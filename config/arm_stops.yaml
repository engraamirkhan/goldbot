# Z 4 "Cost stop per stratum (independent of R)": at >= min_fills fills, the one-sided 95% upper bound of the
# stratum's signal-time cost per R (`cost` / `stop_loss` at the send; SE clustered by UTC day) above halve_above
# halves its share of the pot (ADR 0047 ladder; engine `shares`, live); above suspend_above it is suspended until a
# dated amendment (the daily review records it in exploration_arm_status, so the engine sends no new entry).
cost_stop:
  min_fills: 30
  halve_above: 0.10
  suspend_above: 0.20
  # + the execution controls (prereg-amendment-2026-11-10-execution-controls.md 4 rule 1, the same shape): the daily
  # review retires one in the suspend band (the only controls it ever retires on a cost stop); their pots are slots
  # only, so the halve band binds nothing and is reported by the performance-analyst (amendment 4, "as built")
  arms: [Z1P, Z2P, Z3D, Z3V, Z4D, Z4P, Z5P, Z5V, Z6D, Z6V, Z7D, Z7V, Z7P, Z8P, Z9D, Z10D,
         VEX15, VEX1H, IEX15, IEX1H]

# Thin-liquidity days for gold (BACKLOG 17, playbook G-2), read by RiskGate's holiday window (`risk.holidays`).
# Versioned list, edited by hand and reviewed like code: US federal holidays (observed dates), Good Friday, and
# 24 Dec, 26 Dec, 31 Dec, 1 Jan, 2 Jan. Weekdays only (the market is closed at weekends anyway). Each date is a
# broker SERVER date (Europe/Athens by default), whose midnight is 17:00 New York, i.e. the CME trading-day roll, so a
# listed date blocks the whole CME trading day of that name. tests/test_entry_windows.py re-derives every year here
# from the rules and fails on a typo or a missing day.
# After `valid_through` (or before `valid_from`) the list is unavailable: with `risk.holidays.enabled` entries are
# refused as `calendar_unavailable` (fail closed) until a new version is added. Extend it before it runs out.
version: cme-metals-v1
source: "US federal holidays (5 U.S.C. 6103, observed dates) + Good Friday + 24/26/31 Dec and 1/2 Jan"
valid_from: 2026-01-01
valid_through: 2028-12-31

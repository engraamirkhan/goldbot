id: D28
requirement: '"The engine''s completed 1m bars are the broker''s own M1 bars; the sampled bar is only the provisional current minute and the fallback of a late or missing broker bar (dq flag, same visible_at, never a look-ahead)" (BACKLOG follow-up "engine 1m close lag": 1-2% of signals differed, 83 reconcile closes a day off the broker''s)'
status: implemented
code: 'goldbot/engine/broker_bars.py: `Fetcher`/`Job` (the rates call on its own thread and bridge client, one attempt, `FETCH_TIMEOUT_S` 2 s; the tick thread never waits), `poll` (after the pass''s exits; `get_bars(symbol, "1m", 16)` once each in-session minute closes, retried every 5 s for a late bar up to 10 min, failures backed off 5 s doubling to 60 s from when applied; a failed or malformed reply is a warning, never a tick error), `hold` (a decision close waits at most 3 s past close + 1.5 s for its last bar), `_sound`/`_refuse` (`broker_bar_refused`), finished-bar rule (fetched at or after visible_at and a later bar / a tick at or after the close / clock past close + 1.5 s), `rebuild` + `_merge` (broker bar joins; sampled fallback flagged `broker_bar_late`), `_replace` (`broker_bar_replaced`, store keeps the last copy, decisions untouched), `published` (engine state `broker_bars_1m`); goldbot/engine/history.py `rates_to_bars` (one conversion with the history fill); goldbot/engine/runner.py `EngineConfig.broker_bars` (on in production, goldbot/ops/services/engine.py; off for paper and replays)'
test: tests/test_engine_broker_bars.py::test_completed_minutes_are_the_brokers_m1_bars_not_the_sampled_ones, ::test_a_late_broker_bar_falls_back_to_the_sampled_bar_and_is_replaced_on_arrival, ::test_a_late_bar_replaced_after_a_decision_leaves_that_decision_as_journalled, ::test_a_restarted_engine_loads_the_replaced_broker_bars_and_rejoins_without_duplicates, ::test_in_the_us_eu_dst_gap_week_the_brokers_bars_land_on_their_utc_minutes, ::test_the_forming_bar_and_a_bar_from_a_terminal_clock_ahead_never_join_before_their_close, ::test_in_a_quiet_market_the_minute_is_fetched_once_the_clock_passes_its_close_plus_the_grace, ::test_a_failing_rates_call_keeps_the_sampled_minutes_and_never_blocks_entries, ::test_paper_and_replays_keep_the_sampled_bars_when_broker_bars_are_off, ::test_a_hung_rates_call_never_slows_the_exits_or_the_stop_checks, ::test_failed_calls_back_off_exponentially_up_to_a_minute, ::test_a_decision_close_waits_briefly_for_its_last_broker_bar_and_decides_on_it, ::test_a_close_whose_bar_call_never_answers_decides_after_the_hold_on_the_sampled_bar, ::test_a_broker_bar_with_its_high_below_its_low_is_refused_and_the_sampled_bar_stands, ::test_a_late_replacement_that_is_unsound_is_refused_and_never_replaces_the_sampled_bar, ::test_a_malformed_rates_reply_is_a_warning_not_a_tick_error

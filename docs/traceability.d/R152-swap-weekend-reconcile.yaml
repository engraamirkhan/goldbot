id: R152
requirement: 'BACKLOG 175 (BACKLOG 153 / R130 follow-up): the broker''s swap on a weekend hold of a seven-night (crypto) book is reconciled against the projection automatically. The daily job `swap_reconcile` (23:45 UTC) reads each account''s exploration ledger (the broker''s swap from the position''s deals). Every closed position of a registry crypto instrument held across a rollover ending a Friday, Saturday or Sunday server day is compared with the instruments.db rate per lot per night x lots x the seven-night count, in the account currency at the order''s fx_acct_per_usd. It is stored once in aux.db `swap_reconciliations` (migration 35) with the nights of seven_night, five_plus_triple and seven_plus_triple, the nights the charge implies and the schedules it matches. Health `swap_reconcile` (NOTIFY_ON_WARN) warns while a hold closed in the last 14 days is more than `costs.swap_reconcile_tolerance` (0.5 night) off the seven-night count or unpriced; an interest swap is priced at the entry price and each row records whether the hold tells the schedules apart (quant review 2026-11-14). No weekend hold: no-op. Read-only (no broker call, no order); the seven-night schedule itself is unchanged until the finance-auditor rules on the evidence'
status: 'implemented (2026-11-14, branch feat/auto-gated-1114); trigger: the first night after any weekend crypto hold closes; reviews: quant-reviewer'
code: 'goldbot/ops/swap_reconcile.py (`nights`, `weekend_rollovers`, `reconcile_one`, `run`, `results`, `check_swap_reconcile`); goldbot/ops/jobs.py (`swap_reconcile`); goldbot/ops/health.py (NOTIFY_ON_WARN); goldbot/config.py (`CostSettings.swap_reconcile_tolerance`, `SchedulerSettings.swap_reconcile`); config/settings.yaml; goldbot/db/migrations.py (aux 35)'

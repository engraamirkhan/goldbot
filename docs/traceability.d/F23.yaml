status: implemented
code: 'goldbot/data/calendar.py `SessionWindow`, `DEFAULT_SESSION_WINDOWS` (Asia 08:00 Tokyo -> London open, London 08:00 London -> New York open, New York 08:30-17:00 New York), `SessionTable.session_windows`, `last_open_ns`, `session_label` (consumers unchanged: features/session.py `session` v2, features/trader.py `session_zones` v2 and `market_structure` v2, execution/costs.py spread/slippage tables, execution/audit.py, execution/classifier.py, research/attribution.py, engine `_cost_atr`). Reading taken: the old fixed UTC table (07:00/12:30/21:00) was right on summer time, so summer values are unchanged and each London/New York boundary is an hour later in UTC on that zone''s winter time'

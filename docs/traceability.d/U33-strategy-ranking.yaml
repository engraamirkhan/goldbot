id: U33
requirement: 'Strategy ranking (backlog 136-138; docs/design/trades-ux-2026-10-27.md §7; ADR 0053 with the quant reviewer''s binding conditions): one pure builder and GET /api/strategies/ranking (window, account, style); families sorted on the Bonferroni-adjusted lower bound of net R per trade after costs (t(1 - 0.025/K, G-1), SE clustered by account and opportunity day) with the unadjusted 95% CI beside it; ranked only with 30 fills on 10 opportunity days; hit rate, net £ total and per trade, profit factor, max drawdown in R, n, edge vs random (recorded after the read, else interim), cost per trade, 7/30-day trend; "early, not proven" until the read; controls and retired in their own bands; shadow and cost probes never ranked; a rule edit (new config_hash) a new row; shown in the morning Telegram report, the weekly digest (rank change) and the Strategies tab (Ranked by default, progress toggle in the URL); no trading, stop, annealing, evaluator or promotion module imports it'
status: 'implemented. Not done: engine strategies stay "early, not proven" (no per-strategy gate pass is recorded); the interim edge treats an arm and its control as independent (no day pairing); a family''s retired band uses the H-61 stop state now, not frozen at the retirement instant (a retired arm takes no new trades, so its figures stop moving); p95 is measured on the remembered answers over 50k fills (a cold build is bounded at 1 s)'
code: 'goldbot/api/strategy_ranking.py (`rank`, `Ranker`, `rank_moves`, `RANKING_READERS`); goldbot/api/strategy_board.py (`retired_arms`); goldbot/api/strategy_labels.py (`ArmVariant.version`, `ArmInfo.version`); config/strategy_labels.yaml (`version`); goldbot/api/app.py (`/api/strategies/ranking`); goldbot/api/schema.py (RankingView, RankRow, RankVariant, RankFigures, RecentFigures, AccountChoice); goldbot/telegram/ranking_text.py; goldbot/telegram/digest.py (`ranking_section`, `with_ranking`); goldbot/telegram/weekly_digest.py; web/src/screens/trades/Ranking.tsx; web/src/screens/trades/Strategies.tsx; web/src/lib/trades.ts'
test: 'tests/test_strategy_ranking.py (lucky short run below a long small edge, 70% hit rate losing below 45% earning, adjusted bound with t on G-1 df, clustering, every column, drawdown, profit factor, currencies, interim and recorded edge, 7/30 d, minimums, early status, controls and exclusions, retired band, voided fills, rule-edit row, variants, filters, rank moves, import tests, 50k p95); tests/test_ranking_text.py (12-line section, top 5 and lowest 2, copy and true minus, edge source, weekly moves, after the guard, endpoint = Telegram numbers, leak test, morning report); web/src/lib/trades.test.ts; web/src/screens/Trades.test.tsx; web/e2e/dashboard.spec.ts (Trades)'

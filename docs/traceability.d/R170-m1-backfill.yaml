id: R170
requirement: 'The broker M1 (bars_1m_broker) the discovered-arm read proves windows against has no hole a missed, late or short reconcile leaves (quant review of fix/arm-integrity-voids, M1): each feed_reconcile run re-pulls, per account, every UTC day from BACKFILL_MAX (7 days) before the run up to its 24 h window whose stored M1 lacks more than BACKFILL_SLACK open minutes, within BACKFILL_BUDGET_S, never graded and with no divergence event (the 24 h report unchanged in meaning); a by-hand m1-backfill does the same over READ_DAYS; every write keeps the first stored copy of a minute and its write time. The read voids a live window minute stored after the decision and not recomputed (late_minute, L1) and never counts a broker M1 minute the engine''s bar table closes as a gap (SRE simulation of 0d8543ae); a window minute this account''s engine flagged broker_bar_late with no broker_bar_replaced of its own within GIVE_UP voids (sampled_minute, read for every account sharing the bars_1m_live key, each against its own replacements; an unparseable late detail voids to GIVE_UP after it); store writes of bars_1m_broker keep the first copy under one partition lock (Store.append keep=first)'
status: 'implemented (2026-11-19, branch fix/m1-backfill); reviews: quant-reviewer, data-engineer, sre'

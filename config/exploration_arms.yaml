  - { id: S0R, rule: random_bracket, timeframe: 1m, params: {"minutes": [5, 35], "window_utc": ["07:05", "19:35"], "stop_usd": 3.0, "target_r": 1.0, "hold_bars": 30}, max_open: 1, status: run, note: "history = S0's geometry on its own seed; the resting-stop overshoot is a LIVE measurement (ARM-SPEC 4), history has no R read of it", role: control, config_hash: 0919febfbefef8d5 }

# History source map (D1, lane W1-E; data-engineer, 2026-11-25). NO market data here: source codes and terms only.
#
# Why a sibling of config/instruments.yaml and not a `history_sources:` block inside it: that file is the live
# registry, parsed by goldbot.instruments.Instruments with extra="forbid" (fail closed), so a new top-level key would
# fail every engine and RiskGate load. History sources are research-only metadata; they key on the same 25 owner
# instrument keys (tests/test_history_sources.py proves the key sets match tests/test_owner_instrument_list.py).
# Loader: goldbot.data.era_quality.load_history_sources (strict, extra="forbid").
#
# Per key:
# - owner_name: the owner's name when it differs from the key (USOIL, NAS100, GER40).
# - asset_class: fx | metal | index | energy | crypto | dollar_index.
# - cfd_type: spot (FX, spot metals, crypto) | cash_index (broker cash CFD priced off the futures with a fair-value
#   carry; no roll gap, dividend adjustments) | rolling_future (CFD on a front future; price jumps at each roll) |
#   synthetic_cross (no native series for part of the span; built from legs).
# - roll: null or the roll calendar of a rolling_future. Labels spanning a roll are excluded (W2-6 D8 basis table).
# - weekend: the instrument prints on Saturday/Sunday (crypto only). Weekday session days otherwise.
# - session_minutes: minutes a full session day should hold (R11 coverage denominator). Structural (exchange/broker
#   hours), fixed before any grade was computed: FX 1440, metals/US index/energy/USDX 1380 (60-min daily break),
#   UK100 1320 (01:00-23:00 UK), DE40 1305 (01:15-23:00 CET), BTC 1440 on 7 days.
# - dukascopy: {code, point, from}: bi5 code, the integer divisor (bi5 prices are integers in 1/point), first month
#   the hourly archive serves (checked against raw/daily/_cache on 2026-11-25). null when Dukascopy has no series.
# - histdata: list of {code, from, to}: HistData free M1 ASCII code, its first year (histdata.com's pair pages,
#   2026-11-25) and, where HistData stops or reuses the code for another series, its last year or month (`to`,
#   inclusive). Found by the era bands on the first pull (2026-11-25): UDXUSD is the DOW (US30 levels 11k-26k) in
#   2010-2018 and the US dollar index (~96) from 2019; GRXEUR leaves DAX levels for 2020-07..2023 (~3,300, a Euro Stoxx 50
#   level) and is DAX again from 2024; XAUEUR is served to 2018 and WTIUSD to 2023 (later pages issue no download token). Stamps are New York local time WITH daylight saving (repo finding 2026-11-01, re-verified per
#   instrument-year by the clock check in scripts/histdata_m1.py); prices are decimals (divisor 1). null when absent.
# - source_tz: per source, the zone its stamps are in before conversion to UTC (we always store UTC).
# - price_bands: [from, to, low, high]: inclusive periods (YYYY or YYYY-MM), the band a month's MEDIAN close must lie
#   in. Every band has high/low < 10, so a x10 or /10 (and x100) point-size error is caught in every era
#   (test: seeded scale errors). Not a spike filter: a month outside is reported SCALE and never written.
# - reference: the independent hourly series for the clock check and the R11 daily checks, as eras (newest first):
#   {from, legs: {dukascopy_code: exponent}, scale}. Value = scale x prod(close_leg ^ exponent). One leg with
#   exponent 1 is `native` (its high/low are true highs/lows); more legs are a synthetic cross, whose high/low are NOT
#   the cross's high/low, so R11's range check is not evaluable there (the month can reach Tier B, not A).
#   `dukascopy_1m` = the XAUUSD Dukascopy 1m yearly files (raw/xauusd_1m_dukascopy_YYYY.parquet).
# - synthetic: null, or the recipe when no native 1m source exists (XAUJPY).
#
# Holdout (quant R10, D21): research stores never hold a minute at or after holdout_cut; 2025-10-01..2026-09-30 is the
# sealed holdout and everything after it is forward data. Pull tools drop those minutes and count them.
version: 1
holdout_cut: "2025-10-01T00:00:00+00:00"

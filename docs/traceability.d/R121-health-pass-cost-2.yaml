id: R121
requirement: 'The Telegram health pass (every 60 s on the 2-vCPU brain) re-reads nothing that has not changed: config YAML (the arm spec, accounts, strategy labels, arm reads) is parsed once per file version, keyed by (inode, mtime_ns, size), and every caller gets its own copy; history_gap reads the account''s decisions journal again only when a part file was added (or the last read does not cover the window) and otherwise filters its last read to the current window, so it decides exactly what a fresh read would; the session_local DST-gap refusal is worked out once per (zone, minute). No check''s verdict or NOTIFY behaviour changes (health pass cost, 2026-11-10; acceptance on the brain: pass < 5 s, service < 5 % of a core)'
status: 'implemented (2026-11-10, branch fix/health-pass-cost-2); local warm pass 4.58 s -> 0.28 s; brain acceptance to be measured after deploy'
code: 'goldbot/config.py (`safe_load_cached`); goldbot/research/arms.py (`load_arms`); goldbot/ops/accounts.py (`load_accounts`); goldbot/api/strategy_labels.py (`load_catalog`, `_reads_file`); goldbot/ops/checks/engine.py (`_journal_parts`, `_journal_window`, `check_history_gap`); goldbot/research/arm_rules_growth.py (`_in_dst_gap`)'
test: tests/test_yaml_parse_cache.py::test_an_unchanged_file_is_parsed_once_across_many_reads; ::test_a_caller_mutating_its_result_never_changes_what_the_next_caller_reads; ::test_an_edited_file_is_parsed_again_at_once; ::test_an_atomic_replace_of_the_same_size_and_mtime_is_still_seen; ::test_a_missing_or_broken_file_raises_as_a_plain_parse_did; ::test_the_arm_spec_is_parsed_once_across_health_passes; ::test_the_accounts_file_is_parsed_once_across_reads; ::test_the_strategy_catalogue_parses_its_input_files_once_across_passes; ::test_the_catalogue_reads_an_edited_input_file_on_the_next_load; tests/test_history_gap_cache.py::test_an_unchanged_journal_is_read_once_across_passes_with_the_same_verdict; ::test_a_refusal_journalled_after_a_pass_is_seen_on_the_next_pass; ::test_refusals_leaving_the_window_stop_counting_without_a_new_journal_write; ::test_a_clock_that_went_back_reads_the_journal_again; ::test_each_account_and_symbol_keeps_its_own_read; ::test_the_window_holds_exactly_the_rows_the_bounded_store_read_returns; tests/test_dst_gap_memo.py::test_a_skipped_clock_is_still_refused_and_a_normal_one_is_not; ::test_each_zone_and_minute_is_worked_out_once_across_arm_loads

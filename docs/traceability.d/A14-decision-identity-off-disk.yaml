id: A14
requirement: 'Approvals keep only the decision channel on disk and in the API (BACKLOG 52): an archived proposal in `approvals/done/` and the dashboard''s decided cards carry `decided_channel` ("telegram" or "dashboard") and `decided_ts`, never the owner''s Telegram id or email (`decided_by` / `decided_via` are no longer written); identity, when needed, is in the auth audit log. Older done files that still carry the fields load (ADR 0010, not counted as schema skew) and are shown by channel only'
status: implemented (security and trading-safety review pending)
code: goldbot/telegram/approvals.py `Proposal._drop_decider_identity`, `ApprovalCenter.poll_bus`, `ApprovalCenter.decide`; goldbot/api/schema.py `DecidedProposal.decided_channel`, `decided_ts`; goldbot/api/app.py `recent_proposals`; web/src/lib/approval.ts `viaChannel`; web/src/screens/ProposalCard.tsx `Outcome`

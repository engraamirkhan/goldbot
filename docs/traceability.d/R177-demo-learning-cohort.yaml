id: R177
requirement: 'A demo learning cohort (ADR 0095) lets retired gold arms registered on one demo probe_only account at the minimum lot send real demo orders while keeping their retirement for promotion and learning weights. A member stopped by its cap or the end records replay-only again. A member joins at the start only when its frozen row is retired, gold, not a control, in control_mode broker, not hash-refused, invalid or dark, and inside since..until. Its caps replace the evidence stops it was retired by (spec retirement, unqualified refusal, daily-review retirement, cost-read completion, cost or edge-cap suspension, learning block); every other cap still binds, the RiskGate first. The caps are: one open per arm; a per-arm net loss cap since `since` that stops the arm for good; a weekly net loss cap that holds every member to Monday 00:00 UTC; an end date. Each check counts realised loss + open risk + the new trade, and the cohort fails closed until the ledger is read. Exits are never gated. Fills are stamped learning_cohort. A cohort arm registered on a second account, a control or a non-minimum-lot arm is refused at load. First use: the self-retrain''s ten PRENAMED arms on icm-probe, GBP 15 per arm, GBP 50 a week, until 2027-01-15, K = 0. Controls stay replay_only; GD-1 and live accounts untouched. Health shows the cohort''s week-to-date P&L. Card: docs/research/prereg-amendment-2026-11-24-demo-learning-cohort.md.'
status: implemented (2026-11-24, branch feat/demo-learning-cohort)
code: 'goldbot/engine/exploration_cohort.py (start, refresh, read, send_refusal, max_open_refusal); goldbot/engine/exploration.py (ExplorationConfig.cohort, Exploration.cohort*, refresh_retired, refresh_cost_reads, _Pass.active, _send, evidence_class); goldbot/engine/exploration_learning.py (group, start, refresh skip members); goldbot/engine/exploration_deregister.py (candidates); goldbot/ops/accounts.py (LearningCohort, Exploration.cohort, Account._cohort_fenced, cohort_clashes); goldbot/ops/entry_silence.py (supply_for, _enterable, cohort_line); goldbot/ops/checks/entries.py; config/accounts.yaml (icm-probe cohort, Z3D/Z9D/Z10D and LCZ3D/LCZ9D/LCZ10D moved, RBR15 max_loss 15); config/exploration_arms.yaml (10 control_mode edits)'

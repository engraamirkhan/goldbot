id: R163
requirement: 'Standing amendment docs/research/prereg-amendment-2026-11-18-discovered-arms.md (quant ruling 2026-11-18): a discovered spec_rule arm registers on demo as a learning arm only with its K row, its replay-only control''s NOT_TRIAL row and its arm rows written together or not at all (a void marker when the arm row fails, K kept); refused over research.trial_budget_quarter (used + reserved + 1), for a 6th concurrent discovered arm and when its kill rule is unreadable by until; learning block since / until = min(since + 42 d, 2027-03-31) / loss_cap_gbp 60 / 0.01 lot / demo only / the 300-fill read; arm and control carry per_trade_bracket spec_exit:<hash12> built by one shared arm_rules_spec.bracket on bars closed at the decision, recomputed at the entry (void and not sent when late or off by more than 1e-9); the control draws seeded entries at the arm''s signal rate, 50/50, never an order, frozen by hash (a change voids the arm, K kept); the phase gate reads n_trials_discovery for a spec whose origin is discovery'
status: 'implemented (2026-11-18, branch feat/discovered-arm-registration on feat/arm-lifecycle-auto); not effective before 2026-11-22 22:00 UTC; reviews: quant-reviewer, trading-safety-reviewer; the nightly lifecycle read does not yet void bracket-refused or control-changed reads'
code: goldbot/ops/autodisc_register.py (plan_learning, register_learning_to_db, --learning); goldbot/engine/arm_registry.py (learning and control rows, _pair_refusals, append_many, bracket_refusal); goldbot/research/arm_rules_spec.py (bracket, bracket_void, check_learning, spec_control); goldbot/research/arms.py (spec_control rule, control_freeze_refusal); goldbot/research/registry.py (NOT_TRIAL, LEARNING_VOID, phase_gate_k, discovery_origin); goldbot/ops/gates_phase.py

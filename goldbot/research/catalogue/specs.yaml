version: catalogue-screen-2026-11-07.1
sources:
  top30_catalogue_1107.json: 5948c7521d6dd2f9b1d292fcafcc786b90db653d450b733bf08a89e369ed5270
  patterns_top30_1107.json: c01ba254b9e2d445f3b4232ea5bb0c89f9e5a1dbea22980910d3d1b9cdf9224c
card_text:
  B04:
    name: Round-number stop-cascade breakout
    spec: 'Level L = nearest grid multiple above (long) / below (short) the close. Setup: bar close within 0.5*ATR14 of L
      and L untouched in the last 20 bars. Entry: BUY STOP at L + 0.1*ATR14 (SELL mirrors), valid 6 bars. Confirmation V2:
      wait for a CLOSE beyond L + 0.1*ATR, enter at next open. Stop: L - 0.5*ATR14 (back inside = cascade failed). Target:
      1.5*ATR14 beyond entry. Time exit 12 bars. Skip within 30 min of tier-1 news (event leg is B08).'
    params_grid: V0 stop-entry | V1 close-confirmed | V2 gold grid $100 only | V3 V0 + 4h ADX14 > 20
  B05:
    name: Multi-touch horizontal S/R break-and-retest
    spec: 'Level = SR(3) (common.level_cluster, ZZ k per TF). Break: first CLOSE beyond level by >= 0.25*ATR14. Retest entry
      (differs from failed box_break_close): LIMIT at level +- 0.1*ATR14 valid 8 bars after the break; cancelled if price
      first closes back inside (that event goes to F02). Stop: 0.75*ATR14 beyond the level on the inside. Target: 2.0*ATR14
      from entry or the next opposite SR(2) level if nearer but >= 1.5*ATR. Time exit 20 bars.'
    params_grid: V0 SR(3) retest | V1 SR(2) | V2 enter on break close (no retest; neighbour of failed box family, control
      only) | V3 V0 + break bar tick-volume > 1.5x 20-bar median
  B07:
    name: Triangle breakout (symmetrical / ascending / descending) from zigzag trendlines
    spec: 'Last 4 confirmed ZZ pivots alternate H1,L1,H2,L2 (5 for V1) within 60 bars. Symmetrical: H2 < H1 - 0.25*ATR and
      L2 > L1 + 0.25*ATR. Ascending: |H2-H1| <= 0.25*ATR and L2 > L1 + 0.25*ATR; descending mirrors. Upper line through H1,H2,
      lower through L1,L2, projected to the current bar. Breakout: CLOSE beyond the projected line by 0.1*ATR while lines
      have not crossed and current bar <= apex - 3 bars. Entry next open, side = break side (asc: long only, desc: short only,
      sym: either). Stop: opposite line value at entry or 1.0*ATR, whichever is nearer (min 0.6*ATR). Target: measured move
      = pattern height at H1/L1, capped 3*ATR. Time exit = 2x pattern length.'
    params_grid: V0 all 3 types | V1 5-pivot pattern | V2 asc/desc only | V3 V0 + break in direction of SMA50
  B08:
    name: Macro-release pre-range breakout (news jump continuation)
    spec: 'Events: point-in-time tier-1 calendar (NFP, CPI, FOMC statement, Core PCE, ISM). Pre-range R = high/low of the
      60 min before release. At T+5 min (V1: T+15) if price has CLOSED a 5m bar beyond R by >= 0.25*ATR(5m,20): enter next
      open in that direction. Stop: midpoint of R or 1.0*ATR(15m) whichever nearer (min 0.6*ATR15). Target 2.0*ATR(1h,14).
      Time exit T+4h. One trade per event per instrument. Spread gate: skip if quoted spread at entry > 3x median (spread-state,
      N-1).'
    params_grid: V0 T+5 5m close | V1 T+15 15m close | V2 V0 FOMC/NFP/CPI only | V3 V0 + surprise sign agrees (when consensus
      data exists, else drop)
  B09:
    name: Breakaway gap continuation (session/weekly gap beyond prior range)
    spec: 'Gap up: open_t > high_{t-1} + 0.25*ATR14 (weekly: Monday open vs Friday high). Confirmation: first 4h bar (daily-only
      data: day t) closes above open_t and the gap is not filled (low > high_{t-1}). Entry next open long (gap down mirrors).
      Stop: high_{t-1} (gap filled = fail). Target 2*ATR14. Time exit 5 days (1w: 3 weeks).'
    params_grid: V0 0.25 ATR gap | V1 0.5 ATR | V2 weekly gaps only | V3 V0 in SMA50 direction
  B10:
    name: Floor-pivot R1/S1 breakout with trend gate
    spec: 'P = (H+L+C)/3 of the prior UTC day (gold: 22:00 UTC rollover day); R1 = 2P - L, S1 = 2P - H. Long: first 30m CLOSE
      above R1 after 07:00 UTC while close > P at 07:00; enter next open. Stop P or 1*ATR(1h) nearer (min 0.5 ATR1h). Target
      R2 = P + (H-L) if >= 1.5x stop else skip. Time exit 22:00 UTC. Short mirrors at S1.'
    params_grid: V0 R1/S1 | V1 30m close required twice | V2 London+NY only (07-17 UTC) | V3 15m bars
  C01:
    name: Head-and-shoulders / inverse H&S (zigzag detector, neckline break)
    spec: 'Last 5 confirmed ZZ pivots P1..P5 alternate H,L,H,L,H (top). Head P3 > max(P1,P5) + 0.5*ATR; shoulders |P1-P5|
      <= 1.0*ATR (LMW: within 1.5 % at 1d); troughs |P2-P4| <= 1.0*ATR (neckline slope bounded); pattern span 15-80 bars;
      P1 preceded by an uptrend (P1 > ZZ low before it). Neckline = line P2-P4. Confirmation: CLOSE below neckline by 0.1*ATR
      within 20 bars of P5 confirmation; void if price exceeds P3 first. Entry next open short. Stop: P5 + 0.2*ATR (right
      shoulder). Target: measured move = P3 - neckline at P3, cap 3*ATR (V2: 1R partial then trail). Time exit 2x span. IHS
      mirrors.'
    params_grid: V0 measured move | V1 LMW kernel extrema (common.kernel_LMW) instead of ZZ | V2 V0 + 1R partial/trail | V3
      V0 only against SMA200-trend reversal (top below SMA200 slope up excluded)
  C02:
    name: Double top / double bottom (Eve & Eve / Adam variants)
    spec: 'Top: confirmed ZZ pivots H1, L1, H2 with |H2-H1| <= 0.5*ATR, bars(H1->H2) in 10-60, H1-L1 >= 2*ATR (V: depth 10
      % at 1w). Confirmation: CLOSE below L1 by 0.1*ATR within 20 bars of H2; void if > max(H1,H2)+0.25 ATR first. Entry next
      open short. Stop max(H1,H2) + 0.2*ATR. Target L1 - (max(H1,H2) - L1), cap 3*ATR. Time exit 2x pattern span. Bottom mirrors.'
    params_grid: V0 base | V1 tighter |H2-H1| <= 0.25 ATR | V2 V0 + second peak tick volume < first | V3 V0 1d/1w only
  C03:
    name: Bull / bear flag and pennant (pole + counter-trend channel)
    spec: 'Pole: move >= 3*ATR14 over <= 10 bars ending at confirmed ZZ high Hp (bull). Flag: next 4-20 bars, retracement
      <= 50 % of pole, highs and lows each fitted by OLS on bar highs/lows with slope <= 0 (flag) or converging (pennant),
      channel width <= 1.5*ATR. Confirmation: CLOSE above the flag upper line. Entry next open long. Stop: flag low - 0.1*ATR.
      Target: pole length x 0.5 from breakout (V1 x 1.0), cap 4*ATR. Time exit 20 bars. Bear mirrors.'
    params_grid: V0 0.5 pole target | V1 1.0 pole | V2 retracement <= 38 % | V3 V0 + higher-TF (x4) SMA50 agrees
  C04:
    name: LMW kernel-regression 10-pattern ensemble
    spec: 'common.kernel_LMW detector with LMW''s exact definitions for the 10 patterns (e.g. HS: E1 max, E3 > E1,E5, E1/E5
      within 1.5 % of mean, E2/E4 within 1.5 %). Signal at completion + 3 bars: direction = LMW''s documented sign (tops short,
      bottoms long; RTOP/RBOT/TTOP/TBOT: breakout side of the last extremum). Entry next open, stop 1.0*ATR14, target 2.0*ATR14,
      time exit 10 bars. Rectangles (box family, failed) reported but excluded from the verdict.'
    params_grid: V0 all 8 non-rectangle patterns pooled | V1 reversal patterns only (HS/IHS/DTOP/DBOT/BTOP/BBOT) | V2 h =
      0.5 x CV | V3 V0 1w only
  C05:
    name: Candlestick 3-day reversal patterns at 5-bar extremes (morning/evening star, three inside/outside)
    spec: 'Caginalp-Laurent definitions: downtrend = close below SMA5 of closes for the 3 prior bars; morning star = long
      black body (>= 0.6 ATR), small body (<= 0.25 ATR) gapping/below, white body closing above midpoint of bar 1; three inside
      up = harami + next close above bar-1 open; three outside up = bullish engulfing + higher close. Entry next open long;
      stop pattern low - 0.1 ATR; target 1.5x stop; exit at 2-bar close (CL horizon) if earlier. Bearish mirrors.'
    params_grid: V0 all 3 types | V1 morning/evening star only | V2 exit 2 bars no target | V3 V0 at SR(2) level only
  C06:
    name: Rising / falling wedge reversal
    spec: 'Last 5 ZZ pivots, highs and lows both rising (rising wedge) with converging lines: slope_low > slope_high > 0 (per
      bar, ATR-normalised), width at last pivot <= 60 % of width at first. Confirmation: CLOSE below the lower line by 0.1*ATR
      before the apex. Entry next open short; stop last pivot high + 0.2*ATR; target wedge start price (first pivot low),
      cap 3*ATR; time exit 2x pattern length. Falling wedge mirrors (long).'
    params_grid: V0 5 pivots | V1 4 pivots | V2 V0 + prior trend >= 3 ATR into the wedge | V3 1d/1w only
  C07:
    name: Broadening top / bottom (LMW BTOP/BBOT, megaphone)
    spec: '5 confirmed ZZ pivots H1,L1,H2,L2,H3 with H1<H2<H3 and L1>L2 (diverging). Confirmation: CLOSE below L2 by 0.1*ATR
      within 15 bars of H3. Entry next open short; stop H3 + 0.2*ATR; target L2 - (H3 - L2) x 0.5, cap 3*ATR; time exit 20
      bars. Bottom mirrors.'
    params_grid: V0 base | V1 entry at H3 rejection (close back below H2) | V2 4-pivot | V3 1d/1w only
  C08:
    name: Cup-with-handle breakout
    spec: 'Cup: confirmed ZZ high A, low B, then price returns to within 0.5*ATR of A at C; depth (A-B) 12-35 % (1w) or 3-8
      ATR (1d); bars A->C 30-150 (1d); B in middle third of A..C (U-shape: >= 30 % of cup bars within lower 25 % of depth).
      Handle: after C, pullback <= 1/3 of depth lasting 5-25 bars. Confirmation: CLOSE above C + 0.1*ATR. Entry next open
      long; stop handle low - 0.1 ATR; target A + 0.5*(A-B), cap 4 ATR; time exit 40 bars (1d).'
    params_grid: V0 base | V1 no handle required | V2 V0 + above SMA200 | V3 1w only
  C09:
    name: Harmonic patterns (Gartley / Bat / ABCD with Fibonacci ratios)
    spec: 'ZZ pivots X,A,B,C,D (confirmed). Gartley bullish: AB = 0.618 XA (+-0.05), BC 0.382-0.886 AB, CD 1.27-1.618 BC,
      D = 0.786 XA (+-0.05). ABCD: CD = AB (+-10 %) and C = 0.618-0.786 of AB. Entry: LIMIT at the projected D (PRZ) once
      A,B,C are confirmed; stop 0.5*ATR beyond X (Gartley) or 1*ATR beyond D (ABCD); target 0.382 then 0.618 of AD; time exit
      20 bars.'
    params_grid: V0 Gartley | V1 Bat (B 0.382-0.5, D 0.886) | V2 ABCD | V3 V0 + D at SR(2)
  C10:
    name: Pin bar / hammer / shooting star at a tested S/R level
    spec: 'Level SR(2). Bullish pin: low_t pierces level by 0-0.5*ATR, lower wick >= 2/3 of range, body in upper third, range
      >= 0.8*ATR14, close above level. Entry next open long; stop low_t - 0.1*ATR; target 2x stop; time exit 10 bars. Bearish
      mirrors.'
    params_grid: V0 SR(2) | V1 no level (pin at 20-bar extreme) | V2 V0 + 1d trend agrees on 1h/4h | V3 range >= 1.2 ATR
  F02:
    name: Multi-touch S/R false-break fade (close back inside)
    spec: 'Level = SR(3). Penetration: bar extreme beyond level by 0.1-1.0*ATR14 (more = real break, skip). Confirmation:
      within 3 bars a CLOSE back inside by >= 0.1*ATR. Entry next open toward the inside. Stop: penetration extreme + 0.2*ATR14
      (min 0.5*ATR). Target: 2.0*stop distance or the opposite SR(2) level if nearer and >= 1.5R. Time exit 15 bars. Same
      event set as B05 (break bars that close back inside go here, held breaks go to B05).'
    params_grid: V0 SR(3) | V1 SR(2) | V2 SR(3) + rejection bar wick >= 50% of range | V3 V0 counter to ADX14 > 25 trend excluded
  F03:
    name: Round-number rejection fade (take-profit cluster)
    spec: 'Grid L as B04. Event: bar high reaches within [L - 0.1*ATR, L + 0.3*ATR] after an approach of >= 1.5*ATR14 over
      the last 10 bars, and bar CLOSES below L - 0.1*ATR (short; long mirrors). Entry next open. Stop L + 0.5*ATR14. Target
      1.5*ATR14. Time exit 10 bars. Shares events with B04 (crossing held -> B04, rejected -> F03).'
    params_grid: V0 gold $50 | V1 gold $100 | V2 V0 + penetration required (true false-break) | V3 V0 London/NY hours only
  F04:
    name: Busted chart pattern reversal (failed H&S / double / triangle breakout)
    spec: 'Base patterns from C01, C02, B07 detectors (same code). Bust: after the confirmed breakout, price fails to move
      >= 1.0*ATR14 (intraday TF) / 10 % of entry (1w) beyond the breakout level within 10 bars, then CLOSES beyond the opposite
      pattern boundary (H&S: back above right shoulder; double top: above the tops; triangle: through the other line). Entry
      next open in the bust direction. Stop: the failed-breakout extreme + 0.2*ATR. Target: pattern height from the boundary,
      cap 3*ATR. Time exit 2x pattern length.'
    params_grid: V0 all bases | V1 H&S + double only | V2 triangles only | V3 V0 1d/1w only
  F05:
    name: Raschke 80-20 (prior-day extreme-close reversal)
    spec: 'Setup: day t-1 opened in the top 20 % of its range and closed in the bottom 20 % (range >= 0.8*ATR14). Day t: price
      trades >= 0.1*ATR below low_{t-1}; BUY STOP at low_{t-1} (back inside) valid day t. Stop: day-t low - 0.1*ATR. Target
      1.0*ATR14 or exit at day-t close +1 (V1: trail under each new higher low on 1h). Short mirrors.'
    params_grid: V0 20 % bands | V1 V0 trail on 1h | V2 10 % bands | V3 V0 only in SMA200 direction
  F07:
    name: Prior-week high/low false break (weekly liquidity sweep, daily close back inside)
    spec: 'Level = prior ISO-week high (short) / low (long). Event: a daily bar trades beyond the level by 0.1-1.0*ATR14(d)
      and CLOSES back inside. Entry next open. Stop: sweep extreme + 0.2*ATR(d). Target: 50 % of prior-week range or prior-week
      opposite extreme if nearer than 2R; min 1.5R. Time exit 5 days.'
    params_grid: V0 prior week | V1 prior month | V2 V0 + close in outer 30 % of day range (rejection) | V3 V0 Mon-Wed sweeps
      only
  F08:
    name: Key outside reversal at N-bar extreme
    spec: Bar t makes a new 20-bar high, then closes below low_{t-1} (outside reversal down; engulfs prior range). Entry next
      open short. Stop high_t + 0.1*ATR. Target 1.5x stop. Time exit 5 bars. Long mirrors at 20-bar lows.
    params_grid: V0 20-bar extreme | V1 50-bar | V2 V0 + range_t >= 1.5*ATR14 | V3 1w bars only
  F09:
    name: Bollinger band re-entry fade (close outside then back inside)
    spec: 'BB(20,2) on closes. Event: close_{t-1} > upper band, close_t < upper band and close_t < close_{t-1}. Entry next
      open short; stop max(high_{t-1},high_t) + 0.2*ATR; target SMA20 (skip if < 1.2x stop distance); time exit 10 bars. Long
      mirrors.'
    params_grid: V0 BB(20,2) | V1 BB(20,2.5) | V2 V0 only when ADX14 < 20 | V3 1d only
  F10:
    name: Failed macro-release breakout (news spike reversal)
    spec: 'Same events and pre-range R as B08. Event: by T+30 min the first-5m breakout direction has reversed and a 5m bar
      CLOSES back inside R beyond its midpoint. Entry next open opposite the spike. Stop: spike extreme + 0.2*ATR(15m). Target:
      opposite side of R + 0.5*ATR(1h) (min 1.5R). Time exit T+4h.'
    params_grid: V0 midpoint re-entry | V1 any close back inside R | V2 FOMC/NFP/CPI only | V3 V0 + spike >= 1.5*ATR(1h)
  S02:
    name: Internal Bar Strength (IBS) next-day reversion on equity indices
    spec: 'IBS_t = (close - low) / (high - low) of the cash session. LONG at the cash close if IBS_t < ibs_long. EXIT at the
      next cash close (V2: hold until a close with IBS > 0.60, max 3 days). SHORT cell: IBS_t > 0.80, exit next close. Catastrophe
      stop 2.5 x ATR20 (1R). Sizing: risk 0.25% of balance at the stop (high turnover); one position per instrument; max 3
      concurrent index positions.'
    params_grid: V0 ibs_long=0.20, exit next close | V1 ibs_long=0.10 | V2 ibs_long=0.20, exit IBS>0.60 or 3 days | V3 short
      cell ibs>0.80
  S03:
    name: Volatility-conditioned 3-day reversal (Nagel liquidity-provision premium)
    spec: 'Gate: 20-day Yang-Zhang realised vol (cash OHLC) in its top tercile of the trailing 504-day window (point-in-time).
      Signal: z3 = ret_3d / (sqrt(3) x sd20 of daily returns). LONG at the close when z3 <= -z_thr; SHORT when z3 >= +z_thr
      (own cell). EXIT when z3 crosses 0 against the sign, or after 5 trading days. Stop 2.0 x ATR20 (1R). Sizing: constant-risk
      vol-targeted notional = 0.5% daily-vol budget / realised vol (size falls as vol rises; the premium is per unit of risk).
      Max 2 concurrent index positions. Control: random-side twin INSIDE the same vol gate so the gate itself cannot create
      the edge.'
    params_grid: V0 z_thr=1.5, top-tercile gate | V1 z_thr=2.0 | V2 z_thr=1.5, top-quintile gate | V3 short cell z>=+1.5
  S04:
    name: Opening-gap day direction on equity indices (continuation vs inside-range fade)
    spec: 'gap_t = open_t / close_{t-1} - 1 on cash OHLC. Trade only if |gap_t| >= g x ATR20. Cell CONT: long if gap>0, short
      if gap<0, at the open; exit at the cash close. Cell FADE: the opposite direction, only when open_t lies inside [low_{t-1},
      high_{t-1}]; exit at the cash close or on a touch of close_{t-1}. Stop 1.0 x ATR20 from the open (1R). Sizing: vol-targeted
      0.5% daily-vol budget; one gap trade per instrument per day; max 3 concurrent. Cost model adds +1 spread opening slippage;
      demo cost probe at the cash open required before confirm.'
    params_grid: V0 CONT g=0.3 | V1 CONT g=0.5 | V2 FADE-inside g=0.3 | V3 FADE-inside g=0.5
  S05:
    name: Pre-holiday long on equity indices (exchange-calendar, point-in-time)
    spec: 'Holiday list = the cash exchange''s point-in-time calendar (exchange_calendars). LONG at the close of the second-to-last
      trading day before an exchange holiday (T-2 close); EXIT at the T-1 cash close (early closes honoured). Flat over the
      holiday. Stop 2.0 x ATR20 (1R). Sizing: risk 0.25% of balance at the stop per index; equity correlation-group cap when
      several indices share a holiday. V1 adds a trend gate close > SMA200 at T-2.'
    params_grid: V0 plain | V1 + close>SMA200 gate
  S06:
    name: Scheduled macro-announcement-day premium (CPI/PPI/NFP/FOMC) on US indices
    spec: 'Event list: scheduled US CPI, PPI, NFP and FOMC decision days (point-in-time calendar-v1; PPI to be added as a
      static list). LONG at the close of the trading day before the event; EXIT at the event day''s cash close. No re-entry
      the same day. Stop 2.0 x ATR20 (1R). Sizing: risk 0.25% at the stop; US500/USTEC/US30 on the same day count as one cluster.
      Control: matched non-announcement day (same weekday, same month) random-side twin; the announcement-day mean R must
      exceed it by >= 0.03 R.'
    params_grid: V0 all four events | V1 FOMC+NFP only | V2 CPI+PPI only
  S07:
    name: FOMC-cycle even-week long (Cieslak-Morse-Vissing-Jorgensen)
    spec: 'Day 0 = scheduled FOMC statement day (static dates file 1994-2025, unscheduled meetings excluded); count trading
      days; cycle restarts at the next meeting. LONG at the close of day -2 (holding days -1..3), day 8 (days 9..13), day
      18 (days 19..23), day 28 (days 29..33 when the cycle is long enough); EXIT at the close of day 3/13/23/33. Flat in odd
      weeks (built-in control: even-week mean R must exceed odd-week mean R). Stop 2.5 x ATR20 (1R). Sizing: risk 0.25% at
      the stop; one position per index.'
    params_grid: V0 weeks {0,2,4,6} | V1 weeks {0,2,4} | V2 V0 with 10% vol-scaled notional
  S08:
    name: USD around-the-clock fix pattern on G10 pairs (long USD into the London fix, short after)
    spec: 'Leg A: at the 08:00 UTC bar open go LONG USD in each pair (short EURUSD/GBPUSD/AUDUSD/NZDUSD, long USDJPY/USDCAD/USDCHF);
      close at 16:00 UTC (the 12:00-16:00 bar contains the fix in both DST regimes). Leg B: at 16:00 UTC reverse to SHORT
      USD; close at the 20:00 UTC bar close. Always flat across the 22:00 UTC rollover (swap = 0). Stop per leg 1.5 x ATR(4h,20)
      (1R). Sizing: risk 0.1% per pair-leg; fx correlation-group cap limits total USD exposure to ~0.5% equity-risk. Control:
      time-of-day-shuffled windows on the same pairs; rule must beat it by >= 0.03 R.'
    params_grid: V0 both legs | V1 leg A only | V2 leg A from 12:00 UTC only (pre-fix hours) + leg B
  S11:
    name: Time-series carry + trend per FX pair (hold the credited side only when 3-month momentum agrees)
    spec: 'carry_t = r3m(base) - r3m(quote) from published rates (asof); historical markup m per pair estimated from today''s
      measured swap_long+swap_short (fallback 2.5%). mom_t = close_t/close_{t-L} - 1. LONG when carry_t > m AND mom_t > 0;
      SHORT when carry_t < -m AND mom_t < 0; else flat. EXIT when either condition fails for 5 consecutive closes (hysteresis),
      or at the disaster stop 3 x ATR20 from the last rebalance price. Crash guard: close the position on a 2 x (60d vol)
      drawdown from its peak equity. Sizing: 10% vol target per pair, cap 2x; min_live=3 (book flat when fewer than 3 pairs
      qualify); max 4 concurrent pairs, net USD exposure capped. V2 (Carver): forecast = carry/(annualised 60d vol) x 30,
      capped +-20, trade when |forecast| > 5, weekly rebalance with a 10% position-inertia buffer.'
    params_grid: V0 L=63 | V1 L=126 | V2 Carver forecast form, weekly
  S15:
    name: Cross-sectional 12-1 momentum within asset class (commodities, indices, FX books)
    spec: 'At month-end compute R12-1 = close[t-21]/close[t-252] - 1 per instrument (FX: per currency vs USD, netted into
      pairs). Per class book: LONG the top third, SHORT the bottom third; enter at the next open. EXIT at the next ranking
      or when leaving the tercile; hard time stop 21 trading days then re-rank. Stop 3 x ATR20 per leg (catastrophe only).
      Class-book drawdown > 12% of its risk budget pauses new entries until the next re-rank. Sizing: inverse 60d vol weights,
      class book scaled to 8% annualised vol, three class books equal-risk; strategy vol scaled by its trailing 126d realised
      vol (Barroso & Santa-Clara 2015); cap any leg at 30% of book notional; per-instrument risk <= 0.5%. V2: take a long
      only if its 12m return beats the 3m T-bill (DTB3) rate, else flat on that leg.'
    params_grid: V0 12-1, thirds, monthly | V1 6-1 | V2 12-1 + Antonacci absolute filter on longs | V3 12-1 weekly, 4 tranches
  S16:
    name: 52-week-high proximity momentum (cross-sectional) and fresh-approach breakout (time-series)
    spec: 'P_t = close_t / max(high, 252 bars). Lookback is RESET at every source cutover (manifest.json ''sources'') so a
      futures-basis level is never compared with a spot level. XS: at month-end LONG the top third by P, SHORT the bottom
      third; enter next open; monthly re-rank; stop 3 x ATR20; inverse-60d-vol weights, book vol target 8%. TS: LONG when
      close crosses above 0.98 x 252-day high having been below 0.90 x it within the last 60 days (fresh approach to the anchor);
      EXIT on close < 20-day low or after 30 trading days; initial stop at the 20-day low (1R), trailed at the 20-day low;
      risk 0.5% at the stop. Per-instrument risk <= 0.5%. Pre-registered sub-read: XS gross pass / net fail -> one rerun with
      the S14 swap-sign filter, counted as +1 K.'
    params_grid: V0 XS all-instrument thirds, 252d | V1 XS within class | V2 TS 0.98 entry / 0.90 dip / 20d-low exit | V3
      TS with 126d high
  S17:
    name: Same-calendar-month return seasonality (time-series and cross-sectional)
    spec: 'HARD DATA PREREQUISITE: futures-sourced segments (source = yahoo:*=F) must be ratio back-adjusted with a roll-date
      log; the screen re-runs with roll days masked, and if the two disagree in sign on > 20% of instrument-months the trial
      is VOID (not failed). At the last close of month m-1 compute, per instrument, the mean and t-stat of its calendar-month-m
      return over the prior 20 years (min 10, rolling, point-in-time). V0 (TS): LONG at that close if mean > 0 and t >= 1.0,
      SHORT if mean < 0 and t <= -1.0, else flat; EXIT at the last close of month m (positions may continue). V1 (XS, the
      paper''s form): LONG the top third, SHORT the bottom third of instruments ranked by their same-month historical mean,
      equal risk. Stop 2.5 x ATR20 (1R); a stopped position stays flat until the next month-end. Sizing: risk 0.25% per instrument
      at the stop; vol-scaled to 10%/yr per leg in V1; correlation-group caps. Control: shuffled-month assignment on the same
      instrument, rule must beat it by >= 0.05 R.'
    params_grid: V0 TS, 20y lookback, t>=1.0 | V1 XS thirds | V2 TS, 30y lookback (min 15), t>=1.0
  S20:
    name: Crabel NR7 / ID-NR4 range-contraction breakout, one-overnight hold
    spec: 'Setup at the close of day t-1: true range of t-1 is the narrowest of the last 7 days (NR7); V2 requires inside
      day AND narrowest of 4. Cost gate (pre-registered): skip if range_{t-1} < 4 x round-trip cost in price terms; if the
      gate removes > 60% of events the instrument is retired for CFD costs. Orders for session t: BUY STOP at high_{t-1} +
      0.05 x ATR20, SELL STOP at low_{t-1} - 0.05 x ATR20, OCO, valid that session only; one reversal entry allowed on the
      other side the same day if stopped (Crabel). EXIT at the close of session t+1 (one overnight) or at target 1.5 x ATR20,
      whichever first. Stop: opposite side of the setup bar; if < 0.3 ATR20 use 0.3 ATR20; move to breakeven at +0.75 ATR20.
      Sizing: risk 0.5% at the stop, notional cap 1.0x capital per position; max 6 concurrent per account. V3: take only the
      side agreeing with sign(close - SMA50).'
    params_grid: V0 NR7 + inside day | V1 NR7 only | V2 ID/NR4 | V3 V1 trend-side only (SMA50)
  S21:
    name: Williams/Crabel daily volatility breakout from the open (prior-range stretch)
    spec: 'At the open O_t of day t: BUY STOP at O_t + k x TR_{t-1}, SELL STOP at O_t - k x TR_{t-1} (TR = previous day''s
      true range; V3 uses Crabel stretch = 10-day mean of min(|O-H|, |O-L|)). First fill cancels the other; one entry per
      day. EXIT at the next day''s open (V3: same day''s close). Stop = the opposite trigger (risk = 2k x TR_{t-1}), hard
      cap 1.5 x ATR14. Sizing: fixed fractional 0.5% of equity at the stop; one position per instrument; news blackout (tier-1)
      honoured.'
    params_grid: V0 k=0.7, exit next open | V1 k=0.5 | V2 k=1.0 | V3 Crabel stretch k=1.0, exit same close
  S22:
    name: Bollinger/Keltner squeeze release breakout (TTM squeeze; BandWidth-low variant)
    spec: 'BB = SMA20 +- 2 x sd20(close); KC = EMA20 +- 1.5 x ATR20. Squeeze ON when BB_upper < KC_upper AND BB_lower > KC_lower
      for >= 6 consecutive closed bars. Release = first close where BB moves outside KC. On release: BUY STOP at the squeeze-range
      high + 0.1 x ATR20, SELL STOP at the range low - 0.1 x ATR20, valid 3 bars, first fill cancels the other. EXIT at target
      2.0 x ATR20, or a close beyond the opposite BB band, or time stop 10 bars (30 on 4h). Stop: initial at the EMA20 midline
      (typically 0.7-1.0 ATR), to breakeven after +1 ATR. Sizing: risk 0.5% at the stop; one squeeze trade per instrument;
      max 5 concurrent. V2 (Bollinger): BandWidth = (BB_upper-BB_lower)/SMA20 at its 120-bar low, enter on a close outside
      the band in that direction, same exits.'
    params_grid: V0 TTM kc_mult=1.5, >=6 bars | V1 kc_mult=1.0 | V2 BandWidth 120-bar low | V3 V0 on 4h bars
  S23:
    name: Turtle Soup / Turtle Soup Plus One (failed 20-day breakout fade)
    spec: 'BUY setup: low_t is a new 20-day low AND the previous 20-day low was set >= A trading days earlier. Once price
      trades below that previous 20-day low, place a BUY STOP at previous_20d_low + 0.1 x ATR20; cancel at the close if unfilled
      (V1 Plus One: the order may fill on day t+1). SELL setup mirrors on new 20-day highs. EXIT at target = entry + 0.5 x
      (20-day range), or time stop 5 days; trail the stop under each subsequent higher low. Stop 0.1 x ATR20 below the sweep
      low (low_t). Sizing: risk 0.5% at the stop, ATR-scaled; one position per instrument.'
    params_grid: V0 A=4, same-day fill | V1 Plus One (next-day fill allowed) | V2 A=3 | V3 V0 on 4h gold (20-bar extremes)
  S24:
    name: 'Raschke Holy Grail: ADX(14)>30 pullback to the 20-EMA, short hold'
    spec: 'ADX14 (Wilder), +DI/-DI, EMA20, ATR20. LONG setup: ADX14 > adx_min AND ADX14_t > ADX14_{t-3} AND +DI > -DI; price
      has been above EMA20 for >= 5 bars and bar t touches or closes below EMA20. Order: BUY STOP at high_t + 0.05 x ATR20,
      valid 3 bars. SHORT mirrors. EXIT at target = min(most recent 5-bar fractal swing high confirmed by closed bars, entry
      + 2R), or at the close if ADX turns down 3 bars running, or time stop 15 bars. Stop 0.1 x ATR20 below the lowest low
      of the pullback bars (typically 0.8-1.5 ATR); to breakeven at +1R. Sizing: risk 0.5% at the stop; one trade per pullback;
      max 6 concurrent per account, 2 per correlation group.'
    params_grid: V0 adx_min=30, EMA20 | V1 adx_min=25 | V2 EMA50 pullback | V3 V0 on 4h
  S26:
    name: Fear-spike contrarian long index (realised-vol z-score primary; VIX stretch when data lands)
    spec: 'V0: RV21 = 21-day Yang-Zhang realised vol of the index (cash OHLC); z = (RV21 - mean252(RV21)) / sd252(RV21). LONG
      at the next open when z > 2.0. EXIT at the close when RV21 < its 10-day SMA, or time stop 10 trading days. V1: VIX close
      > 1.05 x SMA10(VIX) for 3 consecutive days -> long next open; exit when VIX closes below SMA10 or 10 days. V2: VIX z-score
      vs 252d > 2. Stop 3 x ATR14 below entry (tail-reversal bet; no averaging down). Sizing: risk 0.5% at the 3-ATR stop;
      cap 2% of equity at risk; one position at a time per index. Low-N pre-registration: day-block bootstrap p; retire if
      N < 150 across learn+confirm.'
    params_grid: V0 RV21 z>2 | V1 VIX stretch (5%, 10d, 3 days) | V2 VIX z>2 (252d)
  S27:
    name: Multi-speed EWMA trend (Baz et al.) with response function and strength gate -- REOPENS the closed trend line, one
      trial only
    spec: 'For k in {(8,24),(16,48),(32,96)}: x_k = (EWMA_S - EWMA_L)/sd(price,63); y_k = x_k/sd(x_k,252); u_k = y_k*exp(-y_k^2/4)/0.89.
      S = mean(u_k). ENTER long when S > gate_in (short when S < -gate_in); flat when |S| <= gate_in. EXIT when S crosses
      back inside |S| < gate_out or flips sign. Stop 3 x ATR20 from entry; book drawdown pause at 15% of risk budget. Sizing:
      |S| (capped 1.0) x inverse 60d vol at 10% per-instrument vol target; notional cap 1.5x capital; per-instrument risk
      <= 0.5%. Control: the UN-GATED version of the same signal (always in) on the same instruments; the gated net must exceed
      it by >= 0.03 R per position-month, else the trend family is retired on CFDs permanently with no neighbours.'
    params_grid: V0 gate_in=0.5, gate_out=0.25 | V1 fast speeds only (8/24, 16/48) | V2 gate_in=0.75, gate_out=0.35
  S30:
    name: FX cross-sectional 1-month momentum on majors (currency-ranked, spread-cheap)
    spec: 'At month-end compute each currency''s L-month total return vs USD (spot + swap accrual as the carry proxy). LONG
      the top 2 currencies, SHORT the bottom 2, expressed as the cheapest pairs available on the account (e.g. long AUD/short
      JPY -> AUDJPY on vantage, AUDUSD + USDJPY on ICM). Monthly re-rank; close pairs whose currencies leave the extreme ranks;
      time stop 21 trading days. Stop 3 x ATR20; book drawdown > 10% of risk budget pauses entries until the next re-rank.
      Sizing: equal risk per currency leg (inverse 60d vol), book vol target 6%; per-pair risk <= 0.4%. Net read includes
      the actually quoted swap per leg.'
    params_grid: V0 L=1 month | V1 L=3 months | V2 L=1, weekly, 4 tranches

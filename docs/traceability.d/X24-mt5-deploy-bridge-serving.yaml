id: X24
requirement: 'Incident 2026-11-02: an MT5-box deploy passes only once every bridge that ran before answers GET /health within 8 min of the switch and stays un-restarted 30 s after the last answer (the watcher covers 90 s from that answer), else it rolls back; after a rollback the old bridges must answer too or the record is failed (alerted); INT and TERM cannot stop it between the switch and the record; the probe runs as nobody with an empty environment'
status: in review (trading-safety, security, sre; PR #319)
code: goldbot/ops/linux/goldbot-deploy.sh `bridges_answer`, `after_rollback_bridges`, `bridge_token`, `bridge_port`, `write_watch`, `main` (trap INT TERM); goldbot/ops/linux/mt5-box-upgrade.sh (systemd-run --wait); goldbot/ops/linux/goldbot-bridge-watchdog.sh `probe` (env -i)
test: tests/test_goldbot_deploy_sh.py::test_an_mt5_deploy_whose_bridge_never_answers_health_rolls_back_after_8_minutes; ::test_an_mt5_deploy_passes_only_once_the_bridge_answers; ::test_f1_a_bridge_restarting_after_it_answered_still_rolls_back; ::test_f1_after_the_last_answer_it_waits_stable_s_and_the_watcher_covers_watch_s_more; ::test_f2_a_signal_while_waiting_for_the_bridge_still_rolls_back_and_records_it; ::test_f3_the_rollback_passes_when_the_old_bridge_answers; ::test_l1_the_probe_runs_unprivileged_with_an_empty_environment; tests/test_mt5_box_upgrade_sh.py; tests/test_engine_watchdog.py::test_t1_terminal_ok_restarts_nothing

id: R126
requirement: 'Backlog 161: base closes missed while the engine is down count toward open trades'' holds, and no close is counted twice. Each open trade carries `bars_through` (the last base close counted in its `bars_held`, in the same orders-file record, written only once set). At the first base close this engine counts, a trade is credited the closes strictly between `bars_through` and that close whose bar has a minute in `SessionTable.expected_open` (the engine''s session table, D13: broker windows or the static rule, less the exchange holidays; weekends, the daily break and holidays never count); its time exit fires there when due, and a passed exit-policy hard flat fires there above or below the floor (below_floor''s rule). A close at or before `bars_through` (a restart whose first quote is stamped before a counted close) is never counted again. Exits only get earlier. A trade saved before `bars_through` (the first deploy) or adopted counts from its next close, as before; a broken session table credits nothing; credit is capped at 92 days. Replay golden unchanged (a replay never restarts); store golden: restart.json only, every in-memory open trade gains `bars_through: null` (engine, orders, orders_after and risk hashes unchanged in all 192 cases)'
status: 'implemented (2026-11-12, branch fix/downtime-bars-catch-up); in review (trading-safety, quant)'
code: 'goldbot/engine/downtime.py (`age`, `missed_closes`); goldbot/engine/runner.py (`_manage_open` calls it; LINE_CAP 3087 -> 3083); goldbot/engine/below_floor.py (`hard_flats`); goldbot/engine/store.py (`OpenTrade.bars_through`, `_unwritten`); goldbot/engine/books.py (`_first_counted` per book); tests/data/engine_store_golden/ (restart regenerated)'

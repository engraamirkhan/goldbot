id: R150
requirement: 'BACKLOG 90 / ADR 0031 reading 9: the adaptive limits get the 20-day measured cost/model series, so the frozen cost rule (cost/model > 1.25 -> floors, 1.10-1.25 -> one step down) can fire. Per account, the closed demo gold fills of the last 20 risk days (UTC weekdays) before the decision day: measured = spread at the fill (decision spread) + entry slippage against the requested price + the lots-weighted exit-leg slippage (store exit_fills, stop overshoot included) + commission and paid swap at the account''s own measured terms; model = the ask - bid close of the last 15m bar closed at the entry (asof_join on its close time, at most 1 h old) + the canonical cost table''s extra cost + the paid swap at the model swap. Pooled; slippage pooled signed and floored after. None below 20 measured fills (the rule is then inert); a fill missing any part is counted unmeasured, never guessed. Tighten only: nothing loosens on it.'
status: 'implemented (2026-11-13, branch feat/cost-model-series); definition awaits quant-reviewer sign-off before merge; the replay still reads None (BACKLOG 255)'
code: 'goldbot/ops/cost_ratio.py (definition, MIN_FILLS, WINDOW_RISK_DAYS), goldbot/ops/limits_job.py (decide_account exit_legs, cost_ratio_20d into Evidence, result row cost_ratio_20d/cost_fills/cost_unmeasured; limits_job reads store exit_fills)'
test: 'tests/test_cost_ratio_series.py (measured vs model components, swap over rollovers, the 20-risk-day window, population filters, None below the minimum, pooled ratio, price improvement floored when pooled, every missing part unmeasured, the model bar never after the entry; through limits_job: 1.0 keeps the ceiling, 1.2 one step down (cost_step), 1.3 the floors (cost_floor); no exit legs -> None)'

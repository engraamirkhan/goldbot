  S2B: {variant: "30-min range"}
  S3A: {variant: "target 1R"}
  S3B: {variant: "target 2R"}
  S5A: {variant: "stop $3"}
  S5B: {variant: "stop $3.75"}
  I2A: {variant: "MFI forced"}
  I2B: {variant: "stop 1 ATR"}
  MB15: {variant: "shadow mirror"}
  BXR15: {variant: "runner"}
  BXT15: {variant: "structure target"}
  BXF15: {variant: "fixed target"}
  BXR30: {variant: "runner"}
  BXT30: {variant: "structure target"}

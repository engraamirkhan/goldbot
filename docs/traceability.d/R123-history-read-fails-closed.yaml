id: R123
requirement: 'Backlog 155: a store read of the engine''s history fails closed. A warm-start or release re-read that raises (duckdb 2.0: every ts-filtered `Store.read` raised a BinderException) starts the engine on no stored minutes instead of crashing it, so its exits run, and refuses every entry: `history_read` is a blocking data-quality check (RiskGate data_quality_error on every entry path), each specialist close is journalled `history_read:<tf>`, the engine health check FAILs naming it; the store is read again every 30 min of engine clock and a read that succeeds merges its minutes (the engine''s own win) and lifts it. A weekday-gold warm start that loads fewer than settings engine.warm_start_min_bars (28 800 = 120 bars of 4h) refuses the same way (`history_short:<tf>`) until the window holds the minimum. A normal read changes nothing; exits and position management never read either flag'
status: 'implemented (2026-11-10, branch fix/history-read-fails-closed); trading-safety review pending'
code: 'goldbot/engine/history.py (`warm_start`, `_read_store`, `read_failed`, `_judge_short`, `blocking`, `hold`, `reread`, `after_close`, `refuse` held=); goldbot/engine/runner.py (EngineConfig.history_min_bars, `_dq_blocking`, `on_bar_close`); goldbot/engine/books.py (`book_cfg`); goldbot/engine/key_zones.py (`KeyZoneWorker.refresh` re-reads a failed cache); goldbot/config.py + config/settings.yaml (engine.warm_start_min_bars); goldbot/ops/services/engine.py (`warm_start_min_bars`); goldbot/ops/checks/engine.py (`check_engine`)'
test: tests/test_engine_history_read.py::test_a_warm_start_whose_store_read_raises_starts_the_engine_and_blocks_entries; ::test_entries_are_refused_history_read_while_the_store_cannot_be_read; ::test_a_failed_history_read_never_stops_an_open_trade_s_time_exit; ::test_a_re_read_that_succeeds_restores_the_history_and_lifts_the_refusal; ::test_a_store_read_that_keeps_failing_is_retried_and_stays_refused; ::test_a_failed_release_reload_blocks_entries_like_a_failed_warm_start; ::test_the_engine_health_check_fails_and_names_the_failed_history_read; ::test_a_short_store_read_refuses_entries_history_short_until_the_window_holds_the_minimum; ::test_a_short_read_on_a_failed_store_is_a_read_error_not_a_short_read; ::test_a_normal_store_read_with_the_minimum_set_changes_nothing; ::test_the_other_books_never_carry_the_gold_warm_start_minimum; ::test_the_service_passes_the_warm_start_minimum_to_weekday_gold_only; ::test_an_unreadable_key_zone_cache_is_read_again_at_the_next_build

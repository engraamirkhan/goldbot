name: research
# Walk-forward research on the published 1m bars (release data-v1). Runs on GitHub's runners because Claude
# sandboxes cannot download release assets. The trial registry lives on release research-v1 so the deflated
# Sharpe counts every trial ever run; the report is posted to the issue "research: <specialist>".
# Trials run in parallel, the registry is written once: `plan` turns the inputs into cells (one trial each), `trials`
# runs the cells side by side on a read-only registry snapshot (no write scope, no lock), `record` merges their rows
# into the fresh registry under the lock, restates every deflated Sharpe on the final trial count and posts the reports
# (goldbot.research.cells). A cell that failed still records a "failed" trial row, so no trial vanishes from the count.
on:
  workflow_dispatch:
    inputs:
      specialist: { description: "specialist family", default: "session_open" }
      from_year:  { description: "first year of bars", default: "2010" }
      to_year:    { description: "last year of bars", default: "2026" }
      rationale:  { description: "why this trial (recorded in the registry)", default: "baseline walk-forward on Dukascopy 1m bars" }
      variants:   { description: "JSON list of config overrides, one trial each, run in parallel (charged to the quarter's trial budget)", default: "[{}]" }
      score_holdout: { description: "score these configurations on the held-out year (once per configuration, final)", type: boolean, default: false }
      skip_screen: { description: "fit the model even if the rule fails the primary-signal screen (recorded as skipped)", type: boolean, default: false }
      pooled:     { description: "15m or 1h: one pooled meta-model over every family on that timeframe (ignores specialist and variants)", default: "" }
      macro:      { description: "add the point-in-time macro features from release macro-v1 (data-macro workflow); the model's feature version then includes them; fails if macro-v1 cannot be downloaded", type: boolean, default: false }
      discover:   { description: "ONE pre-registered feature-discovery trial on the specialist and its one variant (research_pass.py --discover)", type: boolean, default: false }
      families:   { description: "with discover: feature grouping (column, feature, family, cluster; empty = column)", default: "" }
      discover_config: { description: "with discover: JSON overrides of DiscoveryConfig, exactly as pre-registered", default: "{}" }
      rule_ref:   { description: "the pre-registered rule this run follows (e.g. preregistration-2027Q1.md#reserve); empty = none", default: "" }
      lot_fit:    { description: "H-27: add the lot-fit overlay to the report (what the account can take at the gate's own sizing; settings research.lot_fit_*); reporting only", type: boolean, default: false }
      batch:      { description: "many trials at once: JSON list of objects {specialist, variants, pooled, timeframe, from_year, to_year, rationale, score_holdout, skip_screen, macro, discover, families, discover_config, rule_ref, lot_fit}; a missing key takes the input above; one cell per variant (max 64, 10 at a time); empty = the single-trial inputs", default: "" }
# Least privilege: no scopes by default; each job grants itself what it needs. Inputs reach the shell only via env:.
permissions: {}
jobs:
  plan:
    if: ${{ github.ref == 'refs/heads/main' }}   # only reviewed, merged code reaches the registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e .
      - name: plan the cells (every value is validated before a runner starts)
        id: plan
        env:
          SPECIALIST: ${{ inputs.specialist }}
          FROM_YEAR: ${{ inputs.from_year }}
          TO_YEAR: ${{ inputs.to_year }}
          RATIONALE: ${{ inputs.rationale }}
          VARIANTS: ${{ inputs.variants }}
          SCORE_HOLDOUT: ${{ inputs.score_holdout }}
          SKIP_SCREEN: ${{ inputs.skip_screen }}
          POOLED: ${{ inputs.pooled }}
          MACRO: ${{ inputs.macro }}
          DISCOVER: ${{ inputs.discover }}
          FAMILIES: ${{ inputs.families }}
          DISCOVER_CONFIG: ${{ inputs.discover_config }}
          RULE_REF: ${{ inputs.rule_ref }}
          LOT_FIT: ${{ inputs.lot_fit }}
          BATCH: ${{ inputs.batch }}
        run: |
          python -m goldbot.research.cells plan > cells.json
          echo "cells=$(cat cells.json)" >> "$GITHUB_OUTPUT"
          python -c 'import json; [print(c["idx"], c["pooled"] or c["specialist"], json.dumps(c["variant"])) for c in json.load(open("cells.json"))]'

  trials:
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false        # one crashed cell must not cancel the others: each leaves its own rows or a failed trial
      max-parallel: 10
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    permissions:
      contents: read          # downloads from releases of this public repo; nothing here writes the registry or an issue
    env:
      GH_TOKEN: ${{ github.token }}
      CELL: ${{ toJSON(matrix.cell) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e .
      - name: fetch bars and a read-only registry snapshot
        env:
          WANT_MACRO: ${{ matrix.cell.macro }}
        run: |
          gh release download data-v1 -p 'xauusd_1m_dukascopy_*.parquet' -D raw
          ls -la raw
          # the published registry, READ ONLY: this job has no write scope and never uploads it. Fails the job if it exists
          # but cannot be read (never an empty start); empty only when research-v1 or its registry.jsonl does not exist yet
          scripts/registry_release.sh fetch snapshot.jsonl
          # the cell works on a copy; its own rows are the difference (cells.py delta)
          mkdir -p cell out && cp snapshot.jsonl cell/registry.jsonl
          # the canonical broker's measured costs, published by the VPS after nightly_costs (costs only)
          gh release download costs-v1 -p costs_measured.json -D costs \
            || echo "no measured cost table on release costs-v1; research charges the settings priors (stated in the report)"
          if [ "$WANT_MACRO" = "true" ]; then
            # must succeed: a macro-on run (e.g. a queued row with macro features) never runs without them
            gh release download macro-v1 -p '*.parquet' -D macro
          fi
      - name: walk-forward
        run: |
          # the cell's arguments, built from the validated plan (values in the equals form only; see cells.argv). A failure
          # here stops the step before research_pass.py can run with defaults
          python -m goldbot.research.cells argv "$CELL" > args.bin
          mapfile -d '' TARGET < args.bin
          # the measured cost table from release costs-v1 (docs/RUNBOOK.md section 4); the settings priors without it
          COSTS=(); if [ -f costs/costs_measured.json ]; then COSTS=(--cost-table costs/costs_measured.json); fi
          set +e
          python scripts/research_pass.py --bars raw --registry cell/registry.jsonl --report out/report.md \
            "${TARGET[@]}" "${COSTS[@]}" > out/research.log 2>&1
          RC=$?
          echo "{\"exit\": $RC}" > out/status.json
          tail -n 40 out/research.log
          # the rows this cell added; the record job merges them into the fresh registry
          python -m goldbot.research.cells delta snapshot.jsonl cell/registry.jsonl out/rows.jsonl
          exit "$RC"
      - name: hand the cell's rows, report and log to the record job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cell-${{ matrix.cell.idx }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14

  record:
    needs: [plan, trials]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: research-registry   # one writer at a time for registry.jsonl, shared with preregister-quarter.yml
      cancel-in-progress: false
    permissions:
      contents: write   # registry upload to release research-v1
      issues: write     # report issue / comment
    env:
      GH_TOKEN: ${{ github.token }}
      CELLS: ${{ needs.plan.outputs.cells }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true   # no cell reported at all: every cell is then recorded as failed below
        # a lone match is extracted into cells/ itself, not cells/cell-0/: `record` reads that layout for a one-cell
        # plan (cells.cell_dir)
        with:
          pattern: cell-*
          path: cells
      - name: merge the cells into the fresh registry
        run: |
          # the registry as it is now, under the lock: fails the job if it exists but cannot be read
          scripts/registry_release.sh fetch registry.jsonl
          echo "$CELLS" > plan.json
          # append every cell's rows (a cell that left nothing gets a "failed" row), restate each deflated Sharpe on the
          # final trial count, write the reports
          python -m goldbot.research.cells record plan.json cells registry.jsonl reports.json
      - name: save the registry
        # union with whatever the VPS monthly loop or another workflow pushed while this ran, so no trial is dropped;
        # a failed read or a union shorter than the published copy fails the job instead of uploading
        run: scripts/registry_release.sh save registry.jsonl
      - name: post the reports to the issues
        if: always()
        run: |
          python - <<'EOF'
          import json, os, pathlib, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          hdr = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          p = pathlib.Path("reports.json")
          reports = json.loads(p.read_text()) if p.exists() else [
              {"title": "research: run failed", "body": "The record job failed before it wrote the reports."}]
          for rep in reports:
              title, body = rep["title"], f"Run: {run_url}\n\n{rep['body']}"
              q = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues?labels=research&state=open&per_page=50", headers=hdr)
              existing = [i for i in json.load(urllib.request.urlopen(q)) if i["title"] == title]
              if existing:   # one issue per specialist; each run is a comment so the history of trials stays readable
                  req = urllib.request.Request(existing[0]["comments_url"], data=json.dumps({"body": body}).encode(), headers=hdr)
              else:
                  req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues",
                                               data=json.dumps({"title": title, "body": body, "labels": ["research"]}).encode(), headers=hdr)
              print(title, urllib.request.urlopen(req).status)
          EOF

id: M6
requirement: Breakout exit "Half at 1.0 ATR, rest trailed at 1.0 ATR"; "stop inside range"
status: partial
code: 'scale-out and trail implemented (the 2.0 ATR target caps the rest): goldbot/specialists/breakout.py `exit_spec`, run by the labels, the shadow book and the live: goldbot/engine/runner.py `_manage_policies` (trail via `modify`, hard flat via `close`, on bars of the agent''s timeframe), `_scale_out` (partial `close` on the tick that reaches the level; a failure keeps the trade unscaled and is retried, 3 attempts), `_stop_check` (every tick: price through the engine''s stop while the broker''s is looser after a rejected `modify` -> close at market; reconciliation re-sends with backoff); recovered fills and single-agent orphans get the policy back (`_load_orders`, `_reconcile`); labels and shadow fill a gapped stop at the stop (optimistic, documented), the broker at the market; below 2x the minimum volume the half is skipped; "stop inside range" not done (the stop is the ATR barrier)'
test: tests/test_exit_policies.py::test_shadow_trades_reproduce_policy_labels; ::test_breakout_scale_out_is_taken_and_weighted_in_the_return; ::test_live_engine_exits_as_the_label_on_a_scripted_path (long and short); ::test_a_gap_through_the_trail_exits_on_the_label_bar_but_fills_at_the_market; ::test_price_through_the_engine_stop_closes_at_market_when_the_broker_stop_did_not_move; ::test_reconcile_backs_off_on_repeated_modify_rejects_and_resets_on_success; ::test_a_trade_recovered_from_an_unconfirmed_send_keeps_its_agents_exit_policy; ::test_an_adopted_orphan_of_a_known_agent_gets_its_policy_and_an_unknown_one_none; ::test_scale_out_never_splits_below_the_minimum_volume_and_runs_once; ::test_a_failing_symbol_info_does_not_stop_the_engine_and_the_scale_out_is_retried; ::test_scale_out_retries_are_bounded; ::test_a_scale_out_failure_on_one_position_leaves_the_others_managed

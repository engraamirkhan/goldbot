_and_runs_without_calendar_or_macro; ::test_research_pass_h16_runs_one_trial_on_the_settings_holdout_with_500_rows; tests/test_day_type_golden.py::test_day_type_outputs_match_the_golden_file_of_their_version_so_a_change_needs_a_version_bump

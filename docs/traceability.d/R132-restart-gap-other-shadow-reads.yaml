id: R132
requirement: 'Backlog 174 (follow-up of backlog 165, R129). The remaining shadow-book readers handle `restart_gap` trades (a path with bars missing across a restart) by the R129 rule: statistics leave them out, risk guards keep their losses and drop only their wins. Auto-mode evidence (`telegram/automode.match_outcomes`, a Welch comparison of approved against rejected outcomes): left out, win or loss, and the count of proposals left out for a gap trade alone is in `Eligibility.restart_gap_excluded` and in the "too few outcomes" reason. Performance report (`ops/perf_report.match_shadow`): the proposal is counted unmatched with the reason RESTART_GAP, so the decisions'' R, money and the calibration row never read it and the report says why. Ruin estimate (`research/ruin.r_from_shadow_book`, a risk guard): a loss counts, a win does not; the dropped wins are counted (`RSample`/`RuinReport.n_restart_gap_dropped`) and noted in the report. Exploration minute pass (1m/5m arms): its last decided minute lived in memory only, so an engine restarted inside that minute decided it again and a signal refused there (spread, heat, budget) could pass at a later price inside its staleness (sent ids stop only a signal that was sent); at the engine''s start on the host clock (`live_clock`) every minute complete by then counts as decided (`exploration.start_minute` from `Exploration.start`, journalled `exploration_start_minute`), with or without an orders file (review LOW: a fresh account restarted before its first saved close): at most one minute''s signals lost to a restart, never one decided twice. The tick clock (replays, tests) is left as before. Reporting and research only, plus one fewer entry decision after a restart: no order path widened.'
status: 'implemented (2026-11-12, branch fix/restart-gap-other-shadow-reads); awaiting quant-reviewer and trading-safety-reviewer'
code: 'goldbot/telegram/automode.py (`match_outcomes`); goldbot/ops/perf_report.py (`RESTART_GAP`, `match_shadow`); goldbot/research/ruin.py (`r_from_shadow_book`); goldbot/engine/exploration.py (`start_minute`, `Exploration.start`); goldbot/engine/runner.py (host clock set before the exploration start; line count unchanged)'

id: R118
requirement: 'Vantage-demo refusals 2026-11-10 (SRE diagnosis items 1-4, fixes 2-4; 47-64 % of 1m signals refused stale over 7 days): (a) inside a book''s exploration pass the 1m/5m part (cheap reads, the minute''s decisions, a send) runs before the 15m+ part (learning read, 15m+ close step, a send); the learning read stays ahead of the 1m send when a 1m/5m learning arm or dedicated control reads it. (b) A multi-book pass runs every book''s 1m/5m part before any book''s 15m+ part; no 15m+ part starts while a 1m/5m signal is queued or a 1m/5m minute is due or inside its grace (so a pass starting at :00:00.5 runs no close work first), unless it has waited SLOW_WAIT_S (20 s) (only books whose 1m/5m part ran this pass count: a book with no quote holds nobody); after the first, none starts past PASS_BUDGET_S; a part not run is carried and goes first next pass. (c) Only the order changes: every refusal, RiskGate call, budget and daily-cap read and journal row is unchanged; a book''s two sends together take at most PER_PASS orders; an order that raised in the 1m/5m part holds the 15m+ part''s send (trading-safety M1). (d) The deferral warning names the exploration sub-phases (reads, learning, step, minutes, entry, budget) and the books whose 15m+ work was carried. Exits never delayed; PASS_BUDGET_S, stale_s and send delays unchanged'
status: 'implemented (2026-11-10, branch fix/fast-arms-first)'
code: 'goldbot/engine/exploration.py (`on_pass`, `on_pass_slow`, `_fast`, `_slow`, `_entries`, `_failed`, `fast_pending`, `_minute_due`, `due`, `SPLIT`, `_enter` limit and count, `Exploration.slow_owed`); goldbot/engine/books.py (`account_pass`, `_slow_parts`, `_fast_pending`, `SLOW_WAIT_S`, `EX_PHASES`, `PassTimes.describe`/`totals`)'

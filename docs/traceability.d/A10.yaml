id: A10
requirement: '"/mode auto ... only offered after at least 100 proposals with no RiskGate breach and no distinguishable difference between approved and rejected outcomes"'
status: implemented
code: 'goldbot/telegram/automode.py `auto_mode_eligibility` (decided proposals since the last mode change; breaches = a drawdown stage or kill switch in risk_*.json; R of approved vs rejected from the shadow book''s counterfactual outcomes, Welch t-test: eligible only if p >= 0.10 AND the 90% CI of the difference spans 0, with >= 10 outcomes a side), `AutoModeOffer` (one message per mode epoch, never switches), `mode_command` (`/mode auto <TOTP>` needs the owner''s authenticator via goldbot/api/auth.py and the evidence; `/mode propose` needs nothing; audited); goldbot/telegram/bus.py `Control.approval_mode`, `set_mode`; goldbot/engine/runner.py `_refresh_account` reads it, the re-arm lock and the 12% kill switch force propose and the kill switch writes propose back'
test: tests/test_automode.py::test_not_eligible_below_100_decided_proposals_and_eligible_at_100; ::test_not_eligible_with_a_riskgate_breach; ::test_not_eligible_when_approved_and_rejected_outcomes_differ; ::test_mode_auto_without_a_valid_totp_is_refused_even_when_eligible; ::test_engine_reads_the_owner_mode_and_the_re_arm_lock_wins; ::test_kill_switch_returns_the_owner_mode_to_propose_and_it_stays_there; ::test_downgrade_to_propose_is_always_allowed_without_totp_or_evidence

id: U19
requirement: API request bodies reject unknown fields with 422 instead of silently dropping them (sign-in, invite, reset, password change, recovery, TOTP, mode, re-arm, halt, approvals; security item from the ADR 0010 architect)
status: implemented
code: 'goldbot/api/schema.py `ApiRequest` (`extra="forbid"`), the base of every request body model; response models unchanged; web/openapi.json marks them `additionalProperties: false`; goldbot/api/app.py `validation_error` returns each 422 error as type, loc and msg only (no `input` or `ctx`: the rejected value is never echoed, security review LOW)'
test: tests/test_api_request_bodies.py::test_every_request_body_model_forbids_extra_fields; ::test_a_misspelt_password_key_is_rejected_without_echoing_the_password; ::test_a_missing_field_error_does_not_echo_the_request_body; ::test_the_unknown_field_table_covers_every_request_route; ::test_each_request_endpoint_rejects_an_unknown_field_with_422 (20 routes)

id: F2
requirement: '"versioned so a model can only ever score the feature frame it was trained on"'
status: implemented
code: 'version stamped (goldbot/features/registry.py:43, goldbot/research/model_registry.py:31) and kept through the context merges (goldbot/engine/runner.py `_frame`); a model of another `feature_version` scores a frame rebuilt at its own version when registered implementations reproduce it (`Engine._scoring_frame`, `registry.versions_for`/`with_versions`, superseded versions in `features/legacy.py`: sessions v1 after the DST fix), in `_decide`, the blackout re-score and the shadow book (decisions and shadow trades record `scored_feature_version`; a rebuild that raises is logged and leaves the model unscored, failing closed); drift_watch builds each champion''s PSI inputs at its own version (`jobs._recent_candidates`; macro-trained champions over the default set plus the macro drivers with the store''s macro rows), health `feature_versions` counts champions, challengers and previous champions per version; otherwise `_decide` skips it, journalling `feature_version_mismatch` with both versions, and the shadow book skips it too. An unversioned stand-in (`ConstantModel`, empty version) is not checked'
test: tests/test_features_labels.py::test_build_features_runs_and_is_versioned; tests/test_engine_safety.py::test_a_model_never_scores_a_frame_of_another_feature_version; tests/test_sessions_v1_migration.py::test_a_v1_champion_scores_exactly_as_before_the_fix, ::test_a_v1_shadow_challenger_keeps_paper_trading_on_its_own_features, ::test_the_v1_implementations_reproduce_the_pre_fix_features_exactly, ::test_a_v2_model_scores_the_v2_frame_and_an_unknown_version_is_still_not_scored, ::test_a_legacy_rebuild_that_raises_leaves_the_model_unscored_and_the_bar_running, ::test_decision_and_shadow_records_carry_the_feature_version_they_scored, ::test_a_v1_champions_drift_inputs_are_built_on_its_v1_columns, ::test_drift_skips_psi_with_a_note_when_a_champions_version_cannot_be_rebuilt, ::test_health_counts_models_per_feature_version, ::test_health_counts_previous_champions_because_a_rollback_restores_them, ::test_health_counts_a_macro_trained_model_as_current_not_unbuildable, ::test_a_macro_trained_champion_keeps_its_drift_inputs_with_the_macro_columns, ::test_a_macro_champion_without_macro_rows_skips_psi

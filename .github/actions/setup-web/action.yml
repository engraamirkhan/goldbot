name: setup-web
description: >-
  Node 22 and web/node_modules, restored whole from a cache keyed on web/package-lock.json (npm ci only on a miss).
  A failed install is written to ci-out/<check>-install.txt and listed in ci-out/failed-<check>.list for report-failure.
inputs:
  check:
    description: name used for the ci-out files (e.g. frontend-checks)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
    - id: modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: web/node_modules
        key: "node-modules-${{ runner.os }}-node22-${{ hashFiles('web/package-lock.json') }}"
    - name: npm ci
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      env: { CHECK: "${{ inputs.check }}" }
      run: |
        set -o pipefail
        mkdir -p ci-out
        npm --prefix web ci 2>&1 | tee "ci-out/${CHECK}-install.txt" \
          || { echo "${CHECK}-install" >> "ci-out/failed-${CHECK}.list"; exit 1; }

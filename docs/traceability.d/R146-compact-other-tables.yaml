id: R146
requirement: 'Backlog 179: the other append-only store tables (fills, dq_events, observe_ticks; ticks once measured on the brain) are compacted like the decisions journal (R131): closed months only (the open month never touched), a closed month rewritten from `compact.min_parts` parts into one, every row kept (no dedupe: fills keep every row, the duplicate ticks of two flushes stay), the swap under the partition lock with the manifest, verified by row count and sha256 of the Store.read-ordered read, a mismatch keeps the old parts. Memory bounded for a 10^7-row tick month: the new part is streamed batch by batch in row groups of `row_group_rows`; the verifying sorted read runs in DuckDB under `memory_limit`/`threads` with a spill directory under the store root, removed after the run, and is hashed per batch. The write time of every row survives compaction (Parquet metadata `goldbot.lineage`, rows in part-write order; `written_utc`), so the part-mtime evidence of the 2026-10-26 tz quarantine still selects the same rows. The nightly job is time-boxed (deferred partitions wait for the next night, not an error) and paced.'
status: 'implemented (2026-11-13, branch feat/compact-other-tables); ticks off until measured on the brain (BACKLOG 239); BACKLOG 239-242'
code: 'goldbot/data/compact.py (`compact_table` min_parts/time_box_s/pause_s/memory_limit/threads/row_group_rows, `_build`, `_store_hash`, `written_utc`); goldbot/ops/jobs.py (`journal_compact` per table, totals + `tables`); goldbot/config.py (CompactSettings, `compact`) + config/settings.yaml; scripts/store_parts_report.py (read-only measurement); scripts/quarantine_tz_ticks_2026_10_26.py (`ahead` reads per-row write time)'
test: 'tests/test_store_compaction_tables.py (same Store.read frame per table and source, open month untouched, fills repeated key kept, duplicate ticks kept, per-row write time kept across two compactions, row groups bounded, time box defers, min_parts, pacing, DuckDB memory limit and spill dir removed, job per table with settings and defaults, parts report read only, tz quarantine selector after compaction); tests/test_journal_compaction.py (R131 guarantees on the new build)'

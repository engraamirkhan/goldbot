[project]
name = "goldbot"
version = "0.1.0"
description = "Evolving XAUUSD trading assistant: point-in-time data store, strategy specialists, walk-forward validation, risk-gated execution."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "polars>=1.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",   # [standard] brings the WebSocket implementation the dashboard live feed needs
    "httpx>=0.27",
    "requests>=2.31",
]

[project.optional-dependencies]
# Windows VPS only: the official MetaTrader5 package talks to a running terminal.
live = ["MetaTrader5>=5.0.45; sys_platform == 'win32'", "keyring>=25", "python-telegram-bot>=21"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy>=1.10", "pandas-stubs", "types-PyYAML", "types-requests", "pre-commit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: crosses component boundaries (HTTP API, engine loop, data pipeline); CI runs these in their own job"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle, pyflakes, import order
ignore = ["E501"]               # long lines are allowed; formatting is not enforced

[tool.ruff.lint.isort]
known-first-party = ["goldbot"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goldbot*"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["goldbot", "scripts", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
strict_equality = true

[[tool.mypy.overrides]]
# third-party packages without type information
module = ["lightgbm.*", "sklearn.*", "duckdb.*", "MetaTrader5.*", "keyring.*", "telegram.*", "pyotp.*", "polars.*", "structlog.*", "scipy.*", "pyarrow.*", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# test bodies are type-checked, but test functions need no annotations
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

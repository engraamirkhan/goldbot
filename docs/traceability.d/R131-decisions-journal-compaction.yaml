id: R131
requirement: 'Backlog 170: the decisions journal''s small part files are compacted off the hot path. A nightly scheduler job (`journal_compact`, 03:40 UTC, never the engine flush or the health pass) rewrites each closed month partition (before the slot''s UTC month; the open month an engine writes is never touched) of every source=/symbol= folder into one part, under the partition''s exclusive writer lock: every row and column kept (no dedupe), rows in the store order (ts_utc, KEY_COLUMNS, every column), the new part verified before publication (row count and sha256 of the Store.read-ordered frame equal to the old parts''; a mismatch keeps the old parts). Crash-safe by a fsynced manifest (`.compact-<id>.json`) written before the rename: Store.read, Store.sql and Store._read_partition skip parts a manifest replaced while its new part exists, and the next run finishes the unlinks (or drops a manifest whose new part never landed). Late rows of a closed month are folded in the next night. The health checks'' part-file cache sees the new part set and re-reads once.'
status: 'implemented (2026-11-12, branch feat/decisions-journal-compaction); in review (code-reviewer, sre)'
code: 'goldbot/data/compact.py (`compact_table`, `_compact_partition`, `_recover`, `_merged`, `_store_hash`); goldbot/data/store.py (`compacted_away`, `_live`, `_stage_part`, `_fsync_dir`; manifest-aware `Store.read`, `Store.sql`, `_read_partition`); goldbot/ops/jobs.py (`journal_compact`); goldbot/config.py + config/settings.yaml (scheduler.journal_compact)'
test: tests/test_journal_compaction.py; tests/test_jobs_integration.py (next slot); tests/test_health_registry.py (golden gains job:journal_compact)

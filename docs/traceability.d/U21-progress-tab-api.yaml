id: U21
requirement: 'Progress tab API (ROADMAP W2-3, docs/ux/progress-screens.md "API gaps" 1-4, quant review F1/F2): read-only for viewer and above; `GET /api/gates` evaluates the gates and stop rule on request with nothing written, cached 60 s, with structured progress, earliest calendar dates, 95% intervals, recorded times, proposed flags counted from `gates.signed_off`, and a structured stop rule (status, incidents worst first, clock, breach list, imputed costs; a lost closed-trade write is "can''t check"); `GET /api/attribution` serves state/attribution.json without trades and calibration, with stale, next run, each row''s own bar and se, and exit target/stop rows "by construction"; `GET /api/trades/summary` gives each account''s last 30 opportunity days on the monthly report''s rules. Accounts by config name with 5+ digit runs cut; no operator-typed note, email, login, host or raw error'
status: implemented (API only; the web screens are the next lane)
code: 'goldbot/api/progress.py (`gates_view`, `gates_unavailable`, `GatesCache`, `attribution_view`, `trades_summary`); goldbot/api/app.py `/api/gates`, `/api/attribution`, `/api/trades/summary`; goldbot/api/schema.py Progress tab models; goldbot/ops/gates_phase.py (`GateItem.detail/threshold/progress/earliest_utc/ci95`, `GateStatus.recorded_utc`, `StopRuleStatus` structured fields, `mean_ci95`, `MIN_TRADES_FOR_BOUND`); goldbot/research/attribution.py `Cell.se`; goldbot/config.py `GateSettings.signed_off`, `PROPOSED`, `pending_sign_off`; config/settings.yaml `gates.signed_off`; web/openapi.json, web/src/lib/schema.d.ts'
test: 'tests/test_api_progress.py (30 cases: ::test_gates_are_evaluated_from_the_evidence_and_nothing_is_written; ::test_a_recorded_gate_carries_the_time_from_the_gate_log; ::test_paper_items_carry_progress_the_earliest_calendar_date_and_the_paper_interval; ::test_gate_evidence_never_carries_the_owners_typed_note_but_the_cli_still_prints_it; ::test_proposed_thresholds_are_counted_from_the_settings_and_drop_out_when_signed_off; ::test_a_gate_met_on_a_threshold_not_yet_signed_off_says_so; ::test_signed_off_only_names_a_proposed_threshold_and_ships_empty; ::test_a_cost_table_naming_another_account_than_its_file_still_has_its_digits_cut; ::test_account_names_in_gate_evidence_have_their_digits_cut; ::test_stop_rule_is_structured_with_incidents_worst_first_capped_at_five_and_digits_cut; ::test_stop_rule_has_not_started_without_a_trade_or_the_paper_gate; ::test_a_long_run_breach_is_named_in_the_breach_list; ::test_a_closed_trade_write_reported_lost_makes_the_stop_rule_cant_check; ::test_unreadable_records_map_to_owner_wording_never_the_raw_error; ::test_imputed_costs_of_gross_rows_are_structured; ::test_gates_cache_serves_one_evaluation_for_60_seconds; ::test_gates_cache_serves_the_old_value_while_one_rebuild_runs; ::test_attribution_view_drops_trades_and_calibration_and_keeps_each_rows_own_bar; ::test_exit_target_and_stop_rows_read_by_construction; ::test_attribution_is_stale_only_after_its_slot_plus_the_lateness_allowance; ::test_attribution_missing_is_empty_and_unreadable_is_cant_check; ::test_live_fills_and_cost_source_name_the_account_with_its_digits_cut; ::test_trades_summary_is_the_last_30_opportunity_days_per_account; ::test_a_close_on_a_weekend_report_day_counts_in_the_money_but_not_as_a_day_traded; ::test_an_engine_account_without_trades_is_listed_empty; ::test_the_identifier_check_catches_a_login_or_an_email_but_not_a_decimal; ::test_progress_routes_need_a_sign_in_and_serve_a_viewer_without_identifiers x3; ::test_gates_route_writes_nothing_and_is_cached); tests/test_persistence_compat.py ::case_attribution_report'

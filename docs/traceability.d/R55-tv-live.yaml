id: R55
requirement: 'TradingView live staleness fails closed and TradingView agents are shadow only: at a bar close a requires_tv agent''s signal counts only when its TradingView bar is the decision bar and it arrived no later than the close + `tv.max_lag_s` (60 s, = tv_plots.MAX_LAG) and no later than the decision; otherwise NaN and no candidate. A store outage reads NaN and never stops the bar close or any exit. A requires_tv agent never reaches the broker (share 0) until the DESIGN promotion rule (> 1 % log-loss gain in two consecutive retrains, >= 99 % on-time delivery over 90 days) is met'
status: implemented
code: 'goldbot/engine/tv_context.py (`with_tv`); goldbot/engine/runner.py (`Engine._decide`: candidates through `with_tv`, share 0 for `requires_tv`; `EngineConfig.tv_max_lag_s`); goldbot/config.py (`TvSettings`); config/settings.yaml (`tv.max_lag_s`); goldbot/ops/services/engine.py'
test: 'tests/test_tv_event.py::test_stale_by_1s_gives_no_entry; ::test_lag_exactly_max_is_accepted; ::test_a_value_that_has_not_arrived_at_decision_time_is_not_used; ::test_the_previous_bars_event_never_triggers_the_decision_bar; ::test_tv_store_outage_reads_as_missing_never_raises; ::test_with_tv_leaves_every_other_agents_frame_untouched; ::test_max_lag_setting_equals_the_feature_allowance; ::test_tv_outage_never_blocks_an_exit; ::test_a_tradingview_agent_is_shadow_only_never_a_live_entry'

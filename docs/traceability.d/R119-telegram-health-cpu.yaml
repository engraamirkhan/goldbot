id: R119
requirement: 'Telegram CPU attribution 2026-11-10: the telegram service health pass (~50 s of one core every ~110 s on the 2-vCPU brain) must not hold the proposal pump (the owner''s 90 s confirm window) nor re-parse the research registry per arm. The pass runs as its own task, one at a time (a due pass is skipped while one runs), logs `health pass s=` and warns over 20 s, logs any exception from the task at once, logs run_checks still running after 240 s (awaited, never abandoned) and is cancelled and awaited at shutdown; `arms._registry_rows` parses the registry once per file version (inode, mtime_ns, size); `registry.stale_preregistrations` indexes withdrawals and trial reads once (same answer as the scan, quant ruling 2026-11-09 3(b) unchanged). No health check decides differently'
status: 'implemented (2026-11-10, branch fix/telegram-health-cpu); trading-safety review of the pump change pending'
code: 'goldbot/telegram/bot.py (`_start_health_pass`, `_health_task_ended`, `_timed_health_pass`, `_run_checks`, `_on_shutdown`, HEALTH_SLOW_S, HEALTH_HANG_S, HEALTH_STOP_S); goldbot/research/arms.py (`_registry_rows` cache); goldbot/research/registry.py (`_Exemptions`, `exempting_withdrawal`, `stale_preregistrations`)'
test: tests/test_telegram_health_task.py::test_a_slow_health_pass_does_not_delay_the_outbox_or_start_twice; ::test_each_health_pass_logs_its_duration_and_warns_when_slow; ::test_an_exception_escaping_the_health_task_is_logged_at_once; ::test_a_hung_health_check_run_is_logged_and_the_pass_still_finishes_once_it_returns; ::test_shutdown_cancels_and_awaits_a_running_health_pass; tests/test_arms_registry_cache.py::test_the_registry_is_parsed_once_across_many_reads_of_an_unchanged_file; ::test_an_appended_row_is_seen_at_once_and_parsed_again; ::test_a_rewrite_of_the_same_size_and_mtime_is_still_seen_when_the_file_is_replaced; tests/test_registry_withdrawal_index.py::test_the_indexed_exempting_withdrawal_matches_the_scan_row_for_row; ::test_stale_preregistrations_and_the_counts_are_unchanged_by_the_index; ::test_stale_preregistrations_reads_each_row_a_bounded_number_of_times

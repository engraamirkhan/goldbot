id: R178
requirement: 'Owner directive 2026-11-25. Trading analysis is broken down by instrument category. One mapping, goldbot.ops.class_breakdown.asset_class_of, maps a key, a broker or store symbol, or an arm id to the asset class in config/instruments.yaml; an unknown name maps to "unknown". The ranking (rows and view), the trades page, the lab messages, the ranking Telegram line and the performance report give per class and per family x class: net after costs, trades, win rate, money per trade, mean R and t. A family is flagged split when its mean net R is positive in one class and negative in another, each class with at least 30 fills that have an R. A voided label or a fill void as evidence for n never reaches a class figure (PR #442). The web ranking table shows a Class column.'
status: implemented (2026-11-25, branch feat/asset-class-reporting)
code: 'goldbot/instruments.py (ASSET_CLASS_ORDER, UNKNOWN_CLASS); goldbot/ops/class_breakdown.py (asset_class_of, ClassFigures, class_figures, class_splits, is_split, splits, class_voids); goldbot/api/strategy_ranking.py (_Index.cls/cvoid, _class_figures, RankRow.by_class, RankingView.by_class); goldbot/api/trades_ledger.py (by_class, Ledger.class_void, TradesPage.by_class); goldbot/api/schema.py; goldbot/telegram/labs.py (LabSpan.by_class, class_text); goldbot/telegram/digest.py; goldbot/telegram/ranking_text.py; goldbot/ops/learning_ledger.py (LearningClose.symbol, class_void); goldbot/ops/perf_report.py (asset_class/family_class dimensions, LearningReport.asset_classes/family_classes/class_splits, GroupStats.t_r); web/src/screens/trades/Ranking.tsx'
test: tests/test_asset_class_reporting.py; tests/test_strategy_ranking.py::test_each_family_row_breaks_down_by_asset_class_and_flags_a_family_split_across_classes; ::test_a_family_with_a_short_class_is_not_flagged_split; tests/test_trades_ledger.py::test_a_page_breaks_its_closed_trades_down_by_asset_class_and_family_x_class_and_flags_a_split; tests/test_learning_report.py::test_a_lab_that_closed_on_two_asset_classes_gets_a_by_class_line_with_net_n_win_rate_and_r; ::test_a_lab_on_one_asset_class_gets_no_by_class_line; ::test_a_voided_label_never_reaches_a_labs_class_summary; ::test_a_voided_label_never_reaches_the_trades_or_ranking_class_summaries; tests/test_perf_report_asset_class.py; tests/test_ranking_text.py::test_a_family_split_across_asset_classes_says_so_with_each_classes_mean_r; web/src/screens/Trades.test.tsx (ranked rows show class and split)

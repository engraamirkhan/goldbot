name: ci
# Gates every PR and every push to main. GitHub's free tier gives a private repo 2,000 runner-minutes a month and bills
# each job rounded up to the minute, so the checks run in two jobs (backend, frontend) instead of ten, once per change
# (pull_request, plus push to main for the merge commit) and not for docs-only changes. Every check step runs even
# after an earlier one failed, so one run reports all failures. Any failure is posted as one GitHub issue labelled
# `ci` with the tail of each failed check's output, because Claude sandboxes cannot download Actions logs.
# Runner: repository variable CI_RUNNER (e.g. "self-hosted") moves the jobs to a self-hosted runner, which costs no
# minutes; unset means GitHub's ubuntu-latest.
on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend:
    # pre-commit, lint, types, unit, API contract, integration and the research dry run
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/cache@v4
        with: { path: ~/.cache/pre-commit, key: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}" }
      - run: pip install -e ".[dev]" pre-commit && npm --prefix web ci && mkdir -p ci-out
      - name: pre-commit
        if: success() || failure()
        run: set -o pipefail; pre-commit run --all-files --show-diff-on-failure --color never 2>&1 | tee ci-out/pre-commit.txt || { echo pre-commit >> ci-out/failed-backend.list; exit 1; }
      - name: backend-lint
        if: success() || failure()
        run: set -o pipefail; ruff check goldbot tests scripts --output-format concise 2>&1 | tee ci-out/backend-lint.txt || { echo backend-lint >> ci-out/failed-backend.list; exit 1; }
      - name: backend-typecheck
        if: success() || failure()
        run: set -o pipefail; mypy 2>&1 | tee ci-out/backend-typecheck.txt || { echo backend-typecheck >> ci-out/failed-backend.list; exit 1; }
      - name: backend-unit
        if: success() || failure()
        run: set -o pipefail; pytest -m "not integration" -q -n auto --tb=short --cov=goldbot --cov-report=term:skip-covered 2>&1 | tee ci-out/backend-unit.txt || { echo backend-unit >> ci-out/failed-backend.list; exit 1; }
      - name: api-contract
        # the dashboard's types are generated from the backend's OpenAPI schema; both must be committed in sync
        if: success() || failure()
        run: |
          set -o pipefail
          { python scripts/export_openapi.py && npm --prefix web run gen:api && git diff --exit-code -- web/openapi.json web/src/lib/schema.d.ts \
            || { echo "API contract drift: run 'python scripts/export_openapi.py && npm --prefix web run gen:api' and commit"; exit 1; }; } 2>&1 | tee ci-out/api-contract.txt \
            || { echo api-contract >> ci-out/failed-backend.list; exit 1; }
      - name: backend-integration
        if: success() || failure()
        run: |
          set -o pipefail
          { pytest -m integration -q -n auto --tb=short && python scripts/dry_run.py 1 | tail -40; } 2>&1 | tee ci-out/backend-integration.txt \
            || { echo backend-integration >> ci-out/failed-backend.list; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ci-out-backend, path: ci-out/, include-hidden-files: true }

  frontend:
    # lint, types, unit, and e2e: the real FastAPI backend serving the production build, driven by Playwright
    # (Google Chrome preinstalled on GitHub's Ubuntu runners; `playwright install --with-deps` stalled on apt)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e . && npm --prefix web ci && mkdir -p ci-out
      - name: frontend-lint
        if: success() || failure()
        working-directory: web
        run: set -o pipefail; npm run lint 2>&1 | tee ../ci-out/frontend-lint.txt || { echo frontend-lint >> ../ci-out/failed-frontend.list; exit 1; }
      - name: frontend-typecheck
        if: success() || failure()
        working-directory: web
        run: set -o pipefail; npm run typecheck 2>&1 | tee ../ci-out/frontend-typecheck.txt || { echo frontend-typecheck >> ../ci-out/failed-frontend.list; exit 1; }
      - name: frontend-unit
        if: success() || failure()
        working-directory: web
        run: set -o pipefail; npm test -- --reporter=verbose 2>&1 | tee ../ci-out/frontend-unit.txt || { echo frontend-unit >> ../ci-out/failed-frontend.list; exit 1; }
      - name: e2e
        if: success() || failure()
        working-directory: web
        env: { CI: "1", PYTHON: python, PW_CHROMIUM_PATH: "${{ vars.PW_CHROMIUM_PATH || '/usr/bin/google-chrome' }}" }
        run: set -o pipefail; { npm run build && npm run test:e2e; } 2>&1 | tee ../ci-out/e2e.txt || { echo e2e >> ../ci-out/failed-frontend.list; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ci-out-frontend, path: ci-out/, include-hidden-files: true }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-report, path: "web/playwright-report/\nweb/test-results/" }

  report-failure:
    needs: [backend, frontend]
    if: failure()
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: ci-out-*, path: ci-out, merge-multiple: true }
        continue-on-error: true
      - name: open an issue with the failing checks' output
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          JOBS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]; sha = os.environ.get("PR_SHA") or os.environ["GITHUB_SHA"]
          ref = os.environ.get("GITHUB_HEAD_REF") or os.environ["GITHUB_REF_NAME"]
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          failed_jobs = [j for j, v in json.loads(os.environ["JOBS"]).items() if v["result"] == "failure"]
          out = pathlib.Path("ci-out")
          names = sorted({n for f in out.glob("failed-*.list") for n in f.read_text().split()}) if out.exists() else []
          failed = [out / f"{n}.txt" for n in names if (out / f"{n}.txt").exists()]
          names = names or failed_jobs
          parts = [f"Run: {run_url}\nBranch: `{ref}`\nFailed: {', '.join(names) or '(none reported)'}\n"]
          budget = 60000 // max(len(failed), 1)
          for p in failed:
              parts.append(f"### {p.stem}\n```\n{p.read_text(errors='replace')[-budget:]}\n```")
          if not failed:
              parts.append("(no output captured: the jobs failed before any check ran, e.g. no runner was assigned)")
          payload = {"title": f"CI failure on {sha[:7]} ({', '.join(names)})", "body": "\n".join(parts), "labels": ["ci"]}
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues", data=json.dumps(payload).encode(),
                                       headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          print(urllib.request.urlopen(req).status)
          EOF

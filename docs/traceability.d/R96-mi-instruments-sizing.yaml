id: R96
requirement: 'Multi-instrument demo plan 2026-11-02 (owner: all listed instruments on DEMO), lane L1: adding an instrument is a YAML change only (config/instruments.yaml + an account''s `instruments`); real-money/live and observe accounts refuse any non-XAUUSD instrument; magic = 3_000_000 + account index x 10_000 + magic_block x 100 + offset, never colliding; P&L in the account currency per quote via the broker''s loss_per_lot, refused without it; no CONTRACT_OZ constant (costs, min lot and the cost of record per instrument, never pooled with XAUUSD); point, price tolerance, lot-fit spread and triple-swap weekday per symbol; round-number features off outside gold; the symbol check per symbol; per-instrument random controls S0/I0 with ATR stops; XAUUSD sizing and costs byte-identical'
status: implemented (trading-safety and quant review owed; terms verified by the symbol check on the brain; instruments stay disabled and their controls blocked and unregistered until lanes L2-L4)

id: R154
requirement: 'BACKLOG 251, 252, 254, 105. (251) The 1d/1w long daily history is kept current: a daily job appends the engine store''s complete days on the 21:00 UTC roll (long_bars.daily_from_1m, point in time, atomic; an up-to-date file untouched), a preflight item fails when a live 1d/1w history does not reach the engine window (skipped while dark), and health long_history:<account> warns (NOTIFY_ON_WARN) when an arm has been held back history_gap for more than a day. (252/254) ADR 0081 ratified: every research caller of arm_rules judges a 1d/1w bar''s common filter at its nominal entry (enforced in code, a different filter refused); a 1d/1w position''s hold, order id and time exit count from its decision close (the history run''s exit); the CONFIRM of record re-fills at the first 1m open at or after the live entry close, Friday 1d dropped. Only blocker 7 (BACKLOG 253) keeps 1d/1w dark. (105) Every arm rule carries a rule-code version, pinned by its source hash in a test; exploration_obs.arm_rule_version records it per candidate, the H-60 run per trade; readers filter on it and the daily review reports an arm spanning more than one version; arm_hash unchanged.'
status: implemented (2026-11-14, branch feat/engine-backlog-1114); 1d/1w still dark (settings guard, BACKLOG 253)
code: goldbot/ops/long_history.py (refresh, refresh_job, preflight_status), goldbot/ops/jobs.py (long_history_refresh), goldbot/ops/preflight.py (_long_history_item), goldbot/ops/checks/long_history.py (check_long_history), goldbot/ops/health.py (NOTIFY_ON_WARN long_history:), goldbot/engine/long_bars.py (published, held_since, origin, hold_s, time_exit_due), goldbot/engine/history.py (published), goldbot/engine/exploration.py (pending_id, candidate, _send, _intent, exits), goldbot/research/arm_rules.py (entry_after, long_tf_context), goldbot/research/arm_rules_spec.py (spec_masks), goldbot/research/long_confirm.py, scripts/run_arm_backtest.py, goldbot/research/arm_rule_versions.py, goldbot/research/exploration_data.py (record_candidate, read_obs), goldbot/research/daily_review.py (rule_versions), goldbot/db/migrations.py (aux 36), goldbot/config.py + config/settings.yaml (scheduler long_history_refresh, GO_LIVE_BLOCKERS_1D_1W)
test: tests/test_long_history_refresh.py (stale file extended and up-to-date left untouched, partial or unclosed day never appended, job and settings entry, preflight fails on a gap when live and skips while dark, held-back arm warns after a day and tells the owner, engine publishes the first held close, blocker 4 gone); tests/test_long_tf_live_history.py (filter filled in for a research caller that omits it, another filter refused, intraday unchanged, hold from the decision close, order id carries the decision close and the time exit is the history exit, live == history on a 1d and a 1w arm, CONFIRM fills after the reopen in EET and EEST with Friday 1d dropped); tests/test_exploration_engine.py (a DOND 1d hold capped at the week end is now sent, the uncapped hold still refused; every candidate records the rule version in force); tests/test_arm_rule_versions.py (every rule versioned and pinned, an unbumped source change fails, arm hashes unchanged, read_obs filter, daily review line); tests/test_engine_long_tf.py (only the CONFIRM blocker named)

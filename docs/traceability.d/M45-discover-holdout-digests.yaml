id: M45
requirement: 'A queued row''s run does not depend on how far data-v1 reaches (BACKLOG 50, quant review F2 of BACKLOG 47): `--discover` cuts the 1m bars at research.holdout_from before anything is built, as `--h16` does; the pre-registration writer pins the data-v1 yearly parquet sha256 digests of the research window in every queued row''s plan, and research_pass.py and `--discover` verify them before any look (a refresh or re-pull is refused with the file and both digests named); a run whose family and agent have a pending queued row of the quarter with another config hash is refused instead of falling back to the open budget'
status: implemented (quant review pending)

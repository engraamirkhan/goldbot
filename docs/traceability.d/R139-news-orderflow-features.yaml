id: R139
requirement: 'Plan item 8 (algo-systems-review-2026-11-13, 4-ai-systems.md s.5 ranks 1 and 4): point-in-time LLM news and order-flow proxy columns for the feature-discovery screen, as opt-in candidates (never a live model input until a discovery trial passes them; K unchanged; max 40 features per live model). News (`news_llm`, 17 columns): per headline, gold-signed sentiment (relevance x mean of rates/risk/dollar), gold-signed surprise (beat -1, miss +1), event types fed/usd/geo/etf/cb from the collector''s existing LLM fields plus a fixed keyword taxonomy (no new LLM call, no new spend); aggregated on a 15-minute availability grid to relevant-headline counts and sentiment sums over 1h/4h/24h, their 30-day z-scores (7-day warm-up), 4h surprise, shock and event counts, and the 24h unscored share. available_utc = the row''s write time (`written_utc`, stamped by the collector just before its append, after scoring; rows from before that stamp take the next poll''s received_utc, a proven bound since the collector loop is sequential, and the last poll waits), never the publication time; a window in which more than 20 % of prefiltered headlines were left unscored by the budget reads NaN; a headline first seen more than 2 h after publication (a backfill) or from any store source but `rss` never counts; 12 h with nothing available = outage, NaN; both masks apply before the z-scores. Collect-only: no trial reads news_llm until 12 months of forward data (quant review 2026-11-13). Order flow (`orderflow`, 7 columns): quote-update-weighted return scores over 15/60 min (`of_vw_retz_*`, bulk-volume classification on Dukascopy''s bid quote-update counts), the signed count of the current same-direction run (`of_vw_run`), spread level/change/max against the trailing day, tick rate, all per 1m bar at its visible_at; a survivor must beat the plain return/momentum features. Fill slippage dropped (pooled, endogenous, a date marker); MFE/MAE skipped: no excursion fields in `fills` on main. Every join is `store.asof_join` on available_utc at the bar''s close (visible_at) with a staleness tolerance.'
status: 'implemented (2026-11-13, branch feat/news-orderflow-features); no trial run'
code: 'goldbot/data/news_collector.py (`written_utc`), goldbot/data/news_features.py, goldbot/data/orderflow.py, goldbot/features/news_llm.py, goldbot/features/orderflow.py; goldbot/research/pipeline.py (OPT_IN_FEATURES); scripts/research_pass.py (`feature_ctx` news= / orderflow_bars=)'
test: 'tests/test_news_llm_features.py (truncation invariance with seeded future headlines, received-after-close not seen, write-time and next-poll availability, backfill and non-rss dropped, outage and budget masks before the z-scores, collect-only note, pipeline lookahead_check, shuffled-within-day control); tests/test_orderflow_features.py (truncation invariance with seeded later minutes, own last minute seen and no later one, 1m gap NaN, no-volume minutes missing, no fill column, renamed columns and screen note, pipeline lookahead_check); tests/test_opt_in_features.py; tests/test_news.py::test_every_stored_row_carries_its_write_time_after_scoring'

id: R172
requirement: 'One writer per stored engine minute (ADR 0091; architect plan 2026-11-20, quant Q1-Q6, trading-safety S1-S5): gold''s bars_1m_live key is per account (books.live_key = account, symbol); one engine per account holds an exclusive writer lock taken before any bridge connection, a duplicate start refused without touching the holder''s state; every row the engine writes carries its boot id and each start records whether it holds the lock; the nightly arm read proves a window was its deciding start''s own before reading it without the sampled void'
status: 'implemented (2026-11-20, branch feat/gold-live-key-per-account); reviews due: quant-reviewer, trading-safety-reviewer, code-reviewer'
code: 'goldbot/engine/books.py (live_key, legacy_live_key); goldbot/ops/engine_lock.py (hold_writer, WriterHold, holder_pid); goldbot/ops/services/engine.py (_run_engine: hold_writer, boot id, record_boot; refuse_duplicate, ENGINE_DUPLICATE_EXIT); goldbot/ops/checks/engine.py (check_duplicate_engine) and goldbot/ops/health.py (NOTIFY_ON_WARN); goldbot/engine/history.py (BarWriter writer column, legacy-key union in _store_reader, saved_cutover over both keys, record_boot); goldbot/engine/runner.py (EngineConfig.boot_id, dq events stamped); goldbot/data/quality.py (DQEvent.writer, events_frame); goldbot/engine/exploration.py and goldbot/research/exploration_data.py (candidate boot_id) with goldbot/db/migrations.py aux 40; goldbot/data/account_bars.py (engine_boots, live_cutover, live_rows, minute_versions writer/keyed); goldbot/research/arm_integrity.py (AccountMinutes.writer_proof, boots, UNPROVEN_WRITER, saved_cutover over both keys); goldbot/ops/long_history.py (gold_key both keys); goldbot/api/trade_chart.py (own key first). Reading taken: rows without a locked writer stay void, fail closed: legacy-key minutes, a start without the lock (no flock: the Windows VPS), an unknown boot or writer, a later start before the decision, an unlocked start inside the window, a row written outside its start''s life are all `unproven_writer` for a candidate with a boot id; a candidate without one is read by the rules before only when decided before the account''s first recorded start. Legacy minutes are read only before the first locked start (never the first own minute). The engine reads both keys with no bound (own wins), so its bars and cut-over are unchanged.'
test: tests/test_gold_live_key.py::test_a_gold_book_keys_its_minutes_by_its_account_and_reads_the_brokers_key_only_as_legacy; ::test_the_engine_writes_its_minutes_under_its_account_with_its_boot_id_and_nothing_under_the_brokers_key; ::test_a_restart_after_the_key_change_holds_the_same_bars_and_cut_over_byte_for_byte; ::test_a_minute_on_both_keys_is_held_as_the_accounts_own_copy; ::test_the_writer_column_never_reaches_the_engines_bars; ::test_a_sticky_flagged_copy_keeps_its_own_writer_over_a_later_plain_copy; ::test_each_engine_start_records_its_boot_id_and_whether_it_holds_the_writer_lock; ::test_the_engines_dq_events_carry_its_boot_id_and_other_writers_rows_keep_their_columns; ::test_an_exploration_candidate_records_the_deciding_engines_boot_id; ::test_a_second_engine_of_the_account_is_refused_naming_the_holders_pid_and_kill_9_frees_the_lock; ::test_without_flock_the_engine_starts_unproven_and_is_never_refused; ::test_a_refused_duplicate_start_exits_for_a_restart_before_any_bridge_and_never_writes_the_holders_state; tests/test_arm_writer_proof.py::test_a_window_written_by_its_own_locked_start_is_read_and_sampled_minutes_no_longer_void_it; ::test_an_unlocked_start_alongside_a_locked_one_voids_the_decision; ::test_a_start_on_a_host_without_flock_never_proves_its_rows; ::test_an_unknown_boot_id_or_a_minute_without_a_writer_voids; ::test_a_candidate_without_a_boot_id_decided_after_the_first_recorded_start_is_void; ::test_sequential_locked_starts_inside_one_window_are_proven; ::test_a_minute_a_later_start_overwrote_after_the_decision_voids; ::test_a_proven_window_still_voids_on_a_replacement_written_after_the_decision; ::test_a_proven_window_still_voids_on_a_fill_or_rebase_written_after_the_decision; ::test_a_corrected_row_a_script_wrote_without_a_writer_voids_a_proven_window; ::test_legacy_minutes_are_read_only_before_the_first_locked_start_and_the_accounts_own_copy_wins; ::test_a_back_fill_into_the_own_key_never_moves_the_legacy_cut_over; ::test_a_decision_whose_window_holds_legacy_minutes_is_void_and_one_wholly_after_the_cut_over_is_read; ::test_the_saved_cut_over_is_the_earlier_of_the_own_and_the_legacy_key; ::test_a_minute_quarantined_from_the_accounts_own_live_key_is_read_from_no_feed; ::test_every_reader_of_the_live_minutes_is_known_and_none_lists_them_by_source

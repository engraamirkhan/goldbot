id: R169
requirement: 'Discovered-arm integrity voids precise, not looser (SRE dry run 2026-11-19; prereg-amendment-2026-11-18-discovered-arms.md 4 and 1): a broker_bar_replaced event near a decision voids only when the store cannot show the replacement (no flagged copy of its minute with a write time, fewer flagged minutes than its count, an unparseable count); a flagged copy written before the decision is recomputed, after it voids (K1); the engine never holds a release minute at or after its cut-over, so the night never reads one, and a missing minute after the cut-over voids (gap_after_cutover) when the broker M1 has it or the release has it without the broker M1 silent around it; the engine refuses a learning row whose since is before EFFECTIVE_UTC''s day, one constant for registration and the engine'
status: 'implemented (2026-11-19, branch fix/arm-integrity-voids); reviews: quant-reviewer, trading-safety-reviewer (engine load refusal)'
code: goldbot/research/arm_integrity.py (AccountMinutes.stored_replacement, AccountMinutes.gap_after_cutover, replaced_count, BROKER_SILENCE_MAX, GAP_AFTER_CUTOVER); goldbot/engine/arm_registry.py (_learning_refusal); goldbot/research/arm_rules_spec.py (EFFECTIVE_UTC); goldbot/ops/autodisc_register.py (imports EFFECTIVE_UTC)
test: tests/test_arm_lifecycle_inputs.py::test_a_replacement_logged_near_the_decision_but_stored_before_it_is_recomputed_not_voided; ::test_the_night_reads_the_count_of_the_replacement_event_the_engine_writes; ::test_a_window_minute_the_engine_replaced_after_the_decision_leaves_the_candidate_unrecomputable_not_refused; tests/test_arm_integrity.py::test_a_release_minute_where_the_brokers_m1_shows_no_bar_after_the_cutover_is_not_held_and_the_read_verifies; ::test_a_gap_after_the_cutover_the_brokers_m1_has_a_bar_for_voids_even_without_a_release_minute; ::test_release_minutes_after_the_cutover_in_the_window_void_the_candidate; ::test_the_brokers_m1_never_fills_a_minute_the_engine_never_held; tests/test_discovered_arm_registration.py::test_the_engine_refuses_a_learning_row_whose_since_is_before_the_amendments_effective_day

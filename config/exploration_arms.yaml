  # Multi-instrument learning arms (docs/research/learning-mi-2026-11-02.md; owner 2026-11-02, ADR 0061 amendment and
  # ADR 0072; research lead 2026-11-02: all 26 registered): one opening-range breakout per instrument in its OWN session

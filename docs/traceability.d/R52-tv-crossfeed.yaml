id: R52
requirement: Two price sources kept separate and compared, never blended (Data architecture, D12/D20); TradingView is optional and must never block trading or exits
status: implemented
code: 'goldbot/data/tv_reconcile.py: pulled TradingView bars (origin pull_live/pull_history; chart feed is OANDA) are a second feed only; a close more than 2 points (strictly) from the Dukascopy/broker M1 resampled flags the bar `dq` = tv_close_diff and sets its plots NaN; `confirm_spikes_with_tv` adds TV to D20. Job `tv_reconcile` (goldbot/ops/jobs.py, daily 23:15, settings scheduler.tv_reconcile) rewrites flagged rows in tv_indicators and writes dq_events (source tradingview). goldbot/ops/tv_pull_health.py: `tv_auth` table in state/tv_auth.db written by the pull (`record_ok`, `record_expired`); health check `tv_pull` WARNs (never FAIL) when expired, stale (36 h) or corrupt (counts as expired); one Telegram notice per expiry, persisted across restarts and re-armed by the next successful pull'
test: tests/test_tv_reconcile.py::test_close_diff_over_2_points_flags_and_nans_plot, ::test_exactly_2_points_is_kept, ::test_job_rewrites_flagged_rows_in_the_store; tests/test_tv_pull_health.py::test_expiry_notifies_once_across_restart, ::test_corrupt_state_counts_as_expired, ::test_expired_state_is_warn_not_fail, ::test_stale_pull_is_warn_not_fail

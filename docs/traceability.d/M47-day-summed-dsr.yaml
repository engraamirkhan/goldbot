id: M47
requirement: 'E-6 (BACKLOG 76; pre-registration 2027Q1 O-5/O-6, amended 2026-10-17 before any H-14 outcome): a discovery survivor passes only if the gates pass AND the day-summed DSR is also >= 0.95, computed on one summed net R per entry UTC day (ts_utc + one bar) over days with at least one model-filtered trade only (n = G >= 200), with var(SR) = 1/G, the skew and kurtosis of the daily sums, and the same K = `n_trials_effective` as the gate (both discoveries'' K_eff included), the gate DSR read from `current_dsr` (on ret); the per-trade (R basis) and day-summed effective t are recorded with the trial and shown in the research report; the evaluator''s verdict, the holdout slot and the promotion refusal count an O-5/O-6 survivor pass only with the reading passed'
status: implemented (code review APPROVE; quant re-review pending)

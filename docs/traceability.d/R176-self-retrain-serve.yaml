id: R176
requirement: 'Owner 2026-11-24, "self-retraining is the core of the system": the engine serves the weekly self-retrain''s ACTIVE per-arm filters (aux.db self_retrain_models, status column only) at the exploration send, drop-only before the RiskGate (prereg-2026-11-24-self-retrain.md section 3). Only a demo strategy arm''s first-unit gold 15m/1h/4h signal, on an account risk.gate.is_demo says is demo, from the model''s activation, with settings research.self_retrain enabled and serve; never a control, replay_only, cost, learning (GD-1) or owner-experiment arm, a pyramid add, 1m/5m or 1d/1w. The vector is the trainer''s (feature_snapshots.decision_features at the decision, self_retrain.design). A dropped candidate is recorded taken 0, mu 0, blocked_reason self_retrain:<model_version> (quant R11), so it is replay-labelled; every scored candidate carries meta_p and model_version. Any error fails open (unfiltered), is logged and published; health engine:<account> WARNs for 15 min. Models re-read at most every 5 min; < 5 ms a candidate once its vector is built.'
status: implemented (2026-11-24, branch feat/self-retrain-serve); no model is ACTIVE before the 2026-12-13 run at the earliest (card section 4)
code: 'goldbot/engine/meta_filter.py; goldbot/engine/exploration.py (_send, candidate, _Pass, Exploration.meta_filter); goldbot/engine/runner.py (EngineConfig.meta_filter_serve, state meta_filter); goldbot/ops/services/engine.py (meta_filter_serve); goldbot/ops/checks/engine.py (meta_filter_part); config/settings.yaml research.self_retrain.serve'
test: tests/test_meta_filter_serve.py::test_a_candidate_scoring_below_its_arms_active_cut_is_dropped_before_the_riskgate_and_recorded_untaken; ::test_a_candidate_at_or_above_the_cut_is_sent_unchanged_and_its_record_carries_the_score; ::test_with_serving_switched_off_an_active_model_changes_nothing; ::test_controls_replay_only_learning_cost_and_owner_experiment_arms_are_never_filtered; ::test_an_account_that_is_not_demo_is_never_filtered; ::test_the_served_score_is_the_trainers_model_on_the_trainers_snapshot_vector; ::test_a_scoring_error_fails_open_to_the_unfiltered_send_logs_and_publishes_a_health_warning; ::test_models_are_cached_and_reloaded_at_most_every_reload_interval; ::test_the_filter_adds_under_5_ms_a_candidate_once_its_decisions_vector_is_built; ::test_the_filter_is_called_only_from_the_entry_branch_of_send_before_the_order_core

id: X20
requirement: 'Gross closed trades read conservatively (quant review 2026-10-12, findings A-D): "Do NOT drop gross rows: their causes can be outcome-linked, so dropping them is selection bias. Instead, charge each gross row a conservative imputed cost: the measured commission from the cost table (or the prior), plus swap for every rollover held through (from broker terms or the swap prior, with the triple-swap day counted)"'
status: implemented
code: 'goldbot/ops/cost_imputation.py `CostImputer` (from_state: per-account nightly cost table, else settings commission and swap prior; charges only the components a row''s ret lacks; paid swap only, never a credit; rollover_nights with the triple day; return = cost per oz / entry, R = cost per oz / initial risk; unpriced rows counted) -> goldbot/ops/gates_phase.py paper_expectancy, live_expectancy, live_drawdown, brokers_agree and the stop-rule bound on charged returns with the gross count and total in the evidence (an unpriced gross row fails the item closed), optional paper/live_gross_share items (settings gates.max_gross_share, null = context only; owner decision, recommended 0.05); goldbot/research/ruin.py r_from_closed_trades charges R, cost_basis "net" / "net+imputed (N)" / "unknown"; goldbot/engine/runner.py `_record_closed` USD account without a conversion: ret = pnl / notional, and new ClosedTrade.ret_basis ("pnl" or "price", None on older records)'
test: tests/test_cost_imputation.py (14 tests, incl. ::test_an_older_broker_row_with_a_stop_and_no_r_is_read_as_a_price_return); tests/test_phase_gates.py::test_gross_paper_rows_are_kept_and_charged_the_imputed_cost_in_paper_expectancy; ::test_a_gross_row_that_cannot_be_priced_fails_the_expectancy_items_closed; ::test_gross_live_rows_are_charged_in_live_expectancy_drawdown_and_broker_agreement; ::test_broker_agreement_compares_the_charged_expectancy; ::test_the_gross_share_item_is_context_only_while_the_setting_is_off; ::test_the_gross_share_item_decides_the_gate_when_the_owner_sets_a_limit; ::test_the_stop_rule_charges_gross_rows_and_keeps_them_pooled; tests/test_ruin.py::test_gross_closed_trades_are_kept_and_charged_their_imputed_cost_in_r; ::test_a_gross_row_whose_risk_is_unknown_makes_the_cost_basis_unknown; tests/test_currency_sizing.py::test_a_usd_account_without_a_conversion_records_a_net_return_from_the_pnl; ::test_closed_trade_return_is_from_the_net_pnl_and_says_so_when_converted; ::test_the_incident_check_adds_the_imputed_cost_to_a_gross_loss; tests/test_persistence_compat.py cases closed_trade_from_before_ret_basis, closed_trade_price_return_without_ret_basis

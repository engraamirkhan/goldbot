id: R99
requirement: 'Multi-instrument demo follow-ups (trading-safety review of PR #325; ADR 0043 amendment 2026-11-03): X3''s net same-side cap is per book in minimum lots, max(0.10, 10 x volume_min), gold unchanged at 0.10, judged alike by `_send` and a growth arm''s `growth_lots`; the bridge guard accepts the account''s instrument magic blocks for orders and every registry block for stop changes (wind-down), reads ownership from every symbol, and ties each magic block to its own symbol (gold''s base the account''s symbol, each instrument base its broker symbol; a block with no symbol is refused); a partial close (scale-out) of any symbol is rounded down to that symbol''s own volume step and refused unsent (10014) below its minimum lot or leaving less than it open, so the whole position keeps its stop; exits never gated'
status: 'implemented; trading-safety review of the follow-ups pending'
code: 'goldbot/engine/exploration.py `MAX_NET_MIN_LOTS`, `net_lot_cap`, `_send` (same_side), `growth_lots`; goldbot/execution/bridge.py `GuardedBroker` (`instrument_bases`, `managed_bases`, `block_symbols`, `_ours`, `_managed`, `_own_symbol`, `_own_position` via `account_positions`); goldbot/execution/mt5_adapter.py `close`, `_partial_lots`; goldbot/ops/services/engine.py `account_magic_bases`, `account_managed_bases`, `account_block_symbols`; goldbot/ops/services/bridge.py `run_bridge`, `run_order_lane`; docs/decisions/0043-exploration-budget-and-rotation.md (amendment 2026-11-03)'
test: 'tests/test_bridge_v10_multi_symbol.py::test_the_same_side_cap_is_ten_minimum_lots_and_gold_keeps_its_tenth_of_a_lot; tests/test_bridge_v10_multi_symbol.py (the guard accepts its account''s instrument ranges and refuses every other magic; without instrument bases the guard is gold only as before; stop changes on an instrument position pass and a foreign one is refused; a wind-down block''s stops still change but it takes no new order; the managed bases cover every registry block on demo and none on live; the bridge bases are the engine''s books on demo and gold alone on live; the guard refuses an instrument magic on gold and accepts it on its own symbol; the guard refuses a gold magic on an instrument symbol and accepts it on gold; an instrument block with no symbol in the map is refused; the block symbols are the account''s symbol and each instrument''s broker symbol); tests/test_growth_test.py::test_growth_lots_bounds_a_book_by_its_own_minimum_lot_cap_not_golds_tenth; tests/test_close_any_symbol.py (a partial close of another symbol rounds down to that symbol''s own volume step; a partial close its symbol cannot carry is refused unsent and the position keeps its stop; a partial close of another symbol without its symbol info is refused unsent; a gold partial close is still sent at gold''s step)'

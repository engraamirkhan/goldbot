id: R36
requirement: 'Entry windows from the calendar, off by default (BACKLOG 17, 18; playbook G-2, G-3): when enabled, RiskGate refuses entries `tier2_blackout` from `before_min` (5) before to `after_min` (15) after a tier-2 USD event in the live calendar; `reopen_window` for `after_daily_reopen_min` (10) after each daily reopen and `after_monday_open_min` (30) after the weekly open (any reopen after a closure of 12 h or more), from the broker session table; `holiday_thin` on a listed thin-liquidity server date; `calendar_unavailable` when an enabled calendar window has no calendar (no store, unreadable or empty archive window, missing or expired holiday list). Both edges inclusive; entries only, exits never gated'
status: in review
code: 'goldbot/config.py `Tier2Blackout` (`risk.blackout.tier2`), `ReopenSettings` (`risk.reopen`), `HolidaySettings` (`risk.holidays`), config/settings.yaml; config/holidays_cme_metals.yaml (`cme-metals-v2`, 2026-2028: US federal holidays as a proxy, not measured, less Columbus and Veterans Day; Good Friday, Easter Monday, day after Thanksgiving, 24/26/31 Dec, 1/2 Jan, by server date = CME trading day; measurement BACKLOG 45, replay BACKLOG 46); goldbot/data/econ_calendar.py `TIER2_PATTERNS` (the G-3 list is tier 2 whatever the feed''s impact), `blackout_window(tier=)`; goldbot/risk/windows.py `HolidayList`, `load_holidays`, `server_date`, `last_reopen`, `reopen_window`; goldbot/risk/gate.py `RiskLimits.tier2/reopen/holidays`, `AccountState.tier2_blackout/reopen_window/holiday_thin/calendar_unavailable`, `RiskGate.window_reasons` (a disabled window adds nothing); goldbot/engine/runner.py `_calendar_events` (shared with `_blackout`), `_holiday_list`, `_entry_windows`/`_window_flags` (fails closed; a raising session table = inside the reopen window; any other error sets calendar_unavailable and the reopen flag; logged once per transition), `_windows_state` -> `windows` in engine_<account>.json; tier-2 availability `windows.calendar_gap` (newest fetch <= 7 d old and the archive covering through now + 24 h by Forex Factory week, `ff_week_end`); scheduler `calendar_archive_sunday` (Sunday 18:00 UTC); goldbot/ops/health.py `check_entry_windows` (FAIL after 30 min unavailable with the market open; WARN on a fetch over 36 h old and a holiday list ending within 90 d; Telegram via NOTIFY_ON_WARN); `on_bar_close` manages open trades even when the account read raises'
test: 'tests/test_entry_windows.py (settings off with 5/15, 10/30; disabled = identical decisions per flag; each reason alone; calendar_unavailable only with a calendar window on; tier 2 at both edges in EST and EDT, in the gate and the engine; no store, empty or unreadable archive fail closed; daily and weekly reopen at both edges in winter and summer; broker session table moves the window; raising table fails closed; holiday list re-derived from the rules; holiday server-day edges in winter and summer; missing, expired and misspelt-key list fail closed (exits still run); all off = no flag at any window; a stop is taken while every window refuses entries; review fixes: hand-reviewed holiday set, list valid over a year ahead (CI), gap-week offset pinned, Sunday open with only last week archived fails closed until the Sunday fetch, a fetch over a week old, the windows block and once-per-transition logging, a raising computation, a bar close whose account read fails still manages trades, health FAIL/WARN cases); tests/test_econ_calendar.py (claims tier 2)'

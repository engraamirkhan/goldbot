id: R122
requirement: 'The Telegram health pass does no quadratic or repeated work on unchanged inputs, with every check''s verdict and every research result unchanged: the registry ledger (`director._Ledger`) matches each trial to its ad-hoc pre-registration through an index by `ts` that picks the same row as the linear scan (the first unused one in registry order, `config_hash` matching or not named; unhashable or NaN stamps compared by `==` as before), and `evaluate_gates` counts `n_trials_effective` once and passes it to `best_backtest_trial`; order_failed and history_gap share one decisions-journal read per part-file set, from the earlier of their windows (no eviction across a month boundary), and data_quality reads dq_events again only when a part of the table was added or removed; the trade ledger resolves the instruments registry once per build and re-selects aux.db''s exploration records only when aux.db or its WAL changed ((inode, mtime_ns, size), equal before and after the read, files older than AUX_RACY_S) (CPU attribution 2026-11-10, round 3; acceptance on the brain: pass < 5 s, service < 5 % of a core)'
status: 'implemented (2026-11-10, branch fix/health-pass-cost-3); synthetic 5,930 ad-hoc + 5,930 trials: match 2.68 s -> 0.05 s for the whole ledger; brain acceptance to be measured after deploy'
code: 'goldbot/research/director.py (`_AdhocIndex`, `_Ledger`); goldbot/ops/gates_phase.py (`best_backtest_trial` k=, `evaluate_gates`); goldbot/ops/checks/_base.py (`_part_files`, `_cached_window`); goldbot/ops/checks/engine.py (`_journal_from`, `_journal_window`, `_failed_order_retcodes`); goldbot/ops/checks/feeds.py (`check_data_quality`, `_DQ`); goldbot/api/trades_ledger.py (`_Ctx.reg`, `_aux_marker`, `_aux_trades`)'
test: tests/test_director_adhoc_index.py::test_duplicate_ts_rows_are_used_in_registry_order_one_trial_each; ::test_missing_none_and_mismatched_links_match_like_the_linear_scan; ::test_unhashable_nan_and_numeric_ts_values_match_like_the_linear_scan; ::test_slot_use_is_unchanged_by_the_index; ::test_random_registries_match_the_linear_oracle; ::test_matching_reads_each_row_a_bounded_number_of_times_not_once_per_trial; ::test_evaluate_gates_counts_the_trials_once_per_evaluation; ::test_best_backtest_trial_reads_a_passed_trial_count_without_recounting; tests/test_health_shared_journal_reads.py::test_history_gap_and_order_failed_share_one_read_of_an_unchanged_journal; ::test_the_shared_read_does_not_thrash_when_the_failed_order_window_spans_a_month_boundary; ::test_a_failed_order_journalled_after_a_pass_is_reported_with_its_retcode_on_the_next_pass; ::test_the_cached_retcodes_equal_a_fresh_bounded_read; ::test_data_quality_reads_dq_events_once_while_no_event_is_written; ::test_a_new_error_event_is_seen_on_the_next_pass_and_matches_a_fresh_read; ::test_an_event_of_another_symbol_also_invalidates_the_dq_read; tests/test_trades_ledger_pass_cost.py::test_the_instruments_registry_is_resolved_once_per_ledger_build; ::test_an_unchanged_aux_db_is_selected_once_across_builds_and_the_ledger_is_unchanged; ::test_a_trade_written_after_a_build_is_in_the_next_build; ::test_a_close_recorded_on_an_open_trade_is_seen_on_the_next_build; ::test_a_freshly_written_aux_db_is_not_cached; ::test_open_rows_still_follow_the_engines_price_between_builds

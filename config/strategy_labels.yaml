# The owner's names for strategies (docs/design/trades-ux-2026-10-27.md §2.2, design-system rule 3: no raw ids on
# screen). Read by goldbot/api/strategy_labels.py for the trades ledger (GET /api/trades), the open trades and Today.
#
# families: a family key -> its name and, in plain words, what makes it trade (`why`, at most 60 characters; the row
#   adds the timeframe). The key is an exploration arm's rule (config/exploration_arms.yaml; a `specialist` arm's
#   key is its `params.specialist`) or a specialist family (goldbot/specialists, `family`).
# arms: an arm id -> its variant tag, required when two running arms share a family and a timeframe (a broker twin
#   takes its `twin_of` arm's tag). tests/test_strategy_labels.py fails CI on a new arm or family without a label.
#   `version: 2` (with or without a tag) marks a rule edit: a new arm id and config_hash that amends an earlier arm's
#   rule. It starts its own ranking row ("v2", n from 0; goldbot/api/strategy_ranking.py) and is one more registry
#   trial (ADR 0053 decision 6d); absent means version 1.
families:
  # exploration rules
  random_bracket: {label: "Random control", why: "Random entry at a set minute: the null the arms are measured against"}
  session_vwap_fade: {label: "VWAP fade", why: "Price stretched from the session VWAP, faded back"}
  opening_range_break: {label: "Opening range", why: "Close outside the session's opening range"}
  sweep_absorb: {label: "Sweep + absorb", why: "A sweep of a recent high or low was absorbed"}
  box_break_close: {label: "Box break + close", why: "Close outside the box after a squeeze"}
  box_next: {label: "Box break, exit study", why: "Close outside the box; the exit is what is measured"}
  session_range_break: {label: "Session range breakout", why: "Asia range broken in London, London range in New York"}
  session_range_control: {label: "Growth test random control", why: "Random time and side in the same session windows: GS1's null"}
  ema_pullback: {label: "EMA pullback", why: "Pullback to the EMA in a trend"}
  tsmom: {label: "Trend momentum", why: "Price trend over the lookback points one way"}
  donchian_break: {label: "Donchian break", why: "Close beyond the 55-bar high or low"}
  pdc_break: {label: "Prior close break", why: "Break of the prior day's close level"}
  squeeze_release: {label: "Squeeze release", why: "Volatility squeeze released in one direction"}
  clock_anchor: {label: "Clock anchor", why: "Entry at a fixed time of day"}
  clock_anchor_control: {label: "Clock anchor control", why: "Random side at the clock anchor's times: its null"}
  htf_stretch_break: {label: "Stretch break", why: "Break while stretched on the higher timeframe"}
  htf_stretch_break_control: {label: "Stretch break control", why: "Random side in the same stretched state: its null"}
  hurst_band_break: {label: "Band break (trend regime)", why: "Band break while the market is trending"}
  hurst_band_break_control: {label: "Band break control", why: "Random side at the band break's times: its null"}
  level_break: {label: "Level break", why: "Break of a key level (prior day, week, session)"}
  ob_retest: {label: "Order block retest", why: "Retest of an order block"}
  friday_long: {label: "Friday long", why: "Long from Thursday evening to Friday afternoon (New York)"}
  low30_touch: {label: "30-day low touch", why: "Touch of the 30-day low, held for the bounce"}
  low30_control: {label: "30-day low control", why: "Random entry on the low-touch days: its null"}
  # H-81 scalp strata (Z arms)
  tick_surge: {label: "Tick surge", why: "A burst of ticks one way, followed"}
  run_fade: {label: "Run fade", why: "An exhausted run, faded"}
  extreme_break: {label: "Hour extreme break", why: "Break of the prior hour's high or low"}
  absorb_fade: {label: "Absorption fade", why: "Heavy volume absorbed at a level, faded"}
  halfhour_persist: {label: "Half-hour persistence", why: "The half-hour's move carried on"}
  round_reject: {label: "Round number rejection", why: "A touch of a round number rejected"}
  round_break: {label: "Round number break", why: "Close through a round number"}
  nr4_break: {label: "NR4 break", why: "Break of a narrow-range inside bar"}
  htf_reclaim: {label: "Trend reclaim", why: "5m reclaim in the direction of the 1h trend"}
  three_horizon: {label: "Three-horizon momentum", why: "Momentum agreed on three horizons"}
  scalp_control: {label: "Random control (strata)", why: "Random entry at the strata's times: their null"}
  blocked: {label: "Not running yet", why: "Blocked in the frozen spec until its condition is met"}
  # specialist families (engine strategies, shadow models and specialist arms)
  asia_drift: {label: "Asia drift", why: "The Asian session's drift continued"}
  box_break: {label: "Box break", why: "Break of the box"}
  box_course: {label: "Box course", why: "Box setup from the course rules"}
  box_retest: {label: "Box retest", why: "Retest of the broken box edge"}
  box_rip: {label: "Box rip", why: "Fast move out of the box"}
  breakout: {label: "Range breakout", why: "Breakout of a compressed range"}
  eq_liquidity_run: {label: "Equal-highs run", why: "Run on liquidity at equal highs or lows"}
  fakey: {label: "Fakey", why: "False break of an inside bar, reversed"}
  intraday_momentum: {label: "Intraday momentum", why: "The session's opening move continued"}
  mean_reversion: {label: "Mean reversion", why: "Band and RSI stretch, faded back"}
  session_open: {label: "Session open", why: "Move at the session open"}
  smc_structure: {label: "Market structure", why: "Change of market structure (TradingView rule)"}
  trend: {label: "Trend", why: "Trend filter and pullback agreed"}
  trend_level_signal: {label: "Trend level", why: "Trend signal at a level"}

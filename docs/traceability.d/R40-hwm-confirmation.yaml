id: R40
requirement: 'A rise in the balance high-water mark is applied only once confirmed (BACKLOG 54, ADR 0018): by the deal history since the mark was set (at least one balance-changing deal; mark + profit, commission, swap and fee, credit excluded, within `risk.hwm_rise_tolerance` (0.1%) of the read; a deposit explains a rise and raises the mark), or by the next balance read agreeing within the same tolerance (the mark rises to the lower of the two); one disagreeing read never raises it, two agreeing reads always do; the mark is never lowered by the rule (only /rearm); an unconfirmed rise is re-read on the next tick and a refused one is logged and recorded; the candidate and the anchor persist in core.db, a row for another mark is void, and a restart never applies an unconfirmed rise; a candidate the deals after it carry to a later read was a real peak and raises the mark (review M1); a run of disagreeing candidates keeps its first pending time (M2); core.db is opened once per engine with a 500 ms write busy timeout (L1); a candidate older than 10 min is void (L2); the paper broker declares exact balance reads (one read raises)'
status: implemented
code: 'goldbot/risk/hwm.py (`HwmConfirmation`, `HWM` repo, `step`, `deals_balance_change`, `HwmStore`, `read_only_confirmation`, `CANDIDATE_MAX_AGE`, `WRITE_BUSY_TIMEOUT_MS`); goldbot/execution/paper.py `PaperBroker.balance_exact`; goldbot/db/migrations.py core migration 2 `hwm_confirmation` (additive); goldbot/engine/runner.py `_update_hwm` (in `_refresh_account`, replacing `max(hwm, balance)`), `_load_hwm`, `_set_hwm`, `on_tick` (`_reread_hwm`); goldbot/config.py `RiskSettings.hwm_rise_tolerance` (0.001 in (0, 0.02)); config/settings.yaml `risk.hwm_rise_tolerance`; goldbot/risk/gate.py `RiskLimits.hwm_rise_tolerance` (`from_settings`); goldbot/ops/checks/risk.py `check_risk_state` (`_hwm_pending`, `HWM_PENDING_WARN_S`)'
test: 'tests/test_hwm_confirmation.py (a single inflated balance read leaves the mark unchanged and causes no size-down or halt on the next real reads; a refused rise is logged and recorded; two disagreeing inflated reads do not raise it; low or NaN reads never lower it; two agreeing reads raise it, to the lower of two within the tolerance; a paper close raises it on the second read; a rise the deal history explains, or a deposit, raises it on the first read; an unexplaining, empty or unreadable deal history, or credit, does not; an unconfirmed rise is re-read on the next tick; a restart between the reads does not apply it, and an agreeing read after a restart confirms it; the state is in core.db, not a JSON file; a row for another mark is void; an unwritable core.db never raises the mark on one read; the migration is additive; the tolerance comes from settings; health warns on a rise waiting more than 5 min in market hours, ignores a void row and creates no core.db; review fixes: a real peak followed by a loss raises the mark to the peak, a glitch followed by a lower read without deals is refused, paper reads are exact and no other broker class declares it, jittering reads keep the first pending time so health warns, a read at or below the mark clears it, a candidate older than 10 min is void in the rule and on load, a legacy row uses its pending time, core.db is opened once with a short busy timeout, an unopenable core.db never raises on one read); tests/test_persistence_compat.py::case_hwm_confirmation'

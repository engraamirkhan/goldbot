id: R92
requirement: 'ADR 0049 D3 / T1: a demo probe_only host paused at -8% rolls at the next 00:00 UTC risk-day roll (mark = max(balance, equity), stage NORMAL, epoch n -> n+1). It is refused (journalled `rotation_refused`, retried at the next roll) unless the account is mode demo + probe_only with an effective approval mode of auto (owner /mode, else the account''s, through the auto lock) outside the propose-only window after an owner re-arm, no owner, supervisor or drift halt stands, the terminal reports demo at the call, the drawdown is >= 8% and < 12% with no 12% read pending, and the host is flat except P0. The day and week starts, dynamic limits and exits are untouched. Each roll is journalled `rotation`, and once the risk state is saved it is sent to the owner on Telegram. Other accounts are never read. The owner TOTP re-arm path, the stage machine and the dynamic-limit reset are unchanged (source-pinned)'
status: 'implemented (T1, T3 by construction); T1 accepted by trading-safety on PR #290 with F1-F6 applied; T2, T4-T6 open'
code: 'goldbot/engine/demo_roll.py `at_day_roll`, `_refusal`, `_roll`; goldbot/engine/runner.py `_roll_risk_period`, `_save_risk_state_now` (returns whether saved), `_save_risk_state`, `_load_risk_state`; goldbot/engine/store.py `RiskSnapshot.epoch`, `epoch_utc`; docs/decisions/0049-demo-epoch-roll-and-volume-budget.md'
test: 'tests/test_demo_roll.py (39 cases: the roll, max(balance, equity), the starts untouched, same-day no roll, the Telegram notice and no notice on a failed save, epoch persistence, the hwm anchor, P0 and non-P0 positions, one test per refusal reason incl. the error path and the owner/supervisor/drift halts, the effective mode after a restart (owner /mode propose, propose-only window, the auto lock on a real terminal), halted and at-halt no roll, live/demo-strategy/paper never read or rolled, `test_the_owner_totp_rearm_path_is_byte_identical`)'

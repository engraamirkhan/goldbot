id: R42
requirement: 'Round-trip cost in the absolute daily projection (BACKLOG 36, trading-safety review LOW-6): an entry is refused (`daily_loss_limit_abs`) when loss so far (+ open risk with `project_open_risk`) + its full stop risk + its round-trip cost exceeds the limit; the cost is cost_atr x ATR (spread, slippage, commission from the cost table, else the configured fallback) plus the paid swap of a broker rollover before the risk day ends (ADR 0017 rule: measured rates else the settings prior, triple day counted, credit never), x lots x contract x fx in the account currency; never negative; entries only, exits never gated'
status: implemented
code: 'goldbot/risk/gate.py `Intent.swap_usd_per_oz` (non-finite = `invalid_state`), `GateDecision.cost_amount`, the cost in the projected check of `RiskGate.check`; goldbot/ops/cost_imputation.py `account_swap`, `paid_swap_per_oz` (shared with `CostImputer.from_state` / `charge`); goldbot/engine/runner.py `EngineConfig.swap_prior`, `_cost_table`, `_swap_usd_per_oz` (bar-close intent and the approval re-check); goldbot/ops/services/engine.py passes `settings_swap(settings)`'

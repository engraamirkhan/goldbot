id: R37
requirement: 'Fail closed on state the gate cannot compare (October safety batch, HIGH; safety review MEDIUM-2/3): a NaN or infinite number in the account state or the intent, or a price, ATR, stop, contract, volume or equity that is not > 0, refuses the entry (`invalid_state`, then `invalid:<field>`, after the flag reasons); an approval is refused on a quote that breaks the tick price rules (`bad_quote:<check>`); a dropped quote (`non_finite_quote`, `bid_gt_ask`, `non_monotonic`, folded into one event with a count) or a `last_tick` read that raises still retries decided closes and sends a pending kill-switch flatten at once; once the feed has been dead for 60 s the time barrier counts decision bars of open market (`bars_held` plus bars since `_closed_through`) and the Friday flatten acts only once the feed has been dead for 60 s, whatever happened around the cut; a refused close is re-sent at most once a second; the engine keeps writing its state with `quote_invalid_since` and health FAILs after 60 s of invalid quotes in market hours'
status: implemented
code: goldbot/risk/gate.py `invalid_fields`, `RiskGate.check`; goldbot/engine/runner.py `_quote_fault`, `_tick_ok`, `no_quote_pass`, `_host_clock_exits`, `_on_decision`; goldbot/ops/run.py `engine_pass`; goldbot/ops/health.py `check_engine` (QUOTE_INVALID_FAIL_S); goldbot/risk/sizing.py `account_fx` (blank currency)
test: tests/test_non_finite_state.py::test_a_non_finite_account_state_field_refuses_the_entry_and_names_the_field; ::test_a_non_finite_intent_field_refuses_the_entry_and_names_the_field; tests/test_invalid_feed.py::test_an_intent_number_outside_its_domain_is_refused_by_name; ::test_a_persistently_nan_feed_still_retries_a_pending_close; ::test_a_persistently_nan_feed_still_flattens_on_the_kill_switch; ::test_the_state_keeps_being_written_with_quote_invalid_since_and_health_fails_after_60_s; ::test_an_approval_on_a_crossed_quote_is_refused; ::test_one_crossed_quote_just_after_the_cut_never_flattens_a_winner; ::test_a_winner_survives_a_four_second_crossed_burst_spanning_the_cut; ::test_a_loser_is_closed_once_the_feed_dies_after_a_valid_quote_just_past_the_cut; ::test_a_winner_held_over_the_weekend_is_not_time_exited_by_a_bad_quote_at_the_reopen

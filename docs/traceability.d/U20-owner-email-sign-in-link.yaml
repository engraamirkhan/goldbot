id: U20
requirement: 'Owner-only "email me a sign-in link" that still needs the authenticator code (owner request 2026-10-11): one generic 200 for every address; mail only to `auth.owner_email` when that account is the enabled owner and mail is configured; random 32-byte token stored hashed, single use, 15 min, at most 3 requests an hour per address and per IP; token in the URL fragment; every send and redeem audited without the token; no address or token in logs or 422s; login screen shows sign-in, forgot-password, email-link and reset-link flows on a phone'
status: implemented
code: 'goldbot/api/auth.py `request_email_link`, `redeem_email_link`, `_count_ip_failure` (aux.db `email_links`, `email_link_requests`: goldbot/db/migrations.py version 6, additive); goldbot/api/app.py `/api/auth/email-link`, `/api/auth/email-link/redeem`, `send_email_link` (background task, error type only); goldbot/api/mailer.py `SmtpMailer` (STARTTLS, timeout, keyring `smtp-password`), `email_link_message`, `mail-test`; goldbot/config.py `MailSettings` (`auth.mail`); web/src/screens/Login.tsx, web/src/lib/links.ts (`#signin=`), web/src/main.tsx (tokens taken at start). Review follow-ups (docs/decisions/0013): sign-in notice by Telegram and email (`coarse_ip`, `sign_in_notice_message`), `MailSettings._origin` (urlsplit), `revoke_sessions`/`revoke_sessions_cli` delete links, goldbot/ops/health.py `check_email_link` (`email_link_health_note`), `SmtpMailer.ready` cached 60 s'
test: 'tests/test_auth_email_link.py (57 cases: ::test_the_request_answers_the_same_for_unknown_non_owner_and_owner_addresses; ::test_only_the_owner_address_gets_mail_matched_case_insensitively_and_trimmed; ::test_the_link_with_the_authenticator_code_signs_the_owner_in_once; ::test_an_expired_link_fails; ::test_redeem_without_an_authenticator_code_fails; ::test_a_wrong_authenticator_code_fails_and_burns_the_link; ::test_at_most_three_links_an_hour_per_address; ::test_at_most_three_requests_an_hour_per_ip_whatever_the_address; ::test_a_disabled_owner_gets_no_link; ::test_no_token_or_address_reaches_the_logs_even_when_sending_fails; ::test_validation_errors_never_echo_the_address_or_token; ::test_mail_not_configured_answers_the_same_and_sends_nothing; ::test_every_send_and_redeem_is_audited_without_the_token; ::test_the_smtp_sender_uses_starttls_a_timeout_and_the_keyring_password; ::test_a_link_sign_in_queues_a_telegram_notice_with_a_coarse_network_hint_only; ::test_a_link_sign_in_also_emails_the_owner_without_the_token; ::test_a_bad_dashboard_origin_is_refused; ::test_signing_a_user_out_everywhere_also_deletes_their_email_links; ::test_the_server_side_revoke_sessions_command_also_deletes_email_links; ::test_the_health_check_reports_repeated_link_rate_limiting_as_a_warning; ::test_mailer_readiness_is_cached_for_a_minute); web/src/screens/Login.test.tsx; web/src/lib/links.test.ts; web/src/main.test.tsx'

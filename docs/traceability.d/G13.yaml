id: G13
requirement: Research director splits the quarter's trial budget from recorded evidence only (registry, shadow book); attribution is one more, bounded, out-of-sample input; the pre-registered queue is reserved first; retired ideas share one exploration trial a quarter and come back only on corrected out-of-sample evidence
status: implemented
code: 'goldbot/research/director.py:320 `reserved_trials` (research.reserved_trials_quarter = 13 for docs/research/preregistration-2027Q1.md, less trials run against a `preregistered` row, at least the queued ones; plan total = budget - used - reserved), :472 `attribution_evidence` (cells rebuilt from the report''s per-trade rows, only trades from each version''s promotion on and, for a retired family, after its retirement date; t x n/(n+100), clipped at t=3), :582 `retired_drift` (settings research.retired_families vs docs/research/hypotheses.md section B; reported, never allocating; doc sha256 in the plan), :605 `reinstatement_threshold` (t >= 2 Bonferroni over retired families x sources), `allocate` (live floors, then the retired families'' ONE shared exploration trial a quarter from `retired_exploration`: the clean retired family with the best positive post-retirement attribution, else a rotation by quarter; then the evidence pool; lookahead-dirty = 0), :753 `_with_inputs` (attribution tilts only without shadow_z; reinstatement from attribution after retirement only), :775 `build_plan` (grid share 0 while research.label_grid_paused); goldbot/ops/jobs.py:545 `research_director`, `monthly_research` (grid stops at budget - used - reserved, the reservation of the slot''s quarter), `make_trial_runner` (the research analyst spends only budget - used - reserved; a trial of a configuration with a pending `preregistered` row uses the reservation and is linked to it, `director.pending_preregistration`; a retired, non-reinstated family is refused once the quarter''s shared exploration trial is used, `director.retired_quarter_trials`, unless pre-registered); queued pre-registrations count in their `target_quarter` (`registry.planned_quarter`, `director.prereg_quarter`; matched to a trial in any quarter, one trial per row) and must be written before it starts (`director.is_queued`; `preregister` defaults to `queue=False`, stamps its own clock, no backdating); a trial stamped before a row''s quarter never uses it up and every runner refuses a config queued for a later quarter (`director.later_preregistration`, `registry.PreregisteredForLaterQuarter`); the daily digest''s `_trial_line` (removed with U27, the morning learning report) used the same matching and reservation; goldbot/research/registry.py `check_budget_reserved` (the same rule for the manual paths: scripts/research_pass.py runs, screens, pooled runs and holdout scorings, and goldbot/research/discovery.py `discovery_pass`; an ad-hoc discovery''s own pre-registration is `queue: false` and never counts as a queue trial run; a link matches its row''s timestamp too; CPCV is evidence, uncharged); config/settings.yaml research.reserved_trials_quarter, research.retired_families'

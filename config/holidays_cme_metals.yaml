# Thin-liquidity days for gold (BACKLOG 17, playbook G-2), read by RiskGate's holiday window (`risk.holidays`).
# A PROXY, NOT MEASURED: these are days on which liquidity is expected to be thin (US federal holidays on which CME
# metals close or trade short, Good Friday, Easter Monday, the day after Thanksgiving, 24/26/31 Dec, 1/2 Jan).
# Columbus Day and Veterans Day are left out: CME metals trade normally on them. Whether the listed days really have
# wider spreads and fewer ticks is measured before adoption (BACKLOG 45). Weekdays only (closed at weekends anyway).
# Each date is a broker SERVER date (Europe/Athens by default), whose midnight is 17:00 New York, the CME trading-day
# roll, so a listed date blocks the CME trading day of that name (an hour late in the US/EU DST gap weeks).
# Edited by hand and reviewed like code: tests/test_entry_windows.py holds the same hand-reviewed set and fails on any
# difference, and CI fails when `valid_through` is less than a year away.
# After `valid_through` (or before `valid_from`) the list is unavailable: with `risk.holidays.enabled` entries are
# refused as `calendar_unavailable` (fail closed) and health warns 90 days ahead. Extend it before it runs out.
version: cme-metals-v2
source: "US federal holidays as a proxy (not measured), less Columbus and Veterans Day; Good Friday, Easter Monday, day after Thanksgiving; 24/26/31 Dec, 1/2 Jan"

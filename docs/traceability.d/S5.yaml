id: S5
requirement: '"a heartbeat alert fires if any service has been silent for five minutes" [Infrastructure]'
status: partial
code: 'engines: engine_<account>.json (check_engine) and the loop heartbeat state/heartbeat_engine-<account>.json written every pass with or without ticks (goldbot/ops/watchdog.py `LoopWatch`; `check_engine_loop` fails after 150 s; goldbot-engine@.service Type=notify WatchdogSec=300 restarts a stuck loop); the MT5 bridge is restarted by goldbot-bridge-watchdog@.timer when GET /health stops answering; supervisor, scheduler, telegram, news and api write state/heartbeat_<service>.json every minute (goldbot/ops/health.py:628 `Heartbeat`, `start_heartbeat`; calls in goldbot/ops/run.py) and `check_heartbeat` (:665) fails after 5 min of silence, which the Telegram health pass alerts once with a recovery message. Missing: the health pass runs every 300 s (goldbot/telegram/bot.py HEALTH_EVERY_S), so the alert can come up to 10 min after the last beat, not 6; the bridge is checked from the brain (`check_bridge`, /health through the tunnel) rather than by a heartbeat file; a dead Telegram service cannot alert about itself'
test: tests/test_health.py::test_a_service_silent_for_five_minutes_alerts_once_and_recovers, tests/test_health.py::test_every_service_has_a_heartbeat_check_and_run_py_writes_it, tests/test_health.py::test_bridge_health_through_the_tunnel, tests/test_engine_watchdog.py::test_the_engine_loop_beats_and_notifies_with_no_ticks, tests/test_engine_watchdog.py::test_health_fails_on_a_stale_loop_heartbeat_whatever_the_market, tests/test_engine_watchdog.py::test_a_watchdog_restart_resumes_the_heartbeat_and_health_recovers

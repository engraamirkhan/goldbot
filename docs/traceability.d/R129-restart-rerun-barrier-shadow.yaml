ration_and_throttle_reads; ::test_a_restart_gap_loss_still_blocks_the_rearm_and_only_its_wins_are_dropped; ::test_the_model_watch_cusum_never_rolls_a_champion_back_on_restart_gap_trades; ::test_the_engines_first_bar_close_after_a_restart_replays_the_held_trades; tests/test_engine_replay_identity.py (golden unchanged); tests/test_engine_store_golden.py (golden unchanged)

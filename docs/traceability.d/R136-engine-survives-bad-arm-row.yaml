id: R136
requirement: 'BACKLOG 117: a bad exploration arm row must not stop the engine (exits keep running), and a config defect never closes a healthy position (trading-safety review of f838b7d3, 2026-11-13). An ARM-SPEC or discovered row that fails validation (e.g. the 2026-10-26 G1A/G1C `window_local` form), shares its id with another row, names a bad twin or goes missing is left out of the load; the engine keeps that arm from its last good row (state/arm_spec_last_good.yaml, every cleanly loaded row merged by id, never removed, atomic write) with its entries refused (`arm row invalid`), journalled `exploration_arm_invalid`, so its open positions keep their stop, target, hold and every exit. An unreadable ARM-SPEC keeps every remembered arm with all entries refused; with no snapshot the engine refuses to start (fail loud). Only an arm never in a good spec is dropped (`exploration_arm_dropped` with `why`) and its position closed as an orphan. The research loader (`load_arms` without `rejected`) still raises, so CI refuses the bad file. RiskGate unchanged.'
status: 'implemented (2026-11-13, branch fix/engine-survives-bad-arm-row; trading-safety rework)'
code: 'goldbot/research/arms.py (`load_arms(rejected=)`, `_twin_problem`, `_reject`); goldbot/engine/arm_snapshot.py (new); goldbot/engine/exploration.py (`config_for(snapshot=)`, `ExplorationConfig.invalid`, the start journal); goldbot/ops/services/engine.py (one `config_for` with the snapshot); runner.py unchanged'
test: tests/test_engine_survives_bad_arm_row.py::test_after_a_bad_spec_restart_the_arms_open_position_is_adopted_kept_and_closed_only_by_its_own_hold (bad row, duplicate id, unreadable file); ::test_with_a_snapshot_a_bad_row_keeps_its_arm_from_the_last_good_spec_with_entries_refused; ::test_an_unreadable_arm_spec_with_a_snapshot_keeps_every_arm_with_all_entries_refused; ::test_an_unreadable_arm_spec_without_a_snapshot_refuses_the_start_and_never_closes_everything; ::test_a_clean_load_remembers_every_row_and_a_later_load_never_forgets_one; ::test_the_research_loader_still_refuses_a_file_with_a_bad_row_so_ci_catches_it; ::test_a_snapshot_row_a_newer_release_wrote_still_reads

id: M46
requirement: 'Quant review follow-ups to M44/M45: one predicate (`registry.gate_pass_counts`: results.gates.passed is True AND the row records the swap it charged and its cost source) decides whether a gate pass counts, for every reader of results.gates.passed (the backtest -> paper phase gate''s best trial, which also ignores pre-swap rows whatever their DSR; gap watch''s research-ready founders; the quarterly CPCV job; research_pass --cpcv; the director''s survivor/holdout slots; passed_gates); each queued row pins the data-v1 files from the year of its bars_from (every file for a row without one) and records the pinned years in plan.data_years, so a later bars_from runs while every file read must still be pinned and every pinned file read; count_owed_events reports H-06''s floor as the retire floor (150) and states that a pass needs screen_min_events (1,000)'
status: implemented (quant review and trading-safety review pending)

id: A19
requirement: '"mirror challengers'' SHADOW entry signals as minimum-lot (broker min, 0.01) demo orders, choosing which signal by a fixed round-robin rotation over agent_ids (never by P&L/score). At most one probe position open at a time; real (live-agent) trades take priority" (research director 2026-10-19, ADR 0037)'
status: implemented
code: 'config/accounts.yaml `cost_probe`; goldbot/ops/accounts.py `CostProbe`, `_probe_demo_only`; goldbot/ops/services/engine.py passes it to EngineConfig.cost_probe; goldbot/engine/cost_probe.py `check_start`, `rotate`, `step` (flat book, ADR 0036 lock via auto_entry.permitted, RiskGate.check at the minimum lot), `yield_to_live` (Engine._decide), `record_close` (Engine._record_closed), `adoption` (Engine._adopt: own magic base + 97), `budget_refusal` (budget_share), `probes` (costs-v2 reader); goldbot/db/migrations.py aux 14 `cost_probes`; goldbot/ops/ledger.py `probe_note` (RC-8 reconciles closed probes in the probe ledger)'
test: tests/test_cost_probe.py::test_a_challenger_shadow_entry_is_mirrored_as_one_minimum_lot_demo_order_checked_by_the_riskgate; ::test_a_champion_shadow_entry_is_never_probed; ::test_no_probe_while_any_position_is_open_on_the_account; ::test_at_most_one_probe_position_is_open_at_a_time; ::test_the_rotation_is_round_robin_over_agent_ids_and_never_reads_p_or_pnl; ::test_a_live_agent_candidate_closes_the_open_probe_before_its_own_decision; ::test_a_live_account_with_the_cost_probe_on_is_refused_at_load; ::test_the_engine_refuses_to_start_probes_on_an_account_that_is_not_demo; ::test_a_demo_account_on_a_terminal_that_does_not_report_demo_sends_no_probe; ::test_a_gate_refusal_sends_no_probe; ::test_a_closed_probe_goes_to_the_probe_ledger_and_never_to_closed_trades_fills_or_the_shadow_book; ::test_the_broker_ledger_reconciles_closed_probes_in_the_probe_ledger_not_as_missing; ::test_a_probe_order_carries_its_own_magic_and_a_cp_comment; ::test_no_strategy_family_shares_the_probe_magic_or_the_smoke_magic; ::test_a_probe_found_after_the_orders_file_is_lost_is_adopted_as_a_probe_never_as_the_live_agent; ::test_a_probe_survives_a_restart_and_its_time_exit_still_runs; ::test_a_probe_recovered_from_an_unconfirmed_send_gets_its_challengers_exit_policy; ::test_the_kill_switch_closes_an_open_probe_and_no_probe_follows; ::test_the_owners_halt_blocks_probes_at_the_riskgate; ::test_no_probe_once_todays_realised_probe_loss_reaches_its_share_of_the_daily_allowance; ::test_no_probe_while_the_daily_loss_remaining_is_below_the_probe_share; ::test_an_open_probe_already_due_to_close_is_not_closed_again_to_make_way; tests/test_broker_ledger.py::test_closed_cost_probes_are_reconciled_in_the_probe_ledger_not_counted_missing

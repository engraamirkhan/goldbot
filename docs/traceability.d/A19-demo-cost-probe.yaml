id: A19
requirement: '"mirror challengers'' SHADOW entry signals as minimum-lot (broker min, 0.01) demo orders, choosing which signal by a fixed round-robin rotation over agent_ids (never by P&L/score). At most one probe position open at a time; real (live-agent) trades take priority" (research director 2026-10-19, ADR 0037)'
status: implemented
code: 'config/accounts.yaml `cost_probe`; goldbot/ops/accounts.py `CostProbe`, `_probe_demo_only`; goldbot/ops/services/engine.py passes it to EngineConfig.cost_probe; goldbot/engine/cost_probe.py `check_start`, `rotate`, `step` (flat book, ADR 0036 lock via auto_entry.permitted, RiskGate.check at the minimum lot), `yield_to_live` (Engine._decide), `record_close` (Engine._record_closed), `probes` (costs-v2 reader); goldbot/db/migrations.py aux 14 `cost_probes`; goldbot/ops/ledger.py `probe_note` (RC-8 reconciles closed probes in the probe ledger)'
test: tests/test_cost_probe.py::test_a_challenger_shadow_entry_is_mirrored_as_one_minimum_lot_demo_order_checked_by_the_riskgate; ::test_a_champion_shadow_entry_is_never_probed; ::test_no_probe_while_any_position_is_open_on_the_account; ::test_at_most_one_probe_position_is_open_at_a_time; ::test_the_rotation_is_round_robin_over_agent_ids_and_never_reads_p_or_pnl; ::test_a_live_agent_candidate_closes_the_open_probe_before_its_own_decision; ::test_a_live_account_with_the_cost_probe_on_is_refused_at_load; ::test_the_engine_refuses_to_start_probes_on_an_account_that_is_not_demo; ::test_a_demo_account_on_a_terminal_that_does_not_report_demo_sends_no_probe; ::test_a_gate_refusal_sends_no_probe; ::test_a_closed_probe_goes_to_the_probe_ledger_and_never_to_closed_trades_fills_or_the_shadow_book; ::test_the_broker_ledger_reconciles_closed_probes_in_the_probe_ledger_not_as_missing; tests/test_broker_ledger.py::test_closed_cost_probes_are_reconciled_in_the_probe_ledger_not_counted_missing

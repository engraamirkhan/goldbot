id: R39
requirement: 'A zero or collapsed equity read is confirmed before the 12% kill switch (BACKLOG 44, trading-safety re-verification LOW-C, ADR 0016): a read at 12% drawdown or more trips at once when the balance plus the profit and swap of every position on the account (all symbols) agrees with the equity within `risk.equity_check_tolerance` (2%) of the high-water mark; otherwise it starts a pending state (no stage moves, entries refused `equity_unconfirmed`, the account re-read on the next tick) in which any later 12% read trips, whatever readings came between; pending clears only after every read stayed below 12% minus the tolerance for `risk.equity_recovery_s` (60 s), and survives a restart; one disagreeing read never trips; exits never gated'
status: implemented
code: 'goldbot/config.py `RiskSettings.equity_check_tolerance` (0.02 in (0, 0.12)), `RiskSettings.equity_recovery_s` (60 in (0, 3600]); config/settings.yaml `risk.equity_check_tolerance`, `risk.equity_recovery_s`; goldbot/risk/gate.py `RiskLimits.equity_check_tolerance`/`equity_recovery_s` (`from_settings`), `AccountState.equity_unconfirmed`, `RiskGate.update_stage` (no stage move while pending), `check` (`equity_unconfirmed`); goldbot/engine/runner.py `_equity_unconfirmed` (in `_refresh_account` before the stage update; sticky pending with the hysteresis clock), `_equity_corroborated` (`broker.account_positions()`, profit + swap), `_set_stage2_pending` and `stage2_pending_since` in `_save_risk_state`/`_load_risk_state`, `on_tick` (`_reread_account`: the next tick reads the account); goldbot/execution/broker.py `Position.swap`, `Broker.account_positions`; goldbot/execution/mt5_adapter.py `account_positions` (positions_get without a symbol), `_position` (swap); goldbot/execution/paper.py `account_positions`; goldbot/execution/bridge.py `METHODS["account_positions"]`, `RemoteBroker.account_positions`, protocol v5 (`API_VERSION = MIN_COMPATIBLE = 5`); goldbot/api/entry_status.py `REASONS["equity_unconfirmed"]`'
test: 'tests/test_equity_confirmation.py (a single zero, collapsed or 13% uncorroborated read never closes a position; an unconfirmed read refuses entries and moves no stage, in the engine and in the gate; zone, normal, zone trips; alternating readings trip on the third read; zone, sustained recovery below the hysteresis, zone needs fresh confirmation; a band read restarts the recovery clock; a pending read survives a restart; two consecutive uncorroborated 12% reads close everything; two consecutive zero reads trip; a crash corroborated by balance plus open P&L, by swap, or by a position on another symbol trips on the first read; an unreadable account book cannot corroborate and the second read confirms; an uncorroborated fast crash is closed on the very next tick; an unconfirmed bar-close read is re-read on the next tick; the MT5 adapter reads swap and every symbol; a Position without swap decodes as None; the tolerance comes from settings); tests/test_bridge_compat.py (protocol v5 pinned)'

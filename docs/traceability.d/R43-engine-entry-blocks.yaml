id: R43
requirement: 'The engine publishes why it refuses entries (BACKLOG 43, ADR 0011): `RiskGate.account_reasons(st, now)` lists every reason `check()` refuses for that does not depend on the intent (halts, data, clock, market closed, rollover, weekend, spread, positions, caps, open risk unknown, invalid state; the throttle per agent when given) and `check()` starts from it, so the two cannot drift; the engine publishes it as `entry_blocks` at every state write (a heartbeat on the feed it publishes) and the last per-trade refusal per agent with its time as `entry_refusals`; the API words them and no longer maps flags (the min-lot fallback is gone); an engine without `entry_blocks` is never shown OPEN. Reporting only: exits are never gated'
status: implemented
code: 'goldbot/risk/gate.py `RiskGate.account_reasons`, `PER_TRADE_REFUSALS`, `invalid_state_fields`; goldbot/engine/runner.py `_note_refusal`, `entry_blocks` / `entry_refusals` in `_write_state`; goldbot/api/entry_status.py `_engine_block`, `_window_block`, `_refusal_blocks`, `entry_reasons_missing`'
test: 'tests/test_entry_blocks.py::test_check_refuses_with_exactly_the_account_reasons_plus_the_intents_own; ::test_every_flag_at_once_is_listed_in_the_order_check_refuses_with; ::test_account_reasons_only_reads_the_stage_machine_runs_in_check; ::test_the_engine_publishes_the_gates_account_reasons_at_every_state_write; ::test_the_heartbeat_lists_the_reasons_of_the_feed_it_publishes; ::test_a_per_trade_refusal_is_published_per_agent_with_its_time; ::test_a_refusal_at_approval_time_is_published_for_its_agent; tests/test_api_entry_status.py::test_the_engines_published_reasons_decide_and_the_api_only_words_them; ::test_an_engine_that_does_not_publish_its_reasons_is_never_shown_open; ::test_a_per_trade_refusal_is_its_agents_own_block_since_when_it_happened'

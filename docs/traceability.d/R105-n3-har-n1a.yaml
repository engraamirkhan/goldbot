id: R105
requirement: 'N-3 HAR low-range-day abstention and N-1a gold learning routing (signed plan 2026-11-07 WS-6, prereg-2026-11-07-n3-har.md): gold learning arms and the controls read only against learning arms are refused (shadowed) on a predicted bottom-quintile range day (trailing 250 forecasts, frozen HAR fit before the holdout, bars visible at 22:00 UTC); once the nightly job has written a row, a day without one refuses them (har_unavailable, fail closed); nothing is refused before the first row or after an off row; gold learning entries run on ICM only; exits, stops, targets, holds and the RiskGate untouched'

id: R44
requirement: '"Combined exposure across both accounts is capped at 3 lots or 30% of combined equity notional, treated as one position" (DESIGN.md:112), enforced again on the MT5 box, independent of the brain (BACKLOG 66; the gate side is R7)'
status: implemented
code: 'goldbot/execution/bridge.py `GuardedBroker.place_order` / `_notional_refusal`: refuses when (every open lot on the symbol + the order''s lots) x contract x price x fx > `MAX_NOTIONAL_EQUITY_MULT` (6.0 = 30% x 1:20) x equity, strict as the gate; checks run magic -> 3.0 lots -> account (read once, always; verified) -> ceiling -> order age again -> send. Readings: (1) total gross exposure: all positions on the symbol, any magic, both sides; (2) this terminal''s equity only (stricter than the gate with two accounts, equal with one); (3) no minimum-lot exception: below ~£525 at 2,500 USD/oz even 0.01 lot is refused, by intent; (4) W1-1 / ADR 0021: the 0.01-lot smoke is ~3.1x and passes, the F4 fence slots in before the ceiling. Every figure is read on the box (account, symbol_info, last_tick ask/bid, loss_per_lot via sizing.account_fx, account_positions); any read that raises, is missing, non-finite or <= 0 refuses `unreadable:<field>`. A refusal is OrderResult retcode 10006 (a definite reject) with message "bridge_notional_ceiling: ...", never a raise or an HTTP 500. goldbot/engine/runner.py: the order journal carries `message`; `bridge_refused` journals it, notifies the owner (ApprovalBus.notify_owner), pauses auto entries for the bar close (`auto_paused:bridge_refused`) and marks an approved card `gate_refusal: [bridge_notional_ceiling]` (Telegram "refused by the bridge"; dashboard card "Refused by the bridge"). close and modify are never sized; protocol (METHODS, signatures, OrderResult, API_VERSION 5, protocol_digest) unchanged'

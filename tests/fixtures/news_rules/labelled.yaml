# Labelled headlines for the rules-v1 scorer (goldbot/data/news_rules.py, BACKLOG 232). Hand-labelled against the
# LLM scorer's schema (goldbot/data/news.py SYSTEM): shock = an unscheduled event (never a scheduled release);
# rates / dollar = the direction the headline itself states, `null` = not labelled. Written in the style of the
# configured feeds (forexlive, Fed press, BLS); hard negatives (negations, hedges, scheduled releases, anniversaries,
# analysis pieces) are deliberate. A small hand set: it bounds gross mistakes, it does not measure live precision.

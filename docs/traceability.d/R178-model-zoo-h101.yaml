id: R178
requirement: 'H-101 model zoo and fusion (card docs/research/prereg-2026-11-25-model-zoo-fusion.md, zoo-v1, quant-signed). There are 8 pre-named candidates on the sr-v2 40 inputs with fixed specs and no tuning: B1 LOGIT, B2 GBT, B3 POOL, B4 REGIME, B5 KNN, F1 AVG, F2 STACK and F3 GATE. The walk-forward has yearly blocks 2011-17, trains on 2010..t-1, is purged by the full horizon and label exit and has a 1-day embargo; every fit, cell-edge and tau row meets the same purge; fusions see base OOF only. tau is set per arm for every candidate (1/3 quantile). The reading rule pools across arms; a new joint stationary bootstrap (mean block 5 session days, B 10,000) draws days jointly across arms, and paired D uses identical draws. Stage 0 is outcome-blind and goes through power_first.start_or_refuse; test_old stays sealed. Stage L books K 8 after the budget check and before any read. Confirm and test_old are each read once (windows read-once ledger). Gold only.'
status: implemented (2026-11-25, branch feat/model-zoo-h101); Stage 0 run locally (STARTED), Stage L not run
code: goldbot/research/model_zoo.py; goldbot/research/history_replay.py (factored from scripts/research/rb_history.py); scripts/research/model_zoo_history.py (count | learn | confirm | test_old); goldbot/research/windows.py (READ_ONCE_FAMILIES, record_read_once, reads_of); goldbot/research/power_first.py (start_or_refuse verdict=)

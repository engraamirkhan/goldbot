id: X7
requirement: Client order id `{account}-{bar_close_ts}-{intent_hash}` "written to a pending_orders table before order_send ... on restart the engine reconciles that table against history_deals_get"
status: implemented
code: 'goldbot/engine/runner.py `_execute` writes the id to state/orders_<account>.json (atomic) before `place_order` and refuses an id already sent (`duplicate_suppressed`); `_load_orders` on start reloads sent ids and open trades and looks up unconfirmed sends in broker positions and `deals_since` (client id or MT5 comment): a fill is adopted with its own agent, otherwise marked unfilled; ids are kept 7 days. Reading taken: rollback = restart, so the orders file a newer release wrote must load on the older one (ADR 0010). `_load_orders` reads it through goldbot/engine/store.py `JsonEngineStore.load_orders` (ADR 0023 step 1) with `goldbot/base.py` `load_record` (unknown fields dropped, a wrong type still stops the start). The risk file a newer release wrote also loads: `JsonEngineStore.load_risk` ignores keys it does not know and notes them with `note_schema_skew` (BACKLOG 74)'
test: tests/test_engine_safety.py::test_sent_ids_and_open_trades_survive_a_restart_and_are_never_re_sent; tests/test_engine_safety.py::test_a_restart_after_an_unconfirmed_send_adopts_the_fill_from_the_broker; tests/test_engine_safety.py::test_a_restart_after_an_unfilled_send_marks_it_unfilled_and_keeps_the_id; tests/test_cov_engine.py::test_an_approved_entry_is_sized_again_and_sent_once; tests/test_persistence_compat.py::test_the_older_release_reads_a_file_the_newer_release_wrote; tests/test_engine_safety.py::test_a_restart_after_a_rollback_loads_an_orders_file_a_newer_release_wrote; tests/test_engine_safety.py::test_a_restart_archives_an_expired_proposal_a_newer_release_wrote; tests/test_engine_safety.py::test_a_restart_warns_about_an_orders_file_table_this_release_does_not_know; tests/test_store.py::test_risk_file_unknown_key_notes_skew_and_still_loads

id: R110
requirement: 'EVAL-2 ladder statistics (method v6 section 2, prereg 2026-11-09 sections 1, 3 and 4.3-4.8; ADR 0076, ADR 0077): session-day-clustered SE on the 17:00 New York clock; power floor, MDE and power; L1 +/-1 ATR first-passage probe over 20 twins with the NO SIGNAL family retire (pooled 90 % UB below the cheapest deciding cost at power >= 0.8); L2 EB hierarchical model (REML, Student-t df 5 on u_c, leave-family-out prior de-duplicated by config hash, Efron empirical null, carry at 0.80/0.80 and at most 3 cells, kill at P(net > 0.05 R) < 0.05, spec frozen in the card before the run); L3 control-variate net with the stationary day-block bootstrap, BatchPRDS pure alpha-spending (alpha_j = q gamma_j, no rejection credit), confirm_resamples called by l3_read, the year rule, the 1.5x gate net with the deciding cost applied once, 2018-25 corroboration and Holm cell forwarding; graded verdicts, CONFIRM-SEEN/HOLDOUT-SEEN by excess overlap >= 15 pp, DSR at K 21,333 (20,151); the ADR 0077 futility retire (300-999 events, 90 % UB < 0.03 R and clustered SE <= 0.055 R, pre-registered only) with Ruling A withdrawn'

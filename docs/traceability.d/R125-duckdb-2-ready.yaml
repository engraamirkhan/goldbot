id: R125
requirement: 'Backlog 156: the Parquet store reads the same on duckdb 1.x and 2.x. `Store.read` binds its ts bounds as ISO strings that duckdb casts to the column''s own type (duckdb 2 reads a pandas datetime64[ns, UTC] column as TIMESTAMPTZ_NS, which a bound TIMESTAMPTZ cannot be compared with; casting the column instead rounds ns to us on 2.x), so the bounds stay table filters in the Parquet scan and row groups outside the window are skipped; the year/month partition filter is unchanged. Every zoned timestamp column from `Store.read` and `Store.sql` comes back tz-aware UTC at microsecond resolution on both majors (2.x `.df()` returns TIMESTAMPTZ_NS naive; 1.x returned the host''s zone, Europe/London on the Mac), the session zone is UTC, naive columns stay naive, a join''s duplicate column names are converted by position. pyproject bounds duckdb to `>=1.0,<3`, uv.lock pins 2.x, Dependabot no longer ignores duckdb majors'
status: 'implemented, in review (2026-11-11, branch feat/duckdb-2-ready)'
code: 'goldbot/data/store.py (`Store.read`, `Store.sql`, `_read_query`, `_bound`, `_connect`, `_fetch`); pyproject.toml; uv.lock; .github/dependabot.yml'
test: tests/test_store_duckdb_compat.py::test_ts_filters_bind_on_ns_files_and_return_utc; ::test_a_read_across_ns_and_us_months_keeps_order_and_bounds; ::test_sql_returns_utc_whatever_the_host_zone; ::test_sql_keeps_duplicate_column_names_of_a_join; ::test_sub_microsecond_ticks_truncate_like_1x; ::test_ts_filter_is_pushed_into_the_parquet_scan

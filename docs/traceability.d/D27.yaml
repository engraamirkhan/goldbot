id: D27
requirement: 'US calendar, tiers 1 and 2, 2010 onwards, point in time (tier 1: CPI, NFP, PCE, FOMC statement and press conference; tier 2: PPI, retail sales, GDP advance and later estimates, JOLTS, jobless claims, ISM, FOMC minutes; playbook G-3, BACKLOG 18 data part, research finding E-1): DST-correct `event_utc` from New York time, `available_utc` when the schedule was known, history never lost. **Gate: no trial cites tier1_events/tier2_events until a quant review of the first live run''s count table**'
status: implemented (data and opt-in features; first live run and its review pending; tier-2 entry blackout built off by default, row R36; adoption pending owner)
code: goldbot/data/us_calendar.py (`rule_available_utc` event - 7 days with per-agency shutdown floors, `parse_fomc_current`/`parse_fomc_historical` + `fetch_fomc` meeting-count guard, `fomc_rows` era times, `split_gdp`, `MANUAL_EVENTS` hand-checked cancellations, `merge_calendar` per-type last_ok backfill, late stamps, cancellations and `mass_cancellations` guard, `quarantine_spacing`, `count_table`, `check_keeps_history`, `known_timeline`); scripts/us_calendar_data.py; .github/workflows/data-us-calendar.yml (release calendar-v1, FRED API key secret); goldbot/data/release.py `read_us_calendar_files`; goldbot/features/us_calendar.py (opt-in `tier1_events`, `tier2_events`, `_pit` minute columns capped at 7 days, counts per New York day); scripts/research_pass.py `--us-calendar`, `--us-calendar-exclude-rule`; docs/decisions/0008-us-calendar-source.md. Fed speakers not covered; no actual/consensus (no free licence-compatible source)

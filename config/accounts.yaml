# Account registry. NO SECRETS HERE. Passwords live in the OS keyring (macOS Keychain on the Mac,
# Windows Credential Manager on the VPS) under service "goldbot" and key "mt5-<account_id>".
# Store credentials before starting an engine service (`python -m goldbot.ops.accounts add <account_id>`):
# a service has no terminal to prompt in. Nothing writes a password to a file or log. MT5 login numbers are
# kept in the keyring too (`mt5-login-<account_id>`): this file is in a public repo, keep every login null.
#
# server_tz: the broker's MT5 server clock. `Europe/Athens` = UTC+2/+3 switching on EU dates; `NY+7` = UTC+2/+3
# switching on US dates ("midnight = 5 pm New York", which IC Markets documents). They differ by one hour in the
# US-EU gap weeks; the `server_clock:<account>` health check measures which one the broker runs (RUNBOOK "Server
# clock"). Keep Europe/Athens until the check confirms UTC+3 in a gap week (next: 26-30 Oct 2026); same value on
# the brain and the MT5 box.
#
# mode: demo | live.  Phases 0-2 run only on demo accounts; live accounts are enabled by the
# phase gate plus a typed confirmation, never by editing this file alone.
accounts:
  icm-demo:
    broker: icm
    mode: demo
    server: ICMarketsSC-Demo  # confirm in the MT5 terminal: File -> Open an Account
    login: null  # never here (public repo): `python -m goldbot.ops.accounts add icm-demo` keeps it in the keyring
    terminal_path: C:\MT5\ICMarkets\terminal64.exe
    server_tz: NY+7   # measured 2026-10-26 (US-EU DST gap week): server clock UTC+3 = NY+7, Athens gave UTC+2 (ADR 0005)
    symbol: XAUUSD
    magic_base: 260100
    enabled: true
    # ADR 0004: the owner's absolute daily loss limit, in this account's deposit currency (GBP). Entries only; exits
    # are never gated. Per account, never global: one number read in two currencies is not one limit.
    # ADR 0042 (CFO 2026-10-25, demo only): £50 -> £220 after the owner's top-up to ~£11,000, i.e. 2% of £11,000, the
    # design's own default daily cap, so the £ limit adds no room beyond the percentage rule. Reverse to £50 BEFORE any
    # withdrawal of the top-up. ADR 0004's £50 stays the real-money limit.
    daily_loss_limit_abs: 220
    # the owner's declared account type (raw spread + commission): the baseline from the first run, so entries are not
    # blocked as "unknown" while the classifier gathers ticks. Measurement keeps running; if it reads standard the
    # stricter class wins and health warns. Leave unset (null) for an account whose type is not known.
    account_class: raw
    # ADR 0032, the owner 2026-10-18: "approve demo risk limits: daily cap £50, min-lot cap 1%, weekly 10%, demo only".
    # CEILINGS, not targets: the RiskGate reads the controller's current limits, each clamped to [settings default ..
    # ceiling]; today's controller (StaticController) returns the ceilings. daily 0.05 = £50 at £1,000 and never above
    # daily_loss_limit_abs (the smaller of the two applies); min_lot_risk_cap lets the £1,000 account place 0.01 lot.
    # The open positions' stop risk counts toward the £50 under this profile. The 8% size-down stage drops back to the
    # defaults until the owner re-arms (TOTP) at a normal stage. Refused on any account that is not mode: demo; the
    # values cannot exceed the owner's approval (goldbot/risk/limits_profile.py RiskCeilings). Records are tagged
    # `limits_profile: demo-2026-10-18`, kept apart from default-profile gate evidence.
    # ADR 0042 (2026-10-25, ~£11,000): weekly 0.10 -> 0.06, a tightening. The weekly cap is checked on the loss so far,
    # so a week can end one day past it: 6% + 2% = 8% (the size-down stage); 10% + 2% would cross the 8% stage and the
    # 12% kill switch. daily 0.05 stays (the £220 binds first, 2.0%); min-lot 1% = £110, every native stop fits. The
    # profile label stays: evidence in R is scale-free and the deposit date splits the regime in the ledger.
    risk_overrides:
      profile: demo-2026-10-18
      ceilings: { daily: 0.05, weekly: 0.06, min_lot_risk_cap: 0.01 }
    # ADR 0036, the owner 2026-10-18: "for the demo account, the trades will be opened and closed by the system, no
    # confirmation is needed, for real account with real money, stick to original plan of confirming from me".
    # propose | auto (default propose). auto is refused at load on any account that is not mode: demo, and the engine
    # enters automatically only while the MT5 terminal itself reports a demo account. The re-arm 30-day window, the
    # 12% kill switch and the owner's /mode propose still return it to propose; exits are never gated either way.
    approval_mode: auto
    # ADR 0037, the research director 2026-10-19: a cost probe, demo only. While the book is flat, one challenger's
    # shadow entry at a time (a fixed round-robin over agent ids, never by score) is mirrored as a 0.01-lot order
    # through the RiskGate under the caps above, exits automatic; a real trade always comes first (an open probe is
    # closed to make way). Probes are recorded in aux.db cost_probes for the costs pipeline only: never in the trade
    # record, the phase gate or the shadow scoring. Refused at load on any account that is not mode: demo, and no
    # probe is sent unless the MT5 terminal itself reports a demo account and the engine is in auto. budget_share:
    # no new probe once today's realised probe loss reaches this share of the day's loss allowance (£10 of £50), nor
    # while less than this share of the allowance remains. Probes trade under their own magic (magic_base + 97).
    # Amendment (research director ruling 2026-10-19, "more trades need to be opened and closed"): up to max_open
    # probes at once (2; revisit 3 after 4 weeks of clean data); each probe runs at its strategy's own stop and hold,
    # and is skipped when that stop's loss at 0.01 lot is above max_loss (£4, from the broker's loss_per_lot; refused
    # when it cannot be computed; architect trace 2026-10-25: no clamped stop, no capped hold); no new
    # probe once today's realised probe loss + open probe risk + the new probe's would exceed budget_share x the
    # day's loss limit (0.2 x £50 = £10).
    cost_probe: { enabled: false, budget_share: 0.4, max_open: 4, max_loss: 4.0 }   # off: probes on icm-probe (am. 4)
    # ADR 0037 amendment 4 (owner 2026-10-19, a dedicated probe account): icm-demo runs the shadow book and the probes
    # until icm-probe is enabled. Switch-over (config only, reversible): icm-probe `enabled: true`; here
    # `shadow_host: false` and `cost_probe.enabled: false`; restart both engines. Two enabled shadow hosts fail at load.
    shadow_host: false        # the shadow book moved to icm-probe (2026-10-19 switch-over)
    # owner 2026-10-19 ("loss per trade, daily loss ... dynamic according to strategy", docs/design/
    # dynamic-limits-2026-10-19.md): per-strategy risk per trade from the nightly controller, tighten-only intraday
    # factors; the ceilings above and the RiskGate's caps still bind. Default false; false + restart is the rollback.
    # A live account stays false until the owner decides (owner-only)
    dynamic_limits: true
    # ADR 0043 amendment (PD 2026-10-26, architect option c; ADR 0043 "What would change this": a second probe account
    # -> per-style hosts): icm-demo is a second learning host. It runs the INTRADAY and SWING exploration arms, icm-probe
    # the SCALP arms and the cost probes; no arm runs on both (tests/test_demo_learning_host.py). Why: one host's 18
    # slots and £198 were shared by three styles, so the 1m/5m scalp arms crowded the 15m-1d arms out; a second host
    # doubles the learning budget at no real-money risk. probe_only (ADR 0037 amendment 6: exploration alone makes a
    # probe host): no live agent, every non-learning entry refused, out of the supervisor's combined limits, the
    # limits evidence (limits_job) and the phase gate (exploration closes never reach closed_trades.jsonl). The phase
    # gate's paper evidence therefore pauses until the re-role back (RUNBOOK "icm-demo learning host": trigger, flat,
    # probe_only false, a new evidence epoch). Rollback: exploration.enabled false, probe_only false, max_positions
    # removed, restart.
    probe_only: true
    max_positions: 18         # PD 2026-10-26 host cap (demo probe_only only), as icm-probe
    # exploration (plan 2026-10-25, ADR 0043 sleeves; the rules are the frozen ARM-SPEC, config/exploration_arms.yaml):
    # budget_share 0.9 x 220 = £198 = intraday £108 + swing £90 (ADR 0043's £48 : £40 ratio, scaled to the host's
    # budget); slots and per-trade caps unchanged (intraday 5 open at £17, swing 1 open at £40; I0 30% of intraday,
    # W0 33% of swing, never allocated by results). max_open_total 17: one of the 18 host slots held in reserve.
    # Arms expansion wave 1 (docs/research/arms-expansion-2026-10-26.md sections 3 and 5; 2026Q4 trial override
    # 74 -> 93, authorised by the owner's directives 1 "tripple the numbers" and 5 "there should be 30 different
    # strategies running..." of 2026-10-26): the intraday pot's max_open 5 -> 9 (10 of the 17, the £108 pot binds
    # first); per trade £17 (15m) and £30 (1h, under ADR 0043's £45); C1H a fixed 0.25 share (a control, never
    # allocated by results). No other limit changes. Rollback: drop the wave-1 arms, max_open back to 5, restart.
    # Arms expansion wave 2 (arms-2026-10-25.md section 8, 8.13, 8.14; research director's decision 3 in
    # arms-expansion-2026-10-26.md section 11: "the swing pot goes from max_open 1 to 2 on icm-demo and vantage-demo for
    # 4h arms. The £40 cap and the £90 / £82 pots are unchanged"; 2026Q4 override 93 -> 106): swing max_open 1 -> 2,
    # nothing else moves. Arms blocked in the frozen spec are dropped by the engine (logged) until their engine lane
    # lands. Rollback: drop the wave-2 arms, swing max_open back to 1, restart.
    exploration:
      enabled: true
      budget_share: 0.9
      max_open_total: 17
      # ADR 0049 D1a (CFO 2026-10-27, H-81 3.4 option B): a scalp pot carved inside the unchanged £198 budget for the
      # H-81 scalp strata, so they are retired on the scalp stop (-30 R in 300), never the intraday one; intraday 108 / 9 -> 68 / 7, swing 90 / 2 -> 40 / 2.
      # budget_share, max_open_total 17 and max_positions 18 unchanged. Until option A (one shared host budget) lands.
      # Rollback: drop the scalp pot and the H-81 arms, restore intraday 108 / 9 and swing 90 / 2, restart.
      pots: { scalp: { gbp: 90, max_open: 8 }, intraday: { gbp: 68, max_open: 7 }, swing: { gbp: 40, max_open: 2 } }
      arms:
        I0: { style: intraday, max_loss: 17.0, control_share: 0.30 }
        I2A: { style: intraday, max_loss: 17.0 }
        I2B: { style: intraday, max_loss: 17.0 }
        MB15: { style: intraday, max_loss: 17.0 }
        MB30: { style: intraday, max_loss: 17.0 }
        MB1H: { style: intraday, max_loss: 17.0 }
        MSA15: { style: intraday, max_loss: 17.0 }
        # time-structure arms (prereg-2026-10-26-time-structure.md; override 69 -> 74 approved 2026-10-26): blocked in
        # the frozen spec until engine lane E2 lands level_break, so the engine drops them (logged) until then
        G1A: { style: intraday, max_loss: 17.0 }
        G1C: { style: intraday, max_loss: 17.0, control_share: 0.05 }
        # wave 1 (arms expansion 2026-10-26): specialist arms; XTV1 is blocked in the spec (dropped, logged)
        XBB15: { style: intraday, max_loss: 17.0 }
        XTV1: { style: intraday, max_loss: 17.0 }
        XEQ15: { style: intraday, max_loss: 17.0 }
        XSO15: { style: intraday, max_loss: 17.0 }
        XIMNY: { style: intraday, max_loss: 17.0 }
        XIMLN: { style: intraday, max_loss: 17.0 }
        XAD1H: { style: intraday, max_loss: 30.0 }
        XMR15: { style: intraday, max_loss: 17.0 }
        XMR1H: { style: intraday, max_loss: 30.0 }
        C1H: { style: intraday, max_loss: 30.0, control_share: 0.25 }
        # wave 2 (arms-2026-10-25.md 8.5, 8.13): F-2 and its state-matched control, the order-block retest
        F2A: { style: intraday, max_loss: 17.0 }
        F2C: { style: intraday, max_loss: 17.0, control_share: 0.05 }
        OBR15: { style: intraday, max_loss: 17.0 }
        # H-80 box family (prereg-exits-adaptive-2026-10-26.md): BXR only, the real-order runner; BXT/BXF are virtual
        # exits on BXR's fills (engine lane E3), never registered as orders
        BXR15: { style: intraday, max_loss: 17.0 }
        BXR30: { style: intraday, max_loss: 17.0 }
        BXR1H: { style: intraday, max_loss: 30.0 }
        W0: { style: swing, max_loss: 40.0, control_share: 0.33 }
        W1A: { style: swing, max_loss: 40.0 }
        W1B: { style: swing, max_loss: 40.0 }
        W2: { style: swing, max_loss: 40.0 }
        WFRI: { style: swing, max_loss: 40.0 }   # time-structure H-72 (forward-only), blocked until engine lane E1
        # wave 2 (arms-2026-10-25.md 8.4, 8.6, 8.9): PDC 4h, the 30-day-low touch and its control; BXR's 4h stratum
        PDC4: { style: swing, max_loss: 40.0 }
        C30A: { style: swing, max_loss: 40.0 }
        C30C: { style: swing, max_loss: 40.0, control_share: 0.05 }
        BXR4H: { style: swing, max_loss: 40.0 }
        # H-81 scalp volume (prereg-2026-10-27-scalp-volume.md section 1): icm-demo's strata at ICM's fixed stops ($3.00
        # 1m = £2.26, $4.50 5m = £3.38) and their random control ZCD (a fixed share, never allocated by results: its
        # ~15 of the ~128 scalp fills a day, section 3.2)
        Z3D: { style: scalp, max_loss: 6.5 }
        Z4D: { style: scalp, max_loss: 6.5 }
        Z6D: { style: scalp, max_loss: 6.5 }
        Z7D: { style: scalp, max_loss: 6.5 }
        Z9D: { style: scalp, max_loss: 6.5 }
        Z10D: { style: scalp, max_loss: 6.5 }
        ZCD: { style: scalp, max_loss: 6.5, control_share: 0.12 }
  icm-probe:
    broker: icm
    mode: demo
    server: ICMarketsSC-Demo
    login: null  # never here (public repo): `python -m goldbot.ops.accounts add icm-probe` keeps it in the keyring
    terminal_path: C:\MT5\ICMarkets\terminal64.exe   # its own box (goldbot-mt5-probe), same layout as icm-demo
    server_tz: NY+7   # measured 2026-10-26 (gap week): UTC+3 = NY+7 (ADR 0005)
    symbol: XAUUSD
    magic_base: 260500
    # ADR 0037 amendment 4 (owner 2026-10-19: "a dedicated demo account for learning probes", GBP; directors' ruling:
    # "probes must never consume the real trades' allowance"). Off until its credentials and terminal exist; enable it
    # together with the switch-over steps on icm-demo above.
    enabled: true             # switched over 2026-10-19 (its own box, goldbot-mt5-probe)
    # its OWN day, in GBP (the RiskGate enforces it as on every account); 0.9 of it is the probe budget. The supervisor
    # keeps it out of the real accounts' combined limits (probe_only). History: £20 / 0.8, then £30 / 0.9 on 2026-10-20
    # for demo learning volume (owner: hundreds of demo fills). ADR 0042 (CFO 2026-10-25, after the owner's top-up to
    # £11,000): £30 -> £220 = 2% of £11,000, the design's default daily cap; probe budget 0.9 x 220 = £198. Reverse to
    # £30 BEFORE any withdrawal of the top-up.
    daily_loss_limit_abs: 220
    # the owner's approved demo ceilings (ADR 0032, demo only), so a 0.01-lot probe is not refused by the 0.5% cap.
    # ADR 0042: weekly 0.10 -> 0.06 (a tightening: 6% + one 2% day = the 8% size-down stage, never the 12% kill switch)
    risk_overrides:
      profile: demo-2026-10-18
      ceilings: { daily: 0.05, weekly: 0.06, min_lot_risk_cap: 0.01 }
    approval_mode: auto       # ADR 0036 (demo); probes are sent only in auto
    # the account type is measured by the classifier (null = not declared: entries wait for a measured class)
    account_class: raw        # owner 2026-10-20: the icm-probe account is a Raw account (as icm-demo)
    # ADR 0042: max_loss £4 -> £45 so native-stop mirror probes fit (1h ~£16.5, 4h ~£38 at 0.01 lot, 18% headroom; a
    # 4h stop above ~$59 is still skipped). Load check: 45 <= the cost probes' 0.2727 x 220 = £60 (ADR 0043).
    # Reverse to £20 if the median realised probe loss passes £150 a day or the weekly cap is hit two weeks
    # running in the first 10 risk days.
    # ADR 0043 (CFO 2026-10-25; PD integration ruling): the £198 probe budget is split into sleeves; the cost probes keep
    # P0 scheduled £15 (scheduled.budget_share 0.25 of it) + M mirrors £45 = £60 = 0.2727 x 220 (was 0.9 = £198); 3 mirror
    # slots (was 4). max_open x max_loss no longer fits the sleeve: budget_refusal binds the count at run time
    cost_probe: { enabled: true, budget_share: 0.2727, max_open: 3, max_loss: 45.0, scheduled: { enabled: true, budget_share: 0.25 } }   # ADR 0037 am. 4 + 5 (owner-approved 2026-10-20: scheduled M1 probes)
    shadow_host: true         # counts only once enabled: then icm-demo must drop its own flag
    # never a real trade: no live agents, and the engine refuses any entry that is not a cost probe (fail closed)
    probe_only: true
    # PD 2026-10-26 (ADR 0043 host cap, 18 open): the RiskGate's open-position cap on THIS account only, replacing
    # risk.max_positions_per_account (2, which every other account keeps); refused at load off a demo probe_only account
    max_positions: 18
    # dynamic limits (design 2026-10-19 item 4): each probe's loss is its own stop's at 0.01 lot, at most max_loss
    # and budget_share x the day's limit / max_open; the probe count is budget_share x the day's limit / the median
    # loss at the stop of the last 20 probes, 1 to max_open. max_loss and max_open are the ceilings and the fallback
    # (an unknown limit or no probe history gives them); every probe row says which applied (basis)
    dynamic_limits: true
    # exploration arms (plan 2026-10-25): minimum-lot demo entries that MEASURE an edge, so the RiskGate skips only
    # its expected-value rules for them, inside its fence (probe_only, demo terminal, minimum lot, a registered arm,
    # loss at the stop <= the arm's max_loss). Refused at load unless demo + probe_only. ADR 0043 sleeves (CFO
    # 2026-10-25, PD integration ruling): budget_share 0.6273 x 220 = £138 = scalp £50 + intraday £48 + swing £40;
    # with cost_probe's 0.2727 (£60) the day's 0.9 = £198. Each pot: realised + open risk at the stops + the new
    # trade's <= its £, at most max_open of its arms open; 18 open at most on the host (the live 6x-notional /
    # 300%-margin cap still applies, the smaller binds). Per trade (loss at the gate's stop + the round trip, the
    # engine; the stop alone, the gate): scalp £6.50, intraday £17, swing £40. The rules are the frozen ARM-SPEC
    # (config/exploration_arms.yaml, hash-checked); here only the arms this account runs, their sleeve and, for the
    # random controls, a fixed share of it (S0 25% + S0R 5% of scalp, I0 30% of intraday, W0 33% of swing; never
    # allocated by results). Blocked spec arms (S6, I1, I3, W3) are not registered. ON since 2026-10-25 (PD decision,
    # owner: a few hundred demo trades a day; trading-safety + quant approved the engine); false + restart is the rollback.
    # ADR 0043 amendment (PD 2026-10-26, per-style hosts): the intraday and swing arms moved to icm-demo; the scalp pot
    # takes their freed £88 (£50 -> £138 = the same 0.6273 x 220), cost probes unchanged (£60). max_open_total 18 -> 17:
    # one host slot is always left for the scheduled probe (trading-safety nit, 2026-10-26).
    exploration:
      enabled: true
      budget_share: 0.6273
      max_open_total: 17
      pots: { scalp: { gbp: 138, max_open: 12 } }   # CFO 2026-10-26: 12 + mirrors 3 + scheduled 1 = 16 of 18; back to 8 if -6% before week 3
      arms:
        S0: { style: scalp, max_loss: 6.5, control_share: 0.25 }
        S0R: { style: scalp, max_loss: 6.5, control_share: 0.05 }
        S1A: { style: scalp, max_loss: 6.5 }
        S1B: { style: scalp, max_loss: 6.5 }
        S2A: { style: scalp, max_loss: 6.5 }
        S2B: { style: scalp, max_loss: 6.5 }
        S3A: { style: scalp, max_loss: 6.5 }
        S3B: { style: scalp, max_loss: 6.5 }
        S4: { style: scalp, max_loss: 6.5 }
        S5A: { style: scalp, max_loss: 6.5 }
        S5B: { style: scalp, max_loss: 6.5 }
        # time-structure arms (prereg-2026-10-26-time-structure.md; override 69 -> 74 approved 2026-10-26): blocked in
        # the frozen spec until engine lane E1 lands, so the engine drops them (logged) and nothing is sent until then
        F1A: { style: scalp, max_loss: 6.5 }
        F1C: { style: scalp, max_loss: 6.5, control_share: 0.05 }
        # wave 2 (arms-2026-10-25.md 8.8, 8.9, 8.13): clock anchors, forward-only, and their random-side control at
        # KA15's decision closes (0.10 of the pot: about KA15's 2 a day; XC15 blocked until engine lane E3)
        KA15: { style: scalp, max_loss: 6.5 }
        XC15: { style: scalp, max_loss: 6.5, control_share: 0.10 }
        # H-81 scalp volume (prereg-2026-10-27-scalp-volume.md section 1 and amendment (a)): icm-probe's strata of
        # Z1/Z2/Z5/Z8 and Z7P/Z4P at ICM's fixed stops ($3.00 1m = £2.26, $4.50 5m = £3.38, inside the £6.50 scalp
        # cap); their control is the borrowed S0 (fills inside W that pass the spread gate only, amendment (b) 2).
        # Inside the unchanged £138 / 12 scalp pot: the requested re-split to £168 / 14 (sections 3.4, 7.1; ADR 0049
        # D1) is not applied here. Rollback: drop these six lines, restart.
        Z1P: { style: scalp, max_loss: 6.5 }
        Z2P: { style: scalp, max_loss: 6.5 }
        Z5P: { style: scalp, max_loss: 6.5 }
        Z8P: { style: scalp, max_loss: 6.5 }
        Z7P: { style: scalp, max_loss: 6.5 }
        Z4P: { style: scalp, max_loss: 6.5 }
  vantage-demo:
    broker: vantage
    mode: demo
    server: VantageMarkets-Demo  # Raw ECN, GBP £10,000 (owner 2026-10-26)
    login: null  # never here (public repo): mt5-login-vantage-demo in the keyring
    terminal_path: C:\MT5\ICMarkets\terminal64.exe   # its own box (goldbot-mt5-vantage); the bootstrap's install path
    server_tz: NY+7   # measured 2026-10-26 (US-EU DST gap week): server clock UTC+3 = NY+7, Athens gave UTC+2 (ADR 0005)
    symbol: XAUUSD+   # Vantage Raw ECN gold (contract 100 oz, min 0.01, 2 digits), read from symbol_info 2026-10-26
    magic_base: 260200
    # third learning host (PD 2026-10-26, owner: "all three accounts learn"); broker-separated evidence (loop lane L1,
    # ADR 0043 broker amendment) has merged: Vantage labels, costs, weights and models never pool with ICM's, and the
    # H-60 priors (ICM-cost history) do not seed it (flat prior). ON since 2026-10-26: its 11 registry trials were
    # recorded first (registry research-v1, family arms_vantage_twin; K 134 -> 145; prereg amendment 2).
    # Rollback: enabled false + restart.
    enabled: true
    # ADR 0004 / ADR 0042 pattern (CFO 2026-10-26): £200 = 2% of the £10,000 demo deposit, the design's default daily
    # cap, so the £ limit adds no room beyond the percentage rule. Demo only; a real-money Vantage account is owner-only.
    daily_loss_limit_abs: 200
    account_class: raw        # the owner's declared Raw ECN account (raw spread + commission); measurement keeps running
    # the approved demo ceilings (ADR 0032, demo only), as icm-demo and icm-probe: weekly 0.06 (6% + one 2% day = the
    # 8% size-down stage, never the 12% kill switch; ADR 0042); min-lot 1% = £100, so a 0.01-lot native stop fits
    risk_overrides:
      profile: demo-2026-10-18
      ceilings: { daily: 0.05, weekly: 0.06, min_lot_risk_cap: 0.01 }
    approval_mode: auto       # ADR 0036 (demo): exploration and probes enter only in auto on a terminal reading demo
    # its OWN cost measurement (ADR 0043 broker amendment: "another broker's measurements are never used"): scheduled
    # M1 probes only (no shadow book here, so no mirror probes), sleeve £15 = 0.075 x 200 (CFO 2026-10-26); scheduled
    # share 0.5 = £7.50 a day, the pre-registered K10 bound (PD 2026-10-26), so its 50 fills come more slowly. max_loss
    # £4 covers the $3 safety stop at 0.01 lot. Labels use the settings priors until its own table has >= 50 fills
    # (research.min_fills_for_slippage)
    cost_probe: { enabled: true, budget_share: 0.075, max_open: 1, max_loss: 4.0, scheduled: { enabled: true, budget_share: 0.5 } }
    shadow_host: false        # icm-probe hosts the shadow book (one host per deployment)
    # a learning host (ADR 0037 amendment 6): no live agent, every non-learning entry refused, out of the supervisor's
    # combined limits, the limits evidence and the phase gate
    probe_only: true
    max_positions: 18         # PD 2026-10-26 host cap (demo probe_only only), as icm-probe and icm-demo
    dynamic_limits: true      # probes' loss and count from their own stops and the budget; the values above are ceilings
    # live issue 2026-10-27 (SRE: Vantage fills 2.6-5.3 s p95, up to 31 s): an entry order waits this long for the
    # terminal's reply on its own worker thread (goldbot/engine/order_send.py); the default 15 s timed out while the
    # broker still filled. Rollback: drop the line (15 s) + restart
    order_timeout_s: 35
    # exploration (ADR 0043 broker amendment; prereg-2026-10-25-high-volume.md amendment 2): the Vantage TWINS of the
    # intraday and swing arms (config/exploration_arms.yaml twin_of; same rule bodies, own ids, hashes, fills and
    # reads; never pooled with ICM). CFO 2026-10-26: budget 0.9 x 200 = £180 = intraday £98 + swing £82 (ADR 0043's
    # £48 : £40 ratio); with the probes' 0.075 the day's 0.975. Per trade intraday £17 (5 open), swing £40 (1 open);
    # VI0 30% of intraday, VW0 33% of swing (controls, never allocated by results). 17 open at most: one of the 18 host
    # slots is kept for the scheduled probe. Rollback: exploration.enabled false + restart (with probe_only, enabled).
    # Arms expansion wave 1 (as icm-demo above, same override and owner directives 1 and 5 of 2026-10-26): intraday
    # max_open 5 -> 9 (the £98 pot binds first); £17 (15m) / £30 (1h) per trade; VC1H a fixed 0.25 share. VX* arms
    # are Vantage's own hypotheses, not twins. No other limit changes. Rollback as icm-demo.
    # Arms expansion wave 2 (as icm-demo above, decision 3 of arms-expansion-2026-10-26.md section 11): swing max_open
    # 1 -> 2, the £82 pot and £40 cap unchanged; KSQ1 and PDC1 (1h, £30) and DON4 (4h swing). Rollback as icm-demo.
    exploration:
      enabled: true
      budget_share: 0.9
      max_open_total: 17
      # ADR 0049 D1a (CFO 2026-10-27, H-81 3.4 V1): a scalp pot carved inside the unchanged £180 budget for the
      # H-81 scalp strata, so they are retired on the scalp stop (-30 R in 300), never the intraday one; intraday 98 / 9 -> 40 / 4, swing 82 / 2 -> 40 / 1.
      # budget_share, max_open_total 17 and max_positions 18 unchanged. Until option A (one shared host budget) lands.
      # Rollback: drop the scalp pot and the H-81 arms, restore intraday 98 / 9 and swing 82 / 2, restart.
      pots: { scalp: { gbp: 100, max_open: 8 }, intraday: { gbp: 40, max_open: 4 }, swing: { gbp: 40, max_open: 1 } }
      arms:
        VI0: { style: intraday, max_loss: 17.0, control_share: 0.30 }
        VI2A: { style: intraday, max_loss: 17.0 }
        VI2B: { style: intraday, max_loss: 17.0 }
        VMB15: { style: intraday, max_loss: 17.0 }
        VMB30: { style: intraday, max_loss: 17.0 }
        VMB1H: { style: intraday, max_loss: 17.0 }
        VMS15: { style: intraday, max_loss: 17.0 }
        # wave 1 (arms expansion 2026-10-26): specialist arms; VXTV2 is blocked in the spec (dropped, logged)
        VXRIP1H: { style: intraday, max_loss: 30.0 }
        VXRT1H: { style: intraday, max_loss: 30.0 }
        VXFK1H: { style: intraday, max_loss: 30.0 }
        VXTL1H: { style: intraday, max_loss: 30.0 }
        VXTV2: { style: intraday, max_loss: 17.0 }
        VXBO1H: { style: intraday, max_loss: 30.0 }
        VXBO15: { style: intraday, max_loss: 17.0 }
        VXTR1H: { style: intraday, max_loss: 30.0 }
        VC1H: { style: intraday, max_loss: 30.0, control_share: 0.25 }
        # wave 2 (arms-2026-10-25.md 8.2, 8.6): squeeze release and PDC break, 1h
        KSQ1: { style: intraday, max_loss: 30.0 }
        PDC1: { style: intraday, max_loss: 30.0 }
        VW0: { style: swing, max_loss: 40.0, control_share: 0.33 }
        VW1A: { style: swing, max_loss: 40.0 }
        VW1B: { style: swing, max_loss: 40.0 }
        VW2: { style: swing, max_loss: 40.0 }
        DON4: { style: swing, max_loss: 40.0 }   # wave 2 (8.3): Donchian-55 break-close 4h
        # H-81 stage V1 (section 3.2): Vantage's strata at the $7.00 bar (£5.26) and ZCV (~12 of ~58 scalp fills a
        # day); Z3V/Z5V wait for V2 (vantage-swing live) and the VS S-twins stay blocked on Vantage's cost gate
        Z6V: { style: scalp, max_loss: 6.5 }
        Z7V: { style: scalp, max_loss: 6.5 }
        ZCV: { style: scalp, max_loss: 6.5, control_share: 0.20 }
  icm-depth:
    broker: icm
    mode: demo
    server: ICMarketsSC-Demo
    login: null  # never here (public repo): `goldbot accounts set mt5-login-icm-depth` keeps it in the keyring
    terminal_path: C:\MT5\ICMarkets\terminal64.exe   # its own box (goldbot-mt5-depth), the bootstrap's install path
    server_tz: NY+7   # as icm-demo and icm-probe (same broker, measured 2026-10-26); re-check on its box (ADR 0005)
    symbol: XAUUSD
    magic_base: 260600
    # ICM depth host (owner 2026-10-27, docs/research/volume-500-plan-2026-10-26.md section 2 lever C; build plan
    # docs/deploy/icm-depth-host.md): a second free IC Markets demo on its own Wine MT5 box, to take icm-demo's 15m-1d
    # families so icm-demo becomes a pure volume host. OFF and armless until the box is verified and the arm move has
    # passed the trading-safety and quant reviews; that change sets the limits, probe_only, approval_mode, exploration
    # and enabled in one step. Until then approval_mode stays propose and no engine unit is enabled for it.
    # Rollback: remove this block.
    enabled: false
  icm-live:
    broker: icm
    mode: live
    server: ICMarketsSC-MT5-3   # the owner's real account (Raw Spread), given 2026-10-27
    login: null  # never here (public repo): `python -m goldbot.ops.accounts add icm-live` on the VPS keeps it in the keyring
    currency: GBP               # the deposit currency; the engine refuses a terminal reporting another one
    # its own box, the bootstrap's install path (docs/deploy/bridge-v7-rollout.md section 7)
    terminal_path: C:\MT5\ICMarkets\terminal64.exe
    # as icm-demo and icm-probe (same broker, measured 2026-10-26 in the gap week: UTC+3 = NY+7). health measures it on
    # the live terminal as soon as its bridge answers (`server_clock:icm-live`, before the unlock too); ADR 0005
    server_tz: NY+7
    symbol: XAUUSD
    magic_base: 260300
    enabled: false  # only the owner's `unlock-live icm-live` and typed phrase enable it (ADR 0055)
    dynamic_limits: false     # ADR 0055: "Dynamic or adaptive limits off"
    # ADR 0055: "£6.25 (two full stops), absolute, account currency"; the pilot's daily_cap_frac keeps the 2% rule
    # from binding first. Entries only; exits are never gated
    daily_loss_limit_abs: 6.25
    approval_mode: propose    # ADR 0036 / 0055: the owner confirms every entry (approval_window_seconds: 90)
    # ADR 0055, option (a), this account only (goldbot/risk/pilot.py): 0.01 lot exactly, stops <= $4 (refused, never
    # shrunk), <= £3.12 a trade including the round trip, one position, 15m only; entries halt for good after £25
    # realised loss or 30 filled entries (counted from the broker's deals since start_utc, kept in core.db), checked
    # before every entry with the open risk and the new trade; exits keep running. The four rails it changes, for
    # this account only: max_risk_frac (1% -> £3.12), daily_cap_frac (2% -> £6.25), leverage_cap (20 -> 500, the
    # terminal's own leverage when lower; the bridge's notional ceiling follows it) and drawdown_stages (the 12% kill
    # gives way to the £25 stop). The field bounds are ADR 0055's terms. It enables nothing by itself
    pilot:
      enabled: true
      adr: 55
      pilot_id: icm-live-adr55
      start_utc: 2026-10-29T00:00:00Z   # before the earliest first order (2026-10-30)
      lot: 0.01
      max_stop_usd: 4.00
      max_risk_per_trade_abs: 3.12
      stop_loss_abs: 25.00
      max_entries: 30
      timeframes: [15m]
      max_positions: 1
      leverage_cap: 500
      max_risk_frac: 0.125            # £3.12 of £25: the £ cap binds over the pilot's whole range
      daily_cap_frac: 0.25            # £6.25 of £25: daily_loss_limit_abs binds over the pilot's whole range
      drawdown_stages: false
      # ADR 0055 amendment (trading-safety rulings): the weekly cap 25% (£12.50 at £50) instead of 5%, and every
      # position closed at the Friday cut, winners too
      weekly_cap_frac: 0.25
      weekend_flat: true
    # BACKLOG 135, PD decision on the trading-safety review of 49335812: a live account takes entries only while its
    # bridge's order lane is up (/health order_lane: separate); exits work without it. Its drill: RUNBOOK "Order lane"
    order_lane: true

id: R176
requirement: 'A retired or no-evidence gold arm of any role in control_mode replay_only keeps its retirement (no entry on any account) and records every candidate in exploration_obs with taken 0, blocked replay_only, mu 0, labelled by the r2 replay; the candidate is recorded at its signal and never queued, so it never reaches the budget, the RiskGate, an order intent or the order core. A hash-refused, invalid or dark arm records nothing; a replay-only arm is never dormant nor de-registered; records of arms that may send no entry are capped at 1,000 a UTC day per engine. The gold arms retired 2026-11-13 for lack of evidence and the red-box rule (new ids RBR*/RBRC*, end_utc 2026-12-31) record; GS1/GS1C, the old red-box rows and non-gold rows do not. No K. Amendment: docs/research/prereg-amendment-2026-11-24-replay-only-retired-arms.md.'
status: implemented (2026-11-24, branch feat/replay-only-retired-arms)
code: 'goldbot/research/arms.py (Arm.control_mode on any role); goldbot/engine/exploration.py (Exploration.recording, silent, _replay, REPLAY_RETIRED_DAILY_CAP, _signal, _with_context, refresh_dormant); goldbot/engine/exploration_deregister.py (candidates); config/exploration_arms.yaml (20 control_mode edits, RBR*/RBRC* rows); config/accounts.yaml (icm-probe RBR*/RBRC* registrations); config/arm_stops.yaml (none)'

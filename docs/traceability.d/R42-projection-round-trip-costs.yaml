id: R42
requirement: 'Round-trip cost in the absolute daily projection (BACKLOG 36, trading-safety review LOW-6): an entry is refused (`daily_loss_limit_abs`) when loss so far (+ open risk with `project_open_risk`) + its full stop risk + its round-trip cost exceeds the limit; the cost is cost_atr x ATR (spread, slippage, commission from the cost table, else the configured fallback) plus the paid swap of a broker rollover before the risk day ends (ADR 0017 rule: measured rates else the settings prior, triple day counted, credit never), x lots x contract x fx in the account currency; never negative; a non-finite swap rate never reads as 0 (finite-only table and SwapSpec, prior on a bad table, NaN refused by the gate); a swap that cannot be priced at the click refuses the approval (`swap_unavailable`); entries only, exits never gated. Conservative by design: cost_atr includes the spread while the stop risk, measured from the fill, already pays it, so the spread is counted twice'
status: implemented
code: 'goldbot/risk/gate.py `Intent.swap_usd_per_oz` (non-finite = `invalid_state`), `GateDecision.cost_amount`, the cost in the projected check of `RiskGate.check`; goldbot/ops/cost_imputation.py `account_swap`, `paid_swap_per_oz` (shared with `CostImputer.from_state` / `charge`); goldbot/labels/triple_barrier.py `SwapSpec` and goldbot/execution/costs.py `CostTable.swap_*` finite-only (`allow_inf_nan=False`), `BrokerTerms.swap_spec` None on a non-finite reading; goldbot/engine/runner.py `EngineConfig.swap_prior`, `_cost_table`, `_swap_usd_per_oz` (NaN on a non-finite rate; bar-close intent and the approval re-check, guarded: `swap_unavailable`); goldbot/ops/services/engine.py passes `settings_swap(settings)`'
test: 'tests/test_projection_costs.py (hand-worked GBP example: £7.50 stop + £0.30 round trip + £0.45 swap; inclusive boundary at 50.00, 42 lost refused; triple night; USD; scales with lots; with open risk; credit or negative cost never loosens; non-finite swap refuses; inert without an absolute limit; swap before the risk day ends by time and side; measured table over the prior; engine prior and clock; unreadable or NaN table keeps the prior; SwapSpec and CostTable refuse non-finite rates; a non-finite broker reading is no swap; a non-finite rate reaching the engine is refused; the service builds the engine with the settings prior; bar-close intent and approval re-check carry the swap; a summer card proposed at 20:50 UTC is re-priced without swap at a 21:05 click; an unpriceable swap refuses the approval); tests/test_daily_loss_abs.py::test_the_boundary_is_inclusive; tests/test_open_risk_heat.py::test_the_projection_counts_two_open_trades_remaining_stop_risk; tests/test_safety_rules_october.py::test_a_trade_that_exactly_fills_the_remaining_budget_is_allowed_and_a_cent_over_is_refused'

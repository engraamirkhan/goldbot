id: R147
requirement: 'Backlog 195 (follow-up of R135): the performance report reads the MFE/MAE on closed exploration_trades bodies (mfe_r, mae_r, mfe_usd, mae_usd, excursion_approx). Per family and per arm, exploration and control, over the countable closes (censored and voided left out): median MFE R and MAE R with n; rows without the fields (closed before R135) counted "not recorded" and never read as 0 R; excursion_approx rows with their own medians and count, never in the exact ones; the losers'' median MFE (R and USD/oz) and the winners'' median MAE with n; the stop exits'' share of the stop and target exits against the bracket''s driftless random-walk null target / (stop + target). Descriptive only: no interval, no reading, not in the groups note. Reporting only; no order, exit or gate path touched.'
status: 'implemented (2026-11-13, branch feat/mfe-mae-reports)'
code: 'goldbot/ops/perf_report.py (ExcursionStats, _excursions, _excursion_rows, LearningReport.excursion_families/excursion_arms, _excursion_sections); goldbot/ops/learning_ledger.py (LearningClose exit_reason, stop_usd, target_usd and the R135 fields, joined from the exploration body); goldbot/api/trades_ledger.py (arm_trade_id, exploration_records: the cached aux read by trade_id; no API contract change)'

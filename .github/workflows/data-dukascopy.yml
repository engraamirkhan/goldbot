name: data-dukascopy
# Downloads XAUUSD ticks from the free Dukascopy archive on GitHub's runners (both Claude sandboxes are
# blocked from the datafeed host), builds 1m bars with goldbot's own resampler month by month, and publishes
# one Parquet per year as assets on the rolling release tag `data-v1`. Research jobs and the VPS fetch from there.
on:
  workflow_dispatch:
    inputs:
      from_year: { description: "first year", default: "2010" }
      to_year:   { description: "last year (inclusive)", default: "2026" }
      full_refresh: { description: "download every month again (published bars stay as fallback). Costs hours of runner time per year of data: on the free tier this can use the whole month's 2,000 minutes", type: boolean, default: false }
      retry_flagged: { description: "also re-download closed months flagged imputed/partial (about 80 runner-minutes per month; off for the Saturday run, G5)", type: boolean, default: false }
      months: { description: "targeted refetch (G1/G2): comma-separated YYYY-MM, e.g. 2024-01,2024-06. Downloads exactly these months again (flagged or not) and keeps every other month as published; replaces from_year/to_year; leave full_refresh and retry_flagged off. Max 24", default: "" }
  schedule:
    - cron: "17 3 * * 6"   # Saturdays 03:17 UTC: refresh the current year
# Least privilege: the token has no scopes by default; only build-year may upload release assets and write issues.
# Workflow inputs and matrix values reach shell/Python only through env:, never interpolated into a script.
permissions: {}
concurrency:
  group: data-dukascopy   # one build at a time: parallel runs would race on the same release assets
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # sparse checkout of the month-list parser
    outputs:
      years: ${{ steps.years.outputs.years }}
      months: ${{ steps.years.outputs.months }}   # validated and normalised; build-year never sees the raw input
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/dukascopy_months.py
          sparse-checkout-cone-mode: false
      - id: years
        env:
          EVENT_NAME: ${{ github.event_name }}
          FROM_YEAR: ${{ inputs.from_year }}
          TO_YEAR: ${{ inputs.to_year }}
          MONTHS: ${{ inputs.months }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
          RETRY_FLAGGED: ${{ inputs.retry_flagged }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "years=[$(date -u +%Y)]" >> "$GITHUB_OUTPUT"
            echo "months=" >> "$GITHUB_OUTPUT"
          elif [ -n "$MONTHS" ]; then
            # targeted refetch: the month list alone decides the years; it is validated strictly (YYYY-MM only)
            if [ "$FULL_REFRESH" = "true" ] || [ "$RETRY_FLAGGED" = "true" ]; then
              echo "::error::months is a targeted refetch: leave full_refresh and retry_flagged off"; exit 1
            fi
            if ! plan=$(python3 scripts/dukascopy_months.py "$MONTHS"); then
              echo "::error::months must be comma-separated YYYY-MM months (2010-01 .. this month), at most 24"; exit 1
            fi
            echo "$plan"
            echo "$plan" >> "$GITHUB_OUTPUT"
          else
            python3 -c "import json,os;print('years='+json.dumps(list(range(int(os.environ['FROM_YEAR']), int(os.environ['TO_YEAR'])+1))))" >> "$GITHUB_OUTPUT"
            echo "months=" >> "$GITHUB_OUTPUT"
          fi
  build-year:
    needs: plan
    runs-on: ubuntu-latest
    # the Saturday run only refreshes the open month and short months (~30-45 min); a hung run stops at 120 min
    # and publishes nothing, so the published file is never touched by it
    timeout-minutes: ${{ github.event_name == 'schedule' && 120 || 340 }}
    permissions:
      contents: write   # release asset upload
      issues: write     # coverage and failure issues
    strategy:
      fail-fast: false
      max-parallel: 2   # Dukascopy throttles; the 3-way run lost whole months
      matrix:
        year: ${{ fromJson(needs.plan.outputs.years) }}
    env:
      YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.11" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - run: pip install -e .
      - name: fetch the previously published year (complete months are kept unless full_refresh)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prev
          # no previous file only when the release (or this year's asset) is confirmed missing; any other error (API,
          # auth, network) fails here instead of rebuilding the year from scratch and clobbering the published months
          if ! assets=$(gh release view data-v1 --json assets --jq '.assets[].name' 2> view.err); then
            cat view.err
            if grep -qi "release not found" view.err; then echo "first run: release data-v1 does not exist"; exit 0; fi
            echo "::error::cannot read release data-v1; refusing to treat this as a first run"; exit 1
          fi
          if ! grep -qx "xauusd_1m_dukascopy_${YEAR}.parquet" <<< "$assets"; then
            echo "first run: release data-v1 has no xauusd_1m_dukascopy_${YEAR}.parquet"; exit 0
          fi
          gh release download data-v1 -p "xauusd_1m_dukascopy_${YEAR}.parquet" -D prev
          test -s "prev/xauusd_1m_dukascopy_${YEAR}.parquet"
      - name: download and build 1m bars for ${{ matrix.year }}
        env:
          REFETCH: ${{ inputs.full_refresh == true && '--refetch-all' || '' }}
          RETRY: ${{ inputs.retry_flagged == true && '--retry-flagged' || '' }}
          MONTHS: ${{ needs.plan.outputs.months }}
        run: |
          set -o pipefail
          # REFETCH/RETRY are constant flags or empty (empty must expand to no argument), so they stay unquoted.
          # Every re-downloaded month is merged day by day and never publishes a day with fewer bars than before.
          # MONTHS is the plan job's validated list; the script validates it again and refetches only this year's.
          target=()
          if [ -n "$MONTHS" ]; then target=(--months "$MONTHS"); fi
          # shellcheck disable=SC2086
          python scripts/dukascopy_year.py "$YEAR" --report "coverage-${YEAR}.md" \
            --existing "prev/xauusd_1m_dukascopy_${YEAR}.parquet" $REFETCH $RETRY "${target[@]}" 2>&1 | tee "report-${YEAR}.txt"
      - name: day-by-day coverage (a month can pass at 15,000 bars and still have lost whole weekdays)
        if: always()
        run: |
          [ -f "xauusd_1m_dukascopy_${YEAR}.parquet" ] || exit 0
          # exit 1 means gap days were found: reported on the coverage issue, never a reason to drop the build
          python scripts/check_coverage.py "xauusd_1m_dukascopy_${YEAR}.parquet" --report "daycov-${YEAR}.md" || true
      - name: publish to release data-v1
        if: always() && steps.prev.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "xauusd_1m_dukascopy_${YEAR}.parquet" ] || exit 0
          # parallel matrix jobs race on create/upload: retry with backoff
          for i in 1 2 3 4 5; do
            { gh release view data-v1 >/dev/null 2>&1 || gh release create data-v1 --title "Market data (rolling)" --notes "1m XAUUSD bars built by the data-dukascopy workflow" --latest=false; } &&
            gh release upload data-v1 "xauusd_1m_dukascopy_${YEAR}.parquet" --clobber && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: coverage report to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]; year = os.environ["YEAR"]
          hdr = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          try: cov = open(f"coverage-{year}.md").read()
          except FileNotFoundError: cov = "(no coverage table; the download step crashed)"
          try: cov += "\n\n## Day-by-day coverage (scripts/check_coverage.py)\n\n" + open(f"daycov-{year}.md").read()
          except FileNotFoundError: pass
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          body = f"Run: {run_url}\n\n{cov}"
          title = f"data coverage {year}"
          # update the existing coverage issue for this year if there is one
          q = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues?labels=data-coverage&state=open&per_page=50", headers=hdr)
          existing = [i for i in json.load(urllib.request.urlopen(q)) if i["title"] == title]
          if existing:
              req = urllib.request.Request(existing[0]["url"], data=json.dumps({"body": body}).encode(), headers=hdr, method="PATCH")
          else:
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues", data=json.dumps({"title": title, "body": body, "labels": ["data-coverage"]}).encode(), headers=hdr)
          print(urllib.request.urlopen(req).status)
          EOF
      - name: report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]; year = os.environ["YEAR"]
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          try: body = open(f"report-{year}.txt").read()[-60000:]
          except FileNotFoundError: body = "(no report file; failure before the download step)"
          payload = {"title": f"data-dukascopy failure for {year}", "body": f"Run: {run_url}\n\n```\n{body}\n```", "labels": ["ci", "data"]}
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues", data=json.dumps(payload).encode(),
                                       headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          print(urllib.request.urlopen(req).status)
          EOF

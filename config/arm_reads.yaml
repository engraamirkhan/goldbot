# Exploration read units whose single pre-registered read is recorded (prereg H-61: "each arm is read once, at its
# 300th admissible trade"; families read pooled below in `read_units`; ADR 0050, 0051). Until a unit is listed here
# every view treats its arms as UNREAD: no aggregate of them (sum, mean, hit rate, rank, share, comparison with a
# control) leaves the server (goldbot/api/trades_ledger.py, goldbot/api/strategy_board.py). The evaluator adds the row
# with the read's verdict, in the same commit as the verdict; a row is never removed or edited. The key is the arm id,
# or the unit id of a pooled family (e.g. `H-81:Z6`). Controls have no read of their own (listed below `read_at`).
# `state` is the annealing state the read set (volume-500 plan 4.1): C1 candidate, P proven, R retired; omitted = R
# (H-61: "not graduated at 300 -> retired"). `vs_control_r` / `vs_control_ci90` are the evaluator's RECORDED
# comparison as the prereg defines it (H-81 section 4: day-paired family minus control); the board never computes
# one (quant 2026-10-27). The board freezes the read's figures at the unit's first n counted trades closed by
# `read_utc`.
#   <unit>: {read_utc: "YYYY-MM-DDTHH:MM:SSZ", verdict: "<plain words>", state: C1, vs_control_r: 0.12, vs_control_ci90: [0.01, 0.23]}
reads: {}
# Read size n per arm as pre-registered (evaluator, 2026-10-27, from the frozen texts; every arm of
# config/exploration_arms.yaml is listed, 300 included). A size below 1 reads no arm. Comment = read source; stop rule.
# Sources:
#   HV   = prereg-2026-10-25-high-volume.md "Graduation and promotion": one read at the 300th admissible trade, on
#          >= 20 session days; not graduated -> retired.
#   STOP = HV "H-61 Per-arm stop": scalp -30 R within 300, intraday -15 R within 100, swing -10 R within 40 (amendment
#          3: graduation-eligible arms only). VOID = HV "retired-family neighbours": read void unless the evaluator
#          records the re-entry condition before the read. TWIN = HV amendment 2(e): own read on Vantage fills.
#   W1   = arms-expansion-2026-10-26.md 2.1 (6): one read at the 300th admissible FAMILY fill; per-family stop -30 R
#          within 300 fills. No futility rule registered.
#   W2   = arms-2026-10-25.md 8.0: FAMILY read at 300; stop -30 R within 300 fills or futility at 300 (one-sided 95%
#          UB of mean net R < +0.03 R); else inconclusive, no outcome read before 1,000.
#   Z    = prereg-2026-10-27-scalp-volume.md 4: W2's rule, FAMILY pooled across strata and brokers, on >= 20 session
#          days; plus per-stratum cost stop (UB cost/R > 0.10 halve, > 0.20 suspend).
# FAMILY = the n is the family's pooled count, not this arm's: the board's per-arm n understates progress.
# No read registered (controls never read for edge, never graduate; no H-61 stop, HV amendment 3 / Z 4 / 8.9):
#   S0, I0, W0, VI0, VW0, C1H, VC1H, F2C, C30C, XC15, ZCD, ZCV, VS0.
#   F1C stops with F1A, G1C with G1A (prereg-2026-10-26-time-structure.md 2.2, 3.2); neither has a read of its own.

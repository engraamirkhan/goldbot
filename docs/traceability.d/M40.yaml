id: M40
requirement: 'E-4, H-16''s evaluation path (preregistration-2027Q2-draft.md, H-16): the opportunity score (HAR + ln(GVZ/YZ20), distinct tier-1 releases, ln(prior range/A_D), NR4/NR7/inside day, abs(reopen gap)/A_D, all as known at 06:30 UTC on D) against the HAR-only forecast, both fitted by `fit_har(regressors=)` on the monthly expanding refits with the 1-day purge. Inputs cut at research.holdout_from before any feature. Evaluation set from the frozen first OOS month, GVZ-stale days dropped from both and counted. Reading rule as pre-registered (rho gain >= 0.05 AND top/bottom quintile mean W/A >= 1.5, inclusive). Runs once, only against exactly one unused pre-registration whose hashed config holds the frozen first OOS month and evaluable-day count; refused before reading when any H-16 trial exists (whatever its config), when the pre-registered h16.py source hash differs, or the pre-registered feature version (feature_version(["day_type"]), outputs pinned by a golden file tied to day_type.VERSION) differs; refused when n < 90% of the frozen count (before any statistic) or a statistic is NaN. Recorded as ONE trial (results.kind range_test)'
status: 'implemented (quant review: merge after fixes, fixes applied)'
code: goldbot/research/h16.py (`cut_before_holdout`, `evaluation_inputs`, `first_oos_month`, `oos_log_forecast`, `evaluation_frame`, `read_rule`, `evaluate_h16`, `h16_preregistration`, `run_trial`, `report_lines`); scripts/research_pass.py `--h16`, `h16_refusal`, `_h16`

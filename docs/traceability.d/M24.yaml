id: M24
requirement: '"previous champion is kept and restored automatically if the new one trips the CUSUM alarm in its first two weeks"'
status: implemented
code: 'goldbot/ops/jobs.py `model_watch`; goldbot/research/promotion.py `cusum_alarm`. Deviation for slow agents (CUSUM re-verify): the watch covers two weeks or the first `cusum.WATCH_MIN_TRADES` (12) trades, whichever is later, capped at `cusum.WATCH_MAX_WEEKS` (8), with h calibrated for `cusum.watch_trades`; two weeks of a 2-2.5 trades/week agent are 4-5 trades, where no 5%-rate alarm is reachable. When the count cannot reach h (`cusum.can_alarm`) the job reports `cannot_alarm` (output and state/model_watch.json) and health check `model_watch` warns; such agents rely on drift_watch (M27) and the drawdown halt'
test: tests/test_shadow.py::test_model_watch_restores_the_previous_champion_on_a_cusum_alarm; ::test_a_slow_champion_is_watched_past_two_weeks_until_its_first_twelve_trades; ::test_the_watch_closes_at_the_twelfth_trade_and_is_capped_at_eight_weeks; ::test_a_watch_too_short_to_alarm_reports_cannot_alarm_and_warns_in_health; tests/test_cusum_calibration.py::test_champion_watch_runs_two_weeks_or_twelve_trades_whichever_is_later_capped_at_eight_weeks

id: R84
requirement: 'Owner rule 2026-10-30 (ADR 0061): every strategy is back tested and qualified (a screen 2010-2017 AND a confirm 2018-2025-09, verdict pass, measured costs, cited docs present) before it takes demo entries; random controls and cost arms exempt by an explicit role; refused at load and again by the engine; refused arms stay configured so open positions keep every exit; a bad record never stops the engine; health lists running and refused arms per account; references never raise and registry ids must exist (registry row or evaluator commit); the cost role only for F1A/G1A naming O-11/O-12, ending at 200/100 admissible fills; measured costs cite the table and measured cells (>= 30 fills, worse of measured and prior)'
status: implemented (trading-safety and quant review owed)

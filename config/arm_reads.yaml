# Families read POOLED (the FAMILY rows above): one read unit, its n the pooled count of `counted` (default: all its
# arms), its read row keyed by the unit id. Every arm of a unit has the same read_at (else the file reads no unit).
read_units:
  W1:intraday_momentum: {arms: [XIMNY, XIMLN]}
  W1:mean_reversion: {arms: [XMR15, XMR1H]}
  W1:breakout: {arms: [VXBO1H, VXBO15]}
  W2:KLR: {arms: [PDC1, PDC4]}
  W2:KSQ: {arms: [KSQ1, KSQ4]}
  W2:DON: {arms: [DON4, DOND]}

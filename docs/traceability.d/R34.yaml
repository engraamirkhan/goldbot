id: R34
requirement: 'Absolute daily loss limit: entries refused when the day''s loss so far plus the trade''s full stop risk (account currency) would exceed min(daily cap x day-start equity, `risk.daily_loss_limit_abs`); supervisor halts on the combined loss; exits never gated; the effective limit shown in engine state and health (ADR 0004 section 3, BACKLOG 29)'
status: implemented
code: 'per account (review MEDIUM-3): goldbot/ops/accounts.py `Account.daily_loss_limit_abs` (> 0 or null), config/accounts.yaml `icm-demo: daily_loss_limit_abs: 50` (its currency), goldbot/ops/run.py `engine_limits` (dropped with `paper=True`); engines publish it (`daily_loss_limit_abs`, `limits.daily_loss_limit_abs`, `limits.min_lot_risk_account`) and the supervisor applies the smallest published one; strict boundary (exceed = refused, equal allowed; supervisor halts on reaching it); goldbot/risk/gate.py `RiskLimits.daily_loss_limit_abs`, `RiskGate.daily_loss_limit`, the projected check after the combined cap in `check` (reason `daily_loss_limit_abs`; null = no projection, decisions as before); goldbot/risk/supervisor.py `SupervisorLimits.daily_loss_limit_abs`, `combined_daily_loss_abs` halt, `day_loss_amount` published; goldbot/engine/runner.py `_daily_allowance` -> `daily_loss_limit`, `daily_loss_remaining` in engine_<account>.json; goldbot/ops/health.py `check_loss_caps` shows them and warns when nothing is left'
test: 'tests/test_sizing_review_fixes.py::test_the_absolute_daily_limit_lives_per_account_in_accounts_yaml_not_in_settings, ::test_icm_demo_is_limited_at_50_and_the_paper_broker_at_10k_is_not, ::test_the_engine_publishes_its_accounts_absolute_limit_and_the_supervisor_applies_the_smallest, ::test_the_accounts_absolute_limit_and_the_min_lot_risk_are_published_under_limits; tests/test_daily_loss_abs.py (£5,000 with £40 lost: £15 refused, £9 allowed; null unchanged; the 2% binds below £2,500; effective limit; inclusive boundary; validation and wiring; supervisor halt at 50 combined and the 1.5% cap first at £1,000; engine state; health; exits never call the gate)'

# Instrument registry (goldbot/instruments.py InstrumentSpec). NO SECRETS HERE: symbols and contract terms only.
#
# Multi-instrument demo plan (architect, adopted 2026-11-02; owner: all listed instruments, demo only). Step 0 froze
# this shape; nothing reads it yet, so today's XAUUSD paths are unchanged.
# - key: broker-neutral name (= the entry name). broker_symbols: accounts.yaml `broker` -> that broker's symbol.
# - store_symbol: the store's symbol column (bars_1m_live, ticks), unique, never pooled with XAUUSD. An account's own
#   `store_symbol` in accounts.yaml (vantage-247: XAUUSD247) still wins for that account's gold.
# - magic_block: unique, 0..99. magic = 3_000_000 + account_idx*10_000 + magic_block*100 + offset (lane L3).
#   XAUUSD is 0. Never renumber a block once an instrument has traded: open positions are reconciled by it.
# - contract_size / digits / point / min_lot / lot_step / currency_profit / swap_rollover3days: the broker's terms.
#   `verify: true` = placeholders; lane L1 fills them from the symbol check (goldbot/ops/symbol_check.py) against the
#   terminal's symbol_info before any instrument is enabled. swap_rollover3days uses MT5 numbering (0 = Sunday).
#   Source of the non-gold terms: the terminals themselves, `python -m goldbot.ops.symbol_check icm-probe` and
#   `vantage-demo` run read-only on the brain on 2026-11-02 (it compares contract_size, digits, point, min_lot,
#   lot_step, currency_profit and swap_rollover3days). Every instrument it confirmed is `verify: false` (XAGUSD confirmed on the 11-02 21:30 UTC rerun, contract 1000).
#   stays `verify: true` (symbol_info failed: BridgeUnavailable) until a rerun passes. Sizing must not read these
#   terms (the RiskGate sizes from the terminal's own symbol_info and the broker's loss_per_lot); they key the
#   checks, the magic blocks and the research.
# - max_spread_points: the RiskGate's spread ceiling in points of `point` (XAUUSD 45 = $0.45, risk.max_spread_points).
#   Non-gold: about 3 x a typical raw-account spread from the brokers' public spread pages (FALLBACK), until the
#   recorded broker ticks measure it (nightly spread profile); lane L2's gate and L3's engine read it. When the
#   symbol check corrected a point, the ceiling kept its width in price (points x point): XNGUSD, UST10Y; Sugar and
#   Coffee also moved from cents to dollars per lb (contract x 100), so their ceiling is a hundredth in dollars;
#   Wheat and Soybean read as dollars per bushel (3 cents).
# - correlation_group: the group the RiskGate caps notional by (gold, metals, equity, fx, energy, rates, ags, crypto).
# - leverage_class: fx 30, gold_index 20, commodity 10, bond 5, crypto 2 (goldbot/instruments.py LEVERAGE_BY_CLASS).
# - session_profile: trading-hours family, checked against the broker's trading_sessions (lane L2).
# - news_currencies: news blackouts by these currencies; L2 adds EIA (crude, gas) and WASDE (grains) by group.
# - enabled: true only once the symbol check confirmed the terms (`verify: false`); never with `verify: true`
#   (tests/test_instruments.py). The accounts loader refuses non-XAUUSD instruments on a live or observe-only account
#   whatever this says, and the RiskGate refuses an entry whose minimum lot risks more than the cap.
# Corn is out: the brokers list dated contracts only, no continuous CFD.
#
# Owner decision 2026-11-04: trade ONLY these 25 (owner name = key here): EURUSD GBPUSD USDJPY GBPJPY XAUUSD XAGUSD
# USOIL=XTIUSD US30 NAS100=USTEC UK100 GER40=DE40 EURGBP EURJPY AUDJPY AUDUSD NZDUSD USDCAD USDCHF EURAUD GBPAUD BTCUSD
# XAUEUR XAUJPY USINDEX US500 (tests/test_owner_instrument_list.py). REMOVED, `enabled: false`, entries and magic
# blocks KEPT (open positions are reconciled by block; a block is never renumbered or reused): XPTUSD XAUAUD JP225
# XBRUSD XNGUSD UST10Y BUND10Y COPPER WHEAT SOYBEAN SUGAR COFFEE. No account lists them; a position still open in
# one's range gets a wind-down book (entries refused, exits run; goldbot/ops/services/engine.py wind_down_books).
# The 10 added ones (blocks 27-36) were read from both terminals on 2026-11-04 by a read-only symbols_get/symbol_info
# query on the brain (the symbol check's own calls); their terms below are the terminals' own. One broker per
# instrument (tests/test_instrument_accounts.py: one set of terms): all 10 trade on vantage-demo, so icm-probe's box
# (no CPU for 20 books, incident 2026-11-02) drops to 15. ICM lists 9 of them with the same terms (GBPJPY EURGBP
# EURJPY AUDJPY EURAUD GBPAUD BTCUSD XAUJPY US30, no suffix) if one is ever moved there.
# USINDEX: ICM lists only a dated DXY future (DXY_Z6, min 1 lot), so it is Vantage's continuous USDX alone. BTCUSD:
# ICM reports no triple-swap day, Vantage 5; crypto trades 7 days at both brokers but the `fx` profile keeps its
# entries to the weekdays (it only narrows). max_spread_points of the new ones: FALLBACK, about 3 x a typical raw
# spread (crosses 0.4-1.1 pips, XAUJPY as XAUEUR's EUR 1.50 in yen, BTCUSD ~$20, US30 ~2 pts, USDX ~0.05), until the
# nightly spread profile measures them.
instruments:

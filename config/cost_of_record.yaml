# The cost of record (docs/research/cost-of-record-2026-10-31.md): what one 0.01-lot market round trip costs per oz on
# each broker's demo, by session, from the week's own fills. Every research screen reads it through
# goldbot.research.arms.load_costs (arm_costs.yaml `cost_of_record`). USD per oz (= per 0.01 lot); adverse positive.
# round_trip = spread + max(0, entry slip) + max(0, exit slip) + commission, each a pooled mean (floored after pooling,
# never per day: demo slippage only raises costs, and a per-cell floor charges noise). ci90 = 5th-95th percentile of
# an i.i.d. bootstrap of the fills (4000 resamples, seed 20261031). Overshoot = past the server stop on stop exits, a
# separate charge on those exits only. Aggregates only: no trade row, account or host.

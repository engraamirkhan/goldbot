id: G14
requirement: 'Contingent trial slots and withdrawal (ADR 0007 + amendment 2026-10-11): the reservation is a priority device; a slot pre-registered before its quarter holds a trial only while its derivation rule can still be met (survivor: parent reads continue under its rule and >= k pre-registered clusters pass; follow-up: parent read continue, by the evaluator for a rule-only parent) and covers only its derived config, never a retired family; a withdrawn pre-registration frees its trial; reserved = max(setting - run - withdrawn - expired slots, pending, 0), setting per quarter; E-5 cap on the open budget for 2027Q1; group-unit discovery forwards whole groups while they fit (Q-3)'
status: implemented
code: 'goldbot/research/registry.py `reserve_slot` (rule, survivor_pool, follow-up family/config_hashes/overrides), `preregister(slot_ref=, rule_ref=)`, `withdraw`, `record_verdict` (status `verdict`, not a trial, first final), `check_budget_reserved(retired=)`, `_stamp`, `row_ref`; goldbot/research/director.py `_Ledger` (`slot_state`, `reads_continue`, `verdict`), `slot_survivors`, `slot_refusal`, `slot_preregistration`, `rule_preregistration`, `reserved_trials`; goldbot/research/discovery.py `H02_CLUSTERS`, `column_groups(mode="cluster")`, `check_group_sizes`, `survivor_selection`, `group_members`, `group_map_hash`, `cluster_of`, `check_cluster_columns`, `group_permutation_importance` (size-neutral joint permutation group measure); goldbot/features/macro.py `macro_drivers` v3 `macro_vrp` (GVZ^2 - HAR-RV^2, point-in-time); director `preregistered_decisions`, `cited_rule`; goldbot/ops/jobs.py `make_trial_runner` and `monthly_research` (E-5 cap); goldbot/config.py `ResearchSettings.reserved_for`, `open_budget_capped`; config/settings.yaml research.reserved_trials_quarter {"2027Q1": 9}, research.open_budget_preregistered_only'
test: tests/test_trial_slots.py (all), tests/test_discovery.py::test_group_mode_forwards_whole_groups_in_stability_order_while_they_fit_and_records_the_rest, ::test_group_mode_refuses_a_group_over_max_selected_before_any_look_at_the_data, ::test_group_survivor_unit_needs_an_explicit_group_top_k, ::test_group_discovery_reports_the_feature_count_beside_each_survivor_group, ::test_cluster_grouping_maps_columns_to_the_preregistered_hypothesis_clusters_first_match_wins; tests/test_director.py::test_e5_cap_refuses_open_budget_analyst_trials_unless_a_preregistration_names_a_rule; tests/test_macro_vrp.py (all); tests/test_discovery.py::test_h02_clusters_follow_the_hypotheses_and_send_the_rest_to_their_family, ::test_cluster_mode_refuses_a_cluster_with_no_informative_column_before_any_look, ::test_group_permutation_importance_is_size_neutral_and_redundancy_safe, ::test_select_in_fold_ranks_groups_by_the_joint_permutation_measure; tests/test_director.py::test_manual_runs_in_an_e5_quarter_record_the_rule_they_cite; tests/test_trial_slots.py::test_an_unknown_screened_pass_continues_only_citing_its_preregistrations_reading_rule, ::test_preregister_accepts_only_known_rule_ids; tests/test_discovery.py::test_the_group_measure_rows_are_purged_one_week_from_the_subsample_and_averaged_over_repeats; tests/test_screen_pool.py::test_rule_only_net_split_reports_long_only_short_only_and_positive_net_years

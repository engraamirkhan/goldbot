status: implemented
code: 'goldbot/risk/sizing.py `account_fx` (USD account = 1, a broker figure off by > 1% refused; other currencies need the broker''s finite positive figure), `size_lots(acct_per_usd=)`; goldbot/risk/gate.py `check` calls sizing.py for the arithmetic, refuses `fx_conversion_unavailable`, notional x fx, open notional (USD) x fx, `GateDecision.risk_amount`; brokers: `loss_per_lot` on the protocol, MT5 `order_calc_profit` then `trade_tick_value_loss`/`trade_tick_value` per `trade_tick_size` (goldbot/execution/mt5_adapter.py), paper USD (factor 1), bridge allow-list read-only retry-safe, RemoteBroker; goldbot/engine/runner.py `_sizing_terms` (contract, volume min/step, volume max capped at the engine''s 2.0, stops level, currency, conversion; unreadable terminal = currency unknown = refused) into `Intent`, `_record_closed` R and return with the same conversion (R left empty when none exists; the exit and its record are never blocked)'

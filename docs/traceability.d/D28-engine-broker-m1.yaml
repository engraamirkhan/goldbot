id: D28
requirement: '"The engine''s completed 1m bars are the broker''s own M1 bars; the sampled bar is only the provisional current minute and the fallback of a late or missing broker bar (dq flag, same visible_at, never a look-ahead)" (BACKLOG follow-up "engine 1m close lag": 1-2% of signals differed, 83 reconcile closes a day off the broker''s)'
status: implemented
code: 'goldbot/engine/broker_bars.py: `poll` (after the pass''s exits; `get_bars(symbol, "1m", 16)` once each in-session minute closes, retried every 5 s for a late bar up to 10 min; a failed call is logged, never a tick error), finished-bar rule (fetched at or after visible_at and a later bar / a tick at or after the close / clock past close + 1.5 s), `rebuild` + `_merge` (broker bar joins; sampled fallback flagged `broker_bar_late`), `_replace` (`broker_bar_replaced`, store keeps the last copy, decisions untouched), `published` (engine state `broker_bars_1m`); goldbot/engine/history.py `rates_to_bars` (one conversion with the history fill); goldbot/engine/runner.py `EngineConfig.broker_bars` (on in production, goldbot/ops/services/engine.py; off for paper and replays)'
test: tests/test_engine_broker_bars.py::test_completed_minutes_are_the_brokers_m1_bars_not_the_sampled_ones, ::test_a_late_broker_bar_falls_back_to_the_sampled_bar_and_is_replaced_on_arrival, ::test_a_late_bar_replaced_after_a_decision_leaves_that_decision_as_journalled, ::test_a_restarted_engine_loads_the_replaced_broker_bars_and_rejoins_without_duplicates, ::test_in_the_us_eu_dst_gap_week_the_brokers_bars_land_on_their_utc_minutes, ::test_the_forming_bar_and_a_bar_from_a_terminal_clock_ahead_never_join_before_their_close, ::test_in_a_quiet_market_the_minute_is_fetched_once_the_clock_passes_its_close_plus_the_grace, ::test_a_failing_rates_call_keeps_the_sampled_minutes_and_never_blocks_entries, ::test_paper_and_replays_keep_the_sampled_bars_when_broker_bars_are_off

# Exploration arms of the historical matrix: the frozen ARM-SPEC 2026-10-25 (docs/research/arms-2026-10-25.md on
# research/high-volume-learning), one row per arm id. config_hash = sha256 of id, rule, timeframe, params, max_open
# (goldbot.research.arms.arm_hash): an edited arm fails to load; amend under a NEW id. status blocked: no history run
# until the note's condition is met. Regenerate hashes only for a new arm.
# twin_of: a broker twin (same rule body, own id and hash, no history run; goldbot.research.arms.load_arms).
# forward_only: no history run, live fills from a flat prior only (goldbot.research.arms.runnable_ids); not hashed.
# retired_day / retired_rule: retired from demo trading on every account under the named rule; not hashed, the row, id
# and K stay ("never reused", prereg-amendment-2026-10-30-kill-rules.md A2). The engine sends no new entry and keeps the
# arm configured so open positions keep every exit (goldbot.engine.exploration.spec_retired). Never removed or edited.
# Research-director ruling 2026-11-13 (docs/research/ruling-2026-11-13-gold-only.md): every non-gold row retired on
# 2026-11-14 (gold only on demo; accounts.yaml keeps them registered for their exits, backlog 187); no new 1m arm (a
# 1m row loads only with its id on arms.ONE_MINUTE_ALLOWED); A2 readability never retires a 1h+ arm from 2026-11-13.
# role / qualification (owner rule 2026-10-30, ADR 0061): a strategy arm (role omitted) sends a demo entry only with
# a passing qualification on its row: {screen: <doc path or registry:<config_hash>[@<evaluator commit>]>,
# screen_window: "2010-01-01..2017-12-31", confirm: <the same forms>, confirm_window: "2018-01-01..2025-09-30",
# verdict: pass, cost_basis: measured, cost_table: <cost table version>, cost_cells: {<session>:<order_type>: {n,
# mean_usd, prior_usd, charged_usd, from_prior: false}}} (goldbot.research.arms.qualification_refusal: every cell
# measured on >= 30 fills, charged at the worse of measured and prior). Exempt: role control (a random control:
# random_bracket or params.control) and role cost (F1A/G1A only, naming cost_read O-11/O-12; refused once the cost
# read's admissible fills are in, 200/100, with their paired controls). Not hashed. Without one the arm stays
# configured (open positions keep every exit) and sends no new entry: on 2026-10-30 no strategy family has qualified.
# role learning (ADR 0061 amendment 2026-11-02, the demo learning class; owner 2026-11-02: "fix the limits of our
# system to trade ... for the system to be not bound to test, learn and improve signals"): enters on demo unqualified
# inside its `learning` block {prereg: <doc>, k_id: <its own K row, research.arms.learning_k_id>, control: <a matched
# control row: same timeframe, stop, target, hold>, loss_cap_gbp, until: <at most 45 days away>} and no qualification
# block; retired by the engine at 300 admissible fills, its loss cap or its end (engine/exploration_learning.py). A
# control row dedicated to learning arms names them (params.control "learning:<ids>") and stops with them. Not hashed.
arms:

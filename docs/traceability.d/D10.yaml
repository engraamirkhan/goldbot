id: D10
requirement: '"Bar close is detected by clock (close time plus 1.5 s grace), not by tick arrival"'
status: implemented
code: 'goldbot/engine/runner.py:359 `_due_close`: the bar is finalised when the clock (wall clock in production) reaches close + `BAR_CLOSE_GRACE_S` (:60) with no new tick, or at once by a tick at or after the close (ticks are time-ordered); each close once (`_closed_through`); a tick older than a clock-finalised bar never revises it; it raises a rate-limited `late_tick` warning (:1218 `_late_tick`) counted as `late_ticks` in the engine state, and the broker-vs-wall clock skew is published as `clock_skew_s` (:1254, rolling median), warned by goldbot/ops/health.py:316 above the grace; blocking dq error (:1240 `_dq_blocking`) when |skew| > 10 s or late ticks on 3 consecutive bars'
test: tests/test_bar_close_clock.py::test_a_late_tick_raises_a_rate_limited_late_tick_warning_that_does_not_block_entries, tests/test_bar_close_clock.py::test_broker_vs_wall_clock_skew_is_measured_as_a_rolling_median_and_published, tests/test_health.py::test_engine_clock_skew_beyond_the_bar_close_grace_warns, tests/test_bar_close_clock.py::test_broker_clock_skew_beyond_ten_seconds_blocks_entries_as_a_dq_error, tests/test_bar_close_clock.py::test_late_ticks_on_three_consecutive_bars_block_entries_until_a_clean_bar, tests/test_bar_close_clock.py::test_a_pending_warning_and_error_together_block_and_only_the_error_is_a_dq_check, tests/test_bar_close_clock.py::test_quiet_market_bar_closes_by_clock_after_the_grace_with_no_new_tick, tests/test_bar_close_clock.py::test_a_bar_closed_by_clock_is_not_processed_again_by_the_next_tick, tests/test_bar_close_clock.py::test_a_bar_closed_by_its_next_tick_is_not_closed_again_by_the_clock, tests/test_bar_close_clock.py::test_a_tick_older_than_a_bar_the_clock_finalised_never_revises_it, tests/test_bar_close_clock.py::test_replay_tick_clock_never_decides_a_close_twice_with_clock_polls

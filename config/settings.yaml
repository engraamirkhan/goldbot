# Goldbot settings. Everything time-related is UTC unless the key says otherwise.
symbol: XAUUSD
data_root: data            # Parquet root; DuckDB views sit over it

# The three "days" (see design: Data architecture / Time and calendar)
# The two anchors below are fixed, not settings (BACKLOG 57): no code reads them, and Settings refuses any other value
# at load. Moving either day needs code (one shared day function) and a trading-safety review.
feature_day_anchor: { tz: America/New_York, time: "13:30" }   # COMEX settlement -> daily bars & features
risk_day_anchor:    { tz: UTC,              time: "00:00" }   # loss caps reset
# swap-day (the broker's server-midnight rollover) follows each broker's server_tz; the swap rates and triple day in
# `costs` are research priors until the broker's cost table reports its own.

timeframes:
  decision: [15m, 1h, 4h]   # 4h (proposal P4) is also a context timeframe of 15m/1h agents; 1d stays research-only
  context:  [4h, 1d, 1w]

brokers:
  icm:
    server_tz: Europe/Athens          # EET/EEST; resolved per bar, never a fixed offset
    symbol_map: { XAUUSD: XAUUSD }
    magic_base: 260100
    canonical_costs: true             # reference broker for backtest cost tables
  vantage:
    server_tz: Europe/Athens
    symbol_map: { XAUUSD: XAUUSD+ }   # confirmed from symbol_info at startup, this is only a hint
    magic_base: 260200
    canonical_costs: false
  # ADR 0062: the XAUUSD247 weekend lane's own broker key (vantage-247), so its weekend evidence, cost table and
  # learner weights never pool with vantage-demo's XAUUSD+ (evidence is keyed by broker). Same broker, other symbol
  vantage247:
    server_tz: Europe/Athens
    symbol_map: { XAUUSD247: XAUUSD247 }   # its own store symbol: never the weekday XAUUSD history
    magic_base: 260700
    canonical_costs: false

features:
  max_live_features: 40
  version: f1

labels:
  embargo_days: { 15m: 1, 1h: 2, 4h: 4 }
  purge_days:   { 15m: 2, 1h: 5, 4h: 10 }

walkforward:
  15m: { train_months: 24, test_months: 3, step_months: 3 }
  1h:  { train_months: 36, test_months: 6, step_months: 6 }
  4h:  { train_months: 48, test_months: 6, step_months: 6 }   # proposal P4; research.walkforward.WINDOWS["4h"]
  # no 1d: daily agents are research-only (the engine holds ~40 trading days of 1m bars, short of 120 daily bars)

risk:
  risk_per_trade: 0.005
  risk_per_trade_tiny_live: 0.001
  multiplier_bounds: [0.25, 1.5]
  daily_cap: 0.02
  weekly_cap: 0.05
  supervisor_daily_cap: 0.015
  supervisor_weekly_cap: 0.04
  drawdown_stage1: 0.08
  drawdown_stage2: 0.12
  drawdown_stage1_clear: 0.05
  max_positions_per_account: 2
  max_spread_points: 45
  stale_tick_seconds: 20
  # Tier-1 news blackout (design): entries refused -15/+30 min around CPI, NFP, FOMC, PCE.
  # Tier 2 (BACKLOG 18, playbook G-3): entries refused `tier2_blackout` from before_min before to after_min after a
  # tier-2 USD event (PPI, retail sales, ISM, GDP, JOLTS, claims, FOMC minutes, Fed chair; any other high-impact USD
  # event) in the live calendar (the archived Forex Factory feed). Enabled with no calendar archived around now,
  # entries are refused `calendar_unavailable` (fail closed). Entries only. OFF until the owner adopts it.
  blackout:
    before_min: 15
    after_min: 30
    events: [CPI, NFP, FOMC, PCE]
    tier2: { enabled: false, before_min: 5, after_min: 15 }
  min_target_over_cost: 2.5
  approval_window_seconds: 90
  # Minimum-lot exception (BACKLOG 25, ADR 0004): null = off (the design's 1.2x rule only). Settings are global, not
  # per account, so it stays off here; to enable it on one server (the £1,000 demo needs it to trade 15m at 0.01 lot,
  # 0.82%), put `risk: { min_lot_risk_cap: 0.01 }` in that server's config/settings.local.yaml (not in the repo).
  # Maximum 0.01 (the per-trade hard limit); halved in the 8% size-down stage; never applied in tiny-live.
  # The absolute daily loss limit (ADR 0004, the owner's £50) is per account, in that account's currency:
  # `daily_loss_limit_abs` in config/accounts.yaml. ADR 0032: a demo account's own ceilings (`risk_overrides` in
  # config/accounts.yaml) can raise this, the daily and the weekly cap for that account alone; these values stay the
  # floor, and the defaults for every other account.
  min_lot_risk_cap: null
  # ADR 0031: on a demo account with the owner's ceilings (`risk_overrides` in config/accounts.yaml) the daily, weekly
  # and minimum-lot caps (and the supervisor's combined caps) are learnt by the nightly `limits_job` from the account's
  # own demo trades, between the defaults above (floors) and those ceilings; they rise only at the 00:00 UTC roll and
  # tighten at once. false: that account trades the ceilings themselves (ADR 0032). Other accounts: the defaults.
  adaptive_limits: true
  positions_unreadable_alert: 5      # failed broker reads in a row before health fails and Telegram alerts
  # Per-agent throttle (BACKLOG 21, playbook G-6), counted per agent per account and checked at every entry
  # decision: after `loss_streak` consecutive full losses (R <= -0.9) RiskGate refuses the agent's entries
  # (`throttle_loss_streak`) until `cooldown_bars` bars of its timeframe have passed since the last loss, or a real
  # shadow win (target hit or >= 0.25R) of its live model entered after that loss closes. The count persists past the
  # cooldown (one more full loss re-blocks) until such a win. Past `max_entries_per_day_per_agent` entries in the risk
  # day (00:00 UTC) it refuses `throttle_entry_rate`. Entries only: exits are never gated. OFF until the owner sets the
  # thresholds (these are the playbook's proposal, not decisions).
  throttle: { enabled: false, loss_streak: 3, cooldown_bars: 4, max_entries_per_day_per_agent: 3 }
  # Open-risk heat cap (BACKLOG 19, playbook G-4), per account, checked at every entry: RiskGate refuses `heat_cap` when
  # the open positions' remaining stop risk (each: loss from the current price to its SL x lots x contract x fx, in the
  # account currency) plus this trade's stop risk exceeds `max_open_risk` x equity, and `same_direction_cap` once
  # `max_same_direction` positions on the entry's side are open, whichever agent (or the owner) opened them. A position
  # without SL, or a conversion the broker cannot give, makes the open risk unknown: entries are refused
  # (`open_risk_unknown`). Entries only: exits are never gated. OFF until the owner sets the values.
  heat: { enabled: false, max_open_risk: 0.02, max_same_direction: 2 }
  # BACKLOG 35: when the account has an absolute daily loss limit (`daily_loss_limit_abs` in config/accounts.yaml), the
  # projection becomes loss so far + open positions' remaining stop risk + this trade's stop risk, so two open trades
  # cannot carry the day past the limit (refused `daily_loss_limit_abs`; unknown open risk `open_risk_unknown`).
  # Entries only. OFF until the owner adopts it.
  project_open_risk: false
  # Equity confirmation before the 12% kill switch (BACKLOG 44, ADR 0016): a read at 12% drawdown closes everything at
  # once when the balance plus the open P&L agrees with the equity within this fraction of the high-water mark (2% =
  # £20 on £1,000: room for swap, which the open P&L does not carry). A read that disagrees (a zero or collapsed equity
  # from the terminal) refuses entries and is re-read on the next tick. It stays pending until every read has been
  # below 12% minus the tolerance (10%) for equity_recovery_s seconds; any 12% read while pending trips.
  equity_check_tolerance: 0.02
  equity_recovery_s: 60
  # High-water-mark rise confirmation (BACKLOG 54, ADR 0018): a balance read above balance_closed_hwm raises it only
  # when the deal history since the mark was set explains it (closed deals, swap, commission, deposits) within this
  # fraction of the mark (0.1% = £1 on £1,000: rounding, not money), or when the next read agrees with it within the
  # same fraction. One inflated balance read never raises the mark (no phantom size-down or kill switch after it).
  hwm_rise_tolerance: 0.001
  # Reopen window (BACKLOG 17, playbook G-2): entries refused `reopen_window` for after_daily_reopen_min minutes after
  # each daily reopen and after_monday_open_min after the weekly open (or any reopen after a closure of 12 h or more),
  # read from the broker session table (DST follows the server clock). Entries only. OFF until the owner adopts it.
  reopen: { enabled: false, after_daily_reopen_min: 10, after_monday_open_min: 30 }
  # Holiday window (BACKLOG 17): entries refused `holiday_thin` on the thin-liquidity days of the versioned list in
  # `file` (US federal holidays as a proxy, not measured; Good Friday, Easter Monday, day after Thanksgiving,
  # 24/26/31 Dec, 1/2 Jan), by broker server date (= the CME trading day). A missing or expired list refuses entries
  # `calendar_unavailable` (health warns 90 days ahead). Entries only. OFF until the owner adopts it.
  holidays: { enabled: false, file: config/holidays_cme_metals.yaml }

costs:
  slippage_prior_usd: 0.15           # per oz, used until 50 real fills exist
  commission_per_lot_side_usd: { icm: 3.5, vantage: 3.0 }
  # Swap, USD per lot (100 oz) per night, negative = paid. Prior; replace with the broker cost table. Long -60 is the
  # 2024-25 retail level at ~5% USD rates (~9-11% a year at $2,000-2,500 gold), so it overcharges the low-rate
  # 2010-2021 years (conservative). Short 0: the positive short swap of 2023-25 was negative before the 2022 hikes,
  # so no credit is assumed. Triple swap on Wednesday's rollover (0 = Monday). The engine also charges it to the
  # RiskGate's absolute daily projection for a rollover before 00:00 UTC, until the cost table measures (BACKLOG 36).
  swap_long_usd_per_lot: -60.0
  swap_short_usd_per_lot: 0.0
  swap_triple_weekday: 2
  # After nightly_costs, publish the canonical broker's measured table (costs only: no account id, login, balance or
  # equity) as costs_measured.json on release costs-v1, which research.yml downloads. Needs the github-token in the
  # keyring; refused while swap or the spread is unmeasured. Below 50 fills a slippage cell is published as the prior
  # and labelled so (fields.slippage: prior or mixed; K3). Turn on once the demo terminal runs.
  publish_release: false
  # Recorded broker-tick days (tick_record, state/ticks/) in the 30-day cost window before nightly_costs builds the
  # spread profile (median and p90 by UTC hour and session, aggregates only; reported, not charged). 10 trading days
  # with all three sessions: docs/research/costs-binding-2026-10-18.md section 1.4 step 4.
  spread_profile_min_days: 10

# Research scheduler (VPS service `goldbot-scheduler`). Times are UTC; gold's daily break is 21:00-22:00 UTC in
# summer and 22:00-23:00 in winter, so the nightly job sits after both. Weekdays 0=Mon .. 6=Sun.
scheduler:
  nightly_costs:    { kind: daily,   at: "23:10", weekdays: [0, 1, 2, 3, 4], max_late_hours: 8 }
  saturday_retrain: { kind: weekly,  at: "06:00", weekday: 5, max_late_hours: 30 }
  tournament:       { kind: weekly,  at: "12:00", weekday: 5, max_late_hours: 30 }   # population round after the retrain
  research_director: { kind: weekly, at: "12:30", weekday: 5, max_late_hours: 30 }   # research plan before agents_weekly
  model_watch:      { kind: daily,   at: "23:30", max_late_hours: 20 }                  # CUSUM on new champions
  agents_daily:     { kind: daily,   at: "23:45", weekdays: [0, 1, 2, 3, 4], max_late_hours: 8 }   # data steward, risk officer
  agents_weekly:    { kind: weekly,  at: "13:00", weekday: 5, max_late_hours: 30 }     # journal coach, improvement agent
  monthly_research: { kind: monthly, at: "08:00", weekday: 6, max_late_hours: 30 }   # first Sunday of the month
  calendar_archive: { kind: daily,   at: "06:10", max_late_hours: 20 }                  # Forex Factory week -> calendar_events
  calendar_archive_sunday: { kind: weekly, at: "18:00", weekday: 6, max_late_hours: 3 }  # the new week before the Sunday open
  agents_presession: { kind: daily,  at: "06:30", weekdays: [0, 1, 2, 3, 4], max_late_hours: 1 }   # macro/news briefing before London
  recalibrate:      { kind: weekly,  at: "11:30", weekday: 5, max_late_hours: 30 }   # P9: bounded calibrator refit after the retrain
  drift_watch:      { kind: daily,   at: "23:40", max_late_hours: 20 }                  # PSI, calibration, CUSUM halts (M26/M27)
  gap_watch:        { kind: daily,   at: "23:55", max_late_hours: 20 }                  # gaps -> shadow founders / on-demand staff runs
  backup:           { kind: daily,   at: "22:15", max_late_hours: 20 }                  # restic -> Oracle Object Storage (ops/backup.py)
  restore_drill:    { kind: weekly,  at: "10:00", weekday: 6, max_late_hours: 30 }      # Sunday: restore latest to a temp dir and verify
  cpcv_quarterly:   { kind: monthly, at: "14:00", weekday: 6, months: [1, 4, 7, 10], max_late_hours: 30 }   # M16: CPCV + PBO of gate-passing trials, first Sunday of each quarter
  attribution:      { kind: daily,   at: "23:50", max_late_hours: 20 }                  # R by family/session/regime/cost -> state/attribution.json

  feed_reconcile:   { kind: daily,   at: "23:20", weekdays: [0, 1, 2, 3, 4], max_late_hours: 8 }   # D12: engine bars vs broker M1, last day
  tv_reconcile:     { kind: daily,   at: "23:15", max_late_hours: 20 }                  # TradingView bars (OANDA, second feed) vs Dukascopy/broker M1: >2 points -> dq + NaN plots
  broker_ledger:    { kind: daily,   at: "23:25", max_late_hours: 20 }                  # GAP-07/08: balance snapshot, positions + balance vs broker
  tick_record:      { kind: daily,   at: "21:10", max_late_hours: 0.5 }                 # BACKLOG 79: broker ticks -> state/ticks/, in the daily break (US summer time)
  tick_record_winter: { kind: daily, at: "22:10", max_late_hours: 0.5 }                 #   ... and in the winter break; outside the break or weekend a run skips
  limits_job:       { kind: daily,   at: "23:05", max_late_hours: 0.9 }                 # ADR 0031: adaptive limits for the next risk day; never after the roll
  daily_review:     { kind: daily,   at: "06:15", max_late_hours: 12 }                  # learning-ops review after the nightly learner, before the 06:45 owner report
  autodisc_nightly: { kind: daily,   at: "01:30", max_late_hours: 6 }                   # ADR 0058 phase 2 discovery search; skips unless research.autodisc.nightly_enabled

agents:
  monthly_cap_usd: 40.0              # total spend of all staff agents per calendar month (design: capped)
  model: claude-opus-5-5

news:                                # headline collector (VPS service goldbot-news); URLs unverified from the sandbox
  feeds:
    forexlive: https://www.forexlive.com/feed/news
    fxstreet: https://www.fxstreet.com/rss/news
    fed_press: https://www.federalreserve.gov/feeds/press_all.xml
    bls: https://www.bls.gov/feed/bls_latest.rss
  poll_seconds: 300
  model: claude-opus-5-5
  daily_cap_usd: 0.50                # scoring spend per UTC day, counted in agents.monthly_cap_usd
  shock_blackout_min: 30             # entries blocked after a high-relevance unscheduled shock (design)
  shock_min_relevance: 0.7

research:
  trial_budget_per_month: 12         # bounded loop: trials per specialist per month (feeds the deflated Sharpe)
  label_grid_paused: true            # monthly label-grid loop off until a family passes the primary-signal screen
  trial_budget_quarter: 20           # pre-registered trials per calendar quarter across all families (P2); raising it is an owner decision
  trial_budget_overrides: {"2026Q4": 147}   # 145 -> 147 (PD + PO 2026-10-30, under the owner's 10-18 "backtest as much as needed" and 10-30 "speed up" directives): +1 H-80 R2 exit confirmation on 2018-2025-09 (research-plan 2026-10-30 bet 2a), +1 TVA-BC TradingView author-ideas back-catalogue screen (prereg-2026-10-28-tv-author-ideas.md section 5), one registry row each before its first score; owner directive 2026-10-18: backtest as much as needed; batch-2026-10-18.md. +2 (53->55) for H-48 + H-49 stage 2: RD ruling 2026-10-18 (prereg-kb-2026-10-18.md), owner approved 2026-10-18. +11 (55->66) for the Vantage twin arms (prereg amendment 2), under the same owner directive and the 2026-10-26 "all three accounts learn"; reported to the owner 2026-10-26; 66 -> 69: Q4 already held 58 (H-60 reruns and corrections count +1 each, conservative), so the honest total is 69; 69 -> 74 (PD + PO 2026-10-26, under the owner's 2026-10-18 "backtest as much as needed" and 2026-10-25 no-quarterly-wait directives, Vantage precedent): the 5 time-structure arms F1A/F1C/G1A/G1C/WFRI (prereg-2026-10-26-time-structure.md), one registry row each before its first fill, K +5, fills never evidence, owner told on #34 the same day; 74 -> 93 -> 106 (PD + PO 2026-10-26, owner directives "tripple the numbers" and "30 different strategies" (arms-expansion-2026-10-26.md directives 1 and 5), quant approved with conditions): wave 1 (19 arm ids, arms-expansion section 3) and wave 2 (13 ids, arms-2026-10-25.md section 8), one registry row each before its first fill, K counted by the precedent arm-id rule (K about 358), fills never promotion evidence; 106 -> 118 (quant C6, 2026-10-26): the 12 H-80 box-family ids BXR/BXT/BXF x 15m/30m/1h/4h are counted too; 118 -> 145 (PD 2026-10-27, H-81 scalp-volume prereg, owner directives 10-18 "backtest as much as needed", 10-26 "tripple the numbers", 10-27 "500 plus overall, 200 per account"): 27 scalp-volume ids, one registry row each before its first fill, fills never promotion evidence
  loop_trials_per_run: 16            # continuous research loop (owner 2026-10-18): trials per scheduled batch, separate from the
                                     #   quarterly budget; every one is a registry row and the deflated Sharpe counts the full K. 0 = off
                                     #   (ADR 0029; a loop trial cites rule_ref=loop, the quarterly count skips it, K counts it)
  reserved_trials_quarter:           # held for each quarter's pre-registered queue; a quarter not listed holds none
    "2027Q1": 8                      #   preregistration-2027Q1.md: 4 queued rows + 4 contingent H-02 survivor slots (ADR
                                     #   0007; H-06 withdrawn by its rule 2026-10-16, run 38931951849). The director,
                                     #   the label grid and the analyst spend only 20 - used - reserved,
                                     #   reserved = max(this - run - withdrawn - expired slots, pending, 0). A
                                     #   trial run against a queued row, or using a live slot by its derivation rule, uses
                                     #   one up; a withdrawn row or a slot whose condition can no longer be met frees one
  open_budget_preregistered_only:    # E-5 cap: in these quarters the analyst spends the open budget only on an ad-hoc
    - "2027Q1"                       #   pre-registration naming a pre-registered rule (rule_ref), plus the retired
                                     #   families' one shared exploration trial; the label grid spends none (research-plan
                                     #   section 5: no further fast-tsmom horizons, R-06)
  retired_families:                  # mirrors docs/research/hypotheses.md section B (a test checks they agree). The retired
                                     #   families SHARE 1 exploration trial a quarter (best post-retirement evidence, else a
                                     #   rotation) and each is reinstated only by out-of-sample attribution after its
                                     #   retirement date (research/director.py)
    - { family: mean_reversion, hypothesis_id: R-01, retired: 2026-10-10, trials: [3, 5, 10, 12],
        reason: "no gross edge; no cost-surviving evidence for short-horizon reversion in gold" }
    - { family: session_open, hypothesis_id: R-02, retired: 2026-10-10, trials: [1, 7, 11, 13],
        reason: "gross +0.042 R, t 1.31 on 1,498 events, fails P4; about 90 events a year" }
    - { family: trend, hypothesis_id: R-03, retired: 2026-10-10, trials: [2, 4, 9, 14],
        reason: "no gross edge; small-tick contracts lost short-term trend after 2009" }
    - { family: breakout, hypothesis_id: R-04, retired: 2026-10-10, trials: [6, 8, 15],
        reason: "gross +0.015 R, t 0.38; same reason as trend" }
    - { family: intraday_momentum, hypothesis_id: R-05, retired: 2026-10-10, trials: [18, 19],
        reason: "NY -0.006 R, London -0.028 R gross; mechanism absent in spot XAUUSD" }
    # H-48 / H-50 STOP by their pre-registered rules (evaluator 2026-10-19; prereg-2026-10-19-h50-followup.md). The
    #   roster agents keep shadow-trading on demo as parity/cost monitors (owner directive: the owner's box strategy
    #   keeps running for learning) with no promotion route; retirement here governs research allocation only
    - { family: sweep_absorb, hypothesis_id: R-14, retired: 2026-10-19, trials: [88],
        reason: "H-48 STOP: gross -0.028 R, t -1.17 on 3,210; net -0.552 R; no net-positive year" }
    - { family: box_break_close, hypothesis_id: R-15, retired: 2026-10-19, trials: [89],
        reason: "H-50 STOP (15m frozen rule): gross +0.030 R, t 1.61 on 5,684; net -0.297 R; no net-positive year" }
  holdout_from: 2025-10-01           # held-out year: research never sees it; a passing config is scored on it once
  holdout_to: 2026-09-30             #   (scripts/research_pass.py --score-holdout), inclusive
  screen_min_events: 1000            # primary-signal screen (P4): events a rule needs; any screen with fewer events
                                     #   (whatever its sign or t) is "inconclusive (event floor)" and cannot retire the
                                     #   hypothesis. Changing it is an owner decision
  screen_min_events_daily: 150       # rules whose signal is on daily bars (owner ruling A, 2026-10-11: 150,
                                     #   retire-only: below it "inconclusive"; at or above it a screen can fail and
                                     #   retire, but a pass still needs screen_min_events (between the two a good edge
                                     #   reads "inconclusive", never "pass"; screen.screen_floors); promotion still
                                     #   needs research/gates.py, >= 1,500 candidates;
                                     #   docs/research/preregistration-2027Q1.md); null = screen_min_events
  director_floor: 2                  # research director: every unblocked family gets at least this many of the
                                     # month's trials; the rest of (budget x families) follows evidence of signal
  label_grid_step: 0.25              # +-25% on target/stop/max_bars
  cost_window_days: 30               # ticks used for the nightly spread table
  north_star_daily_gbp: 50           # ADR 0004 north-star (GBP a day on opportunity days): the Research summary's
                                     #   question (backlog 97); shown only, never a gate or a trading input
  fills_window_days: 180             # fills used for the slippage table
  min_fills_for_slippage: 50         # below this a session keeps the slippage prior
  recal_min_samples: 50              # weekly recalibration (P9): no update below this many recent shadow outcomes
  recal_prior_trades: 200            #   the validated calibration counts as this many trades (prior weight)
  recal_max_shift: 0.05              #   a probability is at most this far from the validated calibrator
  recal_window_days: 182             #   outcomes (every candidate, taken or not) exited within this window
  lot_fit_equity: 1000               # H-27 lot-fit overlay (research/lot_fit.py, opt-in, reporting only): the account the
  lot_fit_acct_per_usd: 0.75         #   research sizes trades for, in its currency; GBP per USD (GBPUSD ~1.33), a research
                                     #   assumption (the engine reads the broker's figure). Trades the gate would refuse
                                     #   min_lot_exceeds_risk are `unfit` and earn nothing in the overlay
  lot_fit_spread_points: 20          #   the gate floors every stop at stops level + spread: a spread prior (points of 0.01
  lot_fit_stops_level_points: 0      #   USD; the typical London/NY spread) and the broker's stops level (0 at IC Markets)
  registry: state/research_registry.jsonl
  models_dir: models
  autodisc:                          # ADR 0058 phase 2: nightly bounded G2 search on the explore window (2010-2017) only;
                                     #   honesty set (G0 null, RC/SPA, PBO, DSR, circular shift, plateau) ->
                                     #   state/autodisc/survivors-<day>.md. Creates no arm and touches no engine (phase 4)
    nightly_enabled: false           # the owner's Mac only (the local 1m bars live there); the brain never searches
    raw_dir: null                    # 1m bars dir; null: GOLDBOT_RAW_BARS or the repo's raw/ (never committed)
    timeframe: 1h                    # 15m / 1h / 4h decision bars
    population: 32                   # G2 population and generations: at most population x (generations + 1) specs a run,
    generations: 8                   #   every one ledgered (state/discovery_real.db) and counted in K
    null_reps: 20                    # G0 reruns of the whole search on random sides; survivors beat their 95th percentile
    max_candidates: 20               # best candidates whose grid neighbours (plateau, counted in K) and shift null are run
    seed: 0                          # base seed; each night adds its day number, so nights search new ground
    cost_table: null                 # measured cost table JSON (costs_measured.json); null: the settings priors

drift:                               # design: Drift and health (goldbot/research/drift.py)
  psi_warn: 0.1                      # PSI on a top-10 feature that warns
  psi_size_down: 0.25                #   ... that sizes the agent down to size_down_factor
  top_features: 10                   # by gain importance until per-decision TreeSHAP is stored
  ece_size_down: 0.08                # ECE on the trailing calib_trades taken shadow trades that sizes down
  calib_trades: 100
  min_calib_trades: 30
  size_down_factor: 0.5
  window_days: 30                    # recent candidates compared with the training distribution
  min_rows: 50
  cusum_k: 0.5                       # residual CUSUM allowance (sd); h is simulated for this k (research/cusum.py, M25)
  cusum_false_alarm: 0.05            #   design: at most 5% chance of a false alarm within a quarter (two-point trade residuals at the mean p)
  cusum_h: 4.0                       #   fallback h only when the backtest has no trade rate
  dd_mult: 1.5                       # an agent's 30-day drawdown above 1.5x backtest halts the system pending review
  dd_window_days: 30

# Dashboard owner (goldbot/api/auth.py). The repo is public: NEVER put a real address here. On the server, put
#   auth: {owner_email: <your email>}
# in the git-ignored config/settings.local.yaml before the dashboard's first run. Unset, the owner account cannot be
# created; the owner role belongs only to this address.
# auth:
#   owner_email: owner@example.com
#
# Owner-only "email me a sign-in link" (goldbot/api/mailer.py; docs/OWNER_GUIDE.md "Email sign-in link"). Off unless
# enabled; the link still needs the authenticator code. Set the real values in settings.local.yaml only:
#   auth:
#     mail:
#       enabled: true
#       host: smtp.gmail.com           # plain SMTP + STARTTLS
#       port: 587
#       from_address: you@example.com  # the Gmail account the App Password belongs to
#       username: null                 # SMTP login; null means from_address
#       dashboard_origin: https://dash.example.com   # https only: the link is <origin>/#signin=<token>
#       timeout_s: 10                  # connect + each SMTP command
# The SMTP password (a Google App Password) is never a setting: `python -m goldbot.ops.accounts set smtp-password`
# stores it in the OS keyring.
# The same mail setup also offers the owner "email me a code" (password + a 6-digit emailed code, ADR 0028; RUNBOOK
# 2.10 "Email sign-in code"). Its HMAC key is the keyring entry `email-code-hmac-key`, created on first use; there is
# no setting for it, and `enabled: false` turns codes off together with the link.
#
# Where that sign-in code is delivered (ADR 0028 as amended 2026-10-17; RUNBOOK 2.10). Default `telegram`: the API sends
# it to your private chat with the bot, so no mail setup is needed. Store your chat id (it must also be in
# telegram.allowed_user_ids above) with `python -m goldbot.ops.accounts set telegram-owner-chat-id`. `mail` sends it with
# the SMTP setup above instead.
#   auth:
#     code_channel: telegram           # telegram | mail

gates:                               # design: Roadmap gates and stop rule (goldbot/ops/gates_phase.py; `run.py gates`)
  # The design wants these "committed in writing before the first paper trade". Uncommented values are the design's
  # own numbers; every PROPOSED line needs the owner's sign-off. Evaluating a gate never records it or unlocks live.
  shuffle_auc_tolerance: 0.02        # PROPOSED: owner sign-off required. Leakage audit "shuffle test at chance": |AUC-0.5| <= this
  feed_max_mismatch_share: 0.01      # PROPOSED: owner sign-off required. "broker and Dukascopy bars agree": share of bars that differ
  backtest_min_dsr: 0.95             # PROPOSED: owner sign-off required. Roadmap figure says DSR >= 1.0, Validation says 0.95; DSR is a probability, 1.0 is unreachable
  backtest_min_trades: 500           # ">= 500 backtest trades" (model-filtered, best evaluated trial)
  paper_min_trades: 150              # ">= 150 paper trades" (closed demo-account trades since backtest_to_paper)
  paper_min_days: 182                # PROPOSED: owner sign-off required. Roadmap Phase 2 duration "6 months" as a minimum
  paper_expectancy_within: 0.5       # "expectancy within 50% of backtest" (no more than 50% below)
  paper_fills_within: 0.3            # "fills within 30% of target": measured slippage <= 1.3x the modelled slippage
  live_min_trades: 300               # ">= 300 live trades"
  live_min_days: 365                 # PROPOSED: owner sign-off required. Roadmap Phase 3 duration "12 months" as a minimum
  live_expectancy_within: 0.4        # "expectancy within 40% of paper"
  live_dd_mult: 1.5                  # "drawdown under 1.5x backtest"
  brokers_within: 0.15               # "brokers within 15%": the two brokers' live expectancy
  broker_min_trades: 50              # PROPOSED: owner sign-off required. Live trades per broker before they are compared
  stop_after_months: 18              # stop rule: "after 18 months of paper plus live"
  stop_min_pooled_trades: 500        #   "the pooled trade count exceeds 500"
  stop_confidence: 0.90              #   "the lower 90% confidence bound on expectancy is still below zero" (one-sided)
  # OWNER DECISION, off until set (recommended 0.05). Every gross trade (commission or swap unknown) already pays a
  # conservative imputed cost in the expectancy, drawdown and stop-rule figures; this also fails the paper and live
  # gates while more than this share of their trades is gross. null = the share is shown for context only.
  max_gross_share: null
  # The PROPOSED thresholds above the owner has signed off, by name (e.g. [paper_min_days, live_min_days]). Records the
  # owner's decision only: the dashboard's Progress tab shows every other PROPOSED threshold as "proposed".
  signed_off: []

gaps:                                # bounded spawning (goldbot/ops/gap_watch.py, TRADER_LIFECYCLE section 3)
  founders_per_month: 2              # zero-capital SHADOW founders a month (into 4 reserved slots inside the 24 shadow cap)
  staff_runs_per_week: 3             # on-demand runs of existing read-only roles, inside agents.monthly_cap_usd
  hypotheses_per_run: 2              # regime / dead-family gaps filed as hypotheses for the research gates
  dq_window_days: 7                  # repeated data-quality errors: error events on at least
  dq_min_error_days: 3               #   this many distinct UTC days within the window
  regime_window_days: 20             # recent realised volatility = mean of the last 20 daily values
  regime_history_days: 3650          # volatility terciles cut from up to ten years of 1h bars

telegram:                            # owner user ids go in config/settings.local.yaml (per server), never here
  digest_at: "06:45"                 # morning learning report at this UTC time, before London; Sundays the weekly digest (goldbot/telegram/digest.py, weekly_digest.py)
  deadman_every_min: 2               # outside dead man's switch: healthy ping period (goldbot/ops/deadman.py); = the check's period

attribution:                         # daily deterministic attribution (goldbot/research/attribution.py, BACKLOG 12); reporting only
  window_days: 180                   # closed shadow trades exited in the last 180 days
  min_trades: 30                     # cells with fewer trades are marked "noise" and are not evidence
  calibration_bins: 10               # equal-width bins of p for predicted-vs-realised
  calibration_min_bin: 10            # bins with fewer candidates are marked noise
  trade_rows: 300                    # most recent per-trade cost rows kept in state/attribution.json

ledger:                              # broker ledger (goldbot/ops/ledger.py; finance audit GAP-07/08, RC-8/RC-9); read-only
  balance_tolerance: 0.05            # account currency a day: a balance change its deals do not explain beyond this FAILs
  balance_tolerance_per_deal: 0.01   #   ... plus this per deal in the day (RC-9: 0.01 per trade)
  price_tolerance: 0.01              # $/oz: closed record vs broker entry/exit price; further is a mismatch (WARN)
  pnl_tolerance: 0.01                # account currency per trade: closed record vs the broker's deals (WARN)
  close_grace_minutes: 15            # a broker close this recent may not be recorded yet: not reported missing
  max_age_hours: 48                  # health warns when the last ledger report is older

ticks:                               # broker tick record (goldbot/data/ticks.py, BACKLOG 79; H-A holiday diagnostic); research only
  retain_days: 240                   # server days kept in state/ticks/<account>/ (H-A reads Nov 2026 days in May 2027)
  min_london_ny_ticks: 1000          # health ticks:<account> WARNs when the latest trading day has fewer (classifier's bar)
  backfill_days: 7                   # closed server days before the latest that each run re-checks and pulls if missing
  max_days_per_run: 3                # oldest missing day first, within run_budget_s; one a run never caught up
  page_ticks: 2000                   # rows per copy_ticks call: the bridge serves one request at a time
  pause_s: 0.2                       # pause between pages so the engine's quote reads get the bridge
  page_limit_s: 5.0                  # a slower page stops the run (cold history page 2-5 s; orders > 10 s refused)
  run_budget_s: 600                  # per account per run (3 accounts fit the 45-min break); unfinished day pulled next run

webhook:                             # TradingView receiver (goldbot/webhook/app.py)
  max_rows_per_hour: 5000            # inbox rows in the last hour; beyond it 429 (bounds what a leaked secret can write)

tv_pull:                             # TradingView direct pull (goldbot/data/tv_pull.py, ADR 0030): read-only, cookie in the keyring
  enabled: false                     # the owner turns it on in settings.local.yaml once both cookies are in the keyring (RUNBOOK 2.8)
  symbols: {"OANDA:XAUUSD": XAUUSD}  # chart symbol -> store symbol; layouts are read for indicators, only these are pulled
  timeframes: ["15", "60", "240", "1D"]
  sessionid_key: tradingview-sessionid            # keyring entry names only (browser cookies sessionid and
  sessionid_sign_key: tradingview-sessionid-sign  #   sessionid_sign); the values never appear in a file
  discover: true                     # read the saved layouts for their indicators (no owner naming or listing)
  discover_every_s: 21600            # layouts re-read every 6 h
  max_studies: 20                    # indicators pulled per pass at most
  min_interval_s: 5.0                # between any two requests (GET, series, history page, study)
  bars_per_request: 5000             # bars per series load and per history page (TradingView serves up to 5000)
  max_pages_per_tf: 5                # history pages per timeframe and pass (Premium measured: ~11k bars 15m, 1h, 4h)
  max_requests_per_day: 3000         # rolling 24 h; a pass beyond it is skipped, never queued
  study_warmup_bars: 300             # the oldest loaded bars' study values are dropped (an EMA needs its warm-up)
  poll_interval_s: 900               # `tv-pull follow`: one pass per 15m bar ...
  poll_offset_s: 60                  #   ... this long after the close
  live_max_lag_s: 1800               # a bar received within this of its close is pull_live (available_utc = received)
  history_latency_default_s: 960     # pull_history available_utc = close + p95 live latency; this until measured
  min_live_samples: 20               # live bars needed before the p95 is measured rather than the default
  backoff_base_s: 300                # after a failed pass: 5 min, doubling ...
  backoff_max_s: 21600               #   ... to 6 h; an expired cookie waits the full 6 h unless a new cookie is stored
  timeout_s: 30                      # per request
  aliases: {}                        # our display names: key_of(name | plot fingerprint) -> "Structure (smc)", "S/R channels",
                                     #   "Money flow (mfi)" (goldbot/data/tv_alias.py); unmatched -> "Indicator N"
  graphics_timeframes: ["15", "60", "240"]  # a study's boxes/lines/labels are saved per closed bar here (tv.db tv_graphics); [] = off
  graphics_max_objects: 500          # per snapshot (highest ids kept, flagged truncated)
  graphics_max_snapshots: 50000      # per study, symbol and timeframe; append-only, nothing added beyond it
tv_ideas:                            # followed TradingView authors' published ideas (goldbot/data/tv_ideas.py; owner 2026-10-28)
  enabled: true                      # public listing, no cookie; text stays in state/tv_ideas.db and raw/ (never the repo)
  authors: [KnightsofGold, Goldviewfx, ArmanShabanTrading]   # public handles
  poll_interval_s: 720               # a poll every 12 min plus up to poll_jitter_s (12-15 min apart)
  poll_jitter_s: 180
  live_page_size: 20                 # newest-activity page per author; a new or changed idea also reads its detail
  min_interval_s: 3.0                # between two requests (tv_pull's Pacer)
  backfill_min_interval_s: 2.0       # the one-time back catalogue (about 7,000 requests for the three authors)
  max_requests_per_day: 2000         # live, rolling 24 h (a normal day is about 400)
  backfill_max_requests: 12000       # per backfill run; it resumes where it stopped
  backfill_latency_s: 900            # back catalogue: available_utc = TradingView's time + this, flagged backfilled
  backoff_base_s: 300                # after a failed poll: doubling to backoff_max_s, never sooner than the interval
  backoff_max_s: 21600
  timeout_s: 30
  stale_hours: 2.0                   # health tv_ideas WARNs past this without a successful poll on a weekday
tv:                                  # TradingView values at decision time (goldbot/engine/tv_context.py, specialists/tv_event.py)
  max_lag_s: 60                      # a value counts only for the decision bar and when it arrived <= this after its close,
                                     #   else NaN and no TradingView entry (fails closed); equals features.tv_plots.MAX_LAG
  replica_series_start: "2016-01-01" # live replica state (smc/boxes/mfi) bootstraps from the store's bars from here
                                     #   (engine/replica_context.py; the brain's store holds 2016-2026)
  min_bar_match: 0.95                # share of our decision bars with a TradingView bar of the same open, else the TV
                                     #   trial is refused before it is charged (research/tv_grid.py: 4h/1d grids differ)
shadow:                              # shadow book (goldbot/engine/shadow.py; research director ruling 2026-10-19)
  max_open_per_agent: 3              # every signal its own shadow trade, up to 3 open per agent and version; beyond the
                                     #   cap a signal is counted "skipped: cap", never traded. Promotion's 40 counts
                                     #   independent clusters (one per agent per session day), not raw trades
mt5_login:                           # MT5 terminal login from the keyring (goldbot/ops/login.py; owner directive 2026-10-20: no VNC)
  attempts: 3                        # tries per login (goldbot-mt5 login, bridge start); timeouts only, never a refused password
  backoff_s: 20                      # wait after a failed login, doubling for each one in a row (20, 40, ...); kept across restarts
  backoff_max_s: 600                 # longest wait between logins
  max_attempts_per_hour: 6           # logins sent per account per hour, across bridge restarts (state/mt5-login/)
  heal_timeout_ms: 15000             # the bridge's self-heal mt5.login: under the watchdog's 20 s /health probe timeout
  heal_interval_s: 30                # how often the self-heal thread looks at the terminal
  dismiss_wizard: false              # Escape to the terminal's foreground window before initialize, for the "open an
                                     #   account" wizard; best effort, unverified on the box (RUNBOOK "Terminal down")
daily_review:                        # daily learning-ops review (goldbot/research/daily_review.py; research-director spec 2026-10-26)
  # exploration candidates a day per broker and style: the arm rows of prereg-2026-10-25-high-volume.md (~290 a day
  # with the probes, high-volume-learning-2026-10-25.md section 1); Vantage runs the intraday and swing twins only
  volume_plan:
    icm: {scalp: 160, intraday: 35, swing: 5}
    vantage: {scalp: 0, intraday: 35, swing: 5}
  # cost probes a day per broker, from the ADR 0043 probe sleeves (ICM: P0 60-90 + ~8 mirrors; Vantage: scheduled
  # M1 probes only at half ICM's scheduled share, no shadow book to mirror)
  probe_plan: {icm: 90, vantage: 40}
  volume_alert_below: 0.5            # a trading day under half the plan is low ...
  volume_alert_days: 2               #   ... two low trading days running open a learning-ops issue with the counted cause
  refit_min_fills: 200               # a (broker, session) slippage cell is refit after 200 fills since its last fit; never cheaper within a day
  overshoot_scenario_usd: 0.70       # stop-exit overshoot scenario ($/oz, cost-model-1m-2026-10-25): overshoot reported as a multiple of it
  max_gap_minutes: 30                # missing open-market 1m bars of a host in a day beyond this are an incident
  issue_label: learning-ops          # incidents and low volume: open or comment on the open issue with this label
  status_issue: 34                   # one blinded status comment a day on the program issue
  repo: engraamirkhan/goldbot
  weekly_proposals: 4                # Monday roll-up: at most 4 variant proposals for the research director (never run)
trades_view:                         # trades screens' plan figures (goldbot/api/today_ledger.py, item 131); reporting only
  fills_target: 200                  # fills a day for a demo account not listed below; live accounts have none
  # ADR 0049 D1/D1a step-1 targets (fills a day): icm-probe scalp 269 + probes 54; icm-demo under option B (separate
  # pots, D1a); vantage-demo stage V1. Revisit with the ADR (icm-demo ~138 under option A, vantage ~130 at V2)
  fills_target_by_account: {icm-probe: 323, icm-demo: 120, vantage-demo: 90}
  daily_target_share: 0.05           # ADR 0004: GBP 50 a day on the GBP 1,000 basis = 5% of the day's start equity, per account
  daily_target_by_account: {}        # account id -> a fixed daily target in the account currency (overrides the share)
  strip_days: 14                     # trading days in the Today tab's daily net strip

# Instrument registry (goldbot/instruments.py InstrumentSpec). NO SECRETS HERE: symbols and contract terms only.
#
# Multi-instrument demo plan (architect, adopted 2026-11-02; owner: all listed instruments, demo only). Step 0 froze
# this shape; nothing reads it yet, so today's XAUUSD paths are unchanged.
# - key: broker-neutral name (= the entry name). broker_symbols: accounts.yaml `broker` -> that broker's symbol.
# - store_symbol: the store's symbol column (bars_1m_live, ticks), unique, never pooled with XAUUSD. An account's own
#   `store_symbol` in accounts.yaml (vantage-247: XAUUSD247) still wins for that account's gold.
# - magic_block: unique, 0..99. magic = 3_000_000 + account_idx*10_000 + magic_block*100 + offset (lane L3).
#   XAUUSD is 0. Never renumber a block once an instrument has traded: open positions are reconciled by it.
# - contract_size / digits / point / min_lot / lot_step / currency_profit / swap_rollover3days: the broker's terms.
#   `verify: true` = placeholders; lane L1 fills them from the symbol check (goldbot/ops/symbol_check.py) against the
#   terminal's symbol_info before any instrument is enabled. swap_rollover3days uses MT5 numbering (0 = Sunday).
#   Source of the non-gold terms (lane L1, 2026-11-02): FALLBACK, the brokers' public contract-specification values
#   (IC Markets Raw MT5, Vantage Raw ECN), NOT read from a terminal: the read from the brain was refused by the build
#   sandbox's permission policy. They stay `verify: true` until `python -m goldbot.ops.symbol_check icm-probe` (and
#   `vantage-demo`) passes on the brain: it compares contract_size, digits, point, min_lot, lot_step, currency_profit
#   and swap_rollover3days with each terminal and prints the terminal's own terms in these field names; correct any
#   that differ, then set `verify: false`. Sizing must not read these terms (the RiskGate sizes from the terminal's own
#   symbol_info and the broker's loss_per_lot); they key the checks, the magic blocks and the research.
# - max_spread_points: the RiskGate's spread ceiling in points of `point` (XAUUSD 45 = $0.45, risk.max_spread_points).
#   Non-gold: about 3 x a typical raw-account spread from the brokers' public spread pages (FALLBACK), until the
#   recorded broker ticks measure it (nightly spread profile); lane L2's gate and L3's engine read it.
# - correlation_group: the group the RiskGate caps notional by (gold, metals, equity, fx, energy, rates, ags).
# - leverage_class: fx 30, gold_index 20, commodity 10, bond 5 (goldbot/instruments.py LEVERAGE_BY_CLASS).
# - session_profile: trading-hours family, checked against the broker's trading_sessions (lane L2).
# - news_currencies: news blackouts by these currencies; L2 adds EIA (crude, gas) and WASDE (grains) by group.
# - enabled: false for every non-gold instrument until lanes L1-L4 land; the accounts loader refuses non-XAUUSD
#   instruments on a live or observe-only account whatever this says.
# Corn is out: the brokers list dated contracts only, no continuous CFD.
instruments:
  XAUUSD:   # today's gold: the terms the engine and RiskGate use now (contract 100 oz, 2 digits, 0.01 lot)
    key: XAUUSD
    broker_symbols: { icm: XAUUSD, vantage: XAUUSD+, vantage247: XAUUSD247, vantage_obs: XAUUSD247 }
    store_symbol: XAUUSD
    asset_class: metal
    correlation_group: gold
    magic_block: 0
    contract_size: 100.0
    digits: 2
    point: 0.01
    min_lot: 0.01
    lot_step: 0.01
    max_spread_points: 45
    currency_profit: USD
    swap_rollover3days: 3
    session_profile: metals
    news_currencies: [USD]
    leverage_class: gold_index
    enabled: true
    verify: false


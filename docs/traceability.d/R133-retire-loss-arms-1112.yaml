id: R133
requirement: 'Profitability cycle 2026-11-12, ruling (a) (docs/research/profitability-2026-11-12.md section 4): "retire the demo arms that lost money with no live strategy to control". ZCD, F1A, F1C, G1A, G1C and IEX15 carry `retired_day` 2026-11-13 and the ruling as `retired_rule` on their own frozen spec rows (unhashed: id, hash and K unchanged). A retired family stops all its per-instrument rows: a row `<family>-<params.instrument>` running the family''s rule, whose gold family row (no `params.instrument`) is retired, takes the family''s retirement in the engine (`family_retirement`, rule "family <id> retired: ..."), so I0''s 2026-11-06 retirement now stops I0-USTEC, I0-XAUEUR, I0-DE40, I0-US500 (icm-probe) and I0-US30 (vantage-demo), which kept entering through 11-12 because `spec_retired` read only the row''s own `retired_day`. Every retired row stays configured: open positions keep stop, target, hold and every exit (no orphan close). Freed daily slots go to the remaining arms (Z10D, Z9D, Z5P) through the existing allocation; no cap, RiskGate rule, loss limit or size changes.'
status: 'implemented (2026-11-12, branch feat/retire-loss-arms-2026-11-12); reviews: quant-reviewer, trading-safety-reviewer'
code: 'goldbot/engine/exploration.py (`family_retirement`, `config_for`); config/exploration_arms.yaml (ZCD, F1A, F1C, G1A, G1C, IEX15 `retired_day`/`retired_rule`)'

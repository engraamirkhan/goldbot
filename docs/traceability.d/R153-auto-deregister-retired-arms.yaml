id: R153
requirement: 'BACKLOG 187 (R133 follow-up): "once each account shows no open position of [the retired arms], drop the rows", automatically. At every reconciliation after a successful broker position read (`exploration.sweep`), a spec-retired arm (`retired_day` on its frozen row) whose book has no open trade, no order in flight and no waiting signal is de-registered: no signal or bar work at its closes. The first de-registration per account and arm is recorded in aux.db `exploration_arm_deregistered` (migration 35, INSERT OR IGNORE) and journalled `exploration_arm_deregistered` with its rule; later starts drop it again, logged only. The arm stays known to the exits and adoption, so a position never closes as `exploration_orphan`; no position is closed, modified or read beyond the reconciliation''s own read. A failed read de-registers nothing. Runnable arms are never candidates. The config rows stay (inert); RiskGate unchanged'
status: 'implemented (2026-11-14, branch feat/auto-gated-1114); trigger: the first successful reconciliation that finds the arm flat; reviews: trading-safety-reviewer'
code: goldbot/engine/exploration_deregister.py (`candidates`, `holds`, `refresh`, `recorded`); goldbot/engine/exploration.py (`Exploration.deregistered`, `step`, `_minutes`, `_minute_due`, `sweep`); goldbot/db/migrations.py (aux 35)

id: R156
requirement: 'The weekly review raises read_due for every unread unit of a row that has its registered n AND its registered session-day minimum (HV "Graduation" and H-81 section 4: "one read, at the 300th admissible family fill on >= 20 session days"; config/arm_reads.yaml min_session_days, per arm, default none; session days = entry opportunity days of counted fills). A unit short of its days never hides a due one. It raises none for a unit already read, or one whose every arm was retired unread (A5 retired_day, or its registered stop) before the read fell due. An unreadable arm_reads.yaml queues no read and one arm_reads_unreadable action (fail closed). The board says "due now" only when both counts are met. The 2026-11-14 Z4/Z7 VOID verdicts are recorded as comments, not reads.'
status: implemented (2026-11-14, branch fix/weekly-read-due)
code: 'config/arm_reads.yaml (min_session_days, Z4/Z7 VOID comments); goldbot/api/strategy_labels.py (ReadsFile.min_session_days, ArmInfo.read_days / retired_day, Catalog.reads_ok / read_days / retired_unread); goldbot/api/strategy_ranking.py (_UnitFills.due_day, _progress, RankRow.read_units, ARM_READS_UNREADABLE); goldbot/api/strategy_board.py (_progress due now); goldbot/api/schema.py (RankProgress n_days, min_days; RankRow read_units; ARM_READS_UNREADABLE); goldbot/research/weekly_review.py (ranking_actions); goldbot/research/review_actions.py (arm_reads_unreadable); web/openapi.json, web/src/lib/schema.d.ts'
test: tests/test_weekly_review.py::test_a_read_is_not_due_at_its_fill_count_until_its_registered_session_day_minimum_is_met; ::test_a_due_unit_is_queued_even_when_another_unit_of_its_row_is_further_along_but_short_of_days; ::test_an_unreadable_arm_reads_file_queues_no_read_and_says_so_once; tests/test_strategy_ranking.py::test_read_progress_counts_the_units_session_days_and_carries_its_registered_minimum; ::test_a_unit_whose_arms_are_all_retired_unread_has_no_read_due_progress; ::test_a_unit_retired_after_its_read_fell_due_keeps_its_read_due_progress; ::test_every_unread_unit_of_a_row_is_listed_and_a_due_one_comes_first; ::test_session_days_count_the_day_a_fill_was_entered; ::test_an_unreadable_arm_reads_file_is_reported_in_the_views_unreadable_list; tests/test_strategy_labels.py::test_the_session_day_minimum_of_a_read_comes_from_the_arm_reads_file_and_defaults_to_none; tests/test_strategy_board.py::test_due_now_waits_for_the_reads_session_day_minimum

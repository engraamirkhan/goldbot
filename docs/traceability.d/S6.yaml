id: S6
requirement: Combined caps never sum equities in different currencies (ADR 0004 A8, BACKLOG 28)
status: implemented
code: 'engines publish `currency` (goldbot/engine/runner.py `_write_state`); goldbot/risk/supervisor.py `evaluate` halts `mixed_account_currencies` when engines report different currencies (an engine without one counts as unknown next to others), publishes `currencies`; the gate''s `other_equity` therefore only ever combines one currency. Converting instead was rejected: the supervisor has no FX rate and a stale one would loosen the caps silently'
test: 'tests/test_currency_sizing.py::test_the_supervisor_refuses_to_combine_accounts_in_different_currencies, ::test_the_supervisor_treats_an_engine_without_a_currency_as_unknown_when_combining, ::test_one_currency_combines_as_before, ::test_the_engine_publishes_its_account_currency; review MEDIUM-1 (only engines with a fresh heartbeat are compared; the startup-error file carries `currency`; health fails naming each file and currency; vantage-demo disabled; RUNBOOK "Currency rollout"): tests/test_sizing_review_fixes.py::test_a_stale_engine_file_is_left_out_of_the_currency_check, ::test_health_names_mixed_currencies_and_the_offending_files, ::test_the_startup_error_payload_carries_the_currency, ::test_the_shipped_registry_runs_icm_demo_alone; re-verification: money (equity, day/week start, HWM, published limit, the gate''s other_equity) is summed only over fresh engines plus stale ones in the same single currency, a stale file in another or no currency keeps only its exposure (`money_excluded`, health warns naming it): ::test_a_stale_file_in_another_currency_never_dilutes_the_combined_money, ::test_a_stale_file_without_a_currency_stays_out_of_the_money_and_one_in_the_same_currency_counts, ::test_health_warns_naming_a_file_kept_out_of_the_money; final review (no fresh engine: stale money only in one currency, `no_fresh_engine`; digest and monthly report sum per currency, £ on a GBP account): tests/test_currency_followups.py'
order: 4.5

id: M51
requirement: 'BACKLOG 91: "The retired families SHARE 1 exploration trial a quarter" (research.retired_families), enforced in code for allocated and screened families alike: a research.yml / research_pass run on a retired family is refused unless no retired-family trial is stamped in the quarter yet; the director counts trials on every retired family and reports the shared trial as used once one exists (H-53, the 2027Q1 trial on `box_break_close`).'
status: implemented (quant review pending)
code: 'goldbot/research/registry.py `RetiredExplorationUsed`, `check_budget_reserved` (an open-budget job on a family in `retired`, rule_ref cited or not, is refused when `director.retired_quarter_trials` + the run''s retired jobs > `RETIRED_EXPLORATION`; a pending queued pre-registration of the exact config lifts it; `retired=None` reads the settings, fail closed); goldbot/research/director.py `build_plan` (counts every retired family, not only the allocated ones; `ResearchPlan.retired_trials_quarter`), `retired_exploration` (reports the trial as used whenever it is, with or without an allocated retired family)'
test: tests/test_retired_family_trial_guard.py::test_the_first_retired_family_trial_of_a_quarter_runs_from_the_open_budget, ::test_a_screened_retired_family_is_refused_once_another_retired_family_used_the_quarters_trial, ::test_an_allocated_retired_familys_trial_also_uses_the_shared_trial, ::test_a_retired_trial_of_an_earlier_quarter_does_not_use_this_quarters_trial, ::test_two_retired_family_jobs_in_one_run_are_refused_together, ::test_a_live_family_is_not_touched_by_the_guard, ::test_a_pending_queued_preregistration_of_the_exact_config_lifts_the_refusal, ::test_without_a_retired_list_the_guard_reads_the_settings_and_fails_closed, ::test_the_director_counts_a_screened_retired_familys_trial_as_the_quarters_shared_trial, ::test_the_plan_reports_the_shared_trial_as_used_even_with_no_allocated_retired_family

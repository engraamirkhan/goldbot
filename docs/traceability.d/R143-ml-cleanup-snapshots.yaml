id: R143
requirement: 'ML review 2026-11-13 (docs/research/ml-review-2026-11-13.md sections 2, 4B and 5). (1) "Replace it [the Thompson bandit] with equal shares within the existing floor and cap": the nightly learner gives every enterable arm of a style an equal share inside the 5 % floor, the 30 % cap and its own ceiling. Retired, blocked and not-configured arms stay at 0. The H-61 bandit stays selectable (research.exploration.allocator). (2) The H-62 online meta-labeller''s Sunday retrain is retired (research.exploration.meta_labeller false; 0 model rows, nothing trainable). The specialists'' Saturday LightGBM retrain is off (research.specialist_retrain false; shadow AUC 0.44 on 145 trades, Brier 0.206 against 0.197, 0 live agents). Challengers in shadow are still judged, and the recalibration, drift and decay watchers are unchanged. Code and data are kept. (3) Every gold exploration candidate gets a point-in-time default-feature vector keyed by candidate id (aux.db migration 32). It is built from the account''s stored minutes visible by the decision, with the engine''s frame rule, nightly and bounded, never in the engine tick, and no engine module reads it. Point in time is by write time (stored minutes carry `available_utc`; a minute written more than 2 minutes after its close counts from its write time; rows with minutes that have no write time are marked pit nominal). Feeds are resolved per decision. Each row equals engine.frames.frame on the same minutes. Batches are shared fairly between accounts, with retry dates for stuck accounts and bounded retries for a short history. Recomputing from bars cut at each decision gives 0 mismatches; shuffled-label AUC is 0.50 +- 0.02. No order path, cap, pot or RiskGate change.'
status: 'implemented (2026-11-13, branch feat/ml-cleanup-snapshots; ADR 0080)'
code: 'goldbot/research/exploration_data.py (`allocate`, `learn` allocator); goldbot/ops/jobs.py (`learner_options`, `saturday_retrain` RETRAIN_RETIRED, `feature_snapshots` in `nightly_costs`); goldbot/research/feature_snapshots.py; goldbot/data/account_bars.py (`minute_versions`, `as_of_minutes`); goldbot/engine/history.py (BarWriter write time); goldbot/data/crossfeed.py (broker M1 write time); goldbot/db/migrations.py (aux 32); goldbot/config.py (ExplorationLearnSettings, ResearchSettings.specialist_retrain); config/settings.yaml'
test: 'tests/test_ml_review_cleanup.py (equal shares whatever the results, never more of a style spent than the bandit or the weights reader allow, caps and ceilings, Thompson selectable, unknown allocator refused, settings defaults, learner options per day, Saturday job fits nothing when retired and still walks forward when on); tests/test_feature_snapshots.py (12-cut recompute 0 mismatches with power check, shared vector per bar, bounded newest-first and never redone, no-bars retry, non-gold left out, shuffled-label AUC 0.50 +- 0.02 with an informative-label control, 40-column cap, engine isolation, engine window parity, nightly slot order and failure isolation, switch off); tests/test_feature_snapshots_pit.py (writers stamp write time, late/revised/quarantined minutes, pit nominal, equal to engine.frames.frame at 15m and 1h, stuck account never starves a healthy one, fair share, bounded retries, release minutes fill a short history, gold-only coverage)'

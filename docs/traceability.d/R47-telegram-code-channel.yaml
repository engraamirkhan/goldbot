id: R47
requirement: 'The owner''s one-time sign-in code is delivered through the existing Telegram bot, not email (owner decision 2026-10-17, BACKLOG 77 amendment, ADR 0028 amended; security conditions 1-7; see U22): one keyring chat id (`telegram-owner-chat-id`) that is positive, in telegram.allowed_user_ids and a `private` chat per Bot API getChat, else nothing is sent and `code_channel_unavailable` is audited; the API sends with sendMessage over HTTPS (protect_content, no parse_mode), never getUpdates, in a background task; the code is in no file, outbox, agent_runs row or log and the bot token is in no log; only the message id is stored and the message is deleted on use, burn, resend and expiry; every Telegram-code sign-in is audited `tg_code_login` and listed in an owner banner (7 days, coarse network) with sign out everywhere; all other email-code rules unchanged'
status: implemented
code: 'goldbot/api/code_delivery.py (`CodeDelivery`, `TelegramCodeDelivery`, `MailCodeDelivery`, `quiet_http_logs`); goldbot/api/app.py (`_default_code_delivery`, `send_email_code`, `delete_message`, `/api/auth/code-sign-ins`, `AuthState.code_sign_in`/`code_channel`); goldbot/api/auth.py (`code_message`, `set_code_message`, `code_sign_ins`, `tg_code_login`); goldbot/db/migrations.py version 10 (additive: `email_codes.message_id`); goldbot/config.py `AuthSettings.code_channel`; goldbot/api/e2e_mailer.py `CaptureCodeDelivery`; web/src/lib/codeCopy.ts, web/src/screens/CodeSignInsBanner.tsx, Login.tsx, Account.tsx'
test: 'tests/test_telegram_code.py; tests/test_email_code.py (mail channel); tests/test_e2e_mailer.py::test_the_fake_code_channel_captures_the_telegram_message_to_the_outbox_under_the_same_guards; tests/test_migrations.py::test_migration_10_adds_the_code_message_id_and_is_additive_so_a_rollback_still_opens_aux_db; web/src/screens/CodeSignInsBanner.test.tsx; web/src/screens/Login.test.tsx "Login with a Telegram code"; web/e2e/auth.spec.ts "sign-in code: the owner signs in with the password and a code sent to Telegram; ..."'

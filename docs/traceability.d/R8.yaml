id: R8
requirement: '"checked with order_calc_margin and against the FCA retail cap of 1:20; rejected if projected margin level would fall below 300%"'
status: implemented
code: 'goldbot/risk/gate.py `RiskGate.margin_for`: the larger of the broker figure (`check(..., margin_required=broker_margin(broker, symbol))`) and notional / 20; a broker that cannot answer (no source, None, non-finite, negative, error) falls back to 1:20 with the reason in `GateDecision.margin_note`; 300% rule unchanged. Brokers: `margin_required` on the protocol, MT5 `order_calc_margin` (goldbot/execution/mt5_adapter.py), paper 1:20, bridge allow-list retry-safe read. Engine: goldbot/engine/runner.py passes `margin_required=broker_margin(self.broker, self.cfg.symbol)` to both `gate.check` calls (proposal and approval re-check)'
test: tests/test_cov_risk.py::test_entries_that_would_take_margin_level_below_300_percent_are_refused; tests/test_margin_and_tick_dedup.py::test_the_gate_takes_the_stricter_of_the_broker_margin_and_the_one_to_twenty_cap, ::test_the_gate_falls_back_to_one_to_twenty_and_says_why_when_the_broker_cannot_answer, ::test_the_300_percent_margin_level_rule_at_its_boundary, ::test_the_bridge_exposes_margin_required_as_a_retry_safe_read, ::test_mt5_margin_comes_from_order_calc_margin_with_the_order_type_and_none_on_error; tests/test_engine_margin.py::test_the_engine_passes_the_broker_margin_to_the_gate_at_approval, ::test_a_broker_margin_fault_at_approval_falls_back_to_one_to_twenty_never_less, ::test_the_engine_passes_the_broker_margin_on_every_proposal_and_approval_check

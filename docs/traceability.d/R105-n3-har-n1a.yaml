code: 'goldbot/engine/refusals_novel.py (`in_scope`, `learning_icm_only`, `har_unavailable`, `har_low_range`); goldbot/engine/entry_refusals.py (`REFUSALS`); goldbot/research/har_abstention.py (`cut_off`, `next_trading_day`, `read_bars`, `frozen_fit`, `forecast`, `write_row`, `run_job`); goldbot/ops/jobs.py (`har_days`); goldbot/db/migrations.py (aux 26 `har_days`); goldbot/config.py + config/settings.yaml (`research.har_abstention`, `scheduler.har_days`)'

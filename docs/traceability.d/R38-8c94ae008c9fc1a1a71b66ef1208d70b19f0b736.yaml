id: R38
requirement: 'Open-risk heat cap and open-risk daily projection (BACKLOG 19, playbook G-4; BACKLOG 35, trading-safety review MEDIUM-4), per account, entries only: with `risk.heat.enabled`, RiskGate refuses `heat_cap` when the open positions'' remaining stop risk (each: max(0, loss from the current close price to its SL) x lots x contract x fx, account currency) plus this trade''s full stop risk exceeds `max_open_risk` x equity (equal allowed; a minimum-lot exception trade counts in full), and `same_direction_cap` once `max_same_direction` positions on the entry''s side are open, whoever opened them; with `risk.project_open_risk` and the account''s `daily_loss_limit_abs`, the projection is loss so far + open risk + this trade''s risk (`daily_loss_limit_abs`); a position without SL, on another symbol, or without a usable conversion makes the open risk unknown and refuses (`open_risk_unknown`) while either rule is on; exits never gated; both off by default (owner: values)'
status: implemented
code: 'goldbot/config.py `HeatSettings` (enabled false, 0.02 in (0, 1), 2 >= 1), `RiskSettings.heat`, `RiskSettings.project_open_risk`; config/settings.yaml `risk.heat`, `risk.project_open_risk: false`; goldbot/risk/open_risk.py `remaining_stop_risk` (bid for a long, ask for a short; 0 at or through the stop; None without SL or with unusable terms); goldbot/risk/gate.py `RiskLimits.heat`/`project_open_risk` (`from_settings`, every phase), `AccountState.open_risk`/`open_long`/`open_short`, `RiskGate.open_risk_reasons` (before sizing; non-finite or negative open risk = unknown), the projection and `heat_cap` after the daily-limit check in `check`; goldbot/engine/runner.py `_note_open_risk` (in `_refresh_account`, every position on the account; unreadable book = unknown), `_open_risk_fx` (broker conversion through `sizing.account_fx`, once a minute per side) -> `open_risk`, `open_risk_positions`, `open_long`, `open_short`, `limits.heat`, `limits.project_open_risk` in engine_<account>.json; review HIGH (auto entries at one bar close see the previous fill): goldbot/engine/runner.py `_after_auto_order` (re-read after each auto order; a fill not yet visible added conservatively; `DEFINITE_REJECT_RETCODES`, else `auto_paused` for the rest of the bar close; a failed re-read the same), `_execute` returns the broker''s result; review LOWs: `AccountState.open_risk` unknown by default, `_note_open_risk` failures leave it unknown without aborting `_refresh_account`, a failed bar-close account read still runs `_manage_open` and then propagates (no entry decided on that close), goldbot/ops/health.py `check_open_risk` (`open_risk:<account>`, warn + Telegram via `NOTIFY_ON_WARN` while unknown with a rule on)'
test: 'tests/test_open_risk_heat.py::test_open_risk_defaults_to_unknown_so_a_fresh_state_refuses_when_on, ::test_a_failing_open_risk_computation_never_aborts_the_account_refresh, ::test_a_failed_account_read_at_the_bar_close_still_manages_open_positions_and_places_nothing, ::test_health_warns_and_alerts_when_the_open_risk_is_unknown_while_a_rule_is_on; tests/test_sending_row_recovery.py (a send that raised: adoption marks its row filled, a restart keeps the trade, no stop looser than the broker''s, stale rows resolved in-process); tests/test_auto_same_close.py (two agents at one close: max_positions, heat_cap, same_direction_cap; two timeframes closing together; a lagging broker for each cap; an ambiguous result and a failed re-read pause, a definite reject does not; the control trades both); tests/test_open_risk_heat.py (settings default off and validation; disabled rules give identical decisions on a grid whatever the new facts; heat cap at and past 2%; a minimum-lot exception trade counted in full; same-direction cap per side; unknown open risk refuses; projection with two open trades on each side of the limit and with a loss so far; projection inert without an absolute limit; remaining stop risk arithmetic and unknown cases; engine publishes per-position risk and side counts; no-SL position and a GBP account without a conversion make it unknown; two open trades through the engine block an entry; exits never call the gate)'

id: R124
requirement: 'Backlog 160: open trades age on the base clock from every bar close after any cold start. Below the 400-bar floor (or before the first decision frame) `on_bar_close` decides nothing but still runs `_manage_open`, so `bars_held` counts and the time exit fires at its close; before, a cold start paused the count until the first decision frame (~30 h for a 15m arm) unless a failed or short history read held entries (R123, now superseded on this point). `bars_held` is saved in the orders file, so a restart resumes the count where it stopped. Exits only get earlier: in the 7-day replay golden exactly 6 shared trades moved, all from stop/target to an earlier time_exit inside the replay''s own cold window (2025-03-03); exit policies (`_manage_policies`: trail, hard flat) still wait for their frame'
status: 'implemented (2026-11-11, branch fix/cold-start-trade-ageing); in review (trading-safety, quant)'
code: 'goldbot/engine/runner.py (`on_bar_close` runs `_manage_open` below the floor unconditionally); tests/data/engine_replay_identity_golden.json (regenerated)'

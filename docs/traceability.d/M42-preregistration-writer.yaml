id: M42
requirement: 'The quarter''s pre-registered queue is written into the shared registry before the quarter, exactly as pre-registered (BACKLOG 47; preregistration-2027Q1.md "Writing the queued rows", ADR 0007): queued rows (`preregister(queue=True, target_quarter=)`, with `rule_id`) and survivor slots (`reserve_slot`) from a reviewed spec; each config rebuilt as its runner builds it and checked against the pinned hash, agent id and feature version; reading and derivation rules the pre-registration''s own text; rows + slots = the spec''s reservation = `research.reserved_trials_quarter` <= `trial_budget_quarter`; idempotent; refused once the quarter started unless `--allow-late` with a reason (ad-hoc rows naming their rule, no slots); no trial spent, no outcome written; the shared copy is never overwritten after a failed read'
status: 'implemented (security approved; quant M1-M5 fixed, re-review pending)'
code: goldbot/research/preregistration.py `plan_quarter`, `write_quarter`, `resolve_variant` (shared with `research_pass.py parse_variants`); goldbot/research/discovery.py `discovery_trial_config` (shared with `discovery_pass`); scripts/preregister_quarter.py; docs/research/preregistration-2027Q1.yaml; .github/workflows/preregister-quarter.yml (dry run read-only; write merges research-v1 before and after); scripts/registry_release.sh (research.yml and preregister-quarter.yml)
test: tests/test_preregister_quarter.py::test_the_dry_run_prints_exactly_the_docs_queued_rows_and_survivor_slots_and_writes_nothing; ::test_writing_twice_adds_nothing_the_second_time; ::test_a_written_row_is_the_one_the_runners_budget_check_matches; ::test_writing_spends_no_trial_and_records_no_outcome; ::test_rows_and_slots_over_the_quarters_trial_budget_are_refused; ::test_writing_on_or_after_the_quarters_start_is_refused_without_allow_late; ::test_a_malformed_row_is_refused_by_the_spec_schema; ::test_allow_late_is_refused_while_the_settings_still_reserve_trials_for_the_queue; ::test_a_withdrawn_row_dropped_from_the_spec_does_not_block_the_next_run; ::test_no_slot_is_reserved_on_a_withdrawn_parent_and_nothing_is_written; ::test_a_reading_rule_must_be_the_whole_bullet_not_a_part_of_it; ::test_bars_from_and_to_must_be_the_runs_own_utc_timestamp_text; ::test_a_written_discovery_row_is_the_one_research_pass_discover_links; ::test_the_rules_are_read_from_the_pre_registration_at_its_freeze_commit; tests/test_registry_release.py::test_save_never_uploads_after_a_failed_download; ::test_save_refuses_a_merged_registry_shorter_than_the_published_one

id: R111
requirement: 'EVAL-2 Lane 5A (method v6/v7 sections 2 L4, 5 and 6 S5; prereg 2026-11-09 sections 4.9 and 5): replay v2 charges each leg (entry, stop exit, target exit, time exit) per broker and session at max(0, the day-clustered upper 95 % bound of the measured adverse mean) of the broker''s own exploration ledger fills once a cell has min_fills, else the $0.15 prior, never crediting favourable slippage; the stop leg is its overshoot in the fill price, never charged twice; the 1m/5m time limit runs from decision + send delay; r2 is written once to the side table exploration_replay keyed (candidate_id, replay_version) and label_sim_r is never rewritten; every non-gold r1 label is voided (append-only exploration_label_void) and no reader sees a void label; readers name the replay version; vantage (quant ruling 2026-11-09): demo exit legs are never evidence, its exit cells charge max(ICM-measured exit slip per leg and session, the prior), S5 reads its entry leg only and never greens its exit leg, exits without a price are excluded and counted, stops gapped through yet filled at the level are counted; L4 forward: execution, futility and edge e-processes (Ville-checked), exit-mix check, forward_state WAITING until S5 passes'
status: 'implemented 2026-11-09 (branch feat/eval2-lane5a-replay); v7 signed with conditions C1-C10 by the quant-reviewer, all built (per-session-day r2 costs, day-clustered e-processes, per-(broker, leg) execution streams, S5 >= 50 pairs over >= 10 days with a one-sided 95 % bound, pinned forward cost model, bar-implied stop overshoot, vantage entry-at-quote rule, s5_ok units, frozen exit prior, prereg amendment); no S5 or forward read has been run'
code: 'goldbot/execution/costs.py (`LEGS`, `LegSlippage`, `leg_slippage_table`, `real_money_exit_charge`, `DEMO_EXIT_AT_LEVEL`); goldbot/research/exploration_data.py (`ReplayCostsV2`, `replay_label_v2`, `ledger_legs`, `replay_costs_v2`, `label_candidates_v2`, `void_non_gold_labels`, `fill_replay_pairs`, `synthetic_stop_fills`, `read_obs(replay_version=)`); goldbot/research/eval2/forward.py (`e_execution`, `exit_mix_ok`, `e_futility`, `e_edge`, `forward_state`, `s5_read`); goldbot/db/migrations.py (aux 28 `exploration_replay_v2`); goldbot/ops/jobs.py (`exploration_learn` voids, labels r2, reports legs)'

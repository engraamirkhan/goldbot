id: X14
requirement: '"On a Standard account the 15m specialists are disabled and the 1h and session-open specialists run only when expected edge exceeds 1.5x the measured cost; on Unknown the engine stays in paper and alerts"'
status: implemented
code: 'goldbot/engine/runner.py `_refresh_account` sets `AccountState.account_class` from state/classifier_<account>.json (cached by mtime; missing, unreadable or not yet classified = unknown; a paper broker is never restricted); goldbot/risk/gate.py `check`: unknown -> `account_class_unknown` (no entries; the shadow book keeps learning), standard -> `standard_account_15m` for 15m families except session_open and `standard_account_edge` unless the gross edge p*T-(1-p)*S exceeds `standard_edge_over_cost` (1.5) x the measured round trip; alert: goldbot/ops/health.py `check_engine` warns while a broker account is unknown'
test: tests/test_account_class.py::test_unknown_class_blocks_every_entry; ::test_standard_disables_15m_families_except_session_open; ::test_standard_needs_an_edge_above_one_and_a_half_times_cost; ::test_engine_reads_the_class_for_a_broker_account_and_ignores_it_on_paper; ::test_health_warns_while_a_broker_account_is_unclassified

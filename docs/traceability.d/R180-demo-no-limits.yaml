id: R180
requirement: 'Owner 2026-11-25: "there are no limits anymore for demo accounts", "allow absolutely anything" (ADR 0097). On a demo probe_only account with accounts.yaml demo_unlimited: true (refused at load anywhere else; false everywhere until the icm-probe canary), every account-configured cap is lifted in the RiskGate (positions, daily/weekly/absolute loss limits, drawdown stages and kill switch, news and entry windows, spread cap, throttle, heat, exposure and 300 % margin caps, the minimum-lot risk rule, an arm''s per-trade cap, the bridge smoke''s caps) and in exploration (entry budgets, global/host/pot/learning slots, net lots, rooms, the 8 % pause, the learning cohort''s caps). Kept (K1-K6): the RiskGate as the only path, the broker stop on every order, exits never gated or queued behind entries, halts, data and terminal integrity, rollover, the weekend, and the statistical rules (the frozen spec''s max_open, a learning arm''s registered loss cap and until, prereg entry refusals, cost suspension, retirements). Guards: the demo floor (equity >= 20 % of the closed-balance mark, margin level >= 200 % on the broker''s figure; one switch), a 50 % warning, per-arm runaway containment (10 % of the mark a day). Exits before entries (trading-safety H1/H2): no entry while a close, kill flatten or due stop modify is pending; an entry duty ceiling (1.5 s a pass, half of every 10 s); broker capacity refusals 10033/10040 hold entries until a position closes; the loop-pass gap p99 is published and health exit_latency alerts above 5 s; capacity ceiling 300 open positions (measured: exit wait p99 < 5 s on the paper bridge). Every entry is tagged limits_epoch=unlimited; shock-window fills carry blackout_kind. Live and real-money limits byte-identical to before (fixture test).'
status: in review (2026-11-25, branch feat/demo-no-limits; canary on icm-probe Sun 2026-11-29 22:00 UTC)

id: R138
requirement: 'BACKLOG 149 and 150: EVAL-2 reads of real cells go through `goldbot/research/eval2/runner.py` only. Every L2, L3 (batch p and read) and forward read first calls `assert_harness_sane(harness_hash())` (`forward=True` for forward reads) and refuses (`ReadRefused`, fail closed, nothing computed or written) on no report, a BLOCKED or failed test, a report for another hash or a self-test module that does not load. (a) a futility `registry_row` must name a PREREGISTERED row of the same family and config hash written before the read; (b) L3 units, batch p units and corroboration are cut at decision + registered maximum hold before 2025-10-01, a carried cell with no registered time exit is refused; (c) every family p of batch j (m_j = the card''s) is written once to state/catalogue_reads.jsonl before any read of the batch and `run_l3_read` takes `batch_p` only from there; the row has no `window` key, so read_batch_index and _claim are unchanged. K unchanged; no trial run.'
status: 'implemented (2026-11-13, branch fix/eval2-runner-integrity)'
code: 'goldbot/research/eval2/runner.py (`harness_gate`, `checked_futility_terms`, `cut_at_holdout`, `record_batch_p`, `read_batch_p`, `run_l3_read`, `run_l2_read`, `run_forward_read`); confirm.l3_read signature unchanged'

id: P9
requirement: 'MT5 terminal logins on the boxes happen without the owner, no VNC step (owner directive 2026-10-20), to the configured login only: credentials from the keyring, the account verified after login (login, server, demo vs real, hedging), never a login or password in output, logs or errors'
status: implemented
code: 'goldbot/ops/login.py `login_terminal` (initialize or, on an attached session, mt5.login with the keyring login/password and the yaml server; then `accounts.verify_terminal_account`; retries timeouts only with doubling backoff, never an authorization failure; error text scrubbed), `main` (`goldbot-mt5 login <account>`: ok/failed + reason), `attach_terminal` (bridge start: a failed attach logs in, then attaches again), `Relogin` (GuardedBroker `relogin` hook on not_logged_in only, paced, stops after `heal_max_attempts`); goldbot/execution/bridge.py GuardedBroker.terminal_state; goldbot/ops/services/bridge.py run_bridge; settings `mt5_login` (dismiss_wizard off by default)'
test: tests/test_mt5_login.py (::test_login_initializes_the_terminal_with_the_configured_login_password_and_server; ::test_a_terminal_that_ends_on_another_login_is_failed_and_never_retried; ::test_a_real_terminal_under_a_demo_account_is_failed; ::test_an_authorization_failure_is_never_retried_so_the_broker_never_locks_the_account; ::test_a_terminal_error_naming_the_login_or_password_is_scrubbed; ::test_a_failed_attach_logs_in_from_the_keyring_then_attaches_again; ::test_self_heal_logs_in_once_then_waits_out_a_growing_backoff; ::test_guarded_broker_never_logs_in_over_a_wrong_account; ::test_the_command_prints_ok_and_shuts_the_ipc_down_without_the_login)

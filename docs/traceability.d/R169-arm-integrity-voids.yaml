id: R169
requirement: 'Discovered-arm integrity voids precise, not looser (SRE dry run 2026-11-19; prereg-amendment-2026-11-18-discovered-arms.md 4 and 1): a broker_bar_replaced event near a decision voids only when the store cannot show the replacement (no flagged copy of its minute with a write time, fewer flagged minutes than its count, an unparseable count); a flagged copy written before the decision is recomputed, after it voids (K1); the engine never holds a release minute at or after its cut-over, so the night never reads one, and the cut-over is the earlier of the first stored live minute and the saved history_cutover (unreadable: unverified); after it the broker M1 must observe the window: not pulled past the decision window_incomplete (no_broker_coverage after COVERAGE_WAIT), a hole of more than BROKER_SILENCE_MAX open minutes no_broker_coverage, a minute it has that the store lacks (the last one included) gap_after_cutover, weekends observed silence; overlapping replacement events accounted for by the sum of their counts; the engine refuses a learning row whose since is before EFFECTIVE_UTC''s day, one constant for registration and the engine'
status: 'implemented (2026-11-19, branch fix/arm-integrity-voids); review round 1 of bd861f03 fixed (quant MEDIUM + 2 LOW, safety 2 LOW); reviews: quant-reviewer, trading-safety-reviewer'
code: goldbot/research/arm_integrity.py (AccountMinutes.stored_replacement, AccountMinutes.cutover_cause, AccountMinutes.observed, saved_cutover, replaced_count, BROKER_SILENCE_MAX, COVERAGE_WAIT, GAP_AFTER_CUTOVER, NO_BROKER_COVERAGE, CUTOVER_UNREADABLE); goldbot/ops/jobs.py (arm_lifecycle passes the engines' aux.db); goldbot/engine/arm_registry.py (_learning_refusal); goldbot/research/arm_rules_spec.py (EFFECTIVE_UTC); goldbot/ops/autodisc_register.py (imports EFFECTIVE_UTC)
test: tests/test_arm_lifecycle_inputs.py::test_a_replacement_logged_near_the_decision_but_stored_before_it_is_recomputed_not_voided; ::test_the_night_reads_the_count_of_the_replacement_event_the_engine_writes; ::test_a_window_minute_the_engine_replaced_after_the_decision_leaves_the_candidate_unrecomputable_not_refused; tests/test_arm_integrity.py::test_a_release_minute_where_the_brokers_m1_shows_no_bar_after_the_cutover_is_not_held_and_the_read_verifies; ::test_a_gap_after_the_cutover_the_brokers_m1_has_a_bar_for_voids_even_without_a_release_minute; ::test_release_minutes_after_the_cutover_in_the_window_void_the_candidate; ::test_the_brokers_m1_never_fills_a_minute_the_engine_never_held; ::test_a_minute_the_engine_lacks_with_no_broker_m1_after_it_is_never_read_as_ok; ::test_a_lost_last_minute_the_broker_had_is_a_gap_once_its_m1_is_pulled_not_incomplete_for_ever; ::test_the_engines_saved_rebased_cutover_cuts_the_release_minutes_off_where_the_engine_did; ::test_the_saved_cutover_is_read_from_the_engines_aux_db_and_an_unreadable_one_leaves_the_arm_unverified; ::test_overlapping_replacement_events_are_accounted_for_together_by_the_sum_of_their_counts; ::test_a_weekend_the_brokers_m1_is_silent_across_is_observed_and_release_minutes_there_are_no_gap; tests/test_discovered_arm_registration.py::test_the_engine_refuses_a_learning_row_whose_since_is_before_the_amendments_effective_day

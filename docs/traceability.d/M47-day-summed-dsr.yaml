id: M47
requirement: 'E-6 (BACKLOG 76; pre-registration 2027Q1 O-5/O-6): a discovery survivor passes only if the day-summed DSR is also >= 0.95, computed on one summed net R per entry UTC day over days with at least one model-filtered trade only (n = G), with var(SR) = 1/G, the skew and kurtosis of the daily sums, and the same K = `n_trials_effective` as the gate (both discoveries'' K_eff included); the per-trade and the day-summed effective t are recorded with the trial and shown in the research report'

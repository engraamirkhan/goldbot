id: M15
requirement: Walk-forward windows read from settings
status: partial
code: 'goldbot/research/walkforward.py `window_for`/`splits_for` take an optional `settings`: its `walkforward` months and `labels` purge/embargo replace the `WINDOWS` default (1d, absent from settings, keeps the constant); the research callers (`pipeline.run_specialist`/`run_pool`, `discovery.discover`) do not pass it yet and use `WINDOWS` (values equal today, 15m/1h/4h). Settings decide which timeframes the Saturday retrain trains (`saturday_retrain`, gap_watch''s founder check) and the length of history it loads; `Settings` rejects a walk-forward timeframe without purge and embargo, and `DecisionTimeframe` (15m, 1h, 4h) rejects a 1d window'

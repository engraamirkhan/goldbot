id: R127
requirement: 'Backlog 157 and 159: no store read after the warm start runs on the engine''s tick thread. The history re-read (while `history_read` / `history_short` refuses entries, every 30 min of engine clock) and the release reload (while a window has a hole) each run on a thread of their own (`history.StoreRead`), at most one of each in flight; the tick thread merges a finished read at its next bar close (`after_close`) and nowhere else, so a hung or slow store never delays a tick or an exit. The refusal stays in force until a read has finished and been merged and judged (a recovered read still re-judges `history_short`); a read or merge that raises, or a read thread that ends without a result, keeps or sets `history_read`; a re-read lifts `history_read` only when it started at or after the failure was last stamped (a release-reload failure during it stands); a read that never returns keeps entries refused, starts no second read and is logged once as an error after READ_HUNG_S (120 s). Release minutes are merged only before the cut-over found at the merge (a rebase may move it back while the read runs). Key zones (display): an unreadable store cache logs the first failure of each exception type with its traceback, the same type at most once an hour of engine clock with the count of that type it stood for, and a read that works again logs its recovery once; the retry at every build is unchanged.'
status: 'implemented (2026-11-12, branch fix/history-reread-off-tick); code review PASS, trading-safety APPROVE; three LOW findings addressed'
code: 'goldbot/engine/history.py (`StoreRead`, `_no_result`, `READS`, `READ_HUNG_S`, `_running`, `_start`, `_collect`, `_store_reader`, `reread`, `_absorb_reread`, `reload_release`, `absorb_release`, `after_close`, `History.reads`, `History.spawn`); goldbot/engine/key_zones.py (`CACHE_WARN_EVERY`, `KeyZoneWorker._cache_failed`, `KeyZoneWorker._cache_back`)'

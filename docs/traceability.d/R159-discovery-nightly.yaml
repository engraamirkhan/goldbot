id: R159
requirement: 'Discovery nightly on the brain (owner directive 2026-11-18, ADR 0090): a bounded nightly G2 search on 1h, 4h and 1d over the explore window only (bars through load_research_bars, the holdout sealed), steered by grammar-node priors from demo labels and from each discovered arm''s forward result, every spec power-gated by ADR 0085 before it is ledgered (no K on a refused spec), the night''s planned K inside the quarter''s trial budget (assert_budget), costs at the cost of record v3; survivors that can run live offered as candidate arm rows for registration; a run record in aux.db and the discovery ledger; on the brain in a niced, memory-capped child with a wall-clock budget, killed when it overruns; a dry run writes nothing.'
status: implemented (2026-11-18, branch feat/discovery-nightly); off until a host enables it with bars_path after the quant and sre GO
code: 'goldbot/research/autodisc/discovery.py (load_explore_bars, cor_v3_extra, node_evidence, prior_weights, SpecPowerGate, timeframe_reachable, card_triage, budget_line, run_discovery, record, run_job); goldbot/research/autodisc/handoff.py (CandidateArm, write_candidates, pending, registered, record_run, runs); goldbot/research/autodisc/gen_gp.py (Admit, node_key, catalogue priors, GPConfig.leaf_priors, not_started); goldbot/research/autodisc/nightly.py (search_and_judge admit, backends_from_1m); goldbot/ops/bounded.py (run_bounded, cap_memory); goldbot/ops/jobs.py (discovery_nightly); goldbot/config.py (DiscoverySettings, scheduler.discovery_nightly); goldbot/db/migrations.py (aux 37 discovery_runs); config/settings.yaml'
test: 'tests/research/autodisc/test_discovery_nightly.py::test_the_holdout_is_refused_before_the_bar_file_is_opened; ::test_explore_bars_hold_no_row_from_2018_on_even_when_the_file_has_holdout_rows; ::test_a_per_year_bar_directory_never_opens_a_file_outside_the_explore_years; ::test_k_is_not_spent_on_a_spec_whose_power_is_below_the_adr_0085_floor; ::test_a_spec_with_power_at_the_floor_is_searched_and_counted_in_k; ::test_a_timeframe_no_spec_could_power_is_not_searched_at_all; ::test_priors_reweight_the_grammar_and_stay_inside_their_bounds; ::test_demo_labels_and_forward_results_become_node_evidence; ::test_a_dry_run_makes_no_registry_ledger_aux_or_handoff_writes; ::test_a_run_respects_its_time_budget_and_stops_before_the_next_timeframe; ::test_a_run_records_counts_k_survivors_and_power_verdicts_in_aux_and_the_ledger; ::test_a_survivor_that_cannot_run_live_is_recorded_but_never_handed_off; ::test_a_spec_whose_stage_read_failed_is_never_offered_again; ::test_a_run_over_the_quarter_budget_searches_nothing; ::test_catalogue_cards_get_a_power_verdict_and_cost_no_k; tests/test_discovery_nightly_job.py::test_the_job_is_registered_with_a_daily_slot_clear_of_the_other_nightly_jobs; ::test_a_child_that_overruns_its_budget_is_killed_and_reported; ::test_the_child_runs_at_the_configured_nice_level_and_returns_its_value; ::test_the_memory_cap_sets_the_data_segment_limit; ::test_discovery_settings_can_only_stay_gentle_on_the_brain'

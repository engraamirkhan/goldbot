id: R107
requirement: 'EVAL-2 twins (method v6 section 2, prereg 2026-11-09 section 4.1, quant finding 7): each signal gets up to M = 20 replay-only twins drawn from decision bars after its exit (intraday: the 7 days after exit; 1d: the 20 bars after exit), same instrument, timeframe, side, hour +/-1 h and regime level, excluding bars where any instance of the same family fires and bars at or after the window end; a pool under M uses every bar once (M_eff in n_twins), else M without replacement; stop, target and entry offset are the signal''s Wilder ATR14 multiples at the twin''s bar (ATR20 only in the risk floor); twins are scored on the signal''s replay and cost path (swap by the strict-interior rollover rule, #343); excess = signal net - mean twin net, clustered by session day (17:00 New York); twin correlation is an S0 diagnostic, never a multiplier; read_batch_index numbers BatchPRDS reads (2018-25 first EVAL-2 read = batch 15, TEST-OLD = 1) over every state/*_reads.jsonl'
status: 'implemented (quant approved 2026-11-09); S0 here is the synthetic-walk harness unit check, method S0 on real explore bars is Lane 4''s'
code: 'goldbot/research/catalogue/sim.py (`TWIN_M`, `TwinDraw`, `twin_pool`, `draw_twins`, `simulate_twins`, `same_instant_draws`, `excess_r`, `twin_correlation`, `session_day`); goldbot/research/catalogue/run.py (`read_batch_index`, `family_fire`, `unit_twins`)'

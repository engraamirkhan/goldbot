id: A7
requirement: First decision wins across dashboard and Telegram
status: implemented
code: 'goldbot/telegram/bus.py:114 (O_EXCL); decisions are read strictly (ADR 0010): one with a field this release does not know is skipped, logged once per proposal and counted, and the proposal expires; the engine publishes the count in engine_<account>.json `schema_skew` (`goldbot/base.py` `schema_skew_summary`, bounded) and goldbot/ops/health.py `check_schema_skew` FAILs `schema_skew:<account>` for 1 h after a decision was refused, then WARNs with its time (WARN for ignored fields; Telegram); every service publishes the same block in heartbeat_<service>.json (`Heartbeat`), checked as `schema_skew:svc:<service>`'

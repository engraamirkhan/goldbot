id: R159
requirement: 'An unpaired gold random control is replay_only (spec row control_mode; role control, gold only, not hashed): every candidate is recorded and labelled by the r2 replay and no order is ever sent; the engine refuses it before the budget, the RiskGate, an order intent or the order core. S0 is replay_only, not retired. S0R is exempt from control thinning (propensity 1) until 100 stop exits, then stops itself. S1A/S1B carry the 2026-11-13 retirement of the control-thinning amendment. The daily review reads replay parity (closed gold fills not excluded, joined to their r2 label; gap = side x (exit - fill) / stop_usd - label_mid_r; barrier agreement with time/weekend/broker exits as time; latest >= 300 fills over >= 10 session days per broker x TF band and pooled) and FIRES when the day-clustered 95 % CI of the mean gap lies outside +-0.02 R or agreement is under 90 % in two consecutive 300-fill windows; a fire is an incident, a feedback-loop health failure, an automatic review_actions row (replay_parity) and a permanent revocation honoured by the S5 gate (deciding cost charges the gap, L4 forward reads stop counting). Amendments: docs/research/prereg-amendment-2026-11-15-replay-only-controls.md, -eval2-s5-calibration.md, -hv-rule3-replay-control.md.'
status: implemented (2026-11-15, branch feat/replay-only-controls); the strategy ranking's matched read against S0 replay labels is not wired yet
code: 'goldbot/research/arms.py (Arm.control_mode, STOP_EXIT_READS, STOP_EXIT_READ_DONE); goldbot/engine/exploration.py (_send replay_only refusal and S0R propensity 1, stop_exits, refresh_cost_reads, STOP_EXIT_REASONS); config/exploration_arms.yaml (S0 control_mode, S1A/S1B retired_day, header); goldbot/research/replay_parity.py; goldbot/research/daily_review.py (_parity step, DailyReview.parity, Incident kind parity); goldbot/research/review_actions.py (replay_parity automatic kind); goldbot/research/eval2/forward.py (revoked_for, apply_s5 revoked); goldbot/research/catalogue/costs.py (deciding_cost s5_revoked); goldbot/ops/checks/loop.py (_parity); goldbot/research/exploration_data.py (fill_replay_pairs exit_utc, exit_reason, label_barrier); goldbot/research/eval2/runner.py (forward_revocations, run_forward_read revoked); goldbot/api/strategy_ranking.py + schema.py (RankRow.control_note, S0_REPLAY_NOTE); web/openapi.json, web/src/lib/schema.d.ts'
test: tests/test_replay_parity.py::test_the_gap_is_fill_r_minus_the_r2_sim_r_so_spread_on_both_legs_reads_as_parity; ::test_under_daily_relooks_a_true_gap_of_0_fires_in_under_5_percent_of_250_day_runs_over_13_scopes; ::test_weekend_flats_and_other_non_label_exits_leave_agreement_and_their_share_is_reported; ::test_the_pooled_read_leaves_out_the_1m_5m_band_and_a_pooled_fire_revokes_nothing; ::test_a_recorded_fire_stops_the_forward_read_counting_through_the_runner; ::test_the_forward_read_refuses_while_the_revocations_cannot_be_read; tests/test_strategy_ranking.py::test_a_row_read_against_s0_is_tagged_as_an_unwired_replay_control_and_never_a_verdict; tests/test_replay_only_controls.py::test_s0r_refuses_entries_while_its_stop_exit_count_cannot_be_read; ::test_replay_only_candidates_are_recorded_and_journalled_even_when_no_entry_may_go; ::test_a_position_open_when_its_arm_turns_replay_only_still_exits_at_its_stop_and_is_recorded; tests/test_replay_only_controls.py::test_a_replay_only_control_records_every_candidate_and_never_creates_an_order_intent; ::test_replay_only_is_a_control_mode_and_refused_on_any_other_role; ::test_replay_only_is_refused_on_a_non_gold_control; ::test_s0_is_replay_only_and_not_retired_so_it_keeps_recording_its_twin; ::test_s0r_and_the_execution_controls_stay_broker_traded; ::test_s0r_is_exempt_from_thinning_with_propensity_1_before_its_100_stop_exits; ::test_s0r_keeps_entering_at_99_stop_exits_and_its_target_exits_never_count; ::test_s0r_stops_itself_at_its_100th_stop_exit_and_says_so; tests/test_replay_parity.py::test_a_parity_passing_sample_does_not_fire_where_the_naive_point_rule_would; ::test_a_broken_sample_fires_on_the_mean_gap; ::test_barrier_disagreement_in_two_consecutive_300_fill_windows_fires; ::test_the_population_is_s5s_pairs_closed_before_the_reviewed_days_end; ::test_a_fire_alerts_records_an_automatic_review_action_and_marks_the_twin_reads_unvalidated; ::test_a_revocation_is_never_lifted_by_a_later_passing_read; ::test_a_revoked_band_is_unvalidated_for_the_forward_read_and_the_deciding_cost; ::test_a_recorded_fire_charges_the_s5_gap_in_the_deciding_cost_even_when_s5_passed; ::test_the_feedback_loop_check_fails_on_a_recent_fire

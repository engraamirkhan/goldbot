id: R136
requirement: 'BACKLOG 117: a bad exploration arm row must not stop the engine (exits keep running). An ARM-SPEC row that fails validation (e.g. the 2026-10-26 G1A/G1C `window_local` form), shares its id with another row (neither runs) or names no valid original as its twin is left out of the engine''s exploration config, logged and journalled `exploration_arm_dropped` with its reason (an engine incident of the daily review); an unreadable ARM-SPEC drops every arm. The engine starts, the other arms run, reconciliation and every exit run; a dropped arm sends no candidate and its open position is closed as an orphan. The research loader (`load_arms` without `rejected`) still raises, so CI refuses the bad file. RiskGate unchanged.'
status: 'implemented (2026-11-13, branch fix/engine-survives-bad-arm-row)'
code: 'goldbot/research/arms.py (`load_arms(rejected=)`, `_twin_problem`, `_reject`); goldbot/engine/exploration.py (`config_for`, `ExplorationConfig.invalid`, the start journal''s `why`); runner.py unchanged'

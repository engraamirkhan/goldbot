id: X7
requirement: Client order id `{account}-{bar_close_ts}-{intent_hash}` "written to a pending_orders table before order_send ... on restart the engine reconciles that table against history_deals_get"
status: implemented
code: 'goldbot/engine/runner.py `_execute` writes the id to state/orders_<account>.json (atomic) before `place_order` and refuses an id already sent (`duplicate_suppressed`); `_load_orders` on start reloads sent ids and open trades and looks up unconfirmed sends in broker positions and `deals_since` (client id or MT5 comment): a fill is adopted with its own agent, otherwise left `ambiguous` for the look-up (BACKLOG 72); ids are kept 7 days. Reading taken: rollback = restart, so the orders file a newer release wrote must load on the older one (ADR 0010). `_load_orders` reads it through goldbot/engine/store.py `JsonEngineStore.load_orders` (ADR 0023 step 1) with `goldbot/base.py` `load_record` (unknown fields dropped, a wrong type still stops the start). BACKLOG 72 (goldbot/engine/unconfirmed.py): a result that is neither a fill nor a definite reject leaves the row `ambiguous` (never re-sent); `_load_orders` and every pass look it up in positions and `deals_since`. Reading taken: ambiguous = not a definite reject; unfilled only after 120 s of clean empty looks (two looks in this process, both reads succeeded), never on row age alone; exits found by position id; the 7-day prune keeps unresolved rows until they turn terminal `unknown`. Rollback: an older release keeps the unknown status in sent_ids and never re-sends it; it only fails to resolve it. The risk file a newer release wrote also loads: `JsonEngineStore.load_risk` ignores keys it does not know and notes them with `note_schema_skew` (BACKLOG 74)'
test: tests/test_engine_safety.py::test_sent_ids_and_open_trades_survive_a_restart_and_are_never_re_sent; tests/test_engine_safety.py::test_a_restart_after_an_unconfirmed_send_adopts_the_fill_from_the_broker; tests/test_engine_safety.py::test_a_restart_after_an_unanswered_send_leaves_it_ambiguous_and_keeps_the_id; tests/test_cov_engine.py::test_an_approved_entry_is_sized_again_and_sent_once; tests/test_persistence_compat.py::test_the_older_release_reads_a_file_the_newer_release_wrote; tests/test_engine_safety.py::test_a_restart_after_a_rollback_loads_an_orders_file_a_newer_release_wrote; tests/test_engine_safety.py::test_a_restart_archives_an_expired_proposal_a_newer_release_wrote; tests/test_engine_safety.py::test_a_restart_warns_about_an_orders_file_table_this_release_does_not_know; tests/test_order_not_confirmed.py::test_an_ambiguous_result_keeps_the_sent_row_unresolved_and_it_is_never_resent; ::test_a_restart_resolves_an_unconfirmed_row_as_before; ::test_two_clean_looks_at_least_120_s_apart_are_needed_and_row_age_alone_never_declares_unfilled; ::test_no_deal_is_not_declared_unfilled_before_settle_s_boundary; ::test_a_fill_closed_before_the_next_check_is_recorded_from_its_deals; ::test_an_exit_deal_without_our_comment_is_found_by_position_id; ::test_a_partial_ambiguous_fill_records_the_dealt_lots; ::test_an_unresolved_row_becomes_terminal_unknown_after_7_days_with_one_notice_and_is_then_pruned; ::test_a_corrupt_ambiguous_row_stops_the_start_loudly; tests/test_persistence_compat.py::test_an_older_release_loads_a_file_with_ambiguous_rows; tests/test_store.py::test_risk_file_unknown_key_notes_skew_and_still_loads

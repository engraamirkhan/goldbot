id: X22
requirement: 'An account `enabled: false` in config/accounts.yaml never trades: its engine refuses to start (no restart loop), or with its own positions open only winds down (entries refused, exits never gated); a live account starts only enabled and past the phase gate'
status: implemented
code: goldbot/ops/services/engine.py (`ENGINE_DISABLED_EXIT`, `refuse_disabled`, `disabled_wind_down`); goldbot/risk/gate.py `account_disabled`; EngineConfig `wind_down`; goldbot/ops/linux/systemd/goldbot-engine@.service `RestartPreventExitStatus=78`; goldbot/ops/vps_bootstrap.ps1 NSSM `AppExit 78 Exit`
test: tests/test_engine_disabled_account.py::test_a_disabled_account_with_nothing_open_refuses_to_start_with_the_no_restart_exit_code; ::test_a_disabled_account_with_its_own_position_open_starts_to_wind_down_and_manage_the_exit; ::test_a_disabled_account_whose_positions_cannot_be_read_starts_to_wind_down_rather_than_strand_one; ::test_an_enabled_account_starts_trading_normally; ::test_the_configured_live_accounts_never_start_even_with_positions_open; ::test_the_gate_refuses_every_entry_on_a_winding_down_account; ::test_the_engine_unit_does_not_restart_a_refused_disabled_account

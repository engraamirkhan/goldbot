id: V7
requirement: 'Performance report for the performance-analyst and finance-auditor (ADR 0004 section 6 KPIs; opportunity-days.md 3.4), read only on state, no identifiers in the output: net and gross R and money per trade and per weekday by family, agent, timeframe, session (DEFAULT_SESSIONS at the entry), side and day type; owner approvals, rejections (by reason) and expiries with the shadow outcome of each signal (same agent, side and signal bar); realised against modelled commission (same currency only) and slippage by session; opportunity-day capture (range >= 1.5 x prior ATR(1d), >= 1 R) and £50+ days; drawdown, worst day and worst week against the stages and caps; counts everywhere, no interval or reading under 30 trades; a field a record lacks is "not recorded", never guessed'

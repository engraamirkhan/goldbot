id: R157
requirement: 'ADR 0085 (panel ruling 2026-11-15, research and demo promotion only). (1) A card starts only with >= 0.5 power at every gate it must pass and >= 0.25 joint power; otherwise it gets a "NOT STARTED (power)" registry row with no K and no data read. Quant re-ruling 2026-11-15: delta is fixed at 0.10 R, and goal_edge_R is information only and never gates. n_eff = n / (1 + (m_day - 1) rho_day) / (1 + (k - 1) rho_inst), with rho_day 0.25 (amendment 2026-11-25, quant Q3: n_eff = sum(u_i) / (1 + (m_w - 1) rho_day) / rho_inst term from the learn labels'' measured uniqueness, or for a count-only card also / max(1, c), c = signal days per instrument per trading day x hold_days; quant Q1: rho_day_le_60m, floor 0.05, for labels <= 60 min), rho_inst 0.5 or 0.7 for metal pools (priors), and n taken from the learn signal rate. power_g = Phi(delta sqrt(n_eff) / sd_tf - z_g) at Holm rank 1, with sd_tf = max(1.2, demo measured). A card also needs n_eff >= 200 at each fresh-data gate. The joint power is simulated on shared data. Every refusal is logged and takes no trial number. (2) The confirm is Holm at alpha_j = 0.05·2^-y / 4 batches a year, from one global never-reset ledger that is never a second pot beside EVAL-2 q 0.10. Fresh data means TEST-OLD once per family and never after EVAL-2, the holdout once per config, or a frozen forward replay; each read''s stamp (card hash, code SHA, feature version, cost-of-record version) must match its pre-registration. Ledger years are UTC and never reopened backwards. p-values come from the day-block bootstrap, the read is net of measured costs at the upper CI, the size comes from the fresh effect, and the registry-K DSR is report-only. (3) Rule-only cards drop the 1,500 / 60 minimums, with the 200-trade minimum replaced by a clustered n_eff of 200 on fresh data; regime years come from pooled family trades or pre-registered blocks, at 10 trades for each year of a block. (4) Phase gate 1 and the tournament passed_gates keep today''s criteria exactly.'
status: implemented for the library, predicates and phase-gate pin (2026-11-15, branch feat/power-first-gates). Autodisc/EVAL-2 rewiring, research_pass recording and the rho derivation are follow-ups (ADR 0085 consequences).
code: 'goldbot/research/power_first.py (PowerCard incl. hold_days and learn_uniqueness, Uniqueness, uniqueness, Segment, Gate, PowerVerdict incl. overlap_effect and rho_day, evaluate, joint_power, concurrency, overlap_effect, design_effect, goal_edge_r, holm_first_z, start_or_refuse); goldbot/research/promotion_confirm.py (FrozenStamp, ConfirmItem, PromotionLedger, batch_alpha, ledger_year, fresh_refusal, clustered_n_eff, run_batch, research_promotion_refusal, MIN_FRESH_N_EFF, LEDGER_ID); goldbot/research/gates.py (rule_only_promotion_gates); goldbot/research/registry.py (NOT_STARTED_POWER in NOT_TRIALS, no trial number, accepted only from start_or_refuse; goldbot/research/registry_sync.py keeps it unnumbered; phase_gate_refusal, phase_gate_pass_counts, formerly promotion_*); goldbot/research/cpcv_gate.py, goldbot/ops/gates_phase.py (read phase_gate_refusal); goldbot/config.py PowerFirstSettings (rho_day_le_60m, rho_day_for); config/settings.yaml research.power_first; docs/decisions/0085-power-first-gates.md'

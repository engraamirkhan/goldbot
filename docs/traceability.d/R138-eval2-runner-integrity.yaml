id: R138
requirement: 'BACKLOG 149 and 150: EVAL-2 reads of real cells go through `goldbot/research/eval2/runner.py` only. Every L2, L3 (batch p and read) and forward read first calls `assert_harness_sane(harness_hash())` (`forward=True` for forward reads) and refuses (`ReadRefused`, fail closed, nothing computed or written) on no report, a BLOCKED or failed test, a report for another hash or a self-test module that does not load; the module is executed from the file''s current bytes, never a cached module of that name, and only the runner calls l3_read, family_cv_p or forward_state. (a) a futility `registry_row` must name a PREREGISTERED row of the same family and config hash written before the read, not withdrawn and (ad hoc) not past STALE_PREREG_DAYS; (b) L3 units, batch p units and corroboration keep only `bound_end_ns` < 2025-10-01, the open of bar i + valid + hold + 1 on the sim''s bars (`unit_bound_end_ns`), units without it and carried cells with no registered time exit (BACKLOG 207) are refused; (c) the batch''s families and m_j come from a frozen batch card checked by sha256; every family p of batch j is written once, with the card hash and each family''s units hash, to state/catalogue_reads.jsonl before any read of the batch and `run_l3_read` takes `batch_p` only from there and refuses other units; the row has no `window` key, so read_batch_index and _claim are unchanged. K unchanged; no trial run.'
status: 'implemented (2026-11-13, branch fix/eval2-runner-integrity)'
code: 'goldbot/research/eval2/runner.py (`harness_gate`, `selftest`, `checked_futility_terms`, `unit_bound_end_ns`, `cut_at_holdout`, `freeze_batch_card`, `load_batch_card`, `record_batch_p`, `read_batch_p`, `run_l3_read`, `run_l2_read`, `run_forward_read`); confirm.l3_read signature unchanged'

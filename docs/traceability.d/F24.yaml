id: F24
requirement: 'BACKLOG 30a, opportunity-day features (`opportunity-days.md` 3.1; H-16, H-17, H-19, H-20, H-21): opt-in `day_type` family per 22:00 UTC opportunity day, joined as-of. H-16''s HAR model of the 08:00 London - 16:30 New York window range over A_D, refitted monthly on an expanding window (quant ruling Q-2) at the close of the last weekday before the month, with band cuts. GVZ staleness on 5 US business days. Every column point in time. The default set and `f-079deacc61` are unchanged, and sets with day_type have pinned versions (`f-1eada57050`, `f-93fbe9386d`). Reading taken: this ATR(1d) (mean true range of 20 stub-free opportunity days) is not the 1d-bar ATR (DESIGN, time and calendar)'
status: 'implemented (quant + data-engineer review: merge after fixes, fixes applied)'
code: goldbot/features/day_type.py (`enable()`, `opportunity_day`, `window_mask`, `daily_bars`, `daily_inputs`, `fit_har(regressors=)` with `HarFit.fitted_quantiles`, `monthly_refits`, `har_forecast(refit_at=)`, `reopen_gap`, `noise_components`, `gvz_columns`, `tier1_columns`); goldbot/data/macro.py `driver_frames` keeps value_date; scripts/research_pass.py `--day-type` (refused without `--us-calendar`, with `--discover`/`--cpcv`, or with `--from-year` after 2010), `--us-calendar-features`, `feature_ctx`, `day_type_info` (inputs on the trial row)

id: R150
requirement: 'BACKLOG 90 / ADR 0031 reading 9: the adaptive limits get the 20-day measured cost/model series, so the frozen cost rule (cost/model > 1.25 -> floors, 1.10-1.25 -> one step down) can fire. Per account, the closed gold fills (demo and live) of the last 20 risk days (UTC weekdays) before the decision day: measured = spread at the fill (decision spread) + entry slippage against the requested price + the lots-weighted exit-leg slippage (store exit_fills, stop overshoot included) + the record''s own commission and paid swap (account currency over the engine''s USD factor; else the account''s measured terms); model = the ask - bid close of the last dukascopy 15m bar closed at the entry (asof_join on its close time, at most 1 h old) + the extra cost and swap the strategies were qualified under (the settings priors, never the live cost table, which already holds the measured slippage). Pooled; slippage pooled signed and floored after. None below 20 measured fills, with a zero model cost, or with more than 20% of fills unmeasured (dq alert cost_ratio_unmeasured); a fill missing or with a non-finite part is counted unmeasured, never guessed; a failing series gives None with a log; fills entered after the last dukascopy bar (weekly refresh) are pending, not unmeasured. Tighten only: nothing loosens on it.'
status: 'implemented (2026-11-13, branch feat/cost-model-series); quant review round 1 fixed (qualified-cost model, record commission/swap, live fills, unmeasured share, dukascopy bars); awaits quant re-review; the replay still reads None (BACKLOG 255)'
code: 'goldbot/ops/cost_ratio.py (definition, MIN_FILLS, WINDOW_RISK_DAYS), goldbot/ops/limits_job.py (decide_account exit_legs, cost_ratio_20d into Evidence, result row cost_ratio_20d/cost_fills/cost_unmeasured/cost_model, dq cost_ratio_unmeasured; limits_job reads store exit_fills and dukascopy bars_15m)'
test: 'tests/test_cost_ratio_series.py (measured vs model components, swap over rollovers, the 20-risk-day window, population filters, None below the minimum, pooled ratio, price improvement floored when pooled, every missing part unmeasured, the model bar never after the entry; through limits_job: 1.0 keeps the ceiling, 1.2 one step down (cost_step), 1.3 the floors (cost_floor); no exit legs -> None; review round 1: live table ignored by the model, record commission/swap in USD and swap credit 0, live fills counted, >20% unmeasured -> None + dq, non-finite parts unmeasured, zero model cost -> None, dukascopy bar read, failing series -> None, adaptive-off account never measured)'

# The findings register (owner 2026-11-20: "feedback must close itself"; goldbot/ops/findings.py, RUNBOOK
# "Findings register"). One row per audit finding or owner directive. A row is closed only when its CHECK measures it
# fixed on the brain's data; the daily `findings_check` job re-measures every row and announces new, regressed,
# closed and past-due rows once a day on issue #34 (critical/high also on Telegram). Health `findings` WARNs while a
# critical/high row is past due.
#
# Rules for editing (refused at load otherwise, tests/test_findings.py):
# - PUBLIC file: no login, host, email, account number or money figure (no currency amount). Name accounts only
#   through patterns (`reconcile:*`), never the owner's real-money record. An open security weakness is a
#   `private: true` row with a generic title (detail in the private audit notes); its measurement is never published.
# - owner: an agent role in .claude/agents/ (the role accountable for the fix, not who found it).
# - check.fn: a registered check (goldbot/ops/finding_checks.py) with valid params. Prefer a measurement; `manual`
#   only where nothing can be measured, closed by setting done_on + evidence (a commit, PR or document) in a PR.
# - Never delete an open row to make it go away: change its due date or check in a reviewed PR with the reason in
#   `source`. Retiring a finding (e.g. the learner retired honestly) is a reviewed edit of its check.
#
# Seeded 2026-11-20 from the system audit (finance, performance, SRE, engineering, security, research, team) and the
# learning plan L1-L4. Due dates follow the audits' recommendations; PD + PO confirm owners and dates at the next cycle.

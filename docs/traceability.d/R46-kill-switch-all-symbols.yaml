id: R46
requirement: '"12%: close everything at market immediately" read as every position on the account, every symbol and every magic, the owner''s manual trades included (BACKLOG 62, ADR 0016 amendment; extends R13, R15 and R39): while `_kill_everything` is set the kill switch and the close retries read `account_positions()` and close each position with its own symbol''s quote and fill mode; an unreadable account book closes what `positions()` returns (the engine''s symbol, every magic) and never clears the flag; the flag clears only on a successful `account_positions()` read that lists nothing; a due close of another symbol is never dropped on the fallback read; a symbol without symbol info or a tick is a refused close (10021), backed off like a market-closed refusal on another symbol and retried at once on the engine''s; every due close records its symbol; exits never gated'
status: implemented
code: 'goldbot/engine/runner.py `_read_kill_book` (account book or the positions() fallback, failure logged once per streak), `_kill_switch` (scope any symbol/magic while the flag is set; flat only on a complete read with nothing to close; `kill_switch_close` rows carry symbol, magic, lots; `open_positions` counts the engine''s symbol), `_retry_closes` (same book; drops a missing close only when the book would list its recorded symbol); `_try_close` (records the symbol in every due close; backs off 10021 on another symbol, `NO_QUOTES_RETCODE`); goldbot/execution/mt5_adapter.py `_filling(symbol)`, `close` (symbol_select, refused 10021 without symbol info or tick, logged once per streak, no partial close of another symbol); goldbot/execution/paper.py `set_quote`, per-symbol `last_tick`/`_check_exits`, `positions()` engine symbol only, `account_positions()` every symbol; goldbot/execution/bridge.py unchanged (closes pass through unsized)'
test: 'tests/test_kill_switch_everything.py (the trip closes a EURUSD and an XAUUSD position; a refused EURUSD close is retried and does not block the XAUUSD close; a due EURUSD close is not dropped by a gold-only retry read; a due XAUUSD close gone from the fallback read is dropped; the flag stays set until account_positions reads flat; an all-ok run keeps the switch pending for one more read; an unreadable account book closes what positions returns and stays pending; after a restart a saved flag still closes the EURUSD position; after the account is flat halted refreshes close only this engine''s magic; a market-closed EURUSD close backs off while the XAUUSD close goes through; a due EURUSD close is retried through the no-quote pass; an auto-mode trip with account_positions raising still resets to propose; every kill_switch_close row carries symbol, magic and lots; open_positions counts the engine symbol of every magic; a hidden EURUSD close is backed off one row per step, not per tick; an XAUUSD close refused 10021 is not backed off; every due close records its symbol; a due close without a recorded symbol is kept on the fallback read); tests/test_close_any_symbol.py (close reads the fill mode of the position''s own symbol; symbol_select before the tick; no tick or no symbol info refused 10021, not raised; a close without a quote is logged once per streak; no partial close of another symbol; a 10010 partial close is resent with the remaining volume; paper per-symbol quotes and positions; paper and bridge close a non-engine symbol; the notional ceiling ignores closes)'

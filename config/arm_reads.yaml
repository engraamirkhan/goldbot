# Exploration arms whose single pre-registered read is recorded (prereg H-61: "each arm is read once, at its 300th
# admissible trade"; ADR 0050). Until an arm is listed here every view treats it as UNREAD: no aggregate of it (sum,
# mean, hit rate, rank, share, comparison with its control) leaves the server (goldbot/api/trades_ledger.py,
# goldbot/api/strategy_board.py). The evaluator adds the row with the read's verdict, in the same commit as the
# verdict; a row is never removed or edited.
# Controls are the null their arms are read against: they stay unread until listed (the board shows an arm's
# difference against its control only once both are listed).
# `state` is the annealing state the read set (volume-500 plan 4.1): C1 candidate, P proven, R retired; omitted = R
# (H-61: "not graduated at 300 -> retired"). The board freezes the read's figures at the arm's first n counted trades
# closed by `read_utc`.
#   <arm id>: {read_utc: "YYYY-MM-DDTHH:MM:SSZ", verdict: "<the recorded verdict, plain words>", state: C1}
reads: {}
# Arms whose pre-registration reads them at another n than H-61's 300 (the strategy board's "n of N"; the evaluator
# adds the row with the prereg section that sets it, before the arm's first fill). A size below 1 reads no arm.
#   <arm id>: <n>    # <prereg file>#<section>
read_at: {}

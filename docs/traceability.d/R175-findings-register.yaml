id: R175
requirement: 'Owner 2026-11-20, "feedback must close itself": every audit finding and owner directive is a row of the versioned, public-safe config/findings.yaml (owner role from .claude/agents, severity, due date, source, a registered check with validated parameters; a row with a login, host, email or money figure, an unknown check, a bad parameter, a duplicate id or an unknown owner is refused at load). A daily findings_check job evaluates every row on the brain''s data (a check that raises or cannot read its data is never a pass), stores the status history in aux.db, and announces new, regressed, closed and past-due rows (overdue again every remind_days) at most once a day on issue #34, plus Telegram for critical/high; unposted events stay pending. Health `findings` WARNs while a critical/high row is past due and not closed. CLI `findings` prints the table.'
status: implemented (2026-11-20, branch feat/findings-register); 51 seeded rows (22 measured, 29 manual); github_security needs an admin token to read
code: 'config/findings.yaml; goldbot/ops/findings.py; goldbot/ops/finding_checks.py; goldbot/ops/checks/findings.py; goldbot/ops/jobs.py (findings_check); goldbot/ops/commands/ops.py (findings); goldbot/ops/github_issues.py (issue, repository); goldbot/db/migrations.py (aux 41 findings_register); goldbot/config.py (FindingsSettings, scheduler.findings_check); config/settings.yaml'
test: tests/test_findings.py::test_the_shipped_register_loads_with_registered_checks_and_agent_owners; ::test_the_shipped_register_seeds_the_audit_headline_findings; ::test_a_register_carrying_a_login_host_or_money_figure_is_refused; ::test_a_row_naming_an_unknown_check_is_refused_at_load; ::test_controls_ratio_fails_an_account_with_more_broker_controls_than_signal_trades; ::test_trades_per_day_fails_a_weekday_outside_the_band_and_skips_the_weekend; ::test_bleeding_arms_fails_an_arm_still_trading_below_its_floor_and_ignores_a_stopped_one; ::test_learner_outputs_fails_on_empty_model_tables_and_passes_once_weights_are_written; ::test_a_check_that_raises_is_cant_check_never_a_pass; ::test_a_failing_row_past_due_raises_past_due_once_then_a_reminder_after_remind_days; ::test_the_job_stores_every_row_and_posts_one_comment_on_the_status_issue; ::test_the_job_posts_at_most_once_a_day_and_carries_new_events_to_the_next_day; ::test_a_failed_post_or_no_token_keeps_the_events_pending_for_the_next_run; ::test_health_findings_warns_while_a_high_row_is_past_due_and_not_closed; ::test_the_cli_prints_one_line_per_finding_from_the_last_stored_run

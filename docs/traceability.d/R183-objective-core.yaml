id: R183
requirement: 'ADR 0098 obj-v1 with the 2026-11-27 amendment (R-H one ub95 cost quantile, R-I offset form) and ML lifecycle plan 2026-11-25 N1, N2 (+A23), N5, N6, N10: one implementation of the objective used for training, threshold, selection and the gate. Net R clipped at ±10 R in every statistic (quarantine counted, never dropped; £ on unclipped R). Offset form: E[gross R given x] by uniqueness-weighted squared error on clipped gross R, cost(x) known at decision as an offset, keep iff pred − cost > 0, no keep floor. ABSTAIN from kept counts first (MIN_KEPT 100, 30 days); an abstained unit counts 0. S = mean(net R x keep) − max(0, mean net R) per judged unit, day-block bootstrap lower bound; S split into gross skill and cost avoidance. Gate legs: S >= 0.05 R with lower bound > 0, kept mean > 0, gross >= 0, control, 2x cost S >= 0. Weights normalised to sum to n_eff / H; penalty in effective rows (ADR 0102). AUC, accuracy, win rate and unweighted log-loss never reach a fit, threshold, select or gate path. Baseline ladder B0-B8 on the same rows; a model must beat max(B0, B3, B4, B5, B6, B8). Diagnostic battery descriptive only.'
status: implemented (2026-11-25, branch feat/objective-core). Not wired into sr-v3 / zoo-v2 / H-102 yet (their cards call it); the logit alternative's fit, deflation at the K of record and the eval-v1 report are not here.
code: goldbot/research/objective.py; goldbot/research/baselines.py; goldbot/research/diagnostics.py; scripts/research/obj_v1_h101_recompute.py; docs/decisions/0102-obj-v1-units-and-offset-diagnostics.md
test: tests/research/test_objective.py (clip, uniqueness, Kish, offset keep on a known DGP, weights x 10, phase copies, overlap H, objective_id refusal, abstain from counts, S, decomposition, stress, day-block bound, £/day, gate legs, import guard incl. planted AUC / LogisticRegressionCV / early_stopping, H-101 S ≈ −0.021 R integration); tests/research/test_baselines.py (B0-B8, learn-only B4, closed-label B6, in-sample B8, beats_ladder, shared abstain rule); tests/research/test_ml_diagnostics.py (calibration, BSS, within-arm AUC, seed SD, learning curve, shuffle check pass and loose-penalty flag, canary recovery, deciles)

# Rethink lane STRATEGY candidates (docs/research/rethink/strategy.md). Written 2026-11-02 BEFORE any outcome of these
# rules was computed; none is a trial until a pre-registration selects it (then it counts in K).
# Focus: multi-day / swing / position horizons and portfolio designs. Conventions:
#  - "1d close" = the Dukascopy mid at 21:00 UTC (NY 17:00 ET roll proxy); decision at the close, fill at the next 1m
#    open; financing per the W3 proposal (by date: 3-month bill + measured broker markup) and the three venue scenarios.
#  - "vol-scaled" = exposure = signal x (target_vol / EWMA(60d) realised vol), capped at 2x, rounded to the lot step.
#  - "position engine" = the daily target-exposure backtester proposed in strategy.md (4), step 2.
#  - Every rule is long/short unless the side says otherwise; long_only variants exist for the ETC venue.
#  - Data: "local" = raw/xauusd_1m_dukascopy_* or raw/positioning (CFTC 1986+, SPDR 2004+); "free" = Dukascopy other
#    symbols, FRED, CFTC, World Bank, Yahoo daily; nothing paid is required by any candidate.

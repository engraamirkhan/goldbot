id: V6
requirement: 'Playbook G-9 (BACKLOG 23): maximum adverse and favourable excursion in price, R (initial risk, from price) and time on every closed shadow trade (from the bars, label semantics: a long''s MAE from the bid low, a short''s from the ask high, the exit bar stop-first, the track starting at the entry stamped with the signal bar''s open) and every closed demo/live trade (from ticks while the engine holds it, never a price after the exit, persisted with the open trade, approximate from stored 1m bars across a restart or a late-seen close and flagged); old records load; tracking never blocks an exit; median MAE/MFE in R in the monthly report (exact and approximate records apart) and by exit type in attribution. Known biases of the exit-bar convention: a stop exit''s MAE (-1 R) and a target exit''s MFE (target / stop) are fixed by construction and marked so; stop-first understates the MFE of a bar that touched both levels; a gapped stop fills at the stop, so shadow MAE on stops is not comparable with live. A scaled position''s figures cover the whole position until its final exit'
status: in review
code: 'goldbot/labels/excursion.py (`Excursion`, `exit_bar_extremes`, `label_excursions`); goldbot/engine/shadow.py `_excursion_bar`; goldbot/engine/runner.py `_track_excursions` (after the per-tick exits; bar-close and reconcile exits on the same tick follow, their fill added by the record; frozen at a broker-held SL/TP, raw while an engine close is retried), `_closed_excursion` (from `_record_closed`: drops a track with an extreme after the exit, never folds the quote of a close confirmed without deals, fields empty when nothing of the path was observed (no usable track, no bar folded), R empty for an orphan adopted without an order record), `_load_orders`/`_adopt` flag `excursion_approx`; goldbot/ops/gates_phase.py `ClosedTrade`; goldbot/ops/monthly_report.py `account_month`; goldbot/research/attribution.py `ExitCell`, `render_markdown`. Not covered: research/owner_history.py (no price path in the MT5 statement)'
test: tests/test_excursion.py::test_a_closed_trade_records_side_correct_mae_and_mfe_from_the_ticks_it_was_open_for, ::test_the_exit_fill_counts_but_prices_after_a_server_side_exit_never_do, ::test_the_track_survives_a_restart_and_the_gap_is_filled_from_stored_bars_and_flagged_approximate, ::test_bars_that_straddle_the_entry_or_the_exit_are_left_out_of_the_approximation, ::test_stored_bars_without_the_exit_side_columns_keep_the_tick_track, ::test_a_tracking_exception_never_blocks_an_exit_or_the_record, ::test_a_run_up_after_a_manual_broker_close_never_enters_the_mfe, ::test_a_close_confirmed_without_deals_never_folds_the_quote_seen_at_the_sweep, ::test_ticks_through_the_engine_stop_count_raw_while_its_close_is_being_retried, ::test_a_broker_stop_freezes_the_track_and_the_record_stays_exact, ::test_a_position_that_outlives_its_freeze_by_more_than_the_tolerance_is_approximate_with_the_bars, ::test_an_exit_within_the_freeze_tolerance_stays_exact, ::test_a_close_with_nothing_observed_leaves_the_excursion_empty_instead_of_zero_r, ::test_a_dropped_track_with_no_covering_bars_leaves_the_excursion_empty, ::test_an_adopted_orphan_without_an_order_record_keeps_prices_but_no_r, ::test_a_shadow_trade_takes_mae_and_mfe_from_the_exit_side_of_each_bar, ::test_a_stop_bar_counts_the_adverse_side_to_the_stop_and_none_of_its_favourable_side, ::test_shadow_excursions_equal_the_labels_on_the_same_path, ::test_shadow_excursions_equal_the_labels_under_an_exit_policy, ::test_a_shadow_trade_opened_before_the_upgrade_leaves_its_excursion_empty, ::test_records_written_before_the_change_load_with_empty_excursions, ::test_the_monthly_report_keeps_approximate_excursions_out_of_the_exact_median, ::test_attribution_shows_median_mae_and_mfe_by_exit_type, ::test_attribution_marks_the_stop_mae_and_target_mfe_as_fixed_by_construction

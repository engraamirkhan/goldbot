id: R124
requirement: 'Backlog 160: open trades age on the base clock from every bar close after any cold start. Below the 400-bar floor (or before the first decision frame) `on_bar_close` decides nothing but still runs `_manage_open`, so `bars_held` counts and the time exit fires at its close; before, a cold start paused the count until the first decision frame (~30 h for a 15m arm) unless a failed or short history read held entries (R123, now superseded on this point). `bars_held` is saved in the orders file, so a restart resumes the count where it stopped. Exits only get earlier: in the 7-day replay golden exactly 6 shared trades moved, all from stop/target to an earlier time_exit inside the replay''s own cold window (2025-03-03); knock-on: 7 entries in on 03-03 (freed slots), 11 RB15 entries of 03-04 out (arm_budget, daily loss room), 5 later out (min_lot_exceeds_risk, lower equity). Below the floor a policy''s hard flat fires at the first base close at or after its deadline and the orders file is saved at the close (review C1, C2); the trail waits for its frame. Ledger legs of trades opened in a no-history cold start before R124 may show stop/target where the arm''s hold was a time exit; the performance-analyst ledger-vs-label reconciliation excludes or flags them. Bars missed while the engine is down: backlog 161'
status: 'implemented (2026-11-11, branch fix/cold-start-trade-ageing); in review (trading-safety, quant)'
code: 'goldbot/engine/below_floor.py (`manage`); goldbot/engine/runner.py (`on_bar_close` calls it below the floor); tests/data/engine_replay_identity_golden.json (regenerated)'

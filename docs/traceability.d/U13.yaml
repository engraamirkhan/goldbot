id: U13
requirement: Authenticator codes for re-arm and auto mode are inside an atomic code lockout (`code:<email>`, shared by dashboard and Telegram; never locks sign-in; failed sign-ins lock it too), and crossing the limit alerts the owner at most once an hour (security re-review)
status: implemented
code: 'goldbot/api/auth.py `_reserve` (one BEGIN IMMEDIATE check-and-count, used by every auth flow: login, forgot-password, recovery login, password change, recovery-code regeneration, codes; `_unreserve` when only the new password is refused), `verify_code_guarded`, `_lock_notice`, `revoke_sessions_cli` (`python -m goldbot.ops.run revoke-sessions`, refuses a state directory without aux.db); goldbot/api/app.py `rearm` (off the event loop), `automode_set`; goldbot/telegram/automode.py `owner_totp_ok`, `mode_command` (`MODE_LOCKED`)'
test: tests/test_api_code_lockout.py::test_wrong_auto_mode_codes_lock_the_switch_even_for_a_valid_code_and_alert_the_owner; ::test_telegram_mode_and_the_dashboard_share_one_lockout_counter; ::test_wrong_rearm_codes_lock_rearm_even_for_a_valid_code_and_alert_the_owner; ::test_a_right_code_clears_the_owner_counter; tests/test_api_security_followup.py::test_a_concurrent_burst_of_codes_checks_at_most_the_lockout_limit; ::test_a_concurrent_burst_of_logins_checks_at_most_the_lockout_limit; ::test_the_lock_notice_is_sent_on_crossing_the_limit_and_rate_limited; ::test_wrong_codes_lock_rearm_and_mode_but_not_sign_in; ::test_failed_sign_ins_also_lock_rearm; ::test_revoke_sessions_cli_signs_everyone_out; ::test_a_concurrent_forgot_password_burst_checks_at_most_the_lockout_limit; ::test_a_concurrent_recovery_login_burst_checks_at_most_the_lockout_limit; ::test_concurrent_change_password_and_recovery_code_bursts_check_at_most_the_limit; ::test_a_rejected_new_password_is_not_counted_as_a_failure; ::test_revoke_sessions_cli_refuses_a_state_dir_without_aux_db; ::test_revoke_sessions_cli_prints_the_database_it_used

id: X8
requirement: Reconciliation "on startup and every 30 seconds"; orphan "given a 1.5 ATR stop"; "Missing or out-of-range stops are reinstated"; unknown magic left alone
status: implemented
code: 'goldbot/engine/runner.py `_reconcile`, on the first tick, every `reconcile_every_s` (30) of tick time and every bar close: orphans in the magic range adopted and, without a stop, given 1.5 x decision-tf ATR from entry; a missing SL/TP or a stop looser than the one the engine set is reinstated; unknown magic listed as `foreign_positions` in the engine state and never touched. 2026-10-10 review: a position this engine sent is re-adopted with its pending_orders row''s agent, initial stop/lots (R) and signal ATR, never the trailed stop (`_adopt`); MT5 `positions_get` None raises (`last_error`), so a terminal fault is never a flat book; consecutive failed reads set `positions_unreadable` (entries blocked, health FAIL + Telegram after `risk.positions_unreadable_alert` = 5)'
test: tests/test_cov_engine.py::test_reconciliation_adopts_only_positions_in_its_own_magic_range; tests/test_engine_safety.py::test_reconciliation_protects_orphans_and_reinstates_missing_or_loosened_stops; tests/test_engine_safety.py::test_reconciliation_runs_on_start_and_every_30_seconds_of_tick_time; tests/test_closed_trade_review.py::test_reconcile_keeps_the_initial_stop_and_lots_for_r_not_the_trailed_stop, ::test_mt5_positions_raise_on_a_terminal_error_instead_of_reading_as_a_flat_book, ::test_failed_broker_reads_set_positions_unreadable_block_entries_and_clear_when_it_reads_again, ::test_health_warns_on_an_unreadable_book_and_alerts_after_n_failures_in_a_row

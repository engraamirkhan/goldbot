id: R33
requirement: 'Minimum-lot exception: below the minimum lot, exactly the minimum lot only if its realised risk (account currency) is within `risk.min_lot_risk_cap` (half in size-down), every other check after it; null = today (ADR 0004 decision 2, BACKLOG 25)'
status: implemented
code: 'goldbot/config.py `RiskSettings.min_lot_risk_cap` (null, or 0 < x <= 0.01); config/settings.yaml `risk.min_lot_risk_cap: null` (settings are global: enable per server in settings.local.yaml); goldbot/risk/gate.py `RiskLimits.min_lot_risk_cap`, `RiskGate.min_lot_cap` (clamped to the 1% maximum, halved in SIZE_DOWN or the combined size-down), the branch after `size_lots` in `check` (exactly `volume_min`; margin floor, combined exposure and everything before still apply; an allowed decision carries `min_lot_exception`); goldbot/engine/runner.py `_decide` puts `sizing`, `risk_fraction` and `risk_per_trade` on the journalled decision'
test: 'tests/test_sizing_review_fixes.py::test_tiny_live_limits_never_carry_the_minimum_lot_exception, ::test_a_tiny_live_engine_never_takes_the_exception, ::test_the_minimum_lot_tolerance_never_exceeds_the_one_percent_maximum (review MEDIUM-2, LOW-4: never in tiny-live; 1.2x tolerance capped at 1%); tests/test_min_lot_exception.py (£1,000 GBP 0.82% allowed, £700 refused, size-down and combined size-down refused at £1,000, USD $1,000 refused, inclusive cap boundary, 1% clamp and validation, never more than the minimum lot, sizes above the minimum lot unchanged, margin floor at $600, combined cap, halts first, missing conversion first, settings default off; ::test_an_exception_entry_reaches_the_decisions_journal_with_its_realised_risk, integration)'

# Rethink lane ACADEMIC: mechanical strategy/signal candidates for XAUUSD from peer-reviewed and working-paper
# literature, practitioner books and fund notes, plus commodity/FX/futures anomalies that plausibly port to gold.
# Companion: docs/research/rethink/academic.md (diagnosis, ranking, pre-registration drafts, sources).
#
# Integrity: written from sources and from published EXPLORE-window (2010-2017) numbers of earlier lanes only.
# No price, outcome or holdout data was read to write this file. K added by this file: 0 (nothing was run).
# Holdout (>= 2025-10-01) sealed. Every candidate that is later screened counts in K whether it fires or not.
#
# Field legend
#   grade: peer-reviewed | practitioner-documented | folklore | own-data   ("(unverified)" in `source` = cited
#          from memory, not fetched in this lane; treat as a lead, not as evidence)
#   reported: effect as published, sample, instrument; net = source charges realistic costs, gross = it does not
#   s3k: sprint3000 vocabulary mapping (docs/research/sprint3000/prereg.md) or "needs primitive: <id>"
#   data: local (gold 1m 2010+, FRED macro-v1, COT/GLD positioning-v1, US calendar 2010+, XAG/EURUSD/USDJPY 1m
#         2010-2017) | free (named public source) | paid
#   tested: no | partial (<what covered it>) | yes (<row, result>)
#   priority: A = pre-register as a single trial now | B = screen inside one bulk family trial |
#             C = feature only / low prior | X = do not test (already failed, retired, contradicted or untradeable)
#
# Primitives referenced (definitions in academic.md section 5)
#   CP    continuous vol-targeted position: daily forecast in [-20, +20], position = clip(f/10, -2, 2) x 10% / sigma_ann
#         (EWMA 35-day span of daily close-to-close returns), decision on the 21:00 UTC daily close, fill at the first
#         1m open after 23:00 UTC, 10% no-trade buffer, P&L = position x return - |trade| x RT bps - swap by side per
#         night held; read as annual SR on daily P&L (t = SR x sqrt(years)) against CP-HOLD and a sign-randomised twin
#   XS    external daily series as-of joined on available_utc (FRED, GPR, EPU, FX, equity, commodity closes)
#   CAL   calendar window (month, turn of month, FOMC cycle week, festival dates) with entry/exit at fixed clocks
#   EVT   threshold event on a daily series -> trade with wide ATR(20,1d) stop and fixed time exit (> 20 bars allowed)
#   W1    weekly bars (Friday 21:00 UTC close)
#   PAIR  two tradable legs (needs a second instrument: owner decision)
#   CURVE COMEX GC term structure (front/second contract settlements)
#   ML    a fitted model (fold-internal fitting only)

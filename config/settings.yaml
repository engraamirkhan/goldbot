# Goldbot settings. Everything time-related is UTC unless the key says otherwise.
symbol: XAUUSD
data_root: data            # Parquet root; DuckDB views sit over it

# The three "days" (see design: Data architecture / Time and calendar)
feature_day_anchor: { tz: America/New_York, time: "13:30" }   # COMEX settlement -> daily bars & features
risk_day_anchor:    { tz: UTC,              time: "00:00" }   # loss caps reset
# swap-day (the broker's server-midnight rollover) follows each broker's server_tz; the swap rates and triple day in
# `costs` are research priors until the broker's cost table reports its own.

timeframes:
  decision: [15m, 1h, 4h]   # 4h (proposal P4) is also a context timeframe of 15m/1h agents; 1d stays research-only
  context:  [4h, 1d, 1w]

brokers:
  icm:
    server_tz: Europe/Athens          # EET/EEST; resolved per bar, never a fixed offset
    symbol_map: { XAUUSD: XAUUSD }
    magic_base: 260100
    canonical_costs: true             # reference broker for backtest cost tables
  vantage:
    server_tz: Europe/Athens
    symbol_map: { XAUUSD: XAUUSD+ }   # confirmed from symbol_info at startup, this is only a hint
    magic_base: 260200
    canonical_costs: false

features:
  max_live_features: 40
  version: f1

labels:
  embargo_days: { 15m: 1, 1h: 2, 4h: 4 }
  purge_days:   { 15m: 2, 1h: 5, 4h: 10 }

walkforward:
  15m: { train_months: 24, test_months: 3, step_months: 3 }
  1h:  { train_months: 36, test_months: 6, step_months: 6 }
  4h:  { train_months: 48, test_months: 6, step_months: 6 }   # proposal P4; research.walkforward.WINDOWS["4h"]
  # no 1d: daily agents are research-only (the engine holds ~40 trading days of 1m bars, short of 120 daily bars)

risk:
  risk_per_trade: 0.005
  risk_per_trade_tiny_live: 0.001
  multiplier_bounds: [0.25, 1.5]
  daily_cap: 0.02
  weekly_cap: 0.05
  supervisor_daily_cap: 0.015
  supervisor_weekly_cap: 0.04
  drawdown_stage1: 0.08
  drawdown_stage2: 0.12
  drawdown_stage1_clear: 0.05
  max_positions_per_account: 2
  max_spread_points: 45
  stale_tick_seconds: 20
  blackout: { before_min: 15, after_min: 30, events: [CPI, NFP, FOMC, PCE] }
  min_target_over_cost: 2.5
  approval_window_seconds: 90
  positions_unreadable_alert: 5      # failed broker reads in a row before health fails and Telegram alerts

costs:
  slippage_prior_usd: 0.15           # per oz, used until 50 real fills exist
  commission_per_lot_side_usd: { icm: 3.5, vantage: 3.0 }
  # Swap, USD per lot (100 oz) per night, negative = paid. Prior; replace with the broker cost table. Long -60 is the
  # 2024-25 retail level at ~5% USD rates (~9-11% a year at $2,000-2,500 gold), so it overcharges the low-rate
  # 2010-2021 years (conservative). Short 0: the positive short swap of 2023-25 was negative before the 2022 hikes,
  # so no credit is assumed. Triple swap on Wednesday's rollover (0 = Monday).
  swap_long_usd_per_lot: -60.0
  swap_short_usd_per_lot: 0.0
  swap_triple_weekday: 2
  # After nightly_costs, publish the canonical broker's measured table (costs only: no account id, login, balance or
  # equity) as costs_measured.json on release costs-v1, which research.yml downloads. Needs the github-token in the
  # keyring; refused while swap is unmeasured or fewer than 50 fills exist. Turn on once the demo terminal runs.
  publish_release: false

# Research scheduler (VPS service `goldbot-scheduler`). Times are UTC; gold's daily break is 21:00-22:00 UTC in
# summer and 22:00-23:00 in winter, so the nightly job sits after both. Weekdays 0=Mon .. 6=Sun.
scheduler:
  nightly_costs:    { kind: daily,   at: "23:10", weekdays: [0, 1, 2, 3, 4], max_late_hours: 8 }
  saturday_retrain: { kind: weekly,  at: "06:00", weekday: 5, max_late_hours: 30 }
  tournament:       { kind: weekly,  at: "12:00", weekday: 5, max_late_hours: 30 }   # population round after the retrain
  research_director: { kind: weekly, at: "12:30", weekday: 5, max_late_hours: 30 }   # research plan before agents_weekly
  model_watch:      { kind: daily,   at: "23:30", max_late_hours: 20 }                  # CUSUM on new champions
  agents_daily:     { kind: daily,   at: "23:45", weekdays: [0, 1, 2, 3, 4], max_late_hours: 8 }   # data steward, risk officer
  agents_weekly:    { kind: weekly,  at: "13:00", weekday: 5, max_late_hours: 30 }     # journal coach, improvement agent
  monthly_research: { kind: monthly, at: "08:00", weekday: 6, max_late_hours: 30 }   # first Sunday of the month
  calendar_archive: { kind: daily,   at: "06:10", max_late_hours: 20 }                  # Forex Factory week -> calendar_events
  agents_presession: { kind: daily,  at: "06:30", weekdays: [0, 1, 2, 3, 4], max_late_hours: 1 }   # macro/news briefing before London
  recalibrate:      { kind: weekly,  at: "11:30", weekday: 5, max_late_hours: 30 }   # P9: bounded calibrator refit after the retrain
  drift_watch:      { kind: daily,   at: "23:40", max_late_hours: 20 }                  # PSI, calibration, CUSUM halts (M26/M27)
  gap_watch:        { kind: daily,   at: "23:55", max_late_hours: 20 }                  # gaps -> shadow founders / on-demand staff runs
  backup:           { kind: daily,   at: "22:15", max_late_hours: 20 }                  # restic -> Oracle Object Storage (ops/backup.py)
  restore_drill:    { kind: weekly,  at: "10:00", weekday: 6, max_late_hours: 30 }      # Sunday: restore latest to a temp dir and verify
  attribution:      { kind: daily,   at: "23:50", max_late_hours: 20 }                  # R by family/session/regime/cost -> state/attribution.json

  feed_reconcile:   { kind: daily,   at: "23:20", weekdays: [0, 1, 2, 3, 4], max_late_hours: 8 }   # D12: engine bars vs broker M1, last day

agents:
  monthly_cap_usd: 40.0              # total spend of all staff agents per calendar month (design: capped)
  model: claude-opus-5-5

news:                                # headline collector (VPS service goldbot-news); URLs unverified from the sandbox
  feeds:
    forexlive: https://www.forexlive.com/feed/news
    fxstreet: https://www.fxstreet.com/rss/news
    fed_press: https://www.federalreserve.gov/feeds/press_all.xml
    bls: https://www.bls.gov/feed/bls_latest.rss
  poll_seconds: 300
  model: claude-opus-5-5
  daily_cap_usd: 0.50                # scoring spend per UTC day, counted in agents.monthly_cap_usd
  shock_blackout_min: 30             # entries blocked after a high-relevance unscheduled shock (design)
  shock_min_relevance: 0.7

research:
  trial_budget_per_month: 12         # bounded loop: trials per specialist per month (feeds the deflated Sharpe)
  label_grid_paused: true            # monthly label-grid loop off until a family passes the primary-signal screen
  trial_budget_quarter: 20           # pre-registered trials per calendar quarter across all families (P2); raising it is an owner decision
  holdout_from: 2025-10-01           # held-out year: research never sees it; a passing config is scored on it once
  holdout_to: 2026-09-30             #   (scripts/research_pass.py --score-holdout), inclusive
  screen_min_events: 1000            # primary-signal screen (P4): events a rule needs; any screen with fewer events
                                     #   (whatever its sign or t) is "inconclusive (event floor)" and cannot retire the
                                     #   hypothesis. Changing it is an owner decision
  screen_min_events_daily: null      # override for rules whose signal is on daily bars (owner ruling A,
                                     #   docs/research/preregistration-2027Q1.md); null = screen_min_events
  director_floor: 2                  # research director: every unblocked family gets at least this many of the
                                     # month's trials; the rest of (budget x families) follows evidence of signal
  label_grid_step: 0.25              # +-25% on target/stop/max_bars
  cost_window_days: 30               # ticks used for the nightly spread table
  fills_window_days: 180             # fills used for the slippage table
  min_fills_for_slippage: 50         # below this a session keeps the slippage prior
  recal_min_samples: 50              # weekly recalibration (P9): no update below this many recent shadow outcomes
  recal_prior_trades: 200            #   the validated calibration counts as this many trades (prior weight)
  recal_max_shift: 0.05              #   a probability is at most this far from the validated calibrator
  recal_window_days: 182             #   outcomes (every candidate, taken or not) exited within this window
  registry: state/research_registry.jsonl
  models_dir: models

drift:                               # design: Drift and health (goldbot/research/drift.py)
  psi_warn: 0.1                      # PSI on a top-10 feature that warns
  psi_size_down: 0.25                #   ... that sizes the agent down to size_down_factor
  top_features: 10                   # by gain importance until per-decision TreeSHAP is stored
  ece_size_down: 0.08                # ECE on the trailing calib_trades taken shadow trades that sizes down
  calib_trades: 100
  min_calib_trades: 30
  size_down_factor: 0.5
  window_days: 30                    # recent candidates compared with the training distribution
  min_rows: 50
  cusum_k: 0.5                       # residual CUSUM (fixed; not yet tuned to 5% quarterly false alarms, row M25)
  cusum_h: 4.0
  dd_mult: 1.5                       # an agent's 30-day drawdown above 1.5x backtest halts the system pending review
  dd_window_days: 30

# Dashboard owner (goldbot/api/auth.py). The repo is public: NEVER put a real address here. On the server, put
#   auth: {owner_email: <your email>}
# in the git-ignored config/settings.local.yaml before the dashboard's first run. Unset, the owner account cannot be
# created; the owner role belongs only to this address.
# auth:
#   owner_email: owner@example.com

gates:                               # design: Roadmap gates and stop rule (goldbot/ops/gates_phase.py; `run.py gates`)
  # The design wants these "committed in writing before the first paper trade". Uncommented values are the design's
  # own numbers; every PROPOSED line needs the owner's sign-off. Evaluating a gate never records it or unlocks live.
  shuffle_auc_tolerance: 0.02        # PROPOSED: owner sign-off required. Leakage audit "shuffle test at chance": |AUC-0.5| <= this
  feed_max_mismatch_share: 0.01      # PROPOSED: owner sign-off required. "broker and Dukascopy bars agree": share of bars that differ
  backtest_min_dsr: 0.95             # PROPOSED: owner sign-off required. Roadmap figure says DSR >= 1.0, Validation says 0.95; DSR is a probability, 1.0 is unreachable
  backtest_min_trades: 500           # ">= 500 backtest trades" (model-filtered, best evaluated trial)
  paper_min_trades: 150              # ">= 150 paper trades" (closed demo-account trades since backtest_to_paper)
  paper_min_days: 182                # PROPOSED: owner sign-off required. Roadmap Phase 2 duration "6 months" as a minimum
  paper_expectancy_within: 0.5       # "expectancy within 50% of backtest" (no more than 50% below)
  paper_fills_within: 0.3            # "fills within 30% of target": measured slippage <= 1.3x the modelled slippage
  live_min_trades: 300               # ">= 300 live trades"
  live_min_days: 365                 # PROPOSED: owner sign-off required. Roadmap Phase 3 duration "12 months" as a minimum
  live_expectancy_within: 0.4        # "expectancy within 40% of paper"
  live_dd_mult: 1.5                  # "drawdown under 1.5x backtest"
  brokers_within: 0.15               # "brokers within 15%": the two brokers' live expectancy
  broker_min_trades: 50              # PROPOSED: owner sign-off required. Live trades per broker before they are compared
  stop_after_months: 18              # stop rule: "after 18 months of paper plus live"
  stop_min_pooled_trades: 500        #   "the pooled trade count exceeds 500"
  stop_confidence: 0.90              #   "the lower 90% confidence bound on expectancy is still below zero" (one-sided)

gaps:                                # bounded spawning (goldbot/ops/gap_watch.py, TRADER_LIFECYCLE section 3)
  founders_per_month: 2              # zero-capital SHADOW founders a month (into 4 reserved slots inside the 24 shadow cap)
  staff_runs_per_week: 3             # on-demand runs of existing read-only roles, inside agents.monthly_cap_usd
  hypotheses_per_run: 2              # regime / dead-family gaps filed as hypotheses for the research gates
  dq_window_days: 7                  # repeated data-quality errors: error events on at least
  dq_min_error_days: 3               #   this many distinct UTC days within the window
  regime_window_days: 20             # recent realised volatility = mean of the last 20 daily values
  regime_history_days: 3650          # volatility terciles cut from up to ten years of 1h bars

telegram:                            # owner user ids go in config/settings.local.yaml (per server), never here
  digest_at: "06:45"                 # daily owner digest at this UTC time, before London (goldbot/telegram/digest.py)

attribution:                         # daily deterministic attribution (goldbot/research/attribution.py, BACKLOG 12); reporting only
  window_days: 180                   # closed shadow trades exited in the last 180 days
  min_trades: 30                     # cells with fewer trades are marked "noise" and are not evidence
  calibration_bins: 10               # equal-width bins of p for predicted-vs-realised
  calibration_min_bin: 10            # bins with fewer candidates are marked noise
  trade_rows: 300                    # most recent per-trade cost rows kept in state/attribution.json

# Exploration arms of the historical matrix: the frozen ARM-SPEC 2026-10-25 (docs/research/arms-2026-10-25.md on
# research/high-volume-learning), one row per arm id. config_hash = sha256 of id, rule, timeframe, params, max_open
# (goldbot.research.arms.arm_hash): an edited arm fails to load; amend under a NEW id. status blocked: no history run
# until the note's condition is met. Regenerate hashes only for a new arm.
# twin_of: a broker twin (same rule body, own id and hash, no history run; goldbot.research.arms.load_arms).
# forward_only: no history run, live fills from a flat prior only (goldbot.research.arms.runnable_ids); not hashed.

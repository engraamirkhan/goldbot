id: M25
requirement: CUSUM "tuned to a 5% quarterly false-alarm rate"
status: implemented
code: 'goldbot/research/cusum.py `calibrated_h`: for allowance k (settings `drift.cusum_k`, 0.5), h is simulated on 100,000 in-control paths of the window''s expected trades (round(backtest trades_per_week x weeks)) of two-point trade residuals (win +sqrt((1-p)/p), loss -sqrt(p/(1-p))) resampling the agent''s taken p values per trade (0.01 buckets; the backtest hit rate for the champion watch; normal only when p is unknown); v is the smallest attained max-CUSUM value whose false-alarm rate is <= 5% at 95% confidence (outcomes are discrete) and h sits halfway between v and the next higher attained value (`decision_interval`: same rate, off the lattice, so the live code''s unrounded sums cannot flip a tie); cached per (trades, k, rate, p bucket or histogram). Live false-alarm rates with per-trade p (production `residual_cusum` arithmetic, 200k paths): 4.84-4.96% at p 0.35-0.55 and 0.30-0.70, 2/5/15 trades a week (the mean-p h gave 5.7-6.3% at 0.35-0.55); champion watch (12 trades) 2.6-2.9%. Realised quarterly rates at p 0.4/0.5/0.6 and 2/5/15 trades a week: 3.4-4.8% (the normal-based h gave 0.3-0.5% at p 0.4). research/drift.py `assess` uses the quarter and the p values of the shadow trades in the CUSUM; research/promotion.py `cusum_alarm` (model_watch) uses the watch''s own count (`cusum.watch_trades`, M24) and the backtest hit rate; `drift.cusum_false_alarm` 0.05; fixed `cusum_h` 4.0 only without a trade rate. Limits: the drift CUSUM runs over a version''s life, so 5% is per quarter of trading; a champion watch whose count cannot reach h reports `cannot_alarm` (M24)'
test: tests/test_cusum_calibration.py::test_realised_quarterly_false_alarm_rate_on_trade_residuals_is_between_three_and_five_percent; ::test_a_drop_from_p_0_4_to_0_3_is_caught_within_a_quarter_far_more_often_than_with_the_normal_h; ::test_normal_calibration_was_far_too_conservative_for_trade_residuals_at_p_0_4; ::test_h_is_the_most_sensitive_attainable_value_at_or_under_the_rate; ::test_two_week_champion_watch_is_calibrated_on_its_own_window; ::test_residual_cusum_and_cusum_alarm_use_the_calibrated_h; ::test_calibration_is_cached_per_p_bucket_and_falls_back_without_a_trade_rate; tests/test_drift.py::test_assess_halts_with_the_h_calibrated_on_two_point_residuals_at_the_trades_mean_p; tests/test_shadow.py::test_model_watch_uses_the_watch_count_h_on_two_point_returns_at_the_backtest_hit_rate; tests/test_cusum_calibration.py::test_h_sits_halfway_between_the_chosen_reachable_value_and_the_next_higher_one; ::test_live_residual_cusum_false_alarm_rate_with_per_trade_p_is_at_most_five_percent; ::test_live_champion_watch_false_alarm_rate_with_per_trade_p_is_at_most_five_percent; ::test_calibration_resamples_the_taken_p_values_not_their_mean

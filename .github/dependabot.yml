# Weekly dependency updates. GitHub Actions are pinned to commit SHAs (version in a trailing comment); Dependabot
# understands that form and bumps SHA and comment together. pip and npm updates are grouped into one PR per ecosystem
# per week so CI runs once, not once per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python:                          # minor/patch together; a major arrives as its own PR to be hand-tested
        patterns: ["*"]
        update-types: [minor, patch]
    # duckdb majors are no longer ignored (backlog 156 made the store read the same on 1.x and 2.x). A duckdb major
    # changes how Parquet timestamps read: run tests/test_store_duckdb_compat.py and the store-touching suites on it
    # before merging, and move the `<N` bound in pyproject.toml in the same PR.
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      web:                             # minor/patch together; a major arrives as its own PR to be hand-tested
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # openapi-typescript (web/src/lib/schema.d.ts generation) needs TypeScript 5; revisit when it supports 7
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node follows the Node runtime (22 on CI, brain, VPS, e2e; engines >=22): bump together with NODE_MAJOR
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

id: U31
requirement: 'Strategy board (backlog 132; docs/design/trades-ux-2026-10-27.md §2.3, §3.4; ADR 0050): GET /api/strategies/board, one row per family with its arms as variants; per arm n counted toward its read unit (the evaluator''s config/arm_reads.yaml: `read_at`, families read pooled in `read_units`, S0R''s stop exits in `counts`), fills today / 7 days, open now, ETA at the 7-day pace, status warming / running / read / retired (never "near its stop"), annealing state and the control it is read against; no result of an unread arm in the payload; after the read the recorded verdict, the frozen read-sample figures (net R per trade with 90% CI, hit rate, net money), "since read", and the evaluator''s recorded difference against the control (never computed); ordered by state and closeness to the read, never by result; lab sleeve totals only over 3+ unread arms per account-day, all sleeves of an account or none; engine strategies with n and a 90% CI'
status: 'implemented; quant conditions 1-2 of 2026-10-27 applied (ADR 0051). Not done: the anneal states C1 -> P are taken from the read row (no confirmation read is computed); a pooled unit is retired only when all its counted arms are at their H-61 stop (no pooled stop computed)'
code: 'goldbot/api/strategy_board.py (`board`); goldbot/api/strategy_labels.py (`ArmInfo.control_arm`, `_pairs`, `Catalog.read_size`, `ArmRead.state`); config/arm_reads.yaml (`state`, `read_at`); goldbot/api/app.py (`/api/strategies/board`); goldbot/api/schema.py (StrategyBoardView, BoardFamily, BoardVariant, ReadFigures, LabTotal, EngineStrategy); web/src/screens/trades/Strategies.tsx'
test: 'tests/test_strategy_board.py (progress-only before the read, warming, blocked arms off, prereg read size, retired at stop and never near it, families across timeframes, order by state not result, frozen read figures and since read, vs control only as recorded, pooled H-81 and H-80 units, S0R stop exits, unit-count blinding, partly-read family leak, sleeve totals and all-or-nothing withholding, engine figures with CI, learning counts, route sign-in and payload leak); tests/test_strategy_labels.py (control pairing on the shipped config, the evaluator''s units and sizes, fail closed); web/src/screens/Trades.test.tsx; web/e2e/dashboard.spec.ts (Trades)'

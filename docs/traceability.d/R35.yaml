id: R35
requirement: 'Per-agent loss-streak and entry-rate throttle (BACKLOG 21, playbook G-6), per decision, per account: when `risk.throttle.enabled`, RiskGate refuses an agent''s entries with `throttle_loss_streak` after `loss_streak` consecutive full losses (R <= -0.9; closes seen but not yet recorded count as provisional full losses) until `cooldown_bars` bars of its timeframe pass or a real shadow win (target or >= 0.25R) of its live model version, entered after the last loss, closes (the count persists past the cooldown), with `throttle_entry_rate` at `max_entries_per_day_per_agent` entries in the risk day, and with `throttle_unknown` when its facts cannot be derived; entries only, exits never gated; off by default (owner: thresholds)'
status: implemented
code: goldbot/config.py `ThrottleSettings` (enabled false, 3 / 4 / 3, each >= 1, unknown keys refused), config/settings.yaml `risk.throttle`; goldbot/risk/throttle.py `AgentThrottle`, `is_full_loss` (`STOP_REASONS` without R; `broker_close` without R not counted, documented), `loss_streak`, `entries_on_day`, `shadow_r`, `latest_shadow_win` (`SHADOW_WIN_R`, live version only), `agent_throttle` (shadow book read only while a streak is at the threshold and cooling down); goldbot/risk/gate.py `RiskLimits.throttle`, `RiskGate.throttle_cooldown`, `throttle_cooldown_until`, `throttle_reasons` (fails closed without a clock or a known timeframe), `check(..., throttle=)`; goldbot/engine/runner.py `Engine(live_versions=)`, `_agent_throttle` (None while off; queued and lost closes as provisional full losses, review HIGH-1; errors -> `unknown`), `_shadow_win` (mtime cache), `_throttle_state` (`error` on failure) -> `throttle` in engine_<account>.json, passed at the decision and at the approval re-check; goldbot/ops/run.py `live_versions` (champion per agent, at start and reload); goldbot/ops/health.py `check_throttle` (one check per agent, warn + Telegram via `NOTIFY_ON_WARN`; FAIL on a streak block without a cooldown end, `throttle_unknown` or an unpublished state)
test: tests/test_throttle.py (defaults and validation; disabled gate identical; streak triggers and clears on cooldown, cooldown in the agent's own timeframe, fail closed; rate cap at the 3rd/4th entry; full-loss definition incl. stop_out and broker_close; trailing streak per agent; shadow win clears only losses that exited before its entry, live version only, real wins only, book read only while cooling down; risk-day counting; ::test_the_stop_out_just_found_by_the_bar_close_counts_at_that_closes_decision (auto and propose, with an off control; review HIGH-1); a lost record still counts; restart persistence through the closed-trade record; open trades count, other accounts do not; shared shadow book with mtime cache; disabled engine computes nothing; errors refuse one agent and publish `error`; engine state; health per agent, warn, alert and FAIL cases; exits never call the gate or the throttle; ::test_disabled_replay_decisions_are_identical_to_no_throttle_and_enabled_ones_are_refused, integration)

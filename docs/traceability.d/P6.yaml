id: P6
requirement: 'Stop rule: "after 18 months ... pooled trade count exceeds 500 and the lower 90% confidence bound on expectancy is still below zero, or any single incident produces a loss larger than the weekly cap"'
status: implemented
code: 'goldbot/ops/gates_phase.py `evaluate_stop_rule` (one-sided 90% bound on net per-trade return; incident = one trade losing > `risk.weekly_cap` of equity); goldbot/ops/health.py `check_stop_rule` FAILs and alerts, halts nothing. The record it reads: goldbot/engine/runner.py `_note_closed`/`_record_closed` append one `ClosedTrade` per fully closed position to `state/closed_trades.jsonl` (durable append) on every exit path (broker target/stop via `_sweep_closed`, time exit, hard flat, trail, engine stop, blackout, kill switch, weekend, closed while down); a scale-out is folded into the final record; keyed by account + position id so a restart never duplicates; a write failure is logged (`closed_trade_record_failed`) and never blocks an exit. 2026-10-10 review: a failed write stays queued (persisted), retried up to `closed_record_retries`, then reported lost (health FAIL); a trade leaves the open table only on a confirmed close (`res.ok`); an unreadable or empty deal history never confirms a broker-side close (MT5 `history_deals_get` None raises); the append completes short writes and the loader skips a torn line and keeps the rest (dq warning `closed_trades_unreadable`); the kill switch and weekend rule retry each failed close until flat'
test: tests/test_closed_trade_review.py (no fake closes on a terminal fault, guarded kill switch/weekend, record retry and loss, short and torn writes); tests/test_phase_gates.py::test_stop_rule_needs_eighteen_months; ::test_stop_rule_needs_more_than_500_pooled_trades; ::test_stop_rule_needs_the_lower_bound_below_zero; ::test_single_loss_larger_than_the_weekly_cap_breaches_at_any_time; ::test_stop_rule_health_check_fails_with_what_it_does; tests/test_closed_trades.py (one record per exit path, long and short; ::test_a_scale_out_is_folded_into_one_record_for_the_position; ::test_no_duplicate_after_a_restart_and_reconcile; ::test_a_trade_closed_while_the_engine_was_down_is_recorded_on_restart; ::test_a_record_write_failure_is_logged_and_never_blocks_the_exit)

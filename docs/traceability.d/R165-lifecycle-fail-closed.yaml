id: R165
requirement: 'Reviews of 611d5adb (quant, trading-safety, sre, code; 2026-11-18): a discovered learning arm''s nightly read is evidence only when the night saw everything (F1 journal schema; F2 per arm and account: a journal row on every candidate session day and through the last candidate, judged before the void actions are filtered; F3 the engine''s arm_registry_capable marker since the arm''s since; F4 every account''s minutes read, never a silent drop), otherwise it holds unverified; a candidate''s recompute error voids only it and an arm''s read error holds only it (F5); an unparseable void row counts as on a taken candidate (F6); 2 unverified nights warn and are told (F7); the recompute reads only what the engine held (P1 1d/1w void; P2 no broker M1, no release minute after the cut-over; P3 replaced minutes flagged on the stored minute); each verdict cached append-only once its day has settled and its account is covered, an incomplete window void and retried (P4, Q1); 1d/1w unverified and refused at registration (Q2); a marker at every load of the arm (S1); a replacement found on every stored version (K1); the health check reads only the latest night and skips retired arms (K2); every refusal carries the engine''s and the night''s bracket and is counted by cause, a quarantined minute its own cause (C2); a void at the entry retires as ''bracket integrity: void at entry (engine)'' (C1); a retirement is never reinstated and a retired spec never re-registers (C3)'
status: 'implemented (2026-11-18, branch feat/lifecycle-ready); autodisc_register.LIFECYCLE_READY stays False pending the re-reviews; reviews: quant-reviewer, trading-safety-reviewer, sre, code-reviewer'
code: goldbot/research/arm_integrity.py (host_read, engine_journal, coverage_refusal, AccountMinutes, stored_recompute, integrity, verdicts); goldbot/research/arm_lifecycle.py (read_arm, run, summary, ArmRead); goldbot/ops/jobs.py (arm_lifecycle); goldbot/engine/arm_registry.py (CAPABLE marker); goldbot/engine/history.py (REPLACED_COL); goldbot/engine/broker_bars.py (_replace); goldbot/data/account_bars.py (written_at, replaced); goldbot/db/migrations.py (aux 39 arm_lifecycle_verdicts); goldbot/ops/checks/feeds.py (check_discovered_arm_reads); docs/research/arm-lifecycle-2026-11-18.md section 5
test: tests/test_arm_integrity.py::test_a_journal_without_its_schema_columns_reads_as_unusable_and_holds_the_arm_as_unverified; ::test_an_account_with_a_candidate_day_without_any_journal_row_holds_the_arm_as_unverified; ::test_an_account_whose_journal_ends_before_its_last_candidate_holds_the_arm_as_unverified; ::test_coverage_is_judged_on_every_journal_row_before_the_void_actions_are_filtered; ::test_without_a_capability_marker_since_the_registration_the_arm_holds_as_unverified; ::test_the_engine_journals_its_capability_when_it_loads_a_discovered_learning_arm; ::test_an_account_with_unreadable_minutes_holds_the_arm_as_unverified_never_dropped_silently; ::test_a_recompute_that_raises_voids_only_its_candidate; ::test_a_read_that_raises_holds_only_that_arm_unverified_and_the_other_arms_are_still_decided; ::test_a_void_row_whose_detail_does_not_parse_counts_as_on_a_taken_candidate; ::test_a_mismatch_refusal_journals_the_engines_and_the_nights_bracket_and_the_summary_counts_by_cause; ::test_a_candidates_verdict_is_cached_and_never_recomputed_on_a_later_night; ::test_a_void_candidate_is_not_cached_and_is_tried_again; ::test_a_bracket_changed_after_its_cached_verdict_is_refused; ::test_the_verdict_cache_is_append_only; ::test_a_1d_or_1w_window_cannot_be_proven_from_the_store_and_is_void_never_a_refusal; ::test_release_minutes_after_the_cutover_in_the_window_void_the_candidate; ::test_the_brokers_m1_never_fills_a_minute_the_engine_never_held; ::test_a_minute_flagged_replaced_and_written_after_the_decision_voids_the_candidate_without_a_dq_event; ::test_the_engine_stores_a_replaced_minute_with_its_flag; ::test_broker_bars_replace_queues_the_minutes_flagged; ::test_a_quarantined_minute_in_the_window_is_its_own_cause_and_never_a_refusal; ::test_a_discovered_arm_unverified_two_nights_running_warns_and_the_warning_is_told; ::test_a_retirement_is_never_reinstated_by_a_later_clean_read; ::test_a_retired_spec_hash_never_registers_again_and_writes_no_k_row; tests/test_arm_lifecycle.py::test_a_void_the_engine_journalled_at_the_entry_retires_the_arm_with_the_engines_reason; ::test_a_window_missing_its_last_minutes_is_incomplete_void_and_never_cached_then_stored_when_they_arrive; ::test_a_verdict_is_written_only_once_its_day_has_settled_and_its_account_is_covered; ::test_a_window_the_store_cannot_prove_leaves_the_arm_unverified_never_silent; ::test_registration_refuses_a_1d_or_1w_spec; ::test_every_load_of_the_arm_since_its_registration_needs_its_own_capability_marker; ::test_the_engine_writes_the_load_and_its_marker_at_the_same_time; ::test_a_replacement_written_after_the_decision_and_past_the_live_grace_is_found_through_the_store; ::test_an_arm_no_longer_read_or_retired_never_warns

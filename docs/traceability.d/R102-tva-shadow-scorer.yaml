id: R102
requirement: 'TradingView author ideas, the frozen shadow scorer (prereg-2026-10-28-tv-author-ideas.md sections 1.2-1.5, 2, 6 and amendment T-1): every live, gold idea of a followed author is scored nightly from its first-seen snapshot, point in time on available_utc (asof_join), net of spread, extra cost and swap, with the long and short reads as drift and random-direction baselines; holdout ideas refused; edited ideas (text changed after first sight) scored but never decision-eligible; the side only from a frozen extractor admitted by amendment and audit (none yet: unlabelled, counted), never an LLM; no order, arm or RiskGate path'
status: 'implemented (2026-11-06; no extractor admitted, so no decision-eligible idea until an amendment and its outcome-blind audit admit one)'
code: 'goldbot/research/tv_ideas.py (`direction_read`, `levels_read`, `daily_atr`, `atr_at`, `entry_minutes`, `score_ideas`, `save_scores`, `summarise`, `run_job`, `ADMITTED_EXTRACTORS`); goldbot/ops/jobs.py (`tva_scores`); goldbot/db/migrations.py (aux 23 `tva_scores`); goldbot/config.py + config/settings.yaml (`scheduler.tva_scores`)'

id: R39
requirement: 'A zero or collapsed equity read is confirmed before the 12% kill switch (BACKLOG 44, trading-safety re-verification LOW-C, ADR 0016): a read at 12% drawdown or more trips at once when the balance plus this symbol''s open P&L agrees with the equity within `risk.equity_check_tolerance` (2%) of the high-water mark; otherwise it is unconfirmed (no stage moves, entries refused `equity_unconfirmed`) and the account is read again on the next tick; two consecutive 12% reads always trip; one disagreeing read never does; exits never gated'
status: implemented
code: 'goldbot/config.py `RiskSettings.equity_check_tolerance` (0.02 in (0, 0.12)); config/settings.yaml `risk.equity_check_tolerance`; goldbot/risk/gate.py `RiskLimits.equity_check_tolerance` (`from_settings`), `AccountState.equity_unconfirmed`, `RiskGate.update_stage` (no stage move on an unconfirmed read), `check` (`equity_unconfirmed`); goldbot/engine/runner.py `_equity_unconfirmed` (in `_refresh_account` before the stage update), `on_tick` (an unconfirmed read forces the account read on the next tick); goldbot/api/entry_status.py `REASONS["equity_unconfirmed"]`'
test: 'tests/test_equity_confirmation.py (a single zero, collapsed or 13% uncorroborated read never closes a position and clears on the next real read; an unconfirmed read refuses entries and moves no stage, in the engine and in the gate; a disagreeing read between two 12% reads resets; two consecutive uncorroborated 12% reads close everything; two consecutive zero reads trip; a crash corroborated by balance plus open P&L trips on the first read; an unreadable book cannot corroborate and the second read confirms; an uncorroborated fast crash is closed on the very next tick, inside state_every_s; the tolerance comes from settings)'

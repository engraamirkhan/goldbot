id: M43
requirement: 'Owner-method study (docs/research/owner-method-study.md): "complete export, run locally, share only a summary". The analyser refuses a report inside any git work tree; the console and `owner_history_*.share.md` hold aggregates only (trade count, win rate, mean R or net USD/oz, holding-time quantiles, session/hour/weekday/side/holding histograms, winning and losing streaks, max drawdown %, risk per trade and leverage relative to equity, K and the Bonferroni bar), no account identifier, ticket or account-currency amount; the no-mt5-report hook rejects every format the analyser reads and its own outputs'
status: in review
code: 'goldbot/research/owner_history.py `refuse_in_git_tree` (in `load_report` and `main`, message without the path), `streaks`, `Trade.risk_pct`/`usd_per_oz`/`move_per_oz`, `GroupStat.mean_usd_per_oz`, `Summary.holding_quantiles`/`mean_usd_per_oz`/`mean_move_per_oz`/`median_risk_pct`/`max_risk_pct`/`longest_winning_streak`, `render_share` (stdout and `.share.md`, mode 0600), `write_outputs`; scripts/check_no_mt5_report.py `TRADE_HEADERS`, `_trade_header`, `NAME` (owner_history outputs; every zip member name), `PRIVATE_TITLE`, `_owner_json`, `_zip_is_report`, `_content_is_report` (gzip, zip members, UTF-8 BOM)'

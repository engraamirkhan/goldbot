id: R157
requirement: 'The red-box week (owner directive 2026-11-15; prereg-amendment-2026-11-15-redbox-week.md): on 15m, 1h and 4h, every close through an own-timeframe replica red box (sr_channels) is a demo learning-class trade on icm-probe at 0.01 lot, one open per arm, through the RiskGate: long above a top, short below a bottom, stop at the broken box''s far side plus 0.1 ATR14, target the next box edge beyond the close, no filter, the review features journalled on every candidate (money flow, swing trend, golden zone, break depth, box height, session, the 1h/4h box holding the close). A replay-only control per arm runs the same rule on seeded random ladders with the boxes'' spacing and never sends an order. £100 loss cap per arm (£300 the family), no candidate from 2026-11-22 22:00 UTC, K +6.'
status: implemented (2026-11-15, branch feat/kog-redbox-arm); trades once the 6 K rows are written on the brain
code: 'goldbot/research/arm_rules_redbox.py (crossing, next_edge, events, random_ladder, redbox_break, redbox_control, check); goldbot/research/arms.py (RULES, PER_TRADE_KEY, _per_trade_refusal); goldbot/research/arm_rules.py (RULE_FUNCS, lookback_bars); goldbot/research/arm_rule_versions.py; goldbot/engine/redbox_week.py (journal, htf_box, session_label); goldbot/engine/exploration.py (_signal hook); goldbot/engine/refusals_novel.py (SCOPE_CONTROLS); config/exploration_arms.yaml (RB*/RBC*); config/accounts.yaml (icm-probe)'
test: 'tests/test_redbox_week.py::test_a_close_above_a_box_top_is_a_long_and_below_a_box_bottom_a_short; ::test_the_target_is_the_next_box_beyond_the_close_and_the_stop_sits_beyond_the_broken_box; ::test_no_filter_a_shallow_break_on_a_bearish_body_still_trades; ::test_the_rule_finds_breaks_on_each_timeframe_with_every_review_feature; ::test_appending_bars_never_changes_a_past_candidate; ::test_live_on_its_lookback_window_gives_the_history_candidate; ::test_no_candidate_is_decided_at_or_after_the_end_of_the_week; ::test_the_control_never_sends_every_candidate_is_recorded_replay_only; ::test_a_per_trade_bracket_control_matches_only_the_same_construction_hold_band_and_end; ::test_the_family_is_three_learning_arms_each_with_its_replay_only_control_one_open_and_the_weeks_caps; ::test_a_red_box_break_is_sent_at_the_minimum_lot_through_the_riskgate_with_the_box_bracket; ::test_the_replay_only_control_places_no_order_and_its_candidate_is_recorded_blocked'

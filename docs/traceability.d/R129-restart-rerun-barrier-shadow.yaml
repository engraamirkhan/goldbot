id: R129
requirement: 'Backlogs 163, 164, 165 (follow-ups of backlog 161, R126). (163) A restart never decides a bar close the previous engine already processed: the last processed base close (`_closed_through`) is saved per book with the orders file (`closed_through`, written only once set) before that close''s decisions run (`downtime.processed`; a failed save is a tick error, the close''s exits still run) and restored at start (`downtime.restore`, journalled `restart_closed_through`; the exploration step''s `last_close` starts there too). A quote stamped before it is a late tick (one stale quote is one late bar, never LATE_BARS_BLOCK of them, so entries are not blocked) and its bar is never closed again, so a signal RiskGate refused at the original close cannot pass at a later price. An older file without the value starts as before. (164) The dead-feed time barrier counts a decision bar when any of its minutes is in `SessionTable.expected_open` (`downtime.open_bars`, the downtime catch-up''s rule, moved out of runner.py), so the bar the daily break ends inside counts and a CME holiday does not; the two counts agree on a hold. (165) Shadow trades open across a restart with a resume point (`ShadowTrade.last_bar_ts`, or no bar advanced yet) are held at the host engine''s start and, at the first base close whose history covers their missed span (1m window from their last bar, no `history.window_gaps` hole in between), replayed through the completed bars of their own timeframe visible before that close, exactly as `on_bar` (point in time; `shadow_replay.catch_up`, before the timeframes advance); one not covered within REPLAY_WAIT (6 h) or with no resume point is tagged `restart_gap` and advances from the next bar, as before. `restart_gap` trades are left out of `ShadowBook.stats` (promotion PerfStats, the director''s shadow_z), `outcomes` (recalibration), `returns_since` (re-arm) and `latest_shadow_win` (throttle). Shadow only: no order. Replay golden and store golden unchanged.'
status: 'implemented (2026-11-12, branch fix/restart-rerun-barrier-shadow); in review (trading-safety: 163, 164, throttle; quant: 164, 165)'
code: 'goldbot/engine/downtime.py (`processed`, `restore`, `open_bars`, `_open_count`); goldbot/engine/store.py (`OrdersSnapshot.closed_through`); goldbot/engine/runner.py (`_on_tick`, `_save_orders`, `_load_orders`, `_host_clock_exits`, `on_bar_close`; `_open_bars` removed; LINE_CAP 3083 -> 3073); goldbot/engine/shadow.py (`ShadowTrade.last_bar_ts`, held trades, `replay`, `release`, `restart_gap` exclusions); goldbot/engine/shadow_replay.py (`catch_up`, REPLAY_WAIT); goldbot/risk/throttle.py (`latest_shadow_win`)'

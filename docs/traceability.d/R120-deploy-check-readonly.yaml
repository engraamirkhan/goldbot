id: R120
requirement: 'The one-click deploy check (goldbot-telegram, every 10 min) never writes the repo: the unit runs with ProtectSystem=strict and /opt/goldbot/.git outside ReadWritePaths, so the old `git fetch` exited 255 on every pass and no version was ever offered. origin main is read with `git ls-remote`; the fast-forward and the commit subjects come from the GitHub compare API (read-only); MT5-box ancestry too. No answer from git or GitHub: no offer and one concise warning per outage, no traceback each pass. The sandbox is not widened'
status: 'implemented (2026-11-10, branch fix/deploy-check-readonly)'
code: 'goldbot/ops/deploy.py (`DeployWatch.check`, `_remote_main`, `_compare`, `_warn`, `_ok`, `mt5_notes`)'
test: tests/test_deploy.py::test_the_check_reads_the_remote_head_with_ls_remote_and_never_fetches; ::test_a_new_remote_commit_is_detected_on_the_next_pass; ::test_an_ls_remote_failure_logs_one_concise_warning_per_outage_and_offers_nothing; ::test_without_an_answer_from_github_nothing_is_offered; ::test_the_offer_lists_commit_subjects_newest_first_from_github; ::test_the_offer_says_so_when_github_cannot_place_the_mt5_box_commit; ::test_a_new_commit_that_passed_ci_is_offered_once

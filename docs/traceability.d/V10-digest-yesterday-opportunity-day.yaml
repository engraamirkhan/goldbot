id: V10
requirement: 'The digest''s "Yesterday" lines (proposals, trades closed) cover the opportunity day before the digest''s, [D-2 22:00, D-1 22:00) UTC for a digest on opportunity day D, through goldbot/ops/report_days.py and with no day arithmetic of their own, so they count the same closes as the "month so far" line; D is taken from the scheduled slot, not the send time, so a late send neither drops nor repeats a day; the header reads "Thu 15 Oct trading day (ended 22:00 UTC, 23:00 UK)" (local time from telegram.owner_tz, else Europe/London, dropped only when the zone cannot be resolved); a Saturday or Sunday with no proposal and no close shows one "Weekend: market closed" line instead, never Friday again; the risk and loss-cap lines stay on the risk day (00:00 UTC); reporting only, no limit changes'
status: implemented
code: 'goldbot/ops/report_days.py (`day_bounds`, `day_before`); goldbot/telegram/digest.py (`build_digest` `as_of`, `day_header`, `WEEKEND_LINE`, `month_line`); goldbot/telegram/bot.py (`_digest_pass` passes the slot); goldbot/ops/monthly_report.py (`build_monthly_report` / `month_to_date_line` `day`)'
test: tests/test_report_days.py::test_day_bounds_are_the_22_utc_instants_report_day_puts_on_that_day, ::test_day_before_is_the_opportunity_day_before_the_one_holding_the_instant; tests/test_digest.py::test_yesterday_header_names_the_trading_day_and_its_end_in_utc_and_uk_time, ::test_the_header_reads_the_owner_zone_and_drops_the_local_time_when_it_cannot_be_resolved, ::test_a_late_send_reports_the_slots_day_before_so_no_day_is_dropped_or_repeated, ::test_a_close_at_2159_is_yesterdays_and_one_at_2200_is_todays, ::test_a_digest_built_at_2159_and_at_2200_reports_different_yesterdays, ::test_yesterday_and_the_month_so_far_count_the_same_closes, ::test_weekend_digests_put_friday_on_saturday_and_the_sunday_reopen_on_tuesday, ::test_a_weekend_day_with_a_close_shows_its_rows_not_the_weekend_line, ::test_a_weekend_day_with_a_proposal_shows_its_rows_not_the_weekend_line, ::test_the_weekend_line_is_plain_and_points_at_tuesday

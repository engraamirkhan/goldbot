  BXR1H: {variant: "runner"}
  BXT1H: {variant: "structure target"}
  BXF1H: {variant: "fixed target"}
  BXR4H: {variant: "runner"}
  BXT4H: {variant: "structure target"}
  BXF4H: {variant: "fixed target"}
  XIMNY: {variant: "New York"}
  XIMLN: {variant: "London"}
  G1A: {variant: "key levels"}
  G1C: {variant: "random levels (control)"}
  XTV1: {variant: "TV rule 1"}
  VXTV2: {variant: "TV rule 2"}

id: M48
requirement: 'E-2 (BACKLOG 75; preregistration-2027Q1.md "Threshold rule, per row"): O-4 trades when the test-fold p >= the 2/3 quantile of the inner cross-fitted out-of-fold p of the training fold''s rows, never in-sample training p, with a test proving the cut never sees a test-fold row; every other row keeps the coded rule (calibrated p > break-even + 0.02), byte-identical. Reading taken: "inner cross-fitted p of the training side" = the raw out-of-fold p of the folds earlier than fold k that are also in fold k''s train_idx (quant condition 1; the set the calibrator already uses, cut to the training window), so no nested CV; the cut is label-free; only finite p count toward the quantile and the 50-row minimum (a NaN cut takes no trade); `np.quantile(method="linear")` and q = 2/3 are part of the rule (any other is a new trial); overlapping test folds raise; no break-even floor under the tercile rule (`share_taken_below_breakeven` is a diagnostic only, retention recorded, never read). Leakage ruling (quant plan review, 2026-10-17): on a CPCV path the earlier groups'' p may come from splits that trained on group g; the cut is a label-free scalar, the calibrator already has the larger exposure and CPCV only vetoes (ADR 0003), so no purged variant. A tercile result does not carry to live trading (break-even + 0.02): promotion needs a separate trial under the live rule.'
status: implemented (quant and code review pending)

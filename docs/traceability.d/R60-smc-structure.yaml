id: R60
requirement: 'TVR-1/TVR-2 (prereg-tv-replica-2026-10-18.md B2, B4a, B4b): a screening specialist for the owner''s chart structure overlay on 15m, computed from our own bars (never TradingView); candidates equal the written rules, stamped at confirmation (no look-ahead), series start pinned to 2010, one trade at a time, stop first on a shared bar, out of the loop grid; counts before dispatch (both withdrawn, 0 trials). Replica live use (quant review 2026-10-18): no plain tail, stale state refused, state bootstrapped from 2010 and persisted in SQLite every bar, re-bootstrap on any discontinuity'
status: implemented (engine wiring pending)
code: 'goldbot/specialists/smc_structure.py (`SmcStructureSpecialist`, typed `SmcStructureConfig`, presets tvr1/tvr2, `screening`, `state_lag`); scripts/smc_counts.py (counts only, holdout rows cut before resampling); goldbot/features/registry.py (`NEEDS_STATE`, `FULL_HISTORY`, `refuse_plain_tail`); goldbot/features/smc_replica.py (`ReplicaState.code_version` / `params_hash`, `StaleReplicaState`); goldbot/features/smc_live.py (`ReplicaFeed`); goldbot/db/migrations.py (aux 12 `replica_state`)'
test: tests/test_smc_structure.py::test_candidate_bars_equal_the_preregistered_definition; ::test_appending_later_bars_never_changes_a_past_signal_or_label; ::test_every_replica_column_is_prefix_invariant; ::test_research_refuses_a_series_that_does_not_start_at_the_pinned_2010_start; ::test_one_trade_at_a_time_in_total_so_an_opposite_signal_in_a_trade_is_skipped; ::test_the_stop_counts_first_when_stop_and_target_fall_in_one_bar; ::test_the_family_is_kept_out_of_the_loop_grid_the_pools_and_the_founders; ::test_a_configuration_hashes_the_same_whatever_spelling_of_its_typed_values; ::test_a_live_window_with_the_carried_state_decides_as_research_does_on_the_whole_series; ::test_the_specialist_reads_no_tradingview_value; tests/test_smc_live.py::test_the_engine_refuses_replica_features_on_a_plain_tail; ::test_a_state_from_other_code_or_other_parameters_is_refused; ::test_bootstrap_starts_at_the_series_start_and_the_state_is_persisted_every_bar; ::test_a_restart_resumes_from_sqlite_without_a_bootstrap; ::test_any_discontinuity_rebootstraps_and_the_values_stay_exact

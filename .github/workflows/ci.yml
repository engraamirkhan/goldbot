name: ci
# Gates every PR and every push to main (docs/process/ci-performance-2026-10-18.md has the measurements and design).
# The repo is public, so Actions minutes are free; the limits that matter are wall-clock and the account's 20
# concurrent jobs. Shape of a run (critical path: smoke -> the slowest integration shard):
#   changes            which jobs a PR needs (scripts/ci_changes.py); pushes to main always run everything
#   smoke              ~1 min, always: pre-commit (incl. the docs checks), ruff, full test collection.
#                      The test matrices wait for it, so a broken import costs one job, not twelve.
#   backend-lint       mypy (cached) and the API contract
#   backend-unit       4 shards x pytest-xdist -n auto
#   backend-integration 4 shards x -n auto; known-heavy tests spread first (tests/shard_weights.json); dry run in shard 0
#   frontend-checks    eslint, tsc, vitest
#   e2e                one job per Playwright project (each has its own server); flaky = failed (failOnFlakyTests)
#   backend, frontend  aggregates: the REQUIRED checks on main and the checks goldbot-deploy reads; keep these names
#   deployable         main only, when both aggregates are green: commit status `goldbot/deployable` + the owner's
#                      one-line deploy command in the summary. It never deploys (deploys stay owner-approved).
#   report-failure     any failure -> one GitHub issue labelled `ci` with the failing output (Claude sandboxes cannot
#                      download Actions logs); FLAKY / FAIL verdicts of re-run tests are included.
# Every check step runs even after an earlier one failed, so one run reports all failures. A failed pytest shard
# re-runs only its failed tests once, alone, and labels each FLAKY or FAIL; the job stays failed either way.
# scripts/ci_local.sh reproduces this matrix locally (shard counts are read from this file; tests/test_ci_workflow.py
# keeps the two in step). Runner: repository variable CI_RUNNER (e.g. "self-hosted"); unset = ubuntu-latest.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# Supply chain: third-party actions pinned to full commit SHAs (version in the comment; Dependabot bumps them). No
# secrets, no pull_request_target. The token has no scopes unless a job grants them.
permissions: {}
concurrency:
  # a new push to a PR cancels that PR's older run; main runs are per commit and never cancelled
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  GOLDBOT_ALLOW_PLAINTEXT: "1"   # headless runners have no keyring: the only place the plaintext secrets fallback is allowed
  FORCE_COLOR: "0"

jobs:
  changes:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: { contents: read, pull-requests: read }
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # the filter comes from the PR's BASE commit (already on main), never from the PR: a PR cannot edit
      # ci_changes.py to skip its own jobs. Pushes to main and manual runs do not use it (they run everything).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci_changes.py
          sparse-checkout-cone-mode: false
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "code=true" | tee -a "$GITHUB_OUTPUT"; exit 0; fi
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > changed.txt; then
            echo "could not list the PR's files: running everything"; echo "code=true" | tee -a "$GITHUB_OUTPUT"; exit 0
          fi
          if [ ! -f scripts/ci_changes.py ]; then   # base predates the filter: run everything
            echo "code=true" | tee -a "$GITHUB_OUTPUT"; exit 0
          fi
          python3 -I scripts/ci_changes.py < changed.txt | tee -a "$GITHUB_OUTPUT"

  smoke:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-backend
        with: { check: smoke }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: ~/.cache/pre-commit, key: "pre-commit-py311-${{ hashFiles('.pre-commit-config.yaml') }}" }
      - name: pre-commit
        if: success() || failure()
        run: set -o pipefail; pre-commit run --all-files --show-diff-on-failure --color never 2>&1 | tee ci-out/pre-commit.txt || { echo pre-commit >> ci-out/failed-smoke.list; exit 1; }
      - name: ruff
        if: success() || failure()
        run: set -o pipefail; ruff check goldbot tests scripts --output-format concise 2>&1 | tee ci-out/ruff.txt || { echo ruff >> ci-out/failed-smoke.list; exit 1; }
      - name: uv-lock
        # every job installs uv.lock as written (--frozen); a lock that no longer matches pyproject.toml fails here
        if: success() || failure()
        run: set -o pipefail; uv lock --check 2>&1 | tee ci-out/uv-lock.txt || { echo "uv.lock is stale - run uv lock and commit"; echo uv-lock >> ci-out/failed-smoke.list; exit 1; }
      - name: collect
        # every test module imports: a syntax or import error fails here in a minute, not in every shard
        if: success() || failure()
        run: set -o pipefail; pytest --collect-only -q -p no:randomly 2>&1 | tail -20 | tee ci-out/collect.txt || { echo collect >> ci-out/failed-smoke.list; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: ci-out-smoke, path: ci-out/, include-hidden-files: true }

  backend-lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-backend
        with: { check: backend-lint }
      - uses: ./.github/actions/setup-web
        with: { check: backend-lint }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # mypy re-checks by content hash when mtimes differ (fresh checkout), so a restored cache is never trusted blindly
        with:
          path: .mypy_cache
          key: "mypy-py311-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}"
          restore-keys: "mypy-py311-${{ hashFiles('pyproject.toml') }}-"
      - name: backend-typecheck
        if: success() || failure()
        run: set -o pipefail; mypy 2>&1 | tee ci-out/backend-typecheck.txt || { echo backend-typecheck >> ci-out/failed-backend-lint.list; exit 1; }
      - name: api-contract
        # the dashboard's types are generated from the backend's OpenAPI schema; both must be committed in sync
        if: success() || failure()
        run: |
          set -o pipefail
          { python scripts/export_openapi.py && npm --prefix web run gen:api && git diff --exit-code -- web/openapi.json web/src/lib/schema.d.ts \
            || { echo "API contract drift: run 'python scripts/export_openapi.py && npm --prefix web run gen:api' and commit"; exit 1; }; } 2>&1 | tee ci-out/api-contract.txt \
            || { echo api-contract >> ci-out/failed-backend-lint.list; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: ci-out-backend-lint, path: ci-out/, include-hidden-files: true }

  backend-unit:
    # each shard runs the tests tests/conftest.py assigns to GOLDBOT_SHARD=i/n, so every test runs exactly once;
    # the denominator must equal the matrix length (tests/test_ci_workflow.py checks it)
    needs: [smoke]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      GOLDBOT_SHARD: ${{ matrix.shard }}/4
      CHECK: backend-unit-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-backend
        with: { check: "backend-unit-${{ matrix.shard }}" }
      - name: backend-unit
        id: tests
        if: success() || failure()
        run: set -o pipefail; pytest -m "not integration" -q -n auto --tb=short --junitxml="ci-out/junit-$CHECK.xml" 2>&1 | tee "ci-out/$CHECK.txt" || { echo "$CHECK" >> "ci-out/failed-$CHECK.list"; exit 1; }
      - name: re-run failed tests once, alone (labels FLAKY/FAIL; the job stays failed)
        if: failure() && steps.tests.outcome == 'failure'
        run: pytest -m "not integration" --last-failed --last-failed-no-failures none -q -n 0 --tb=short --junitxml="ci-out/rerun-$CHECK.xml" 2>&1 | tail -60 || true
      - name: summary
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_summary.py summary --title "backend-unit $GOLDBOT_SHARD" "ci-out/junit-$CHECK.xml" --rerun "ci-out/rerun-$CHECK.xml" --append "ci-out/$CHECK.txt" --step-summary "$GITHUB_STEP_SUMMARY" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: "ci-out-backend-unit-${{ matrix.shard }}", path: ci-out/, include-hidden-files: true }

  backend-integration:
    needs: [changes, smoke]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      GOLDBOT_SHARD: ${{ matrix.shard }}/4
      CHECK: backend-integration-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-backend
        with: { check: "backend-integration-${{ matrix.shard }}" }
      - name: backend-integration
        id: tests
        if: success() || failure()
        run: set -o pipefail; pytest -m integration -q -n auto --tb=short --junitxml="ci-out/junit-$CHECK.xml" 2>&1 | tee "ci-out/$CHECK.txt" || { echo "$CHECK" >> "ci-out/failed-$CHECK.list"; exit 1; }
      - name: re-run failed tests once, alone (labels FLAKY/FAIL; the job stays failed)
        if: failure() && steps.tests.outcome == 'failure'
        run: pytest -m integration --last-failed --last-failed-no-failures none -q -n 0 --tb=short --junitxml="ci-out/rerun-$CHECK.xml" 2>&1 | tail -60 || true
      - name: dry-run
        if: (success() || failure()) && matrix.shard == 0
        run: set -o pipefail; python scripts/dry_run.py 1 2>&1 | tail -40 | tee ci-out/dry-run.txt || { echo dry-run >> "ci-out/failed-$CHECK.list"; exit 1; }
      - name: summary
        if: ${{ !cancelled() }}
        run: python3 scripts/ci_summary.py summary --title "backend-integration $GOLDBOT_SHARD" "ci-out/junit-$CHECK.xml" --rerun "ci-out/rerun-$CHECK.xml" --append "ci-out/$CHECK.txt" --step-summary "$GITHUB_STEP_SUMMARY" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # the JUnit timings refresh tests/shard_weights.json (scripts/ci_summary.py weights)
        if: ${{ !cancelled() }}
        with: { name: "junit-backend-integration-${{ matrix.shard }}", path: "ci-out/junit-*.xml", retention-days: 14 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: "ci-out-backend-integration-${{ matrix.shard }}", path: ci-out/, include-hidden-files: true }

  backend:
    # REQUIRED check (branch protection) and one of the two checks goldbot-deploy requires: keep the name. Passes only
    # when every backend job passed; lint and integration may be skipped only for a prose-only PR.
    needs: [changes, smoke, backend-lint, backend-unit, backend-integration]
    if: always()
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          ALWAYS: ${{ needs.smoke.result }} ${{ needs.backend-unit.result }}
          CODE_ONLY: ${{ needs.backend-lint.result }} ${{ needs.backend-integration.result }}
        run: |
          echo "changes=$CHANGES code=$CODE smoke,unit=$ALWAYS lint,integration=$CODE_ONLY"
          [ "$CHANGES" = success ] || exit 1
          for r in $ALWAYS; do [ "$r" = success ] || exit 1; done
          for r in $CODE_ONLY; do [ "$r" = success ] || { [ "$CODE" = false ] && [ "$r" = skipped ]; } || exit 1; done

  frontend-checks:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-web
        with: { check: frontend-checks }
      - name: frontend-lint
        if: success() || failure()
        working-directory: web
        run: mkdir -p ../ci-out; set -o pipefail; npm run lint 2>&1 | tee ../ci-out/frontend-lint.txt || { echo frontend-lint >> ../ci-out/failed-frontend-checks.list; exit 1; }
      - name: frontend-typecheck
        if: success() || failure()
        working-directory: web
        run: set -o pipefail; npm run typecheck 2>&1 | tee ../ci-out/frontend-typecheck.txt || { echo frontend-typecheck >> ../ci-out/failed-frontend-checks.list; exit 1; }
      - name: frontend-unit
        if: success() || failure()
        working-directory: web
        run: set -o pipefail; npm test -- --reporter=verbose 2>&1 | tee ../ci-out/frontend-unit.txt || { echo frontend-unit >> ../ci-out/failed-frontend-checks.list; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: ci-out-frontend-checks, path: ci-out/, include-hidden-files: true }

  e2e:
    # the real FastAPI backend serving the production build, driven by Playwright with the runner's preinstalled
    # Google Chrome (no browser download to cache; `playwright install --with-deps` stalled on apt). One job per
    # project: each project's spec has its own server and TOTP clock (web/playwright.config.ts).
    needs: [changes, smoke]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, auth]
    env:
      CHECK: e2e-${{ matrix.project }}
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-backend
        with: { check: "e2e-${{ matrix.project }}", extras: "" }
      - uses: ./.github/actions/setup-web
        with: { check: "e2e-${{ matrix.project }}" }
      - name: e2e
        if: success() || failure()
        working-directory: web
        env: { CI: "1", PYTHON: python, PW_CHROMIUM_PATH: "${{ vars.PW_CHROMIUM_PATH || '/usr/bin/google-chrome' }}" }
        run: set -o pipefail; { npm run build && npx playwright test --project="$PROJECT"; } 2>&1 | tee "../ci-out/$CHECK.txt" || { echo "$CHECK" >> "../ci-out/failed-$CHECK.list"; exit 1; }
      - name: summary
        if: ${{ !cancelled() }}
        run: |
          { echo "### e2e $PROJECT"; echo; grep -E '^ +[0-9]+ (passed|failed|flaky|skipped|did not run)' "ci-out/$CHECK.txt" || echo "no Playwright result line (see the step log)"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: "ci-out-e2e-${{ matrix.project }}", path: ci-out/, include-hidden-files: true }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: "e2e-report-${{ matrix.project }}", path: "web/playwright-report/\nweb/test-results/" }

  frontend:
    # REQUIRED check and one of the two checks goldbot-deploy requires: keep the name. Skipped jobs pass only for a
    # prose-only PR.
    needs: [changes, frontend-checks, e2e]
    if: always()
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          CODE_ONLY: ${{ needs.frontend-checks.result }} ${{ needs.e2e.result }}
        run: |
          echo "changes=$CHANGES code=$CODE checks,e2e=$CODE_ONLY"
          [ "$CHANGES" = success ] || exit 1
          for r in $CODE_ONLY; do [ "$r" = success ] || { [ "$CODE" = false ] && [ "$r" = skipped ]; } || exit 1; done

  deployable:
    # CD, main only: marks the commit deployable. It does not deploy: the owner approves (Telegram) or runs the
    # printed command on the server, and goldbot-deploy re-checks backend + frontend on that commit itself.
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: { statuses: write }
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=goldbot/deployable \
            -f description="backend + frontend green on main" -f target_url="$RUN_URL" > /dev/null
          { echo "### Deployable: \`${GITHUB_SHA:0:7}\`"; echo; echo "Owner-approved deploy on the server (one line):"; echo
            echo '```'; echo "sudo goldbot-deploy $GITHUB_SHA"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    needs: [changes, smoke, backend-lint, backend-unit, backend-integration, frontend-checks, e2e]
    if: failure()
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write   # the only job that writes issues: one issue per failed run
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: ci-out-*, path: ci-out, merge-multiple: true }
        continue-on-error: true
      - name: open an issue with the failing checks' output
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          JOBS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, pathlib, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]; sha = os.environ.get("PR_SHA") or os.environ["GITHUB_SHA"]
          ref = os.environ.get("GITHUB_HEAD_REF") or os.environ["GITHUB_REF_NAME"]
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          failed_jobs = [j for j, v in json.loads(os.environ["JOBS"]).items() if v["result"] == "failure"]
          out = pathlib.Path("ci-out")
          names = sorted({n for f in out.glob("failed-*.list") for n in f.read_text().split()}) if out.exists() else []
          failed = [out / f"{n}.txt" for n in names if (out / f"{n}.txt").exists()]
          names = names or failed_jobs
          parts = [f"Run: {run_url}\nBranch: `{ref}`\nFailed: {', '.join(names) or '(none reported)'}\n"]
          budget = 60000 // max(len(failed), 1)
          for p in failed:
              parts.append(f"### {p.stem}\n```\n{p.read_text(errors='replace')[-budget:]}\n```")
          if not failed:
              if out.exists() and any(out.iterdir()):
                  parts.append("(a job failed but wrote no output for the failed steps; see the run URL)")
              else:
                  parts.append("(no artifact exists: the jobs failed before running any step, e.g. no runner was assigned)")
          payload = {"title": f"CI failure on {sha[:7]} ({', '.join(names)})", "body": "\n".join(parts), "labels": ["ci"]}
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues", data=json.dumps(payload).encode(),
                                       headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          print(urllib.request.urlopen(req).status)
          EOF

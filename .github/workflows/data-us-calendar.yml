name: data-us-calendar
# Builds the point-in-time US economic calendar, 2010 onwards: tier 1 (CPI, NFP, PCE from FRED release dates; FOMC
# statements and press conferences from the Federal Reserve Board's meeting calendars) and tier 2 (PPI, retail sales,
# GDP, JOLTS, jobless claims from FRED; FOMC minutes from the Fed calendars; ISM manufacturing/services by rule), and
# publishes one Parquet, us_calendar.parquet, on the rolling release tag `calendar-v1` (Claude sandboxes cannot reach
# FRED or federalreserve.gov; runners can). Every row carries tier, event_utc (DST-correct from New York time), status,
# source and a conservative available_utc (goldbot/data/us_calendar.py; sources and licence in
# docs/decisions/0008-us-calendar-source.md). Needs the repo secret FRED_API_KEY (free key from
# fred.stlouisfed.org; the owner adds it in Settings -> Secrets; the script never prints it). The previously published
# file is kept as is; only new events, late stamps and cancellations are added. Only a release or asset that is
# confirmed missing counts as a first run; any other error fetching the previous file fails the run, and the script
# refuses (exit 2, no output) a frame that would drop published rows, so --clobber never replaces history. Research
# (scripts/research_pass.py --us-calendar) and scripts/fetch_data_release.py --us-calendar load it.
# The step summary carries a per-type, per-year count table, quarantined releases and refused types; no trial
# cites the calendar features until a quant review of the first run's table.
# Cost: about 1-2 runner-minutes a week (16 small FRED API calls, 13 Fed pages); the asset is well under 1 MB.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 0"   # Sundays 06:17 UTC: weekly; schedules change rarely and are known weeks ahead
permissions: {}   # least privilege: the token has no scopes unless a job grants them
concurrency:
  group: data-us-calendar   # one publisher at a time for calendar-v1
  cancel-in-progress: false
jobs:
  # Without the FRED_API_KEY secret the run is skipped, not failed: a warning annotation and the step summary name
  # the missing secret, the published calendar-v1 file stays as is, and no `ci` issue is opened. Owner step: add
  # the repo secret FRED_API_KEY. Cost of the check: about 1 billed runner-minute a week.
  key-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      present: ${{ steps.key.outputs.present }}
    steps:
      - id: key
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -n "$FRED_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            msg="FRED_API_KEY repo secret is not set: data-us-calendar skipped, calendar-v1 left as published. Owner: add the free key from fred.stlouisfed.org in Settings -> Secrets and variables -> Actions."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
  fetch:
    needs: key-check
    if: needs.key-check.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # release asset upload
      issues: write     # failure report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.11" }
      - run: pip install -e .
      - name: fetch the previously published file (its rows are kept as published)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prev
          # first run only when the release (or its asset) is confirmed missing; any other error (API, auth, network)
          # fails here instead of rebuilding from scratch and clobbering the published history
          if ! assets=$(gh release view calendar-v1 --json assets --jq '.assets[].name' 2> view.err); then
            cat view.err
            if grep -qi "release not found" view.err; then
              echo "first run: release calendar-v1 does not exist"; echo "first_run=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::cannot read release calendar-v1; refusing to treat this as a first run"; exit 1
          fi
          if ! grep -qx "us_calendar.parquet" <<< "$assets"; then
            echo "first run: release calendar-v1 has no us_calendar.parquet"; echo "first_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download calendar-v1 -p us_calendar.parquet -D prev
          test -s prev/us_calendar.parquet
      - name: build the calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FIRST_RUN: ${{ steps.prev.outputs.first_run }}
        run: |
          set -o pipefail
          args=(--out us_calendar.parquet --existing prev/us_calendar.parquet)
          if [ "$FIRST_RUN" = "true" ]; then args+=(--first-run); fi
          python scripts/us_calendar_data.py "${args[@]}" 2>&1 | tee report.txt
      - name: publish to release calendar-v1
        if: always() && steps.prev.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f us_calendar.parquet ] || exit 0
          # same retry pattern as data-positioning (create/upload can race or hit transient API errors)
          for i in 1 2 3 4 5; do
            { gh release view calendar-v1 >/dev/null 2>&1 || gh release create calendar-v1 --title "US economic calendar (rolling)" --notes "Point-in-time US release calendar (tiers 1 and 2) with available_utc, built by the data-us-calendar workflow. Uses the FRED(R) API but is not endorsed or certified by the Federal Reserve Bank of St. Louis." --latest=false; } &&
            gh release upload calendar-v1 us_calendar.parquet --clobber && exit 0
            sleep $((i * 15))
          done
          exit 1
      - name: report failure to issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # only to mask it: the posted report must never carry the key
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          try: body = open("report.txt").read()
          except FileNotFoundError: body = "(no report file; failure before the download step)"
          key = os.environ.get("FRED_API_KEY", "")
          if key:
              body = body.replace(key, "***")       # masked before truncating, so no fragment survives a cut
          body = body[-60000:]
          payload = {"title": "data-us-calendar failure", "body": f"Run: {run_url}\n\n```\n{body}\n```", "labels": ["ci", "data"]}
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues", data=json.dumps(payload).encode(),
                                       headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          print(urllib.request.urlopen(req).status)
          EOF

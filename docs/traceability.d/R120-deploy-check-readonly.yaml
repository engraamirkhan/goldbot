id: R120
requirement: 'The one-click deploy check (goldbot-telegram, every 10 min) never writes the repo: the unit runs with ProtectSystem=strict and /opt/goldbot/.git outside ReadWritePaths, so the old `git fetch` exited 255 on every pass and no version was ever offered (incident 2026-11-10). origin main is read with `git ls-remote` (30 s timeout, no credential prompt); the fast-forward, the commit subjects and MT5-box ancestry come from the GitHub compare API (read-only, streamed, 5 MB and 30 s caps, per_page=1 for the MT5 box). A malformed answer, a timeout or no answer gives no offer and one concise warning per outage, no traceback. Subjects are cut to 120 chars and the offer to one Telegram message. Each successful read is recorded in state/deploy/check.json; health `deploy_read` warns and tells the owner after 2 h without one. The sandbox is not widened'
status: 'implemented (2026-11-10, branch fix/deploy-check-readonly); security PASS, SRE approve-with-conditions applied'
code: 'goldbot/ops/deploy.py (`DeployWatch.check`, `_git`, `_remote_main`, `_compare`, `_warn`, `_ok`, `mt5_notes`, `_get_json`, `_subjects`, `offer_text`); goldbot/ops/checks/services.py (`check_deploy_read`); goldbot/ops/health.py (NOTIFY_ON_WARN deploy_read); goldbot/telegram/bot.py (offer text); docs/RUNBOOK.md 0.5 "No new version offered"; docs/incidents/2026-11-10-deploy-check-exit-255.md'
test: tests/test_deploy.py::test_the_check_reads_the_remote_head_with_ls_remote_and_never_fetches; ::test_a_new_remote_commit_is_detected_on_the_next_pass; ::test_an_ls_remote_failure_logs_one_concise_warning_per_outage_and_offers_nothing; ::test_a_hung_ls_remote_times_out_with_one_warning_and_no_offer; ::test_the_real_git_runner_has_a_timeout_and_never_prompts; ::test_without_an_answer_from_github_nothing_is_offered; ::test_a_malformed_compare_answer_gives_one_warning_and_no_offer; ::test_a_github_answer_larger_than_the_cap_is_refused; ::test_a_github_answer_past_the_deadline_is_refused; ::test_a_small_github_answer_is_read_streamed_with_a_timeout; ::test_the_mt5_box_compare_asks_github_for_one_commit_only; ::test_a_long_subject_is_cut_and_the_offer_text_fits_one_telegram_message; ::test_a_successful_read_records_its_time_and_a_failure_keeps_it; ::test_the_deploy_read_check_is_ok_while_reads_succeed; ::test_the_deploy_read_check_warns_and_tells_the_owner_after_two_hours_without_a_read; ::test_the_deploy_read_check_warns_when_no_read_ever_succeeded; ::test_the_offer_lists_commit_subjects_newest_first_from_github; ::test_the_offer_says_so_when_github_cannot_place_the_mt5_box_commit; ::test_a_new_commit_that_passed_ci_is_offered_once

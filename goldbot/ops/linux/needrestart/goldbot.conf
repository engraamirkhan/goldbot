# goldbot: needrestart never restarts a goldbot unit (installed as /etc/needrestart/conf.d/goldbot.conf by
# mt5_bootstrap.sh, brain_bootstrap.sh and mt5-box-upgrade.sh install).
# Incident 2026-10-22 (docs/incidents/2026-10-22-icm-demo-bridge-23h.md): unattended-upgrades installed a liblzma5
# update at 06:58 UTC on a weekday and needrestart then restarted the MT5 terminal, Xvfb and the bridge in the London
# session; the terminal came back unattachable and the icm-demo bridge was down 23 h. Services keep the old library
# mapped until their next planned restart (a reboot or the attended upgrade, both with the market closed).
$nrconf{override_rc}{qr(^goldbot-)} = 0;

id: R159
requirement: 'Discovery nightly on the brain (owner directive 2026-11-18, ADR 0090): a bounded nightly G2 search on 1h, 4h and 1d over the explore window only (bars through load_research_bars, the holdout sealed), steered by grammar-node priors from demo labels and from each discovered arm''s forward result, every spec power-gated by ADR 0085 before it is ledgered (no K on a refused spec, refused draws redrawn at sampling; none admitted once autodisc:G2 has been read on TEST-OLD), the night''s registry rows inside the quarter''s trial budget (assert_budget) and its planned K inside the quarter''s entry of research.discovery.k_cap_quarter (2026Q4 15000, 2027Q1 0, unlisted refuses; power refusals counted, not K), costs at the cost of record v3 per (session, exit) cell in bps on mid labels (the spread charged once), priors only from demo labels decided from 2026-10-01; survivors that can run live and whose kill rule can read them by until (50 candidates, 10 signal days) offered, the forward power verdict reported not evidence as candidate arm rows for registration; a run record in aux.db and the discovery ledger; on the brain in a niced, memory-capped child (oom_score_adj 500) with a wall-clock budget, killed when it overruns, one run at a time (flock), every unfinished child recorded, elapsed and peak RSS in the result; a dry run writes nothing.'
status: implemented (2026-11-18, branch feat/discovery-nightly); off until a host enables it with bars_path after the quant and sre GO
code: 'goldbot/research/autodisc/discovery.py (load_explore_bars, cor_v3_cells, cell_charge, after_holdout, node_evidence, prior_weights, SpecPowerGate, test_old_spent, forward_verdict, kill_unreadable_rule, timeframe_reachable, card_triage, budget_line, quarter_k_used, run_discovery, record, record_failed, run_lock, run_job); goldbot/research/autodisc/handoff.py (CandidateArm, write_candidates, pending, registered, record_run, runs); goldbot/research/autodisc/gen_gp.py (Admit, node_key, catalogue priors, GPConfig.leaf_priors, not_started, refused_by_power, run_gp redraw); goldbot/research/autodisc/outcomes.py (build_tensor extra_cost_frac); goldbot/research/autodisc/nightly.py (search_and_judge admit and neighbours admitted, backends_from_1m mid_labels); goldbot/ops/bounded.py (run_bounded, cap_memory, volunteer_for_oom, peak_rss_mb); goldbot/ops/jobs.py (discovery_nightly); goldbot/config.py (DiscoverySettings, scheduler.discovery_nightly); goldbot/db/migrations.py (aux 37 discovery_runs); config/settings.yaml'

id: R157
requirement: 'ADR 0085 (panel ruling 2026-11-15, research and demo promotion only). (1) A card starts only with >= 0.5 power at every gate it must pass and >= 0.25 joint power; otherwise it gets a "NOT STARTED (power)" registry row with no K and no data read. The min edge is max(0.10 R, the GBP 50/day edge). The sd comes from a pre-set per-timeframe table. Trades are extrapolated from the learn signal rate. n_eff is clustered by day and across instruments. The joint power is simulated on shared data. Every refusal is logged. (2) The confirm is Holm at alpha_j = 0.05·2^-y / 4 batches a year, from one global never-reset ledger that is never a second pot beside EVAL-2 q 0.10. Fresh data means TEST-OLD once per family and never after EVAL-2, the holdout once per config, or a frozen forward replay; each read is stamped with the card hash, code SHA, feature version and cost-of-record version. p-values come from the day-block bootstrap, the read is net of measured costs at the upper CI, the size comes from the fresh effect, and the registry-K DSR is report-only. (3) Rule-only cards drop the 1,500 / 60 minimums, with the 200-trade minimum replaced by a clustered n_eff of 200 on fresh data; regime years come from pooled family trades or pre-registered blocks. (4) Phase gate 1 and the tournament passed_gates keep today''s criteria exactly.'
status: implemented for the library, predicates and phase-gate pin (2026-11-15, branch feat/power-first-gates). Autodisc/EVAL-2 rewiring, research_pass recording and the rho derivation are follow-ups (ADR 0085 consequences).
code: 'goldbot/research/power_first.py (PowerCard, Segment, Gate, PowerVerdict, evaluate, joint_power, design_effect, goal_edge_r, holm_first_z, start_or_refuse); goldbot/research/promotion_confirm.py (FrozenStamp, ConfirmItem, PromotionLedger, batch_alpha, ledger_year, fresh_refusal, clustered_n_eff, run_batch, research_promotion_refusal, MIN_FRESH_N_EFF, LEDGER_ID); goldbot/research/gates.py (rule_only_promotion_gates); goldbot/research/registry.py (NOT_STARTED_POWER in NOT_TRIALS; phase_gate_refusal, phase_gate_pass_counts, formerly promotion_*); goldbot/research/cpcv_gate.py, goldbot/ops/gates_phase.py (read phase_gate_refusal); goldbot/config.py PowerFirstSettings; config/settings.yaml research.power_first; docs/decisions/0085-power-first-gates.md'

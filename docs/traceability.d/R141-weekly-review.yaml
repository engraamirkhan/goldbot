id: R141
requirement: 'Review loop item 2 (architect plan 2026-11-13): a weekly review (Saturday 13:00 UTC, after research_director) of the seven days before its slot ranks one action list into aux.db `review_actions` (migration 30, with `review_weeks`; one set a week, a restart keeps the first): per family net result against its matched control from the strategy ranking''s figures (handed in by the job, ADR 0053 6f: research never imports the ranking; a missing control reads "unpaired", never an edge), loss drivers from state/attribution.json (negative after the row bar, report at most 14 days old), cost drift against config/cost_of_record.yaml (week above the 90% upper bound on 30+ fills), reads due at their registered size, MFE/MAE exit diagnostics from exploration_trades (rows without mfe_r counted, never guessed), and the Monday roll-up''s variant proposals (each joins once; the roll-up is marked read with daily_review.mark_weekly_consumed for the R140 loop check). The only automatic action is a stop already registered in config/arm_stops.yaml that a daily review found breached and exploration_arm_status lacks (daily_review.retire, INSERT OR IGNORE; tighten only). The research director consumes unconsumed actions once (keyed by its slot) into ResearchPlan.review_queue without moving any budget; backlog kinds go to one scrubbed GitHub issue labelled `review` a week; the Sunday digest counts the week in "Changed this week". No order path; risk/gate.py, engine/exploration.py and limits_job.py unchanged.'
status: 'implemented (2026-11-13, branch feat/weekly-review); not deployed'
code: 'goldbot/research/weekly_review.py (new), goldbot/research/review_actions.py (new), goldbot/db/migrations.py (aux 30), goldbot/research/director.py (build_plan review_queue, ResearchPlan.review_queue), goldbot/research/daily_review.py (mark_weekly_consumed, same text as R140), goldbot/ops/jobs.py (weekly_review, review_queue), goldbot/telegram/weekly_digest.py (changed_lines), goldbot/config.py + config/settings.yaml (weekly_review, scheduler.weekly_review)'
test: 'tests/test_weekly_review.py::test_actions_only_tighten; ::test_proposals_are_consumed_once; ::test_restart_mid_run_keeps_one_action_set; ::test_missing_control_reads_unpaired_not_edge; ::test_the_sunday_digest_says_what_changed_this_week; ::test_the_director_plan_carries_the_consumed_actions_and_its_budget_does_not_move; ::test_an_unreadable_rollup_is_not_marked_read; cost, loss, exit, read-due, ranking, issue, compat and wiring tests; tests/test_jobs_integration.py; tests/test_health_registry.py golden; tests/test_persistence_compat.py'

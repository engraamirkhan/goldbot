id: R137
requirement: 'BACKLOG 146 (EVAL-1 section 1: "Spread and commission per instrument and session from measured broker data ... no cost is lowered without a measurement"; prereg-2026-11-07-catalogue-screen section 14a, for runs after this commit only). The catalogue sim charges a gold trade the cost-of-record cell of its fill instant''s session (asia Tokyo 08:00 to London 08:00, london London 08:00 to New York 08:30, newyork New York 08:30 to 17:00), the dearer of the brokers. A cell on fewer than 30 fills reads no lower than its broker''s pooled cell, a missing cell reads the pooled cell, and no session is charged below the flat $0.166 charged before. The thin hours (New York 17:00 to the Tokyo open, in no cost-of-record cell) pay the higher of the dearest session and every broker''s pooled figure. cor-2026-10-31.2 (pinned by catalogue_costs.yaml `deciding.cost_of_record`; another version raises MissingCost): asia 0.204 (ICM, 309 fills; Vantage 0.158), london 0.293 (Vantage, 44 fills, ci90 0.158-0.45), newyork 0.263 (Vantage, 69 fills), thin 0.293; a gold fill without an instant pays the dearest. Summaries report `net_icm_basis` (gold on ICM''s own cells) as a sensitivity, never gated; H-90 and deployment use per-broker costs, not the max. The risk floor and the S-detector range filter read the decision instant, the buy-and-hold book its first mark. EVAL-2 deciding cost (rt_usd 0.230) is unchanged.'
status: 'implemented (2026-11-13, branch feat/gold-cost-session-split; quant-reviewer approved with 3 conditions, applied)'
code: 'goldbot/research/catalogue/costs.py (`CostModel.round_trip`, `gold_session_rt`, `gold_session`, `gold_sessions`, `gold_basis_gap`, `load_cost_of_record`); sim.py (`round_trip`, `cost_price`, `risk_floor`, `order_risk`); stats.py (`net_icm_basis`, `summarize`); run.py (`_slim`); detectors_catalogue.py; scripts/eval2_selftest.py (HARNESS_FILES += config/cost_of_record.yaml)'

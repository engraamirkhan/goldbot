id: R165
requirement: 'Reviews of 611d5adb (quant, trading-safety, sre, code; 2026-11-18): a discovered learning arm''s nightly read is evidence only when the night saw everything (F1 journal schema; F2 per arm and account: a journal row on every candidate session day and through the last candidate, judged before the void actions are filtered; F3 the engine''s arm_registry_capable marker since the arm''s since; F4 every account''s minutes read, never a silent drop), otherwise it holds unverified; a candidate''s recompute error voids only it and an arm''s read error holds only it (F5); an unparseable void row counts as on a taken candidate (F6); 2 unverified nights warn and are told (F7); the recompute reads only what the engine held (P1 1d/1w void; P2 no broker M1, no release minute after the cut-over; P3 replaced minutes flagged on the stored minute); each verdict cached append-only (P4); every refusal carries the engine''s and the night''s bracket and is counted by cause, a quarantined minute its own cause (C2); a void at the entry retires as ''bracket integrity: void at entry (engine)'' (C1); a retirement is never reinstated and a retired spec never re-registers (C3)'
status: 'implemented (2026-11-18, branch feat/lifecycle-ready); autodisc_register.LIFECYCLE_READY stays False pending the re-reviews; reviews: quant-reviewer, trading-safety-reviewer, sre, code-reviewer'

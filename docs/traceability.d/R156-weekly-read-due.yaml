id: R156
requirement: 'The weekly review raises read_due only once a read unit has its registered n AND its registered session-day minimum (HV "Graduation" and H-81 section 4: "one read, at the 300th admissible family fill on >= 20 session days"; config/arm_reads.yaml min_session_days, per arm, default none). It raises none for a unit already read or one whose every arm is retired unread (A5 retired_day or its registered stop). The 2026-11-14 evaluator void reads of H-81:Z4 and H-81:Z7 are recorded in arm_reads.yaml reads (state R).'
status: implemented (2026-11-14, branch fix/weekly-read-due)
code: 'config/arm_reads.yaml (min_session_days, reads H-81:Z4 / H-81:Z7); goldbot/api/strategy_labels.py (ReadsFile.min_session_days, ArmInfo.read_days / retired, Catalog.read_days / retired_unread); goldbot/api/strategy_ranking.py (_index prog_day, _progress n_days / min_days, retired units skipped); goldbot/api/schema.py (RankProgress n_days, min_days); goldbot/research/weekly_review.py (ranking_actions read_due); web/openapi.json, web/src/lib/schema.d.ts'
test: tests/test_weekly_review.py::test_a_read_is_not_due_at_its_fill_count_until_its_registered_session_day_minimum_is_met; tests/test_strategy_ranking.py::test_read_progress_counts_the_units_session_days_and_carries_its_registered_minimum; ::test_a_unit_whose_arms_are_all_retired_unread_has_no_read_due_progress; tests/test_strategy_labels.py::test_the_session_day_minimum_of_a_read_comes_from_the_arm_reads_file_and_defaults_to_none; ::test_no_arm_is_read_until_arm_reads_lists_it_and_a_broken_file_reads_none

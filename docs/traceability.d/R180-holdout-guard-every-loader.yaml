id: R180
requirement: 'Plan 2026-11-25 S1/S2/S6 (quant R10): every loader and ingest outside research/windows.py refuses the holdout 2025-10-01..2026-09-30 through one shared guard (a research or judging frame touching it raises HoldoutSealed; a pull never asks for it; live paths are exempt only when listed with a reason; pre-guard scripts are frozen in a list none may join). H-60 priors read the learn window 2010-01..2017-12 only; a confirm-window row needs the arm''s confirm read in the read-once ledger, and stored priors with later history are not read. discovery_nightly is stopped whatever a host''s enabled flag says.'
status: implemented (2026-11-25, branch fix/power-overlap-design-effect); quant re-verify pending
code: 'goldbot/data/holdout_guard.py (HOLDOUT_START, HOLDOUT_END, HoldoutSealed, in_holdout, refuse, cut, split, pull_spans, LIVE_EXEMPT, UNGUARDED); goldbot/research/windows.py (HoldoutSealed shared, label_embargo); goldbot/research/exploration_data.py (PRIOR_HISTORY_START/END = learn, confirm_read_recorded, prior_from_history confirm_read, write_prior/read_priors learn-only, replay_frame_v2 and label_candidates_v2 guard, training_table L-10 via the guard); goldbot/ops/m1_backfill.py (pull_spans); goldbot/config.py DiscoverySettings.stopped; config/settings.yaml research.discovery.stopped; goldbot/research/autodisc/discovery.py (run_job, main)'
test: 'tests/data/test_holdout_guard.py (sealed span and shared class, every minute of the holdout raises, edges pass, naive/series/index, cut and split, pull spans split around the holdout, every guarded loader refuses a holdout frame, m1_backfill never asks for a holdout minute, live exemptions name real modules, no new unguarded bar reader, guard imports no research); tests/test_exploration_data.py::test_priors_use_the_learn_window_2010_to_2017_only_shrunk_by_half_worth_n_over_100; ::test_a_prior_with_a_confirm_window_row_is_refused_unless_the_arms_confirm_read_is_recorded; ::test_stored_priors_reaching_past_the_learn_window_are_never_read_into_the_bandit; tests/test_research_windows.py::test_the_label_embargo_is_one_day_or_the_longest_hold_whichever_is_longer; tests/research/autodisc/test_discovery_nightly.py::test_the_shipped_settings_stop_discovery_even_on_a_host_that_enables_it; ::test_a_foreground_night_that_would_write_is_refused_while_discovery_is_stopped'

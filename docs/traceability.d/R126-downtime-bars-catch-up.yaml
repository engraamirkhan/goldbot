id: R126
requirement: 'Backlog 161: base closes missed while the engine is down count toward open trades'' holds, and no close is counted twice. Each open trade carries `bars_through` (the last base close counted in its `bars_held`, in the same orders-file record, written only once set). At the first base close this engine counts, a trade is credited the closes strictly between `bars_through` and that close whose bar has a minute in `SessionTable.expected_open` (the engine''s session table, D13: broker windows or the static rule, less the exchange holidays; weekends, the daily break and holidays never count); its time exit fires there when due, and an exit-policy hard flat fires there above or below the floor (below_floor''s rule) only when the policy timeframe''s close at or after the deadline fell inside the downtime (review S-b; one still ahead, e.g. a 1h policy due 12:10 restarted at 12:15, waits for 13:00). The credit is logged per trade and summed in `downtime_bars` (orders file, closed-trade record): such a time_exit/hard_flat exits at the restart close, not the label deadline, and is excluded from label-vs-live exit-price/slippage reconciliation (quant Q-2). The dead-feed time barrier counts from `bars_through` when set, so a feed that dies right after a restart never re-counts the closes in `bars_held` (safety item 6). Shadow trades open across a restart are tagged `restart_gap` (persisted) for calibration and shadow-vs-live reads to exclude (quant Q-1; replay: backlog 165). A close at or before `bars_through` (a restart whose first quote is stamped before a counted close) is never counted again. Exits only get earlier. A trade saved before `bars_through` (the first deploy) or adopted counts from its next close, as before; a broken session table credits nothing; credit is capped at 92 days. Accepted label-vs-live differences, both only on trades spanning a downtime: (a) an expected-open minute in which no tick arrived credits one bar more than live would have counted (exits earlier); (b) the CME holiday hours credit nothing even if the broker quoted them (exits later). Replay golden unchanged (a replay never restarts); store golden: restart.json only, every in-memory open trade gains `bars_through: null` and `downtime_bars: 0` (engine, orders, orders_after and risk hashes unchanged in all 192 cases)'
status: 'implemented (2026-11-12, branch fix/downtime-bars-catch-up); review conditions applied (trading-safety S-a, S-b, item 6; quant Q-1, Q-2); in re-review'

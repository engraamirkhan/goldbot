id: R110
requirement: 'EVAL-2 self-tests (method v6 section 6, prereg 2026-11-09 section 4.10, build plan Lane 4): S0-S6 run by `scripts/eval2_selftest.py` (frozen keyword-only API, `SelfTestResult` per test with the harness hash, report in ~/tmp, exit 1 on any FAIL or BLOCKED: "S0-S6 pass, or the method is not used"); S0 on real explore bars 2010-01-01..2017-12-31 only (no 2009 warm-up bar, no TEST-OLD or confirm bar; cached bars re-checked on load) for the registered NULL-RAND control cells with 20 twins, plus the buy-every-close and drift-walk sentinels against E9; S1 null population (>= 500 null families on the real cell grid, built from a per-bar NULL net table that reproduces simulate + simulate_twins) and S2 label-shift plants written against the frozen Lane 3 signatures; S3 full-path plant (+0.20 R and 0 on gold-1h-shaped walks through sim + costs + twins); S4 realised-cost lint; S6 truncation at the decision close (signal, ATR14/ATR20, twin geometry, higher-timeframe visibility); the holdout seal: every research loader refuses the holdout window or cuts before it, a bar cache holding a bar past its window end fails closed, every research module that opens bar files names a holdout guard'
status: 'partial: S0 under A1 (prereg section 9, quant + research-director signed) passes its core on real bars (gross F 2 <= F_crit 5, excess F 3 <= 6, no severe cell) and reads BLOCKED until the L2 half of the sentinels runs (Lane 3); S6 and the S3 harness half pass; S1 (three arms), S2, the S3 L2 half, the S4 probe and S5 BLOCKED on Lanes 3 and 5A; S3 cost-separation and gate-only plants not built; assert_harness_sane refuses until all pass'

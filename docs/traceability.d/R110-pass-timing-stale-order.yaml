id: R110
requirement: 'SRE diagnosis 2026-11-09 (demo volume drop, cause 5, fixes 3 and 4): (a) a stale exploration signal of an arm refused new entries for good (retired, or a thin control whose cost cell is complete) is recorded with that refusal, never `exploration_stale`, so the stale count is the entries staleness cost; no order changes. (b) The multi-book pass-budget warning names the quotes read, every book''s phases added up and, for the slowest books, their bridge, bar close, key zones and exploration time. (c) A 1m/5m arm refused for good is dormant: no minute work and its book is never run early for it; the book''s exits, reconciliation and position reads run every pass. (d) Gold''s key-zones build starts after the pass''s entries (single book: after the exploration pass; multi-book: after every book, when no book has a decision due, at most ZONES_WAIT_S later) and builds exactly what it built at the close. PASS_BUDGET_S unchanged; RiskGate untouched; exits never delayed'
status: 'implemented (2026-11-09, branch fix/pass-timing-stale-order)'
code: 'goldbot/engine/exploration.py (`terminal_refusal`, `refresh_dormant`, `_stale_refusal`, `_enter`, `_minutes`, `due`, `Exploration.dormant`); goldbot/engine/exploration_budget.py (`cell_complete`); goldbot/engine/books.py (`PassTimes`, `phase`, `timed`, `exploration_pass`, `_launch_zones`, `ZONES_WAIT_S`, `PHASES`, `PassBroker` bridge timing, `account_pass`); goldbot/engine/key_zones.py (`update` parks, `launch`, `KeyZoneWorker.parked`); goldbot/engine/runner.py (`_on_tick`, `on_bar_close`: call sites only, line count unchanged)'

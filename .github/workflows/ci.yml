name: ci
# Gates every push and PR. Backend and frontend each get lint, typecheck, unit and integration jobs; pre-commit
# and the API contract check run alongside. Any failure is posted as one GitHub issue labelled `ci` with the tail
# of each failed job's output, because Claude sandboxes cannot download Actions logs.
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  issues: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/pre-commit, key: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}" }
      - run: pip install pre-commit
      - name: pre-commit run --all-files
        run: set -o pipefail; mkdir -p ci-out; pre-commit run --all-files --show-diff-on-failure --color never 2>&1 | tee ci-out/pre-commit.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ci-out-pre-commit, path: ci-out/ }

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install ruff
      - name: ruff
        run: set -o pipefail; mkdir -p ci-out; ruff check goldbot tests scripts --output-format concise 2>&1 | tee ci-out/backend-lint.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ci-out-backend-lint, path: ci-out/ }

  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: mypy
        run: set -o pipefail; mkdir -p ci-out; mypy 2>&1 | tee ci-out/backend-typecheck.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ci-out-backend-typecheck, path: ci-out/ }

  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: versions
        run: mkdir -p ci-out; python -c "import pandas,numpy,sklearn,lightgbm,duckdb,pyarrow,fastapi,pydantic;print('pandas',pandas.__version__,'numpy',numpy.__version__,'sklearn',sklearn.__version__,'lgbm',lightgbm.__version__,'duckdb',duckdb.__version__,'pyarrow',pyarrow.__version__,'fastapi',fastapi.__version__,'pydantic',pydantic.__version__)" | tee ci-out/backend-unit.txt
      - name: pytest (unit)
        run: set -o pipefail; pytest -m "not integration" -q --tb=short --cov=goldbot --cov-report=term:skip-covered 2>&1 | tee -a ci-out/backend-unit.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ci-out-backend-unit, path: ci-out/ }

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: pytest (integration)
        run: set -o pipefail; mkdir -p ci-out; pytest -m integration -q --tb=short 2>&1 | tee ci-out/backend-integration.txt
      - name: research dry run
        run: set -o pipefail; python scripts/dry_run.py 1 2>&1 | tail -40 | tee -a ci-out/backend-integration.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ci-out-backend-integration, path: ci-out/ }

  frontend-lint:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: eslint
        run: set -o pipefail; mkdir -p ../ci-out; npm run lint 2>&1 | tee ../ci-out/frontend-lint.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ci-out-frontend-lint, path: ci-out/ }

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: tsc
        run: set -o pipefail; mkdir -p ../ci-out; npm run typecheck 2>&1 | tee ../ci-out/frontend-typecheck.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ci-out-frontend-typecheck, path: ci-out/ }

  frontend-unit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - name: vitest
        run: set -o pipefail; mkdir -p ../ci-out; npm test -- --reporter=verbose 2>&1 | tee ../ci-out/frontend-unit.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ci-out-frontend-unit, path: ci-out/ }

  api-contract:
    # the dashboard's types are generated from the backend's OpenAPI schema; both must be committed in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e . && npm --prefix web ci
      - name: regenerate openapi.json and schema.d.ts, fail on drift
        run: |
          set -o pipefail; mkdir -p ci-out
          { python scripts/export_openapi.py && npm --prefix web run gen:api && git diff --exit-code -- web/openapi.json web/src/lib/schema.d.ts \
            || { echo "API contract drift: run 'python scripts/export_openapi.py && npm --prefix web run gen:api' and commit"; exit 1; }; } 2>&1 | tee ci-out/api-contract.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ci-out-api-contract, path: ci-out/ }

  e2e:
    # integration for both halves: the real FastAPI backend serving the production build, driven by Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e . && npm --prefix web ci
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: build and run e2e
        working-directory: web
        env: { CI: "1", PYTHON: python }
        run: set -o pipefail; mkdir -p ../ci-out; { npm run build && npm run test:e2e; } 2>&1 | tee ../ci-out/e2e.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ci-out-e2e, path: "ci-out/\nweb/playwright-report/\nweb/test-results/" }

  report-failure:
    needs: [pre-commit, backend-lint, backend-typecheck, backend-unit, backend-integration,
            frontend-lint, frontend-typecheck, frontend-unit, api-contract, e2e]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: ci-out-*, path: ci-out, merge-multiple: true }
        continue-on-error: true
      - name: open an issue with the failing jobs' output
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'EOF'
          import json, os, pathlib, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]; sha = os.environ["GITHUB_SHA"][:7]; ref = os.environ["GITHUB_REF_NAME"]
          run_url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          failed = [j for j, v in json.loads(os.environ["NEEDS"]).items() if v["result"] == "failure"]
          parts = [f"Run: {run_url}\nBranch: `{ref}`\nFailed jobs: {', '.join(failed) or '(none reported)'}\n"]
          budget = 60000 // max(len(failed), 1)
          for j in failed:
              f = pathlib.Path("ci-out") / f"{j}.txt"
              text = f.read_text(errors="replace")[-budget:] if f.exists() else "(no output captured; failed before the main step)"
              parts.append(f"### {j}\n```\n{text}\n```")
          payload = {"title": f"CI failure on {sha} ({', '.join(failed)})", "body": "\n".join(parts), "labels": ["ci"]}
          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues", data=json.dumps(payload).encode(),
                                       headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
          print(urllib.request.urlopen(req).status)
          EOF

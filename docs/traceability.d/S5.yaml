id: S5
requirement: '"a heartbeat alert fires if any service has been silent for five minutes" [Infrastructure]'
status: partial
code: 'engines: engine_<account>.json (check_engine); supervisor, scheduler, telegram, news and api write state/heartbeat_<service>.json every minute (goldbot/ops/health.py:628 `Heartbeat`, `start_heartbeat`; calls in goldbot/ops/run.py) and `check_heartbeat` (:665) fails after 5 min of silence, which the Telegram health pass alerts once with a recovery message. Missing: the health pass runs every 300 s (goldbot/telegram/bot.py HEALTH_EVERY_S), so the alert can come up to 10 min after the last beat, not 6; the bridge is checked from the brain (`check_bridge`, /health through the tunnel) rather than by a heartbeat file; a dead Telegram service cannot alert about itself'
test: tests/test_health.py::test_a_service_silent_for_five_minutes_alerts_once_and_recovers, tests/test_health.py::test_every_service_has_a_heartbeat_check_and_run_py_writes_it, tests/test_health.py::test_bridge_health_through_the_tunnel

id: X18
requirement: 'The record carries what the monthly finance audit needs (docs/finance/audit-framework.md gaps GAP-01/02/03/04/05/10/13): the decision price, spread and time at the signal next to the quote the order was priced from (the cost of the 90 s approval wait); the timeframe, family and champion model version; the initial stop and the final stop and target; every exit leg (engine close, scale-out, broker stop or target) against the price it was asked at, kept apart from the entry `fills`; where the money came from (`money_source` broker or engine) and `pnl_basis` gross unless commission and swap are both known; the owner''s decision time and channel on the archived proposal, never an id. Every new persisted field defaults to unknown (ADR 0010)'
status: implemented (trading-safety review pending)
code: goldbot/ops/gates_phase.py `ClosedTrade` (finance audit fields), `EntryAudit`; goldbot/engine/runner.py `_execute`, `_log_exit_fill`, `_try_close`, `_flush_exit_fills`, `_flush_closed`, `_scale_out`, `_record_closed`, `_exit_deals`, `SentOrder.audit`, `OpenTrade.audit`; goldbot/execution/paper.py deals (`swap` None); goldbot/data/store.py table `exit_fills`; goldbot/telegram/approvals.py `Proposal.decided_ts`, `decided_channel`, `decision_channel`; goldbot/telegram/bus.py `ApprovalBus.archive`
test: tests/test_finance_audit_record.py::test_the_closed_record_keeps_the_decision_price_and_spread_apart_from_the_quote_at_approval; ::test_the_order_journal_row_names_its_proposal; ::test_the_decision_price_survives_a_restart_while_the_trade_is_open; ::test_an_orders_file_without_entry_audit_or_with_a_newer_audit_field_still_loads; ::test_the_closed_record_carries_the_timeframe_family_and_the_champion_model_version; ::test_an_agent_without_a_registered_champion_has_no_model_version; ::test_the_closed_record_keeps_the_initial_stop_and_the_final_stop_and_target; ::test_an_engine_market_close_logs_its_exit_fill_against_the_quote_it_was_asked_at; ::test_a_broker_stop_fill_is_logged_against_its_stop_level; ::test_a_scale_out_logs_its_exit_fill; ::test_a_failing_exit_fill_write_never_blocks_the_exit; ::test_a_trade_with_the_brokers_commission_and_swap_is_marked_net_from_the_broker; ::test_a_trade_recorded_from_the_engines_own_fills_is_marked_gross; ::test_broker_deals_without_a_commission_figure_are_marked_gross; ::test_an_older_closed_record_without_the_audit_fields_reads_them_as_unknown; ::test_the_archived_proposal_keeps_the_owners_decision_time_and_channel_from_the_bus; ::test_an_in_process_decision_records_its_time_and_the_telegram_channel; ::test_archive_takes_the_decision_time_from_the_decision_file_before_deleting_it; ::test_an_expired_proposal_has_no_decision_time; ::test_the_kill_switch_closes_every_position_before_any_exit_fill_is_written; ::test_a_failing_exit_fill_write_keeps_the_legs_and_writes_them_later; ::test_a_stale_proposal_archived_on_restart_takes_no_decision_time_from_a_late_click; ::test_an_unreadable_decision_file_is_archived_as_no_decision; ::test_paper_deals_leave_swap_unknown_so_paper_trades_are_gross

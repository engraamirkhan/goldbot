id: M16
requirement: '"Combinatorial purged CV (6 groups, 2 test, 15 paths) runs quarterly"'
status: implemented
code: 'goldbot/research/cpcv.py: research window (holdout excluded) cut into 6 equal-duration groups, all 15 splits of 2 test groups, every training label whose life overlaps a test label''s life (purge before, embargo after, the timeframe''s walk-forward days) dropped and any leak refused; the 15 splits rebuild 5 backtest paths (the design''s "15 paths" are the 15 splits: phi = C(5,1) = 5 paths); per path the walk-forward''s own cross-fitted calibration (`pipeline._cross_fitted`, groups as folds) and threshold (`pipeline.candidate_threshold`); path Sharpe / mean R distribution; PBO (CSCV, 20 group halves) across compared configurations. Not a trial: evidence attached to the trial (`TrialRegistry.attach_evidence`, `<registry>.evidence.jsonl`), no budget slot, no deflated-Sharpe count. `scripts/research_pass.py --cpcv <trial#> [...]`; quarterly job `cpcv_quarterly` (goldbot/ops/jobs.py, first Sunday of Jan/Apr/Jul/Oct via `Schedule.months`) for every gate-passing trial vs its family''s other trials. Reading rule (docs/decisions/0003-cpcv-and-pbo-can-only-veto.md): veto only; `cpcv.verdict` flags a gate-passing config fragile when PBO > 0.5 or more than half the paths are negative, never rescues or picks; `research_pass --cpcv` refuses gate-failed trials unless `--diagnostic` (labelled "diagnostic, not evidence", nothing attached to them). PBO leaves out group 0 (never traded; 5 scored groups split 2 vs 3 both ways, 20 splits) and is labelled a lower bound against `cpcv.selection_set` (every registered trial of the family on the timeframe, screened included). `cpcv_quarterly` skips a trial whose feature version differs from what the bars build now. The evidence sidecar is local-only (not in registry_sync)'
test: tests/test_cpcv.py::test_there_are_exactly_15_splits_and_5_paths_covering_every_group_once_per_path; ::test_no_split_trains_on_a_test_row_or_on_a_label_whose_life_overlaps_one; ::test_purge_and_embargo_are_exact_at_the_group_boundaries; ::test_a_synthetic_leak_is_caught; ::test_run_cpcv_reports_the_path_distribution_with_cross_fitted_selection; ::test_pbo_is_zero_for_a_dominant_config_one_for_anti_persistence_and_none_for_one_config; ::test_cpcv_is_evidence_on_the_trial_not_a_new_trial; tests/test_research_pass_integration.py::test_cpcv_reevaluates_registered_trials_as_evidence_with_pbo_and_takes_no_budget; tests/test_jobs_integration.py::test_cpcv_quarterly_attaches_evidence_to_gate_passing_trials_without_new_trials; tests/test_cpcv.py::test_cpcv_can_only_veto_a_passed_config; ::test_pbo_leaves_out_the_never_traded_group_0_column_and_is_labelled_a_lower_bound; ::test_pbo_on_the_five_scored_groups_splits_two_against_three_both_ways; ::test_cpcv_skips_a_trial_whose_feature_version_is_stale_when_asked; ::test_the_selection_set_is_every_registered_trial_of_the_family_on_the_timeframe_screened_ones_included

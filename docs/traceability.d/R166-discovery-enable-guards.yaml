id: R166
requirement: 'Discovery nightly enable guards (ADR 0090 Accepted; quant GO 2026-11-18 conditions a-e, SRE GO 2026-11-18 conditions f-k): a failed discovery night alerts through the health -> Telegram path; while research.discovery.enabled, a health check warns (and is told) when the last successful night is older than 26 h, and a disabled job is not checked; the child runs at nice 15 with the idle IO class, bounded by RLIMIT_DATA 4 GB plus oom_score_adj 500 (no per-child cgroup MemoryMax), its health line warning past 2 GB peak RSS, and even its latest start is killed before the London open; research.discovery.first_night_dry (default true) books the night''s K to the ledger and the registry but hands nothing off (no candidate_arms rows) and reports what it would have offered; RUNBOOK enable steps, single-flag rollback and the first night''s deploy note (RSS, runtime, engine heartbeat lag).'
status: implemented (2026-11-18, branch feat/discovery-enable-guards); the job stays off until a host enables it, not before 2026-11-22 22:00 UTC
code: 'goldbot/ops/checks/discovery.py (check_discovery_last_run, discovery_enabled, DISCOVERY_STALE_H); goldbot/ops/health.py (NOTIFY_ON_WARN discovery_last_run, re-export, HealthContext.settings_changed); goldbot/ops/bounded.py (idle_io); goldbot/ops/jobs.py (discovery_nightly DISCOVERY_RSS_WARN_MB); goldbot/research/autodisc/discovery.py (run_discovery first_night_dry, DiscoveryRun withheld/would_offer/offered, report, summary); goldbot/config.py (DiscoverySettings.first_night_dry); config/settings.yaml; docs/RUNBOOK.md; docs/decisions/0090-discovery-nightly-brain.md'
test: 'tests/test_discovery_health.py::test_a_disabled_discovery_job_is_not_checked_and_never_alerts; ::test_an_enabled_job_with_a_successful_night_inside_26_hours_is_ok; ::test_an_enabled_job_whose_last_success_is_older_than_26_hours_warns_and_is_told; ::test_budget_and_over_budget_nights_count_as_successful_runs; ::test_an_enabled_job_that_never_succeeded_warns_26_hours_after_its_first_attempt; ::test_a_job_disabled_at_its_last_slot_is_waiting_for_its_first_enabled_night; ::test_a_disabled_skip_newer_than_the_enable_warns_that_the_scheduler_was_not_restarted; ::test_pending_lasts_at_most_26_hours_from_the_enable; ::test_without_a_known_enable_time_a_disabled_skip_is_not_read_as_pending; ::test_the_runtime_context_stamps_when_the_local_settings_last_changed; ::test_an_enabled_job_with_no_run_recorded_anywhere_warns; ::test_a_failed_discovery_night_fails_its_job_check_and_reaches_the_telegram_alert; ::test_the_staleness_warning_is_on_the_owner_notified_list; tests/research/autodisc/test_discovery_nightly.py::test_the_shipped_settings_hold_the_first_enabled_night_dry_until_a_reviewer_flips_it; ::test_a_first_night_dry_run_books_its_k_in_the_registry_but_hands_nothing_off; ::test_with_first_night_dry_off_the_same_night_hands_its_survivors_off; tests/test_discovery_nightly_job.py::test_the_child_memory_bound_is_a_4_gb_data_segment_and_the_oom_killers_first_choice; ::test_the_job_health_line_warns_when_the_childs_peak_rss_passes_the_sres_2_gb_budget; ::test_the_child_asks_for_the_idle_io_class_on_linux_and_never_stops_on_a_refusal; ::test_even_the_latest_allowed_start_is_killed_before_the_london_open'

id: A15
requirement: 'Who decided, halted or re-armed is kept only in the VPS audit log (security follow-up to BACKLOG 52, A14): the decision file `approvals/decisions/<id>.json` and the halt and re-arm in `control.json` record only the channel ("dashboard" or "telegram"), whatever the caller passes; `/api/status` `halted_by`, the entry status and the halt health check report the channel to every role (an older control.json''s "<channel>:<id>" is cut to the channel); the Telegram service writes a `decision` row (Telegram id, proposal, approve/reject, reason, time) and a `halt` row to the audit log after the action, and a failed audit write never undoes or hides it; no API route serves the audit log; an engine start sweeps decision files with no pending file or older than a day'
status: implemented (security and trading-safety review pending)
code: goldbot/telegram/bus.py `ApprovalBus.submit`, `set_halt`, `owner_rearm`, `sweep_decisions`, `DECISION_MAX_AGE_S`; goldbot/engine/runner.py `Engine._archive_stale_proposals`; goldbot/telegram/bot.py `TelegramBot._on_button`, `_on_command`, `_audit`; goldbot/api/app.py `decide`, `halt`, `rearm`, `current_status`; goldbot/api/entry_status.py `entry_inputs`; goldbot/ops/health.py `check_halt`; web/src/screens/Overview.tsx `HaltControl`; web/src/screens/SafetyStrip.tsx `build`
test: tests/test_decision_identity_followup.py::test_a_submitted_decision_file_keeps_only_the_channel_even_when_given_an_identity; ::test_an_older_decision_file_with_an_identity_is_still_applied_by_its_channel; ::test_the_sweep_deletes_decisions_without_a_pending_file_or_older_than_a_day_and_keeps_live_ones; ::test_an_engine_start_sweeps_leftover_decision_files; ::test_a_failing_sweep_never_stops_an_engine_start; ::test_halt_and_rearm_keep_only_the_channel_in_control_json; ::test_the_halt_health_check_names_the_channel_not_who; ::test_a_viewer_reads_who_halted_as_a_channel_with_no_email_or_digits; ::test_a_dashboard_decision_file_holds_no_email_and_the_audit_log_names_the_approver; ::test_no_api_route_serves_the_audit_log; ::test_a_telegram_decision_is_audited_with_the_telegram_id_and_the_approval_files_never_carry_it; ::test_a_refused_telegram_decision_is_not_audited_as_a_decision; ::test_a_failing_audit_write_never_undoes_or_hides_a_telegram_decision_or_halt; ::test_a_telegram_halt_is_audited_with_the_telegram_id_and_control_json_keeps_only_the_channel; web/src/screens/Overview.test.tsx "lets an approver halt new entries with a reason", "re-arms only for the owner with an authenticator code"; web/src/screens/SafetyStrip.test.tsx "shows every halt in red with its reason"

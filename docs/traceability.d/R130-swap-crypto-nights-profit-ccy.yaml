id: R130
requirement: 'BACKLOG 153: a crypto book (registry asset class crypto, Vantage BTCUSD) is charged swap every server-midnight rollover, weekends included, with no triple day (`SwapSpec.seven_night`, `rollover_nights(..., seven_night=True)`); every other book keeps five weekday nights plus the triple; the labels, the CostImputer (`paid_swap_per_oz`) and so the RiskGate daily projection use the same count. BACKLOG 154: a mode 5/6 swap is priced in any reported profit currency (rate / 100 / 360 x price x contract, the price quoted in it), like modes 1/2/3, and stays in that currency; the RiskGate converts it with the same point-in-time `acct_per_profit` as the stop (`profit_fx`), so an unknown or non-finite rate refuses the entry (`fx_conversion_unavailable` / `invalid:acct_per_profit`), never prices it at 0; an unreported profit currency, or a terminal profit currency other than the registry one the gate converts from, leaves the swap unknown (entries refused). Review of R130: the CostImputer never charges a non-gold row (`ClosedTrade.symbol`) gold''s rates: a row missing only its swap pays its own instruments.db rate (`InstrumentTerms.swap_spec`, USD profit currency only), anything else is unpriced; a crypto book needs no Monday-Friday triple day; research callers pass `seven_night` from their SwapSpec. RiskGate unchanged'
status: 'implemented (2026-11-12, branch fix/swap-crypto-nights-profit-ccy)'
code: 'goldbot/labels/triple_barrier.py (`SwapSpec.seven_night`, `rollover_nights`); goldbot/ops/cost_imputation.py (`paid_swap_per_oz`); goldbot/engine/books.py (`swap_spec`); goldbot/engine/instruments_db.py (`swap_per_lot`, `seven_night`, `InstrumentTerms.swap_spec`); goldbot/ops/cost_imputation.py (`CostImputer.instrument_swap`, `charge`); goldbot/research (sprint3000/engine.py, tv_ideas.py, exploration_data.py, attribution.py pass `seven_night`)'
test: tests/test_swap.py::test_a_seven_night_book_is_charged_every_server_midnight_with_no_triple_day; ::test_the_labels_and_the_cost_imputer_use_the_seven_night_count; ::test_seven_night_labels_charge_the_weekend_nights; tests/test_instruments_db.py::test_an_interest_swap_is_priced_in_any_reported_profit_currency; ::test_an_interest_swap_in_an_unreported_profit_currency_stays_unknown; ::test_the_gate_converts_a_profit_currency_swap_into_the_account_currency; ::test_an_unknown_profit_currency_rate_refuses_the_entry_never_prices_the_swap_at_zero; ::test_a_crypto_book_projects_its_swap_on_the_seven_night_schedule; ::test_a_book_whose_terminal_profit_currency_is_not_the_registry_one_has_no_swap; ::test_a_crypto_book_with_no_weekday_triple_day_still_prices_its_swap; ::test_a_profit_currency_swap_reaches_the_gate_unconverted_so_it_is_converted_once; tests/test_cost_imputation.py::test_a_crypto_row_missing_only_its_swap_pays_its_own_rate_every_night; ::test_a_non_gold_row_the_imputer_cannot_price_on_its_own_terms_is_unpriced_never_gold_priced; ::test_a_net_non_gold_row_is_still_charged_nothing; tests/test_phase_gates.py::test_an_unpriced_pooled_row_breaches_the_stop_rule_fail_closed
